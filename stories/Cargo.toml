[workspace]

[package]
name = "iii-stories"
version = "0.1.1"
edition = "2024"
description = "Stories worker for iii — builds CSF story files from any React project with the project's own Vite, indexes components and their states per git line, compares lines, renders deterministic screenshots and DOM/React trees through the browser worker, and injects an explorer and compare page into the console"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
publish = false

[lib]
name = "iii_stories"
path = "src/lib.rs"

[[bin]]
name = "stories"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.23.0"
iii-config-client = { path = "../crates/config-client" }
iii-console-ui = { path = "../crates/console-ui" }
iii-worker-paths = { path = "../crates/worker-paths" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "fs", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
base64 = "0.22"
notify = "8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3"
