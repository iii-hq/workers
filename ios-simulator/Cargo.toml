[workspace]

[package]
name = "ios-simulator"
version = "0.2.1"
edition = "2021"
publish = false

[[bin]]
name = "ios-simulator"
path = "src/main.rs"

[lib]
name = "ios_simulator"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.26.0"
iii-worker-paths = { path = "../crates/worker-paths" }
iii-console-ui = { path = "../crates/console-ui" }
arc-swap = "1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# A scripted engine for tests/events.rs; both are already in the graph through iii-sdk.
futures-util = "0.3"
tokio-tungstenite = "0.28"

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
