[workspace]

[package]
name = "ios-simulator"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ios-simulator"
path = "src/main.rs"

[lib]
name = "ios_simulator"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.23.0"
iii-worker-paths = { path = "../crates/worker-paths" }
iii-console-ui = { path = "../crates/console-ui" }
arc-swap = "1"
async-trait = "0.1"
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
