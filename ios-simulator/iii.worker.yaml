iii: v1
name: ios-simulator
language: rust
deploy: binary
manifest: Cargo.toml
license: Apache-2.0
bin: ios-simulator
tags: [ios, simulator, xcode, mobile, iphone, screenshot, recording, automation]
description: iOS Simulators on the iii bus - create, boot and watch simulators live, drive them with multi-touch (tap, swipe, pinch), hardware buttons and typing, and save screenshots and recordings. One Mac serves many tenants, each with its own isolated device set and media. Registers the `ios-simulator::device-changed`, `ios-simulator::media-changed`, `ios-simulator::frame-event` and `ios-simulator::activity` trigger types and, next to them, the observable functions `ios-simulator::on-device-changed`, `ios-simulator::on-media-changed`, `ios-simulator::on-frame-event` and `ios-simulator::on-activity` (iii 0.25).
dependencies:
  configuration: "latest"
# Registry interface capture boots an x86_64 Linux build; this worker drives
# Xcode's simulators and ships for macOS only, so there is nothing to capture.
registry_interface: false
