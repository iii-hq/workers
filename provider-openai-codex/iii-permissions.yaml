# Agent permissions for the provider-openai-codex worker.
# Spec: tech-specs/2026-06-agentic/llm-router.md § Security.
version: 1

rules:
  # Direct provider calls bypass the router's accounting, budgets, and retry
  # policy — never agent-callable. The router invokes these worker-to-worker.
  - '!provider::openai-codex::stream'
  - '!provider::openai-codex::refresh_models'
  - '!provider::openai-codex::on_router_ready'
  - '!provider::openai-codex::count_tokens'
  # provider::openai-codex::image::generate and image::read are deliberately
  # NOT listed: images have no router front door, the calls bypass no
  # accounting, and agents need them directly (generate saves to
  # data/provider-openai-codex/images/, read is how an agent looks at a saved
  # picture when it must).
