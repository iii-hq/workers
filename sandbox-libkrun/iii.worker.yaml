iii: v1
name: sandbox-libkrun
language: rust
deploy: binary
manifest: Cargo.toml
license: Elastic-2.0
bin: sandbox-libkrun
tags: [sandbox, microvm, libkrun, vm]
description: libkrun sandbox adapter - serves the iii sandbox router's sandbox::* calls as sandbox-libkrun::* in libkrun microVMs, and boots Compose's worker VMs.
config:
  auto_install: true
  image_allowlist:
    - python
    - node
  default_idle_timeout_secs: 300
  max_concurrent_sandboxes: 32
  default_cpus: 1
  default_memory_mb: 512

dependencies:
  configuration: "latest"
