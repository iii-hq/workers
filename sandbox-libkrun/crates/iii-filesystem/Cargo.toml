[package]
name = "iii-filesystem"
version = "0.1.0"
edition = "2024"
license = "Elastic-2.0"
publish = false
description = "Filesystem backends for iii worker VM sandboxes"

[lib]
path = "src/lib.rs"

[dependencies]
dashmap = "6"
libc = "0.2"
# Same exact pin as the root package (see its Cargo.toml).
msb_krun = "=0.1.42"

[target.'cfg(target_os = "macos")'.dependencies]
tempfile = "3"

[features]
default = []
embed-init = []

[dev-dependencies]
libc = "0.2"
tempfile = "3"
