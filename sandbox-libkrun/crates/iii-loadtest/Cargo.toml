[package]
name = "iii-loadtest"
version = "0.1.0"
edition = "2024"
license = "Elastic-2.0"
description = "Capacity and resource benchmarks for the iii engine, run inside resource-limited microVMs (Linux)"
publish = false

[[bin]]
name = "iii-loadtest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hdrhistogram = { version = "7", default-features = false }
iii-helpers = "=0.25.0"
iii-sdk = "=0.25.0"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "process", "signal", "sync", "time", "fs"] }
tokio-tungstenite = "0.30"

[target.'cfg(target_os = "linux")'.dependencies]
iii-filesystem = { path = "../iii-filesystem" }
# Same pin as sandbox-libkrun and iii-filesystem.
msb_krun = { version = "=0.1.42" }

[dev-dependencies]
serde_yaml = "0.9"
