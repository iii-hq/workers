[workspace]

[package]
name = "provider-openai"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "OpenAI Chat Completions provider worker behind llm-router."

[[bin]]
name = "provider-openai"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
llm-router = { path = "../llm-router" }
iii-sdk = "=0.19.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }
