# Agent permissions for the provider-openai worker.
# Spec: tech-specs/2026-06-agentic/llm-router.md § Security.
version: 1

rules:
  # Direct provider calls bypass the router's accounting, budgets, and retry
  # policy — never agent-callable. The router invokes these worker-to-worker.
  - '!provider::openai::stream'
  - '!provider::openai::refresh_models'
  - '!provider::openai::on_router_ready'
  - '!provider::openai::embed'
  - '!provider::openai::count_tokens'
  # provider::openai::image::generate and image::read are deliberately NOT
  # listed: images have no router front door, the calls bypass no accounting,
  # and agents need them directly (generate saves to data/provider-openai/images/,
  # read is how an agent looks at a saved picture when it must).
