[workspace]

[package]
name = "rbac-proxy"
version = "1.1.3"
edition = "2024"
publish = false

[[bin]]
name = "rbac-proxy"
path = "src/main.rs"

[lib]
name = "rbac_proxy"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.26.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# Must stay on the same schemars major as iii-sdk so the derived
# `JsonSchema` impls satisfy `RegisterFunction::new_async`.
schemars = "0.8"

# HTTP + WS proxy (the `ade` proxy stack, verbatim).
# =0.8.8: last axum on tokio-tungstenite 0.28, the iii-sdk major; lift when iii-sdk moves to 0.29.
axum = { version = "=0.8.8", features = ["ws"] }
# The public listener is served over hyper directly, for a header deadline
# (see server.rs `HEADER_READ_TIMEOUT`); both already come in through axum.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

[dev-dependencies]
serde_json = "1"
which = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
