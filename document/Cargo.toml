[workspace]
exclude = ["vendor/anydoc"]

[package]
name = "document"
version = "0.2.1"
edition = "2021"
description = "Document worker for iii — convert Word, PowerPoint, Excel, OpenDocument, RTF, EPUB, CSV and PDF to markdown on the machine, detect the format from the bytes, and pull out embedded images (document::* functions)"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
publish = false

[lib]
name = "document"
path = "src/lib.rs"

[[bin]]
name = "document"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.26.0"
# The converter. Pure Rust, no system libraries, no subprocess, no network.
# Registry-verified 0.1.9 with ZIP 9/calamine 0.38 security dependency fixes.
# Remove the local patch once an upstream release carries these fixes.
anydoc = { version = "=0.1.9", path = "vendor/anydoc" }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"

[dev-dependencies]
tempfile = "3"

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
