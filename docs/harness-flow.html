<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>iii harness — end-to-end information flow</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=JetBrains+Mono:wght@300;400;500;700&display=swap"
/>
<style>
  :root {
    /* Slate ink — tinted toward the brand hue (warm amber). */
    --bg-0: oklch(0.16 0.012 80);
    --bg-1: oklch(0.20 0.014 80);
    --bg-2: oklch(0.24 0.016 80);
    --rule: oklch(0.32 0.018 80);

    --ink-1: oklch(0.94 0.012 85);
    --ink-2: oklch(0.78 0.012 85);
    --ink-3: oklch(0.62 0.014 85);
    --ink-4: oklch(0.48 0.014 85);

    /* Muted teal for dormant nodes; warm amber phosphor for live signal. */
    --node: oklch(0.58 0.04 200);
    --node-soft: oklch(0.32 0.025 200);
    --signal: oklch(0.80 0.18 72);
    --signal-soft: oklch(0.62 0.16 72);
    --signal-dim: oklch(0.45 0.10 72);

    --rose: oklch(0.66 0.16 25);

    --space-2: 4px;
    --space-3: 8px;
    --space-4: 12px;
    --space-5: 16px;
    --space-6: 24px;
    --space-7: 32px;
    --space-8: 48px;

    --r-sm: 4px;
    --r-md: 8px;
    --r-lg: 14px;

    --font-display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg-0); color: var(--ink-1); }
  body {
    font-family: var(--font-display);
    font-feature-settings: "ss01", "ss02", "cv11";
    font-optical-sizing: auto;
    -webkit-font-smoothing: antialiased;
    line-height: 1.55;
    overflow: hidden;
  }

  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 420px;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas:
      "header header"
      "stage  side"
      "dock   dock";
    gap: 1px;
    background: var(--rule);
    height: 100vh;
  }

  /* ── Header ───────────────────────────────────────────── */
  header.bar {
    grid-area: header;
    background: var(--bg-1);
    padding: 14px 22px 12px;
    display: flex;
    align-items: baseline;
    gap: 22px;
  }
  .brand {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--signal);
  }
  .brand::before {
    content: "●";
    color: var(--signal);
    margin-right: 8px;
    text-shadow: 0 0 12px var(--signal);
    animation: pulse-dot 2.4s ease-in-out infinite;
  }
  @keyframes pulse-dot { 0%,100% { opacity: 1 } 50% { opacity: 0.45 } }

  .title {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(18px, 1.4vw + 0.4rem, 24px);
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink-1);
  }
  .subtitle {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
    margin-left: auto;
  }

  /* ── Stage / SVG ──────────────────────────────────────── */
  .stage {
    grid-area: stage;
    background:
      radial-gradient(1100px 700px at 30% 38%, oklch(0.21 0.018 75) 0%, transparent 65%),
      var(--bg-0);
    position: relative;
    overflow: hidden;
  }
  .stage::before {
    /* Faint engineering grid */
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--rule) 1px, transparent 1px),
      linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px;
    opacity: 0.08;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 35%, transparent 85%);
  }

  svg.diagram {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Worker node base styles (SVG via CSS classes) */
  .node rect.body {
    fill: var(--bg-1);
    stroke: var(--node-soft);
    stroke-width: 1;
    transition: stroke 0.25s ease, fill 0.25s ease, filter 0.25s ease;
  }
  .node .label {
    font-family: var(--font-mono);
    font-size: 11px;
    fill: var(--ink-2);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .node .role {
    font-family: var(--font-mono);
    font-size: 9px;
    fill: var(--ink-4);
    letter-spacing: 0.10em;
    text-transform: uppercase;
  }
  .node .pin {
    fill: var(--node-soft);
    transition: fill 0.25s ease;
  }
  .node.external rect.body {
    fill: transparent;
    stroke-dasharray: 4 3;
    stroke: var(--ink-4);
  }
  .node.bus rect.body {
    fill: oklch(0.22 0.012 80);
    stroke: var(--rule);
  }
  .node.bus .label { fill: var(--ink-2); font-size: 12px; letter-spacing: 0.22em; }

  .node.active rect.body {
    stroke: var(--signal);
    stroke-width: 1.4;
    fill: oklch(0.24 0.04 75);
    filter: drop-shadow(0 0 12px oklch(0.78 0.18 72 / 0.45));
  }
  .node.active .label { fill: var(--ink-1); }
  .node.active .pin { fill: var(--signal); }
  .node.warm rect.body {
    stroke: var(--signal-dim);
  }
  .node.warm .pin { fill: var(--signal-dim); }

  .node.alert rect.body {
    stroke: var(--rose);
    filter: drop-shadow(0 0 10px oklch(0.66 0.16 25 / 0.45));
  }

  /* Edges */
  .edge {
    fill: none;
    stroke: var(--rule);
    stroke-width: 1.2;
    transition: stroke 0.3s ease;
  }
  .edge.warm { stroke: var(--signal-dim); }
  .edge.active { stroke: var(--signal); }
  .edge.dashed { stroke-dasharray: 4 4; }

  /* Pulse — travelling dot */
  .pulse {
    fill: var(--signal);
    filter: drop-shadow(0 0 6px oklch(0.80 0.18 72 / 0.9));
  }

  /* Group label (top-of-zone caption) */
  .zone-label {
    font-family: var(--font-mono);
    font-size: 9.5px;
    fill: var(--ink-4);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  /* ── Side narrator ────────────────────────────────────── */
  aside.side {
    grid-area: side;
    background: var(--bg-1);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    overflow: hidden;
  }
  .step-head {
    padding: 22px 24px 14px;
    border-bottom: 1px solid var(--rule);
  }
  .step-counter {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--signal);
    letter-spacing: 0.12em;
  }
  .step-counter .of { color: var(--ink-4); }
  .step-title {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 22px;
    line-height: 1.2;
    margin: 6px 0 0;
    letter-spacing: -0.01em;
    color: var(--ink-1);
    min-height: 2.4em;
  }

  .step-body {
    padding: 18px 24px;
    overflow: auto;
    color: var(--ink-2);
    font-size: 14px;
    line-height: 1.65;
  }
  .step-body p { margin: 0 0 14px; }
  .step-body p:last-child { margin-bottom: 0; }
  .step-body code {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--signal);
    background: oklch(0.22 0.012 80);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .step-body .actors {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-4);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
  }
  .step-body .actors span {
    color: var(--ink-2);
    border: 1px solid var(--rule);
    padding: 2px 7px;
    border-radius: 12px;
  }
  pre.payload {
    font-family: var(--font-mono);
    font-size: 11.5px;
    line-height: 1.55;
    color: var(--ink-2);
    background: var(--bg-0);
    border: 1px solid var(--rule);
    border-radius: var(--r-md);
    padding: 12px 14px;
    margin: 0 0 14px;
    overflow: auto;
    white-space: pre;
  }
  pre.payload .k { color: var(--signal); }
  pre.payload .s { color: oklch(0.74 0.10 145); }
  pre.payload .n { color: oklch(0.78 0.12 230); }
  pre.payload .c { color: var(--ink-4); font-style: italic; }

  .timeline {
    border-top: 1px solid var(--rule);
    padding: 14px 18px 18px;
    background: var(--bg-1);
  }
  .timeline-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-4);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
  }
  .timeline-track {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: 1fr;
    gap: 3px;
  }
  .tl-cell {
    height: 22px;
    background: var(--bg-2);
    border: 1px solid transparent;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    position: relative;
  }
  .tl-cell:hover { background: oklch(0.28 0.018 80); }
  .tl-cell.done { background: var(--signal-dim); }
  .tl-cell.current {
    background: var(--signal);
    border-color: var(--ink-1);
    box-shadow: 0 0 10px oklch(0.80 0.18 72 / 0.6);
  }

  /* ── Dock / controls ──────────────────────────────────── */
  footer.dock {
    grid-area: dock;
    background: var(--bg-1);
    padding: 14px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .ctrl-group {
    display: flex;
    gap: 6px;
  }
  button.ctrl {
    appearance: none;
    border: 1px solid var(--rule);
    background: var(--bg-2);
    color: var(--ink-1);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 8px 14px;
    border-radius: var(--r-md);
    cursor: pointer;
    transition: background 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }
  button.ctrl:hover { background: oklch(0.28 0.018 80); border-color: var(--ink-4); }
  button.ctrl[disabled] { opacity: 0.45; cursor: not-allowed; }
  button.ctrl.primary {
    background: var(--signal);
    color: var(--bg-0);
    border-color: var(--signal);
  }
  button.ctrl.primary:hover { background: oklch(0.86 0.16 72); }

  .speed {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .speed-pills { display: flex; gap: 2px; }
  .speed-pill {
    border: 1px solid var(--rule);
    background: transparent;
    color: var(--ink-3);
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 5px 9px;
    cursor: pointer;
    border-radius: 0;
  }
  .speed-pill:first-child { border-radius: var(--r-md) 0 0 var(--r-md); }
  .speed-pill:last-child  { border-radius: 0 var(--r-md) var(--r-md) 0; }
  .speed-pill.on { background: var(--signal); color: var(--bg-0); border-color: var(--signal); }

  .clock {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.08em;
    padding-right: 4px;
  }
  .clock .accent { color: var(--signal); }

  /* Legend */
  .legend {
    position: absolute;
    left: 22px;
    bottom: 22px;
    display: flex;
    gap: 18px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-4);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    background: oklch(0.18 0.012 80 / 0.85);
    backdrop-filter: blur(6px);
    border: 1px solid var(--rule);
    border-radius: var(--r-md);
    padding: 8px 14px;
  }
  .legend .sw {
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 6px;
    vertical-align: -1px;
    border-radius: 2px;
    border: 1px solid currentColor;
  }
  .legend .sw.dormant { background: var(--node-soft); color: var(--node-soft); }
  .legend .sw.active  { background: var(--signal);    color: var(--signal); }
  .legend .sw.warm    { background: var(--signal-dim); color: var(--signal-dim); }

  /* Mobile fallback — the diagram needs width, so we offer a "stack" view. */
  @media (max-width: 880px) {
    body { overflow: auto; }
    .app {
      grid-template-columns: 1fr;
      grid-template-areas:
        "header"
        "side"
        "stage"
        "dock";
      height: auto;
    }
    .stage { height: 64vh; }
    aside.side { max-height: 50vh; }
    .legend { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="brand">iii / harness</span>
    <h1 class="title">End-to-end information flow</h1>
    <span class="subtitle" id="subtitle">15 stages · browser → bus → provider → function → transcript</span>
  </header>

  <section class="stage" id="stage">
    <svg
      class="diagram"
      viewBox="0 0 1480 880"
      preserveAspectRatio="xMidYMid meet"
      aria-label="harness data flow"
    >
      <defs>
        <!-- arrow marker -->
        <marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 10 10"
                refX="9" refY="5" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="currentColor" />
        </marker>
        <marker id="arrow-active" markerWidth="8" markerHeight="8" viewBox="0 0 10 10"
                refX="9" refY="5" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="oklch(0.80 0.18 72)" />
        </marker>
      </defs>

      <!-- Zone captions -->
      <text class="zone-label" x="30" y="38">01 · CLIENT</text>
      <text class="zone-label" x="290" y="38">02 · ENGINE INGRESS</text>
      <text class="zone-label" x="640" y="38">03 · BUS</text>
      <text class="zone-label" x="840" y="38">04 · ORCHESTRATION</text>
      <text class="zone-label" x="1180" y="38">05 · EXTERNAL</text>

      <text class="zone-label" x="840" y="260">HOOK SUBSCRIBERS</text>
      <text class="zone-label" x="840" y="510">FUNCTION CALL</text>
      <text class="zone-label" x="840" y="710">PERSISTENCE</text>

      <!-- ====================================================== -->
      <!-- ROW 1 — Forward request path                            -->
      <!-- ====================================================== -->

      <!-- Browser -->
      <g class="node" id="n-browser" transform="translate(40,60)">
        <rect class="body" width="180" height="90" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="18" r="3" />
        <text class="role" x="28" y="22">browser :5173</text>
        <text class="label" x="14" y="50">REACT UI</text>
        <text class="role" x="14" y="70">bridge.ts → POST</text>
        <text class="role" x="14" y="82">/bridge/trigger</text>
      </g>

      <!-- iii-http (engine HTTP trigger) -->
      <g class="node" id="n-http" transform="translate(280,60)">
        <rect class="body" width="180" height="90" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="18" r="3" />
        <text class="role" x="28" y="22">engine · :3111</text>
        <text class="label" x="14" y="50">iii-http</text>
        <text class="role" x="14" y="70">accepts http triggers</text>
        <text class="role" x="14" y="82">routes to bus</text>
      </g>

      <!-- bridge::trigger -->
      <g class="node" id="n-bridge" transform="translate(520,60)">
        <rect class="body" width="200" height="90" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="18" r="3" />
        <text class="role" x="28" y="22">iii-harness · binding</text>
        <text class="label" x="14" y="50">bridge::trigger</text>
        <text class="role" x="14" y="70">unwraps {fn_id, payload}</text>
        <text class="role" x="14" y="82">iii.trigger(...)</text>
      </g>

      <!-- iii bus (the spine) -->
      <g class="node bus" id="n-bus" transform="translate(770,60)">
        <rect class="body" width="40" height="780" rx="6" ry="6" />
        <text class="label" x="20" y="430" text-anchor="middle"
              transform="rotate(-90 20 430)">iii bus · ws :49134</text>
      </g>

      <!-- turn-orchestrator -->
      <g class="node" id="n-turn" transform="translate(860,60)">
        <rect class="body" width="200" height="90" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="18" r="3" />
        <text class="role" x="28" y="22">orchestration</text>
        <text class="label" x="14" y="50">turn-orchestrator</text>
        <text class="role" x="14" y="70">run::start</text>
        <text class="role" x="14" y="82">durable state machine</text>
      </g>

      <!-- provider-router -->
      <g class="node" id="n-router" transform="translate(1090,60)">
        <rect class="body" width="180" height="90" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="18" r="3" />
        <text class="role" x="28" y="22">routing</text>
        <text class="label" x="14" y="50">provider-router</text>
        <text class="role" x="14" y="70">router::stream_assistant</text>
        <text class="role" x="14" y="82">→ provider worker</text>
      </g>

      <!-- provider-anthropic + external API -->
      <g class="node" id="n-anthropic" transform="translate(1290,60)">
        <rect class="body" width="170" height="90" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="18" r="3" />
        <text class="role" x="28" y="22">provider</text>
        <text class="label" x="14" y="50">provider-</text>
        <text class="label" x="14" y="66">anthropic</text>
        <text class="role" x="14" y="82">streams Messages API</text>
      </g>
      <g class="node external" id="n-extapi" transform="translate(1290,180)">
        <rect class="body" width="170" height="70" rx="10" ry="10" />
        <text class="role" x="14" y="22">external · https</text>
        <text class="label" x="14" y="46">Anthropic API</text>
        <text class="role" x="14" y="62">api.anthropic.com</text>
      </g>

      <!-- ====================================================== -->
      <!-- ROW 2 — Hook subscribers (agent::before_function_call)  -->
      <!-- ====================================================== -->

      <g class="node" id="n-policy" transform="translate(860,280)">
        <rect class="body" width="200" height="60" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="14" r="3" />
        <text class="label" x="14" y="32">policy-denylist</text>
        <text class="role" x="14" y="50">blocks denied function ids</text>
      </g>

      <g class="node" id="n-budget" transform="translate(860,350)">
        <rect class="body" width="200" height="60" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="14" r="3" />
        <text class="label" x="14" y="32">llm-budget</text>
        <text class="role" x="14" y="50">caps spend · forecast</text>
      </g>

      <g class="node" id="n-approval" transform="translate(860,420)">
        <rect class="body" width="200" height="60" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="14" r="3" />
        <text class="label" x="14" y="32">approval-gate</text>
        <text class="role" x="14" y="50">requests user approval</text>
      </g>

      <!-- hook-fanout (publishes the call to all subscribers) -->
      <g class="node" id="n-fanout" transform="translate(1090,350)">
        <rect class="body" width="180" height="60" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="14" r="3" />
        <text class="label" x="14" y="32">hook-fanout</text>
        <text class="role" x="14" y="50">publish_collect</text>
      </g>

      <!-- ====================================================== -->
      <!-- ROW 3 — Function call                                   -->
      <!-- ====================================================== -->

      <g class="node" id="n-agentcall" transform="translate(860,530)">
        <rect class="body" width="200" height="60" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="14" r="3" />
        <text class="label" x="14" y="32">agent_call · dispatch</text>
        <text class="role" x="14" y="50">thin pass-through</text>
      </g>

      <g class="node" id="n-shellbash" transform="translate(1090,530)">
        <rect class="body" width="180" height="60" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="14" r="3" />
        <text class="label" x="14" y="32">shell-bash</text>
        <text class="role" x="14" y="50">sandbox::exec</text>
      </g>

      <g class="node" id="n-shellfs" transform="translate(1290,530)">
        <rect class="body" width="170" height="60" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="14" r="3" />
        <text class="label" x="14" y="32">shell-filesystem</text>
        <text class="role" x="14" y="50">read · write · glob</text>
      </g>

      <!-- ====================================================== -->
      <!-- ROW 4 — Persistence + stream                            -->
      <!-- ====================================================== -->

      <g class="node" id="n-tree" transform="translate(860,730)">
        <rect class="body" width="200" height="60" rx="10" ry="10" />
        <circle class="pin" cx="14" cy="14" r="3" />
        <text class="label" x="14" y="32">session-tree</text>

const STEPS = [

/* ── DOM refs ─────────────────────────────────────────────────────────── */
const $title      = document.getElementById("step-title");
const $num        = document.getElementById("step-num");
const $body       = document.getElementById("step-body");
const $track      = document.getElementById("timeline-track");
const $elapsed    = document.getElementById("elapsed-label");
const $btnPlay    = document.getElementById("btn-play");
const $btnPrev    = document.getElementById("btn-prev");
const $btnNext    = document.getElementById("btn-next");
const $btnReset   = document.getElementById("btn-reset");
const $pulse      = document.getElementById("pulse");
const $turnCount  = document.getElementById("turn-count");
const $sessionId  = document.getElementById("session-id");
const speedPills  = Array.from(document.querySelectorAll(".speed-pill"));

$sessionId.textContent = "sess_8c2f";

/* Build the timeline scrubber */
STEPS.forEach((_, i) => {
  const cell = document.createElement("button");
  cell.className = "tl-cell";
  cell.title = `Step ${i + 1}`;
  cell.addEventListener("click", () => goto(i, { fromUser: true }));
  $track.appendChild(cell);
});
const $cells = Array.from($track.children);

/* Payload syntax tags ↦ spans */
function renderPayload(src) {
  if (!src) return "";
  const escaped = src
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/&lt;(\/?)([kscn])&gt;/g, (_, slash, cls) =>
      slash === "/" ? "</span>" : `<span class="${cls}">`);
  return `<pre class="payload">${escaped}</pre>`;
}

/* ── State engine ─────────────────────────────────────────────────────── */
let idx          = 0;
let playing      = false;
let speed        = 1;
let pulseRAF     = 0;
let pulseHold    = null;   // setTimeout id between steps
let elapsedClock = 0;      // ms of in-story elapsed time

const STEP_DURATION_MS = 2400; // base time the pulse animates
const STEP_DWELL_MS    = 600;  // pause between steps

function setActive(id, mode = "active") {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove("active", "warm");
  el.classList.add(mode);
}
function cool(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove("active");
  el.classList.add("warm");
}
function dormant(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove("active", "warm");
}

function applyStepStyle(stepIndex) {
  // Cool every previously-active node, mark current step's lights as active.
  STEPS.forEach((s, i) => {
    if (i === stepIndex) return;
    if (i < stepIndex) (s.light || []).forEach(cool);
    else                (s.light || []).forEach(dormant);
  });
  (STEPS[stepIndex].light || []).forEach(id => setActive(id));

  // Edge highlights — mark current as active, others as default
  document.querySelectorAll(".edge").forEach(p => p.classList.remove("active", "warm"));
  const current = STEPS[stepIndex];
  const liveEdges = [current.edge, ...(current.extraEdges || [])].filter(Boolean);
  liveEdges.forEach(eid => {
    const p = document.getElementById(eid);
    if (p) p.classList.add("active");
  });
  // Mark all earlier edges as warm
  for (let i = 0; i < stepIndex; i++) {
    const past = STEPS[i];
    [past.edge, ...(past.extraEdges || [])].filter(Boolean).forEach(eid => {
      const p = document.getElementById(eid);
      if (p && !p.classList.contains("active")) p.classList.add("warm");
    });
  }
}

function renderStep(stepIndex) {
  const s = STEPS[stepIndex];
  $title.textContent = s.title;
  $num.textContent = String(stepIndex + 1).padStart(2, "0");
  $body.innerHTML = `
    <div class="actors">${(s.actors || []).map(a => `<span>${a}</span>`).join("")}</div>
    ${s.narration || ""}
    ${renderPayload(s.payload)}
  `;
  $cells.forEach((c, i) => {
    c.classList.toggle("done", i < stepIndex);
    c.classList.toggle("current", i === stepIndex);
  });

  // Turn count grows after first agent turn completes
  $turnCount.textContent = stepIndex >= 11 ? "1" : "0";

  // Elapsed-time pseudo clock — accumulates by step duration
  elapsedClock = stepIndex * (STEP_DURATION_MS + STEP_DWELL_MS);
  $elapsed.textContent = `+${(elapsedClock / 1000).toFixed(2)}s`;

  applyStepStyle(stepIndex);
}

/* ── Pulse animator ───────────────────────────────────────────────────── */
function stopPulse() {
  if (pulseRAF) cancelAnimationFrame(pulseRAF);
  if (pulseHold) clearTimeout(pulseHold);
  pulseRAF = 0;
  pulseHold = null;
  $pulse.setAttribute("cx", -99);
  $pulse.setAttribute("cy", -99);
}

/* For multi-edge steps (e.g. hook fan-out) pulse along the trunk
   then briefly highlight the branch edges in turn. */
function runStepAnimation(stepIndex, after) {
  const s = STEPS[stepIndex];
  const edges = [s.edge, ...(s.extraEdges || [])].filter(Boolean);
  if (!edges.length) {
    // No edge animation — just dwell.
    pulseHold = setTimeout(after, STEP_DURATION_MS / speed);
    return;
  }
  let i = 0;
  const next = () => {
    if (!playing) return;
    if (i >= edges.length) { after(); return; }
    const isPrimary = i === 0;
    const dur = isPrimary ? STEP_DURATION_MS : 900;
    const eid = edges[i++];
    animatePulseAlong(eid, s.reverse && isPrimary, dur, next);
  };
  next();
}
function animatePulseAlong(edgeId, reverse, dur, onDone) {
  const path = document.getElementById(edgeId);
  if (!path) { onDone?.(); return; }
  const total = path.getTotalLength();
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / (dur / speed));
    const eased = 1 - Math.pow(1 - t, 3);
    const at = reverse ? (1 - eased) * total : eased * total;
    const p = path.getPointAtLength(at);
    $pulse.setAttribute("cx", p.x);
    $pulse.setAttribute("cy", p.y);
    if (t < 1 && playing) {
      pulseRAF = requestAnimationFrame(tick);
    } else {
      $pulse.setAttribute("cx", -99);
      $pulse.setAttribute("cy", -99);
      onDone?.();
    }
  }
  pulseRAF = requestAnimationFrame(tick);
}

/* ── Player ───────────────────────────────────────────────────────────── */
function goto(i, opts = {}) {
  stopPulse();
  idx = Math.max(0, Math.min(STEPS.length - 1, i));
  renderStep(idx);
  if (playing) {
    runStepAnimation(idx, () => {
      pulseHold = setTimeout(() => {
        if (!playing) return;
        if (idx >= STEPS.length - 1) {
          setPlaying(false);     // hit the end — stop
          return;
        }
        goto(idx + 1);
      }, STEP_DWELL_MS / speed);
    });
  }
}

function setPlaying(p) {
  playing = p;
  $btnPlay.textContent = playing ? "Pause" : (idx >= STEPS.length - 1 ? "Replay" : "Play");
  if (!playing) {
    stopPulse();
  } else {
    if (idx >= STEPS.length - 1) {
      // Replay from start
      goto(0);
    } else {
      goto(idx);
    }
  }
}

/* ── Controls wiring ──────────────────────────────────────────────────── */
$btnPlay.addEventListener("click", () => setPlaying(!playing));
$btnNext.addEventListener("click", () => { setPlaying(false); goto(idx + 1); });
$btnPrev.addEventListener("click", () => { setPlaying(false); goto(idx - 1); });
$btnReset.addEventListener("click", () => { setPlaying(false); goto(0); });

speedPills.forEach(p => {
  p.addEventListener("click", () => {
    speedPills.forEach(x => x.classList.remove("on"));
    p.classList.add("on");
    speed = parseFloat(p.dataset.speed);
  });
});

document.addEventListener("keydown", (e) => {
  if (e.target.matches("input,textarea")) return;
  if (e.code === "Space") { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === "ArrowRight") { setPlaying(false); goto(idx + 1); }
  else if (e.code === "ArrowLeft")  { setPlaying(false); goto(idx - 1); }
  else if (e.key === "r" || e.key === "R") { setPlaying(false); goto(0); }
});

/* Initial render */
renderStep(0);
</script>
</body>
</html>
