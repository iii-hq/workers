iii: v1
name: security-scan
language: rust
deploy: binary
manifest: Cargo.toml
license: Apache-2.0
bin: security-scan
tags: [security, scanning, code-review, supply-chain, git]
description: Report-only security reviews of operator-configured repositories at immutable Git commits, dispatched through a read-only Harness policy. Observe security-scan::on-run-changed, on-reconciliation-changed and on-action-changed (iii 0.25) or bind their security-scan::*-changed trigger types.

config:
  repositories: []
  analysis:
    model: ""
    max_turns: 4
    max_output_tokens: 8000
    max_total_tokens: 50000
    max_cost_usd: 2.0

dependencies:
  github: "latest"
  harness: "latest"
  cron: "latest"
  state: "latest"
  queue: "latest"
  worktree: "latest"
  storage: "latest"
  configuration: "latest"
  iii-observability: "latest"
