[workspace]

[package]
name = "security-scan"
version = "0.1.1-experimental"
edition = "2021"
publish = false

[[bin]]
name = "security-scan"
path = "src/main.rs"

[lib]
name = "security_scan"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
cron = "0.12"
iii-helpers = "=0.22.1-alpha.25"
iii-console-ui = { path = "../crates/console-ui" }
iii-sdk = "=0.22.1-alpha.25"
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_yaml = "0.9"
