[workspace]

[package]
name = "workflow"
version = "0.2.2"
edition = "2021"
publish = false

[[bin]]
name = "workflow"
path = "src/main.rs"

[lib]
name = "workflow"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.26.0"
iii-helpers = "=0.26.0"
# Shared plumbing for the builtin `configuration` worker (seeding, retries,
# NOT_FOUND semantics, serialized hot-reload, guidance observer slot).
iii-config-client = { path = "../crates/config-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
schemars = "0.8"
# A JSON node's answer is checked against its `schema` (same version and
# features as the harness).
jsonschema = { version = "0.18", default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "test-util"] }

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
