[workspace]

[package]
name = "workflow"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "workflow"
path = "src/main.rs"

[lib]
name = "workflow"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.22.0-alpha.2"
iii-helpers = "=0.22.0-alpha.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
schemars = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
