[advisories]
ignore = [
  # rust_decimal 1.41 locks optional rkyv 0.7 support, but this project only
  # enables db-tokio-postgres. The vulnerable rkyv code is not compiled.
  "RUSTSEC-2026-0235",
  # rsa (Marvin: timing side channel on private-key operations; no fixed
  # release, 0.10 rc included). Only database/Cargo.lock has it, through
  # russh's `rsa` feature, so the worker can authenticate to an SSH bastion
  # with an RSA key and verify RSA host keys. The private-key operation is
  # one signature per SSH session, toward a server the operator chose; the
  # attack needs an observer timing many operations. Drop `rsa` from russh's
  # features (Ed25519/ECDSA only) if this ever stops being acceptable.
  "RUSTSEC-2023-0071",
  # webpki-roots (distrusted emSign intermediates; fixed in 1.0.10). Ignored
  # for 0.26.11, the last 0.26 release, which mysql_async 0.34's rustls-tls
  # feature requires (database/Cargo.lock): it is a semver trick that
  # re-exports webpki-roots 1's TLS_SERVER_ROOTS, so with 1.0.10 locked it
  # carries the fixed roots. This id also covers 1.x: keep every lockfile's
  # webpki-roots 1 at 1.0.10 or later. Drop this entry with mysql_async's
  # move to webpki-roots 1.
  "RUSTSEC-2026-0381",
]
