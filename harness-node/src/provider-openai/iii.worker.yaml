iii: v1
name: provider-openai
language: node
deploy: binary
manifest: package.json
bin: iii-provider-openai
description: OpenAI Chat Completions streaming provider; exposes provider::openai::stream and provider::openai::complete on the iii bus.

runtime:
  kind: node

scripts:
  install: pnpm install
  start: node ./dist/provider-openai/main.js --config ./config.yaml

dependencies:
  auth-credentials: "^0.2.0"
