[workspace]

[package]
name = "worktree"
version = "0.2.5"
edition = "2021"
publish = false

[[bin]]
name = "worktree"
path = "src/main.rs"

[lib]
name = "worktree"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.22.0-alpha.2"
# Worker-side injectable console UI (content function + console:script/style
# triggers + hot-reload watcher) — direct path link, never published.
iii-console-ui = { path = "../crates/console-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
globset = "0.4"
# Must stay on the same schemars major as iii-sdk so the derived
# `JsonSchema` impls satisfy `RegisterFunction::new_async` /
# `RegisterTriggerType::trigger_request_format`.
schemars = "0.8"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
which = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process", "fs", "test-util"] }
