[workspace]

[package]
name = "worktree"
version = "0.4.3"
edition = "2024"
publish = false

[[bin]]
name = "worktree"
path = "src/main.rs"

[lib]
name = "worktree"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.26.0"
iii-worker-paths = { path = "../crates/worker-paths" }
# Worker-side injectable console UI (content function + ade::ui::asset
# observers + hot-reload watcher) — direct path link, never published.
iii-console-ui = { path = "../crates/console-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
globset = "0.4"
# Must stay on the same schemars major as iii-sdk so the derived
# `JsonSchema` impls satisfy `RegisterFunction::new` / `new_async` and
# `RegisterFunction::args_format`.
schemars = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
which = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process", "fs", "test-util"] }

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
