[workspace]

[package]
name = "web"
version = "1.2.2"
edition = "2021"
publish = false

[[bin]]
name = "web"
path = "src/main.rs"

[lib]
name = "web"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.20.0"
arc-swap = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
schemars = "0.8"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
htmd = "0.5"
tl = { package = "astral-tl", version = "0.7" }
ipnet = "2"
base64 = "0.22"
bytes = "1"
rust-stemmers = "1"
url = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net"] }
futures = "0.3"
bytes = "1"
