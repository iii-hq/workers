iii: v1
name: llm-router
language: rust
deploy: binary
manifest: Cargo.toml
license: Apache-2.0
bin: llm-router
tags: [llm, router, models, providers]
description: One front door + provider protocol in front of every LLM provider. Registers the `router::ready`, `router::models::changed` and `router::provider::changed` trigger types and, next to them, the observable functions `router::on-ready`, `router::on-models-changed` and `router::on-provider-changed` (iii 0.25).

dependencies:
  state: "latest"
  configuration: "latest"
  # Provider keys are referenced as secret://NAME (encrypted) or env://NAME
  # (the project's .env) and resolved through it.
  secrets: "latest"
