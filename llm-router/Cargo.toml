[workspace]

# 0.2.x: the llm-router/v0.1.1–v0.1.2 tags belong to a retired predecessor;
# this lineage starts above them so Create Tag never collides.
[package]
name = "llm-router"
version = "1.4.1"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "One front door + provider protocol in front of every LLM provider."

[[bin]]
name = "llm-router"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.21.6"
iii-console-ui = { path = "../crates/console-ui", optional = true }
# Re-exports the same `opentelemetry` the SDK uses, so we can carry the active
# OTel context across `tokio::spawn` boundaries (shared `Context` global).
# 0.21.5 adds the live span-start push, so `router::chat` renders in the
# console while it streams instead of on close.
iii-helpers = "=0.21.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must stay on the same schemars major as iii-sdk so the derived
# request/response schemas match what the SDK emits at registration.
schemars = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
async-trait = "0.1"
thiserror = "2"
futures = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# Local tokenizers for provider_scaffold::tiktoken_count (o200k/cl100k
# vocabularies embedded in the binary — counting never touches the network).
tiktoken-rs = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[features]
# The injectable console UI (ui.rs + the pnpm bundle in build.rs). Path
# dependents that only consume the library types disable default features to
# drop the Node toolchain from their build graph.
default = ["console-ui"]
console-ui = ["dep:iii-console-ui"]
