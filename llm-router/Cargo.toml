[workspace]

[package]
name = "llm-router"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "One front door + provider protocol in front of every LLM provider."

[[bin]]
name = "llm-router"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.19.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
async-trait = "0.1"
thiserror = "2"
futures = "0.3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
