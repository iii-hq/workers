iii: v1
name: provider-claude-code
language: rust
deploy: binary
iii_engine_version: ">=0.26.0"
manifest: Cargo.toml
license: Apache-2.0
bin: provider-claude-code
tags: [llm, anthropic, claude, claude-code, subscription, provider]
description: Claude Code (Pro/Max subscription) Messages API provider worker; implements provider::claude-code::stream and provider::claude-code::refresh_models behind llm-router, using the OAuth token of each turn's Claude Code account from the tmux worker when it holds the accounts, else from the auth-credentials vault or ~/.claude/.credentials.json.

dependencies:
  state: "latest"
  llm-router: "latest"
