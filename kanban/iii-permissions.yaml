# Agent permissions for the kanban worker.
version: 1

rules:
  # Console asset delivery, the native app's bundle and the configuration
  # reload sink are engine plumbing, never agent-callable.
  - '!kanban::ui-content'
  - '!kanban::native-ui'
  - '!kanban::on-config-change'
  # Deleting and restoring a ticket is the human's call, made from the
  # ticket screen (see skills/tickets/kanban-tickets.md). Agents move tickets.
  - '!kanban::ticket::delete'
  - '!kanban::ticket::restore'
  # Planning is the human's call, made in the console: agents file tickets
  # under a project or release, but never create, rename, ship or convert them.
  # One exception: the deepwork orchestrator files each run under its own
  # project (`lead: deepwork`). Scoped by argument, as rules cannot see the
  # caller; any other create waits for a person.
  - function: kanban::project::create
    action: allow
    rule_id: deepwork-run-project
    args:
      lead: { equals: deepwork }
  - '!kanban::project::update'
  - '!kanban::project::archive'
  - '!kanban::project::restore'
  - '!kanban::release::create'
  - '!kanban::release::update'
  - '!kanban::release::ship'
  - '!kanban::release::reopen'
  - '!kanban::release::delete'
  - '!kanban::label::convert'
  # The chat mention provider is console plumbing; agents read a mentioned
  # ticket through kanban::ticket::get (the provider's declared details).
  - '!kanban::mention::search'
  - '!kanban::mention::get'
  # Reads and the ticket working loop are safe to allow by default.
  - kanban::config::info
  - kanban::board::get
  - kanban::ticket::list
  - kanban::ticket::get
  - kanban::ticket::links
  - kanban::ticket::create
  - kanban::ticket::update
  - kanban::ticket::move
  - kanban::project::list
  - kanban::release::list
  - kanban::comment::create
  - kanban::comment::list
  - kanban::activity::list
  - kanban::agent::list
