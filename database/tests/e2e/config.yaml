# iii engine configuration — passed via `iii -c config.yaml`.
#
# Infrastructure workers only (queue, observability). The `configuration`
# worker is enabled by default in the engine.
#
# The database worker and harness are NOT registered here. run-tests.sh:
#   1. starts this engine
#   2. runs harness seed-configuration.ts (configuration::register)
#   3. spawns the database binary as a host process
#   4. runs the harness test suite

workers:
  - name: iii-queue
    config:
      adapter:
        name: builtin

  - name: iii-observability
    config:
      enabled: true
      service_name: database-tests
      exporter: memory
      logs_console_output: true
      sampling_ratio: 1.0
