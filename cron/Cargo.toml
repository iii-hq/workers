[workspace]

[package]
name = "iii-cron"
version = "0.21.27"
edition = "2021"
description = "Cron scheduler worker for iii - hosts cron::on-tick, observed once per fire of a cron expression"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
publish = false

[lib]
name = "iii_cron"
path = "src/lib.rs"

[[bin]]
name = "cron"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.26.0"
iii-console-ui = { path = "../crates/console-ui" }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"
cron = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
serial_test = "3"
