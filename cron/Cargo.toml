[workspace]

[package]
name = "iii-cron"
version = "0.21.4"
edition = "2021"
description = "Cron scheduler worker for iii - schedules functions with cron expressions (cron trigger type)"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
publish = false

[lib]
name = "iii_cron"
path = "src/lib.rs"

[[bin]]
name = "cron"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.22.1-alpha.8"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"
cron = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
serial_test = "3"
