id: shell
name: Shell
description: Command denylist, timeout & output caps, and the fs jail.
value:
  allowlist: []
  code:
    batch_read_budget_bytes: 1048576
    default_exclude_globs:
    - '**/.git/**'
    - '**/node_modules/**'
    - '**/target/**'
    - '**/dist/**'
    - '**/.venv/**'
    - '**/__pycache__/**'
    list_default_page_size: 100
    list_max_page_size: 1000
    max_output_bytes: 131072
    max_read_bytes: 10485760
    max_write_bytes: 10485760
    non_accessible_globs:
    - '**/.env'
    - '**/.env.*'
    - '**/*.pem'
    - '**/*.key'
    - '**/secrets/**'
    search_default_max_line_bytes: 4096
    search_default_max_matches: 1000
    search_response_budget_bytes: 262144
    tree_default_depth: 4
    tree_per_folder_limit: 50
  default_timeout_ms: 30000
  denylist_patterns:
  - rm\s+-rf\s+/
  - :\(\)\s*\{\s*:\|
  - (?i)^(?:(?:\S*/)?env(?:\s+\S+=\S*)*\s+|(?:\S*/)?(?:sudo|doas|nohup)\s+|(?:\S*/)?timeout(?:\s+\S+)?\s+)*(\S*/)?mkfs
  - (?i)^(?:(?:\S*/)?env(?:\s+\S+=\S*)*\s+|(?:\S*/)?(?:sudo|doas|nohup)\s+|(?:\S*/)?timeout(?:\s+\S+)?\s+)*(\S*/)?dd\s+if=
  - (?i)^(?:(?:\S*/)?env(?:\s+\S+=\S*)*\s+|(?:\S*/)?(?:sudo|doas|nohup)\s+|(?:\S*/)?timeout(?:\s+\S+)?\s+)*(\S*/)?shutdown\b
  - (?i)^(?:(?:\S*/)?env(?:\s+\S+=\S*)*\s+|(?:\S*/)?(?:sudo|doas|nohup)\s+|(?:\S*/)?timeout(?:\s+\S+)?\s+)*(\S*/)?reboot\b
  - /etc/shadow
  env:
    allow:
    - PATH
    - HOME
    - LANG
    - LC_ALL
    - TERM
    inherit: true
  fs:
    allow_special_bits: false
    allow_unjailed: false
    denylist_paths:
    - /etc/passwd
    - /etc/shadow
    host_roots:
    - /tmp
    max_read_bytes: 16777216
    max_write_bytes: 16777216
  job_retention_secs: 3600
  max_bg_timeout_ms: 0
  max_concurrent_jobs: 16
  max_output_bytes: 1048576
  max_timeout_ms: 120000
  sandbox:
    enabled: true
  working_dir: null
