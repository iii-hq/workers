# Agent permissions for the tmux worker.
# Spec: docs/sops/new-worker.md § 7. First-match-wins.
#
# Reading sessions, windows, agent states and ports is allowed by default.
# `tmux::panes::select` stays unlisted (needs approval) like windows::select:
# it moves and zooms what every client of that window sees.
# `tmux::panes::capture` stays unlisted too: it returns what is on a pane's
# screen, which can hold anything the person typed or a program printed.
# `tmux::subagents::transcript` stays unlisted for the same reason: it
# returns a sub-agent's conversation, tool calls and their output.
# Splitting, killing and respawning panes stay unlisted for the same reason:
# a kill (or a respawn with kill) ends the program running in a pane.
# Creating, renaming, selecting, moving and killing change the person's tmux
# (a selected window switches their own terminal; a kill ends programs; moving
# a session's last window closes that session) and stay at the needs_approval
# default. `tmux::install` stays unlisted too: it can run
# the system's package manager as root. `tmux::install::status` only reads how
# that install is going. The Console terminal (its upload included, which
# writes a pasted file to the cache folder), the config-reload callback and
# the Console asset function are bus-internal.
#
# `tmux::usage::read` and `tmux::accounts::list` only read: Claude Code and
# Codex usage and the Claude Code accounts (names, emails, plans), never a
# token; `refresh: true` asks Anthropic's usage endpoint again, at most once
# a minute per account. Every other `tmux::accounts::*` function and
# `tmux::panes::account` stay unlisted: a move ends Claude Code in a pane and
# starts it on another account, `global` moves every idle pane that follows
# the global account, `rules` can let the worker switch accounts on its own,
# `login_code` signs an account in (on `~/.claude`, one signed in to someone
# else becomes global), and `remove` with `delete_files` deletes an account's
# sign-in.
version: 1

rules:
  - '!tmux::terminal::*'
  - '!tmux::on-config-change'
  - '!tmux::ui-content'
  - tmux::status
  - tmux::sessions::list
  - tmux::ports::list
  - tmux::install::status
  - tmux::usage::read
  - tmux::accounts::list
