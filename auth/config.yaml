# Local development defaults. Use wss:// engine_url and https:// issuer when
# environment is production.
environment: "local"
engine_url: "ws://127.0.0.1:49134"
issuer: "http://127.0.0.1:3111"
audience: "iii"
idp_mode: "local"
store: "iii_state"
access_token_ttl_seconds: 900
refresh_token_ttl_seconds: 2592000
rotation_overlap_seconds: 86400
rotation_cron: "0 0 3 * * *"
default_scopes:
  - "mcp:tools"
supported_scopes:
  - "mcp:tools"
  - "a2a:message"
token_endpoint_auth_methods_supported:
  - "client_secret_post"
  - "client_secret_basic"
registration_admin_token_env: "III_AUTH_REGISTRATION_TOKEN"
state_timeout_ms: 5000
connection_ready_attempts: 150
connection_ready_interval_ms: 200
