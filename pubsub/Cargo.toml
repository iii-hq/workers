[workspace]

[package]
name = "iii-pubsub"
version = "0.21.0"
edition = "2021"
description = "Pub/sub worker for iii — topic-based publish/subscribe messaging (subscribe trigger type, publish function)"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
publish = false

[lib]
name = "iii_pubsub"
path = "src/lib.rs"

[[bin]]
name = "pubsub"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.21.6"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"
futures = "0.3"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

[dev-dependencies]
serial_test = "3"
