[package]
name = "iii-sandbox-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
authors = ["iii contributors"]
publish = false

[lib]
name = "sandbox_host"
path = "src/lib.rs"

[[bin]]
name = "iii-sandbox-host"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.11.3"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[lints.rust]
unsafe_code = "forbid"
