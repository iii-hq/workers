# Operator-applied read allow-list, NOT a tower-* session rule.
# The current gate cannot match caller session ids, and Directory does not
# install this file. These allows cover EVERY session if merged into the
# deployment's rules. See README.md before applying; do not replace the
# deployment policy with this file.
version: 1
rules:
  - kanban::ticket::list
  - kanban::activity::list
  - kanban::release::list
  - session::list
  - session::messages-tail
  - harness::status
  - harness::ask::list
  - github::pr::list
  - github::pr::checks
