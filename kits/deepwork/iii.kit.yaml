iii: v1
name: iii/deepwork
version: 0.5.1
description: "Multi-agent workflows on iii with the kanban board as the task list: parallel implementation tickets, tests and independent verification/review once per integrated wave, and bounded rounds. Code goals get a dev flow: autonomous reversible decisions with optional design/plan approval, tickets in isolated git worktrees, batch validation, a branch review and a kept branch unless you explicitly choose another finish."
license: Apache-2.0
repo: https://github.com/iii-hq/workers/tree/main/kits/deepwork
tags: [orchestration, sub-agents, kanban, verification, workflows]
workers:
  # 1.8.54: metrics omit_context (#1401) and profile skills_index (#1406).
  harness: ^1.8.54
  # 1.2.40 reads skills_index from profiles (#1406); directory::agents::get checks judges.
  # No caret: harness pulls iii-directory@latest.
  iii-directory: ">=1.2.40"
  # No caret: harness pulls state@latest, and ^0.22 would block 0.23.
  state: ">=0.22.18"
  # 0.1.21: subtasks + parent_id (#1396), compact writes (#1400), add_labels / remove_labels (#1384).
  kanban: ^0.1.21
  # shell::exec and coder::* preloaded by the work and verify tiers. 0.12.19, the first synced
  # manifest after #1150, carries shell::job-finished, which long runs wait on instead of polling.
  # No caret: projects pin ide@latest, and ^0.12 would hold it below 0.13. Not `shell` (a registry
  # alias) or `coder`.
  ide: ">=0.12.19"
