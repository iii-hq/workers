iii: v1
name: iii/workflow
version: 0.1.12
iii_engine_version: ">=0.26.0"
description: "Sizes a goal first: a small one is done directly, with no ticket and no run, one or two tickets as one workflow run each, and a broad one as multi-agent work on the kanban board, one workflow run per wave: the ticket strategy of iii/deepwork (a run ticket, subtask cards, bounded rounds, independent verification) with every phase as a workflow node, each one with its own profile and model, retried by the run's check loop. Code goals get a run branch, one run per ticket that runs alone, one worktree per ticket of a parallel wave and a kept branch. Installs beside iii/deepwork."
license: Apache-2.0
repo: https://github.com/iii-hq/workers/tree/main/kits/workflow
tags: [orchestration, workflows, kanban, verification, sub-agents]
workers:
  # The flat workflow::start request (`nodes` at the top level, `task` on a node; an older
  # worker refuses every run), node options (profile, model, label, phase, loop,
  # filesystem_root), an `output` naming a loop body node, the caller folder, workflow::status
  # details and the run-end observe (`next` + replay of workflow::on-run-completed): 0.3.0 is
  # the first release with all of them. 0.3.4: the `read_only` node key (an older worker
  # refuses every run that sets it) and the transient-failure continue. No caret, like state
  # and ide.
  workflow: ">=0.3.4"
  # 1.9.9: a parked node keeps waiting while its wake is delivered, and every exchange ends
  # with its terminal completion (a reseeded turn, a failed reseed, a crashed finalize).
  # 1.9.13: `failure.retryable` on harness::status, which the transient-failure continue reads.
  harness: ^1.9.13
  # iii-directory, state, kanban and ide: their first releases on iii-sdk 0.26 (observe v2),
  # the same floors as iii/deepwork, so the two kits install side by side.
  # No caret: harness pulls iii-directory@latest.
  iii-directory: ">=1.3.0"
  # No caret: harness pulls state@latest, and ^0.23 would block 0.24.
  state: ">=0.23.0"
  # 0.1.21: subtasks + parent_id, compact writes, add_labels / remove_labels.
  # 0.2.0 is its observe v2 port: on a 0.26 engine, 0.1.x registers its board page and config
  # watch as triggers, which the engine drops, so the Kanban page never appears.
  kanban: ^0.2.0
  # shell::exec, shell::on-job-finished and coder::* for the nodes. No caret: projects pin ide@latest.
  ide: ">=0.13.0"
  # fp::pipe + fp::get read node_errors when a workflow::status reply is too large to return.
  # No caret: harness pulls fp@latest.
  fp: ">=0.3.0"
  # Not listed, on purpose: `browser` is optional. A run calls browser::chromium::status once (the
  # newest call a page check needs, so an older browser worker reads as absent). When it finds a
  # Chromium, a card that changes a web page is verified in a tab; otherwise the run says pages
  # were not checked. Listing it would install the worker, and maybe a Chromium, for every run
  # that never opens a page.
  # Not listed either: `judge` is optional. A run on the board calls judge::evaluate at most once,
  # to ask which project its goal belongs to. Without the worker, or when the call fails, the run
  # goes under the repository's project. (The harness already depends on judge.)
