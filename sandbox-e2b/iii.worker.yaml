iii: v1
name: sandbox-e2b
language: rust
deploy: binary
manifest: Cargo.toml
bin: iii-sandbox-e2b
description: E2B microVM adapter for the sandbox::* family. Registers sandbox::provider::e2b::*; reach it via the sandbox router with provider="e2b".
config:
  api_base: "https://api.e2b.dev"
  api_key_env: E2B_API_KEY
  max_concurrent_sandboxes: 10
  default_idle_timeout_secs: 300
  image_allowlist: []
