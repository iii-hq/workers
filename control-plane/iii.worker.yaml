iii: v1
name: control-plane
language: javascript
deploy: bundle
iii_engine_version: ">=0.26.0"
manifest: package.json
license: Apache-2.0
tags: [control-plane, summaries, kanban, github, console]
description: Read-only project control plane, management-by-exception view, and referenced summary scheduler.

runtime:
  kind: javascript

scripts:
  install: if [ -f src/index.ts ]; then pnpm install --frozen-lockfile && pnpm run build:bundle; fi
  start: node ./dist/bundle/index.mjs

dependencies:
  configuration: "latest"
  harness: "latest"
  session-manager: "latest"
  kanban: "latest"
  state: "latest"
  iii-directory: "latest"
