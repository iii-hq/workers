[workspace]

[package]
name = "iii-console-ui"
version = "0.1.0"
edition = "2024"
description = "Worker-side helper for the injectable console UI — registers the content function, one ade::ui::asset observer per asset, and the dev-loop hot-reload watcher"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
# Deliberately unpublished: workers in this repo link it by path
# (iii-console-ui = { path = "../crates/console-ui" }) so it versions with
# the ADE worker here, not with the SDK's crates.io release train.
publish = false

[dependencies]
# One iii-sdk per build graph, so the `IIIClient` a worker passes in is the
# type this crate takes: each worker's own exact pin picks the version. A
# range while workers move from 0.26 to 0.27; this crate only uses API both
# have. Back to the exact pin once every worker is on 0.27.
iii-sdk = ">=0.26.0, <=0.27.0-rc.1"
tokio = { version = "1", features = ["rt", "sync", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
