[workspace]

[package]
name = "iii-config-client"
version = "0.1.0"
edition = "2021"
description = "Worker-side client for the builtin configuration worker — safe seeding, NOT_FOUND-aware reads, retrying RPCs, serialized hot-reload, and the knob-following observer slot"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
# Deliberately unpublished: workers in this repo link it by path
# (iii-config-client = { path = "../crates/config-client" }), the same way
# they link crates/console-ui.
publish = false

[dependencies]
# The same exact pin as every worker: one iii-sdk per build graph, so the
# `IIIClient` a worker passes in is the type this crate takes.
iii-sdk = "=0.26.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must stay on the same schemars major as iii-sdk so the derived schemas line up.
schemars = "0.8"
tokio = { version = "1", features = ["rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
