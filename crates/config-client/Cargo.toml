[workspace]

[package]
name = "iii-config-client"
version = "0.1.0"
edition = "2021"
description = "Worker-side client for the builtin configuration worker — safe seeding, NOT_FOUND-aware reads, retrying RPCs, serialized hot-reload, and the knob-following trigger binding slot"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
# Deliberately unpublished: workers in this repo link it by path
# (iii-config-client = { path = "../crates/config-client" }), the same way
# they link crates/console-ui.
publish = false

[dependencies]
# Workers carry their own exact SDK pins. Keep this shared crate compatible
# with the 0.24 and 0.25 SDK lines so Cargo can unify it with each worker.
# No 0.25 release candidate fits: Cargo only admits a prerelease when a
# comparator names one on the same major.minor.patch.
iii-sdk = ">=0.24.6, <0.26.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must stay on the same schemars major as iii-sdk so the derived schemas line up.
schemars = "0.8"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
