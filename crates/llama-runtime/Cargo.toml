[workspace]

[package]
name = "iii-llama-runtime"
version = "0.1.0"
edition = "2021"
description = "llama.cpp runtime shared by the in-process judge providers: model loading, device selection and the thread that owns the context"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
# Deliberately unpublished: workers in this repo link it by path, like
# crates/config-client.
publish = false

[dependencies]
anyhow = "1"
# llama.cpp itself: built, linked and laid beside the binaries by its build.rs.
iii-llama-native = { path = "../llama-native" }
judge-contract = { path = "../judge-contract" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
