[workspace]

[package]
name = "judge-clef"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "clef provider for the judge hub: Cloudflare's Clef-Flash decision model run in-process (Qwen3.5 backbone GGUF through llama.cpp, joint schema head through candle)."

[features]
default = ["console-ui"]
console-ui = ["dep:iii-console-ui"]

[dependencies]
judge-contract = { path = "../crates/judge-contract" }
iii-sdk = "=0.23.0"
iii-config-client = { path = "../crates/config-client" }
iii-console-ui = { path = "../crates/console-ui", optional = true }
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
candle-core = "0.11"
candle-nn = "0.11"
iii-llama-runtime = { path = "../crates/llama-runtime" }
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
ryu = "1"
anyhow = "1"
hf-hub = { version = "0.4", default-features = false, features = ["ureq", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = "0.1"

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.28"

# The joint head runs here on the CPU: keep full optimization, like judge-laya.
[profile.release]
opt-level = 3
