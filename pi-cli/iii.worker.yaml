iii: v1
name: pi-cli
language: javascript
deploy: bundle
manifest: package.json
license: Apache-2.0
tags: [coding-agent, pi, cli, terminal, console-ui]
description: pi as a terminal on the iii console — the worker installs the CLI, equips its workspace with the iii skills, runs it in a shell::pty session, and streams its extension events onto agent::events.

runtime:
  kind: javascript

scripts:
  start: node ./index.mjs

dependencies:
  # The terminal itself: shell::pty runs the CLI, shell::exec installs it and
  # equips the workspace, coder::read-file reads the files back.
  shell: "^0.12.0"
  # The page this worker injects.
  console: "^1.9.11"
  configuration: "0.x"
  iii-stream: "0.x"
