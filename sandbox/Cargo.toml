[package]
name = "iii-sandbox-router"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
authors = ["iii contributors"]
description = "Caller-facing sandbox::* router. Dispatches by `provider` field to sandbox::provider::<name>::*."
publish = false

[lib]
name = "sandbox_router"
path = "src/lib.rs"

[[bin]]
name = "iii-sandbox"
path = "src/main.rs"

[dependencies]
iii-sandbox-abi = { path = "../sandbox-abi" }
iii-sdk = "=0.11.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
