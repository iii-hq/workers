[workspace]

[package]
name = "eval"
version = "0.1.1"
edition = "2021"
publish = false

[[bin]]
name = "eval"
path = "src/main.rs"

[lib]
name = "eval"
path = "src/lib.rs"

[dependencies]
harness = { path = "../harness" }
iii-sdk = "=0.22.0"
iii-helpers = "=0.22.0"
iii-console-ui = { path = "../crates/console-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
schemars = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_yaml = "0.9"
