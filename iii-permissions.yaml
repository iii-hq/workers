# Default agent permissions (first match wins).
#   bare string        → allow (exact id, or glob when pattern contains *)
#   '*'                → allow any function_id (catch-all; order matters)
#   'worker::*'        → allow any id matching that glob (e.g. shell::fs::read)
#   '*::list'          → allow any worker's ::list leaf
#   '!function_id'     → deny (quote required — bare ! is YAML tag syntax)
#   no match           → needs_approval
# Harness loads via config `permissions_path` and hot-reloads on save.

version: 1

rules:
  # Gate, state, auth, routing — agents must not call these directly.
  - '!approval::resolve'
  # Read-only verdict probe. The harness calls it worker-to-worker before
  # binding a trigger to an ordinary function; an agent probing its own
  # approval posture is reconnaissance, not a tool.
  - '!approval::evaluate'
  - '!hook-fanout::publish_collect'
  - '!state::set'
  - '!state::update'
  - '!state::delete'
  - '!stream::set'
  - '!iii::durable::publish'
  # Provider credentials live in the `llm-router` configuration entry. Agents
  # must never resolve a secret, self-register a provider, poison the model
  # catalog, or read/rewrite the configuration value (which carries plaintext
  # api keys). Direct router spend (chat/complete) bypasses the harness
  # loop's accounting; the routing preview is orchestrator-internal. The
  # console edits config as a user-initiated SDK call, which bypasses this gate.
  - '!router::provider::resolve'
  - '!router::provider::register'
  - '!router::provider::update_credential'
  - '!router::models::reconcile'
  - '!router::chat'
  - '!router::complete'
  - '!router::abort'
  - '!router::route'
  - '!router::on_config_changed'
  # Direct provider calls (provider::anthropic::*, provider::openai::*, …)
  # bypass the router's accounting, budgets, and retry policy. The router
  # invokes these worker-to-worker; agents never call them.
  - '!provider::*'
  - '!configuration::get'
  - '!configuration::set'
  - '!configuration::register'
  # Internal hot-reload trigger handler — must not be agent-callable; it is
  # invoked only by the engine's `configuration:updated` trigger dispatch.
  - '!shell::on-config-change'
  # Operator/automation health signal, not an agent tool: it can surface a
  # build-error string (e.g. a host_root path). Operators/console reach it via
  # the privileged dispatch path that bypasses this agent gate.
  - '!shell::config-status'
  - '!oauth::anthropic::login'
  - '!oauth::openai-codex::login'
  - '!run::start'
  # session-manager: deny-by-default for in-run agents (integration.md §2).
  # An agent that can write here can rewrite its own transcript; the raw
  # store protocol (session::store::*) bypasses every invariant. Reads stay
  # at the needs_approval default (tenancy-sensitive).
  - '!session::store::*'
  - '!session::create'
  - '!session::ensure'
  - '!session::set-meta'
  - '!session::set-draft'
  - '!session::set-status'
  - '!session::delete'
  - '!session::append'
  - '!session::append-many'
  - '!session::update-message'
  - '!session::fork'
  - '!session::set-active-leaf'
  # Operator/automation health signal, not an agent tool: it can surface a
  # build-error string (e.g. a data_dir path). Operators/console reach it via
  # the privileged dispatch path that bypasses this agent gate.
  - '!session::config-status'
  # context-manager: assemble/compact are pure transforms (nothing to leak)
  # but each can spend a summariser LLM call, so deny them to in-run agents in
  # this cost-sensitive deployment (context-manager.md § Agent exposure).
  # count_tokens/prune are always safe and stay at the needs_approval default.
  - '!context::assemble'
  - '!context::compact'
  # Internal lifecycle hooks — agents must never force a config reload directly.
  # The handlers already re-fetch from configuration::get (ignoring the event
  # payload), so a direct call cannot inject config. These denies are
  # defense-in-depth: they close the agent-callable surface so a future handler
  # change cannot inadvertently re-open the injection path.
  - '!storage::on-config-change'
  - '!database::on-config-change'
  - '!editor::on-config-change'
  - '!session::on-config-change'
  # (coder::on-config-change retired: the code surface folded into the shell
  # worker, whose shell::on-config-change is already denied above.)
  # editor's file-change observer: a harness post-trigger hook target, fired
  # engine-side (bypassing this gate) after a shell/coder write. Calling it
  # directly would let an agent forge an `editor::changed` event — path, cause
  # and patch are taken from the payload — into every subscribed console tab.
  - '!editor::on-file-change'
  # harness: deny-by-default for in-run agents (harness.md § Agent exposure).
  # send/run let a model start arbitrary turns outside any max_turns guard;
  # turn is the internal loop step; function::trigger/resolve forge call ids
  # and parked results; stop cancels turns. harness::spawn is the only
  # model-reachable way to start new turns and is left at the needs_approval
  # default (the harness self-enforces depth/fan-out and walls spawned
  # children out of the control plane unless the spawn passes
  # options.orchestrator). The internal config/cron hooks must never be
  # agent-callable.
  - '!harness::send'
  - '!harness::run'
  - '!harness::turn'
  - '!harness::function::trigger'
  - '!harness::function::resolve'
  - '!harness::stop'
  - '!harness::on-config-change'
  - '!harness::sweep-pending'
  # eval: durable orchestration internals are trigger/queue targets only.
  # Starting, cancelling, and deleting evaluations remain approval-gated by
  # the default. Status/result are read-only and the exact evaluator is pure.
  - '!eval::step'
  - '!eval::on-turn-completed'
  - '!eval::sweep'
  # The shaping hop for a trigger bound to an ordinary function: the engine
  # fires it, agents never call it. Agents name their real target in
  # engine::register_trigger's `function_id`, which is checked against the
  # registrant's own policy at registration.
  - '!harness::trigger-call'
  - '!context::on-config-change'
  - '!approval::on-config-change'
  # browser: console-UI plumbing, never agent-callable. pick::* and hint are
  # human gestures (the console drives them as user-initiated SDK calls,
  # which bypass this gate); screencast::*/frame exist only to feed the
  # console viewport. The agent-facing surface (sessions, navigate, snapshot,
  # act, evaluate, console/network reads, dom/styles, history, screenshot)
  # stays at the needs_approval default.
  - '!browser::pick::start'
  - '!browser::pick::resolve'
  - '!browser::pick::stop'
  - '!browser::pick::hint'
  - '!browser::screencast::start'
  - '!browser::screencast::stop'
  - '!browser::frame'
  - '!browser::on-config-change'
  # computer: same split as browser. screencast::*/frame exist only to feed the
  # console viewport; the desktop surface the agent actually uses (sessions,
  # screenshot, observe, act, displays) stays at the needs_approval default,
  # because every act is a real click on a real machine.
  - '!computer::screencast::start'
  - '!computer::screencast::stop'
  - '!computer::frame'
  - '!computer::on-config-change'
  # rbac-proxy: internal reload + catalog-cache hooks — invoked only by the
  # engine's trigger dispatch, never agent-callable. The handlers already
  # re-fetch/ignore the event payload; these denies are defense-in-depth.
  # The proxy is an enforcement boundary, not a callable API — rbac-proxy::status
  # (read-only) stays at the needs_approval default; deny it on deployments where
  # the engine URL / bound port topology is itself sensitive.
  - '!rbac-proxy::on-config-change'
  - '!rbac-proxy::on-functions-available'
  - '!telegram-bot::on-config-change'
  - '!telegram-bot::on-message-added'
  - '!telegram-bot::on-message-updated'
  - '!telegram-bot::on-status-changed'
  - '!telegram-bot::on-turn-completed'
  - '!telegram-bot::on-pending-created'
  - '!telegram-bot::on-pending-resolved'
  # worktree: internal hot-reload hook plus the queue-bound land step. The
  # step executor trusts its persisted job record; agents must go through
  # worktree::land, which validates ownership and enqueues. Mutating ops
  # (create/claim/release/remove/prune/land) stay at the needs_approval
  # default, like the coder write paths.
  - '!worktree::on-config-change'
  - '!worktree::land-step'
  # slack: deny operator-only ingress, internal bindings, and config reload.
  - '!slack::events'
  - '!slack::interactions'
  - '!slack::on-config-change'
  - '!slack::on-message-added'
  - '!slack::on-message-updated'
  - '!slack::on-turn-completed'
  - '!slack::on-pending-created'
  - '!slack::on-pending-resolved'
  # github: internal hot-reload hook — invoked only by the engine's
  # configuration:updated trigger dispatch, never agent-callable.
  - '!github::on-config-change'
  # openwiki: internal trigger targets. cron::refresh-due is the per-wiki cron
  # target; on-turn-started/completed are harness trigger-bridge targets whose
  # direct call could forge generation progress. The hot-reload hook follows
  # the same pattern as the other on-config-change denies.
  - '!openwiki::cron::refresh-due'
  - '!openwiki::on-turn-started'
  - '!openwiki::on-turn-completed'
  - '!openwiki::on-config-change'

  # pdf: internal target. The hot-reload hook follows the same pattern as the
  # other on-config-change denies.
  - '!pdf::on-config-change'

  # code-runner: internal hot-reload hook, same pattern as the other
  # on-config-change denies.
  - '!code-runner::on-config-change'

  # Read-only / introspection (extend below for your tools).
  - state::get
  - state::list
  - router::models::list
  - router::models::get
  - router::models::budget
  - router::models::supports
  - router::provider::list
  # harness::status is read-only (current turn status for a session), and
  # harness::triggers::list is the matching read over a session's own trigger
  # bindings. The teardown half (harness::triggers::unregister) is NOT listed:
  # agents unregister through the intercepted engine::unregister_trigger,
  # which enforces ownership; the standalone teardown stays behind the
  # needs_approval default for the console's privileged path.
  - harness::status
  - eval::status
  - eval::result
  - eval::assert::exact
  - harness::triggers::list
  - oauth::anthropic::status
  - oauth::openai-codex::status
  - engine::functions::list
  - engine::functions::info
  - engine::triggers::list
  - engine::triggers::info
  - engine::workers::list
  - engine::workers::info
  - engine::registered-triggers::list
  - engine::registered-triggers::info
  # Subscriptions: engine::register_trigger is intercepted by the harness and
  # produces a binding that either WAKES the registering session or CALLS a
  # plain function — a binding never starts an agent (`harness::spawn` is
  # refused as a target, so nothing fires engine-side past this gate
  # anymore). Call targets are checked at registration against the
  # registrant's own policy AND the approval gate's verdict, so a binding
  # cannot grant an unattended call the session could not make itself.
  # Bindings registered against the removed `harness::react` / spawn targets
  # are purged on startup; register a wake and spawn directly instead.
  - engine::register_trigger
  - engine::unregister_trigger
  - worker::list
  # Public worker-registry catalogue reads — the system prompt's
  # search-before-build ladder starts here. worker::add stays approval-gated.
  - directory::registry::workers::list
  - directory::registry::workers::info
  # Read-only worktree registry surface; mutating worktree ops stay
  # approval-gated (see the deny block above).
  - worktree::list
  - worktree::get
  - worktree::status
  - worktree::validate
  # editor: the reading half. editor::diff is pure (two strings in, a patch
  # out — no I/O at all); the rest read through the shell worker, so they reach
  # nothing shell::fs::read and shell::exec could not already reach.
  # editor::open is allowed even though it records a buffer: recording what an
  # agent read is the point of the shared workspace, and gating the only read
  # path would make the worker unusable.
  # Left at the needs_approval default on purpose: editor::save, ::create,
  # ::delete and ::move write to disk; the editor::git write surface
  # (commit / sync / stash / undo-commit) rewrites history or talks to a
  # remote; editor::workspace::open repoints the workspace for every surface
  # at once; editor::buffers::close discards someone else's tab.
  - editor::diff
  - editor::open
  - editor::tree
  - editor::find
  - editor::search
  - editor::workspace::get
  - editor::buffers::list
  - editor::git::status
  - editor::git::hunks
  - editor::git::show
  # Read-only code surface (coder::*, now served by the shell worker).
  # Mutating ops (create/update/move/delete-file) stay approval-gated.
  - coder::info
  - coder::read-file
  - coder::search
  - coder::list-folder
  - coder::tree
  # fp: the twenty-three pure value transforms are side-effect-free reshapes (no
  # I/O, no authority). fp::pipe stays at the needs_approval default ON
  # PURPOSE: its steps run with the fp worker's authority, so the pipe
  # call itself is the surface an approver reviews (the worker statically
  # refuses hard-denied classes as steps; see fp/src/pipe.rs). Allowlisting
  # fp::pipe would also grant un-approved shell::*/coder::* execution: scoped
  # steps ride the harness-stamped filesystem scope on the pipe call.
  - fp::get
  - fp::pick
  - fp::omit
  - fp::take
  - fp::drop
  - fp::map
  - fp::filter
  - fp::split
  - fp::join
  - fp::uniq
  - fp::size
  - fp::compact
  - fp::nth
  - fp::getOr
  - fp::flatten
  - fp::sortBy
  - fp::reverse
  - fp::sum
  - fp::mean
  - fp::min
  - fp::max
  - fp::groupBy
  - fp::countBy
  # github: read-only GitHub queries (list/view/diff/checks/search) are safe
  # reads. Mutations (create/edit/merge/comment/review/close/rerun/cancel/
  # workflow run/release create) and the escape hatches (github::exec —
  # arbitrary gh commands; github::api — any REST endpoint including writes)
  # stay at the needs_approval default.
  - github::pr::list
  - github::pr::view
  - github::pr::diff
  - github::pr::checks
  - github::issue::list
  - github::issue::view
  - github::repo::view
  - github::repo::list
  - github::run::list
  - github::run::view
  - github::workflow::list
  - github::release::list
  - github::release::view
  - github::search::repos
  - github::search::issues
  - github::search::prs
  - github::search::code
  # web::fetch is load-bearing for the system prompt's SDK-reference gate and
  # HTTP-trigger verification; it enforces size/timeout caps and server-side
  # SSRF protection, so it is allowed by default.
  - web::fetch

  # pdf: every function is a pure read of a document the agent could already
  # reach through the filesystem scope, and reaching it any other way returns
  # binary noise. Nothing here writes, spends, or leaves the machine, and each
  # response is capped by the worker's own configuration. Gating these would
  # mean an approval prompt to read a file the agent is already allowed to open.
  - pdf::classify
  - pdf::to-markdown
  - pdf::extract-text
  - pdf::extract-items
  - pdf::extract-regions
