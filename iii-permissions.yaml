# Default agent permissions (first match wins).
#   bare string        → allow
#   '!function_id'     → deny (quote required — bare ! is YAML tag syntax)
#   no match           → needs_approval
# Harness loads via config `permissions_path` and hot-reloads on save.

version: 1

rules:
  # Gate, state, auth, routing — agents must not call these directly.
  - '!approval::resolve'
  - '!policy::check_permissions'
  - '!hook-fanout::publish_collect'
  - '!state::set'
  - '!state::update'
  - '!state::delete'
  - '!stream::set'
  - '!iii::durable::publish'
  - '!auth::set_token'
  - '!auth::delete_token'
  - '!oauth::anthropic::login'
  - '!oauth::openai-codex::login'
  - '!run::start'
  - '!router::stream_assistant'
  - '!router::abort'

  # Read-only / introspection (extend below for your tools).
  - state::get
  - state::list
  - models::list
  - models::get
  - models::supports
  - auth::get_token
  - auth::list_providers
  - auth::status
  - oauth::anthropic::status
  - oauth::openai-codex::status
  - directory::engine::functions::list
  - directory::engine::functions::info
  - directory::engine::triggers::list
  - directory::engine::triggers::info
  - directory::engine::workers::list
  - directory::engine::workers::info
  - directory::engine::registered_triggers::list
  - directory::engine::registered_triggers::info
  - directory::skills::list
  - directory::skills::get
  - directory::skills::download
  - directory::prompts::list
  - directory::prompts::get
  - directory::prompts::download
