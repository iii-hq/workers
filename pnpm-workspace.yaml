# The UI workspace: the console SPA, the shared @iii-dev/console-ui package,
# and every worker's injected-UI project link against each other from here
# (workspace:* protocol — no publishing, no copied types).
#
# Deliberately NOT a repo-wide workspace: Node bundle workers (harness/,
# e2e/, …) keep their own self-contained projects and lockfiles; list a
# directory here only when it participates in the shared console-UI surface.
packages:
  - iii-directory/ui
  - judge/ui
  - judge-semif/ui
  - judge-typesafe/ui
  - packages/*
  - ade/web
  - ade/ui
  - context-manager/ui
  - browser/ui
  - web/ui
  - a2ui/ui
  - canvas/ui
  - sandbox-code-runner/ui
  - code-runner/ui
  - computer/ui
  - database/ui
  - eval/ui
  - harness/ui
  - memory/ui
  - pdf/ui
  - state/ui
  - storage/ui
  - cron/ui
  - ide/ui
  - claude-code/ui
  - pi/ui
  - worktree/ui
  - security-scan/ui
  - github/ui
  - llm-router/ui
  - provider-openai-codex/ui
  - provider-openai/ui
  - tailscale/ui
  - voice/ui
  - vscode/ui
  - compose-ui/ui
  - kanban/ui
  - onboarding/ui
  - stories/ui

# One pin per shared toolchain package; every worker UI and the shared
# packages reference these as `"catalog:"` so a bump lands in one place.
catalog:
  '@types/react': ^19.2.14
  '@types/react-dom': ^19.2.3
  esbuild: ^0.25.0
  lucide-react: ^1.16.0
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: ^6.0.3
  vitest: ^4.1.10
  zod: ^4.4.3

# pnpm ≥11 blocks dependency postinstall scripts by default; esbuild's
# installs its platform binary. protobufjs (via iii-sdk → @opentelemetry)
# works without its postinstall — explicitly denied rather than left as an
# unanswered prompt that fails `pnpm build`'s deps check.
allowBuilds:
  esbuild: true
  protobufjs: false

minimumReleaseAgeExclude:
  - '@pierre/trees@1.0.0-beta.6'
  - '@iii-dev/helpers@0.23.0'
  - 'iii-browser-sdk@0.23.0'
  - 'iii-sdk@0.23.0'
