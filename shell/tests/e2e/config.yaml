# iii engine configuration — passed via `iii -c config.yaml`.
#
# The harness TS worker is NOT registered here. It runs as a plain host
# node process launched from run-tests.sh and connects to the engine via
# WebSocket like any external client — sidesteps the libkrun-VM-based
# managed-worker setup, which is overkill for a test harness.

workers:
  - name: iii-queue
    config:
      adapter:
        name: builtin

  - name: iii-observability
    config:
      enabled: true
      service_name: iii-shell-tests
      exporter: memory
      logs_console_output: true
      sampling_ratio: 1.0

  # Real iii-sandbox so cases-exec-sandbox.ts can drive the full
  # shell -> sandbox::exec -> microVM round-trip end-to-end. Requires
  # hardware virtualization on the test host (Apple Silicon on macOS
  # or /dev/kvm on Linux); on unsupported hosts every case in
  # EXEC_SANDBOX_CASES short-circuits with a SKIP log message after
  # sandbox::create returns S300.
  - name: iii-sandbox
    config:
      auto_install: true
      image_allowlist:
        - python
      default_idle_timeout_secs: 60
      max_concurrent_sandboxes: 4
      default_cpus: 1
      default_memory_mb: 256

  - name: shell
    config:
      max_timeout_ms: 5000
      default_timeout_ms: 1500
      max_output_bytes: 4096
      working_dir: ./data
      inherit_env: false
      allowed_env: [PATH, HOME, LANG, HARNESS_TEST_VAR]
      # T13: shell allowlist/denylist_patterns are gone. Command-level
      # policy lives in approval-gate's rules layer; shell is a plain
      # executor for the LLM path. The fs.denylist_paths below is the
      # separate filesystem-path denylist for shell::fs::* tools (kept).
      max_concurrent_jobs: 2
      job_retention_secs: 2
      fs:
        host_root: null
        # Test harness needs to write to OS tmpdirs scattered across the
        # filesystem, so the jail is intentionally off here. Production
        # operators should leave this false (default) and pin host_root.
        allow_unjailed: true
        # Caps deliberately set to 1 MiB so size-cap-boundary tests
        # in cases-fs-protocol-break.ts can trip S218 cheaply. Streaming
        # itself is still exercised at 512 KiB in cases-fs-host.ts (~8
        # frames at the 64 KiB chunk size).
        max_read_bytes: 1048576
        max_write_bytes: 1048576
        denylist_paths:
          - /etc/passwd
          - /etc/shadow
      sandbox:
        enabled: true
