# Seed configuration for the symlink-parent jail regression lane. The launcher
# replaces the placeholder with an isolated temporary directory.
max_timeout_ms: 5000
max_bg_timeout_ms: 6000
default_timeout_ms: 1500
max_output_bytes: 4096
working_dir: ./data
env:
  inherit: false
  allow: [PATH, HOME, LANG, HARNESS_TEST_VAR]
denylist_patterns:
  - "rm\\s+-rf\\s+/"
max_concurrent_jobs: 2
job_retention_secs: 2
fs:
  host_roots: [/private/tmp/iii-shell-jailed-root]
  max_read_bytes: 1048576
  max_write_bytes: 1048576
  denylist_paths:
    - /etc/passwd
    - /etc/shadow
sandbox:
  enabled: false
