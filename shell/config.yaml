max_timeout_ms: 30000
default_timeout_ms: 10000
max_output_bytes: 1048576
working_dir: null
inherit_env: false
allowed_env:
  - PATH
  - HOME
  - LANG
  - LC_ALL
  - TERM
# Optional shell-side allowlist. Empty (default) = no upper bound from
# this layer — when the approval-gate is wired upstream (the standard
# playground/harness deployment) it remains sole authority on which
# commands run. Standalone operators (no gate upstream) can populate
# this with arity-aware prefixes (`ls`, `git checkout`, `npm run dev`)
# to get a fallback floor; unlisted argv are rejected before spawn with
# `"command 'X' not in allowlist"`. Reminder: this worker is NOT a
# sandbox — the real boundary is the sandbox backend.
allowlist: []
# Optional regex denylist evaluated against `argv.join(" ")`. Empty
# (default) = nothing rejected at this layer. Hits short-circuit before
# the allowlist check, so a denylisted argv is rejected even when it
# satisfies an allowlist entry. Advisory, not a security boundary —
# any allowlisted shell/interpreter can construct forbidden tokens at
# runtime (variables, eval, IFS, base64). Treat as a tripwire.
denylist_patterns: []
max_concurrent_jobs: 16
job_retention_secs: 3600

fs:
  # SET host_root to a directory you intend to expose to shell::fs::*.
  # When unset, the worker refuses to start unless allow_unjailed is true
  # (because the alternative is "the entire filesystem is reachable
  # behind only the advisory denylist", which is rarely intended).
  #
  # Default is /tmp: exists on every Unix host, is writable, and contains
  # only ephemeral data. Operators should point this at the workspace
  # they actually intend the shell worker to manage.
  host_root: /tmp
  allow_unjailed: false
  max_read_bytes: 16777216
  max_write_bytes: 16777216
  denylist_paths:
    - /etc/passwd
    - /etc/shadow

# When enabled is true, callers can target a live sandbox via the
# top-level `target` field on shell::exec, shell::exec_bg, and every
# shell::fs::* request. When false, every sandbox-targeted call
# returns S210 ("sandbox target disabled in config") regardless of
# whether iii-sandbox itself is running.
sandbox:
  enabled: true
