# Permissive dev default: 2 min foreground cap so a real build/test
# (cargo build, cargo test, npm test) is not reaped at 30s. Long jobs should
# still go through shell::exec_bg (unbounded by default).
max_timeout_ms: 120000
max_bg_timeout_ms: 0  # host bg job hard cap in ms; 0 = unbounded (foreground uses max_timeout_ms)
default_timeout_ms: 10000
max_output_bytes: 1048576
working_dir: null
# Environment policy for spawned commands.
env:
  # Forward the worker's full environment to children so toolchains (cargo,
  # rustup, git, node) find their PATH/HOME/CARGO_HOME/etc. Per-call `env`
  # overrides are still gated: PATH/HOME/LD_*/DYLD_* and interpreter startup
  # keys can never be set per call (see exec/policy.rs DANGEROUS_ENV_KEYS).
  # NOTE: this also forwards any secrets in the worker's env to every command;
  # run the worker with a clean environment if that matters to you.
  inherit: true
  # Dual role: (1) when `inherit` is false, ONLY these keys are forwarded to
  # children; (2) per-call `env` may set a key only if it is listed here —
  # minus the hardcoded dangerous keys above, which are never settable.
  allow:
    - PATH
    - HOME
    - LANG
    - LC_ALL
    - TERM
# PERMISSIVE DEFAULT: an EMPTY allowlist means every command is allowed
# (cargo, git, bash, make, node, python3, …). This is deliberate — a coding
# agent needs arbitrary build/test/VCS tooling, and a half-open list is
# defeated the moment any shell/interpreter is on it. This worker is NOT a
# sandbox: the security boundary is the fs jail (fs.host_root) plus the
# optional sandbox backend, NOT this list. To re-scope exec to deny-by-default,
# list the permitted argv[0] basenames here (a non-empty list flips the gate).
allowlist: []
# Advisory tripwire ONLY (regex over argv.join(" ")), trivially evadable via an
# interpreter — NOT a security boundary. With an open allowlist the old
# sub-execution escapes (find -exec, sed -i, node/python -c, npm run, env <cmd>)
# are pure dev friction with no security value, so they were dropped; only
# catastrophic, host-wrecking patterns are kept to catch honest mistakes.
denylist_patterns:
  - "rm\\s+-rf\\s+/"
  - ":\\(\\)\\s*\\{\\s*:\\|"   # fork bomb
  - "mkfs"
  - "dd\\s+if="
  - "shutdown"
  - "reboot"
  - "/etc/shadow"
max_concurrent_jobs: 16
job_retention_secs: 3600

fs:
  # SET host_root to a directory you intend to expose to shell::fs::*.
  # When unset, the worker refuses to start unless allow_unjailed is true
  # (because the alternative is "the entire filesystem is reachable
  # behind only the advisory denylist", which is rarely intended).
  #
  # Default is /tmp: exists on every Unix host, is writable, and contains
  # only ephemeral data. Operators should point this at the workspace
  # they intend the shell worker to manage.
  host_root: /tmp
  allow_unjailed: false
  max_read_bytes: 16777216
  max_write_bytes: 16777216
  denylist_paths:
    - /etc/passwd
    - /etc/shadow
  # Permit setuid/setgid/sticky bits (the top octal digit, e.g. 4755) in
  # mkdir/chmod/write modes. Default false: such modes are a privilege-
  # escalation primitive when the worker runs as root, so they are rejected
  # with S210. Set true only if your workload genuinely needs them.
  # allow_special_bits: false

# When enabled is true, callers can target a live sandbox via the
# top-level `target` field on shell::exec, shell::exec_bg, and every
# shell::fs::* request. When false, every sandbox-targeted call
# returns S210 ("sandbox target disabled in config") regardless of
# whether iii-sandbox itself is running.
sandbox:
  enabled: true

# The folded `coder::*` code surface. Its ROOTS are NOT set here — the code
# resolver uses fs.host_roots above, so the operator sets the project root
# ONCE. `non_accessible_globs` is the unified protected-paths list: BOTH the
# code functions (visible-but-locked, C211) and shell::fs::* (hard-reject,
# S215) honor it, so secrets are declared once. `default_exclude_globs` is a
# hide-only noise filter for coder::tree / coder::search.
code:
  non_accessible_globs:
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/secrets/**"
  default_exclude_globs:
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/target/**"
    - "**/dist/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
