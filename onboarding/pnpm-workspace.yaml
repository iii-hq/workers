# Config only, no `packages`: this marks the worker its own project root, so
# `pnpm install` here does not reach up into the shared console-UI workspace
# (which owns ./ui). Same split kanban/ uses.
minimumReleaseAgeExclude:
  - '@iii-dev/helpers@0.27.0-rc.3'
  - iii-sdk@0.27.0-rc.3

allowBuilds:
  esbuild: true
  protobufjs: false
