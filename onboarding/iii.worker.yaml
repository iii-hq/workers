iii: v1
name: onboarding
language: javascript
deploy: bundle
manifest: package.json
license: Apache-2.0
tags: [onboarding, tour, console, ui, docs]
description: Guided console tour — step content, per-operator progress in state, and an injected page that spotlights the console element each step talks about.

runtime:
  kind: javascript
  # The iii node image. With a base_image the worker runs in its own VM, and
  # `scripts.install` runs inside that guest before `scripts.start` — so the
  # worker builds itself instead of depending on someone having run a build in
  # the checkout.
  base_image: docker.io/iiidev/node:latest

scripts:
  # npm and esbuild only. The guest gets the worker directory alone, so the
  # build must not need the repo's pnpm workspace: `pnpm --dir ui build` adds
  # `tsc --noEmit` against `@iii-dev/console-ui`, which lives in that
  # workspace and is types-only anyway (esbuild treats it as external).
  install: npm install && npm run build:bundle
  # A published artifact already carries `dist/bundle`, so it starts as it is.
  # A source checkout builds first: `install` runs once per prepared guest,
  # and the build output is not in the guest the next boot.
  start: (test -f dist/bundle/index.mjs || npm run build:bundle) && node ./dist/bundle/index.mjs

dependencies:
  console: "^1.9.11"
  state: "^0.22.2"
