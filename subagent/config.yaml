# subagent runtime config.

# Default system prompt for child runs when the caller omits `system_prompt`.
default_system_prompt: "You are a focused sub-agent. Answer the parent's subtask concisely and stop."

# Bound on how long `run::start_and_wait` may block before the trigger fails (milliseconds).
trigger_timeout_ms: 600000

# Recursion cap when the caller omits `max_subagent_depth`.
default_max_subagent_depth: 3
