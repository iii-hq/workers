workers:
  a2ui:
    source:
      path: a2ui
      package_manifest: Cargo.toml
    artifact:
      kind: rust-binary
      toolchain:
        name: rust
        version: 1.97.1
      binary: a2ui
      targets: &id001
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-unknown-linux-gnu
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-gnu
      - armv7-unknown-linux-gnueabihf
      - x86_64-pc-windows-msvc
      - i686-pc-windows-msvc
      - aarch64-pc-windows-msvc
      frontends:
      - workspace_root: .
        source_path: a2ui/ui
        runtime:
          name: node
          version: 22.20.0
        package_manager:
          name: pnpm
          version: 11.13.1
        lockfile: pnpm-lock.yaml
        install_command:
        - pnpm
        - install
        - --frozen-lockfile
        build_command:
        - pnpm
        - run
        - build
        outputs:
        - dist
    publish: true
  acp:
    source:
      path: acp
