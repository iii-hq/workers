[package]
name = "xmloxide"
version = "0.5.0"
edition = "2021"
rust-version = "1.81"
autobins = false
autobenches = false
license = "MIT"
description = "Repository-owned Scrapling compatibility fork of xmloxide"

[features]
default = []
ffi = []
serde = ["dep:serde"]
async = ["dep:tokio"]

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", optional = true }
tokio = { version = "1", features = ["io-util"], optional = true }

[lib]
path = "src/lib.rs"
