[workspace]

[package]
name = "browser"
version = "0.1.7"
edition = "2021"
publish = false

[[bin]]
name = "browser"
path = "src/main.rs"

[lib]
name = "browser"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.22.1-alpha.8"
iii-console-ui = { path = "../crates/console-ui" }
arc-swap = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"
url = "2"
regex = "1"
chromiumoxide = "0.9"

[dev-dependencies]
serde_json = "1"
which = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
