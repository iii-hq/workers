[workspace]

[package]
name = "fp"
version = "0.2.6"
edition = "2021"
publish = false

[[bin]]
name = "fp"
path = "src/main.rs"

# Library target so tests/ (required by validate_worker.py for source-changed
# workers) can exercise the public contract; the binary is a thin wiring shim.
[lib]
name = "fp"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.23.0-rc.1"
# Shared plumbing for the builtin `configuration` worker (seeding, retries,
# NOT_FOUND semantics, serialized hot-reload, guidance binding slot).
iii-config-client = { path = "../crates/config-client" }
# Must stay on the same schemars major as iii-sdk so the derived schemas line up.
schemars = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
