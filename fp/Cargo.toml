[workspace]

[package]
name = "fp"
version = "0.3.7"
edition = "2024"
publish = false

[[bin]]
name = "fp"
path = "src/main.rs"

# Library target so tests/ (required by validate_worker.py for source-changed
# workers) can exercise the public contract; the binary is a thin wiring shim.
[lib]
name = "fp"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.27.0-rc.3"
# Shared plumbing for the builtin `configuration` worker (seeding, retries,
# NOT_FOUND semantics, serialized hot-reload, guidance observer slot).
iii-config-client = { path = "../crates/config-client" }
# Must stay on the same schemars major as iii-sdk so the derived schemas line up.
schemars = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
# Already in the tree (regex-automata, via tracing-subscriber); withholds every
# stream key in one pass.
aho-corasick = "1"

# tests/gate_flip.rs: an in-process fake engine; all three are already in the
# tree through iii-sdk.
[dev-dependencies]
tokio = { version = "1", features = ["net"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
# The policy drift test in src/pipe.rs reads the root iii-permissions.yaml with
# the gate's own matcher. Tests only: nothing ships in the fp binary.
approval-gate = { path = "../approval-gate" }
serde_yaml_ng = "0.10"

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
