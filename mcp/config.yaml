# Function id prefixes that are filtered out of `tools/list` and rejected at
# `tools/call`. Mirrors the hard floor enforced by the skills worker.
hidden_prefixes:
  - "engine::"
  - "state::"
  - "stream::"
  - "iii."
  - "iii::"
  - "mcp::"
  - "a2a::"
  - "skills::"
  - "prompts::"

# When true, only functions whose `metadata.mcp.expose == true` are advertised
# in `tools/list`. Recommended for agent-facing deployments. Default false for
# backwards compatibility with workers that haven't adopted the flag.
require_expose: false

# HTTP path bound by the bridge's `http` trigger. Override this if you need to
# co-deploy with the TypeScript MCP bridge in `src/mcp/` (which also binds
# `/mcp`); for example, `/mcp-rs`.
api_path: "/mcp"
