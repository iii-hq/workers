# Engine config for the multi-provider e2e harness. Selected by run-tests.sh
# when --providers != local. Each provider gets a dedicated bucket so the
# harness can parameterize cases over them without collision.
#
# Triggers are still registered DYNAMICALLY by the harness via the SDK
# (registerTrigger in runner.ts); we don't list them here.
#
# The harness registers `storage::object-{created,deleted}` triggers against
# both `scratch-local` (rustfs webhook) and `scratch-s3` (SQS poller →
# ElasticMQ via the minio-sqs-bridge fixture). R2 triggers are out of scope
# for the e2e harness — covered separately via Rust integration tests.

workers:
  - name: iii-observability
    config:
      enabled: true
      service_name: storage-tests
      exporter: memory
      logs_console_output: true
      sampling_ratio: 1.0

  - name: storage
    config:
      providers:
        local:
          data_dir: ./data/storage

      buckets:
        scratch-local:
          provider: local
          bucket: scratch-local

        scratch-s3:
          provider: s3
          region: us-east-1
          endpoint_url: http://127.0.0.1:9000
          access_key_id: minioadmin
          secret_access_key: minioadmin
          bucket: scratch-s3
          # Wires the storage worker's SQS poller to ElasticMQ. The bridge
          # service (fixtures/minio-sqs-bridge) translates MinIO webhook
          # events into messages on this queue. Account ID `000000000000`
          # is ElasticMQ's default; queue is created on bridge boot.
          # Worker process needs AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
          # in env (any non-empty values; ElasticMQ accepts unsigned creds)
          # — set by run-tests.sh.
          notifications:
            sqs_queue_url: "http://127.0.0.1:9324/000000000000/storage-events"

        scratch-r2:
          provider: r2
          # account_id is unused when endpoint_url is set, but the field is
          # required by the schema. "fake" is intentional and visible in
          # tracing::warn output to make it obvious this is a test config.
          account_id: fake
          access_key_id: minioadmin
          secret_access_key: minioadmin
          endpoint_url: http://127.0.0.1:9000
          bucket: scratch-r2
