# Storage worker default config.
#
# This file is loaded when you run `cargo run -- --config ./config.yaml` (or
# `iii start`). It declares a single native `scratch` bucket, which gives you
# a working local object backend with zero
# external dependencies.
#
# For real-world configs (AWS S3, GCS, Cloudflare R2, change-notification
# wiring, env-var-substituted credentials), see config.yaml.example.

providers:
  # Where the worker persists data for `provider: local`
  # buckets. Path is resolved relative to the worker's working directory.
  local:
    data_dir: ./data/storage
    # Optional direct-transfer server. Port 0 selects a free loopback port;
    # configure public_url when browsers use a LAN/VPN/proxy address.
    http:
      bind_address: 127.0.0.1:0

buckets:
  # A throwaway bucket served directly by the worker. Useful for local dev,
  # tests, and tutorials. Replace or extend with cloud-backed buckets for
  # production.
  scratch:
    provider: local
