iii: v1
name: claude-code
language: javascript
deploy: bundle
manifest: package.json
license: Apache-2.0
tags: [coding-agent, claude, anthropic, cli, headless, terminal, console-ui]
description: Claude Code as an iii worker — claude::* runs headless turns and claude::terminal::* runs the same CLI in a shell::pty session on its own console page. Both mirror raw messages onto claude::events and stream AgentEvent frames onto agent::events.

runtime:
  kind: javascript

scripts:
  start: node ./dist/bundle/index.mjs

dependencies:
  state: "latest"
  iii-stream: "latest"
  configuration: "latest"
  # The terminal half: shell::pty runs the CLI, shell::exec installs it and
  # equips the workspace, coder::read-file reads the files back.
  ide: "latest"
  # The page this worker injects.
  ade: "latest"
