iii: v1
name: claude-code
language: javascript
deploy: bundle
manifest: package.json
license: Apache-2.0
tags: [coding-agent, claude, anthropic, cli, headless, terminal, console-ui]
description: Claude Code as an iii worker — claude::* runs headless turns and claude::terminal::* runs the same CLI in a shell::pty session on its own console page. Both publish raw messages on the claude::raw-event trigger type and AgentEvent frames on claude::agent-event, also observable as claude::on-raw-event and claude::on-agent-event (iii 0.25).

runtime:
  kind: javascript

scripts:
  start: node ./dist/bundle/index.mjs

dependencies:
  state: "latest"
  configuration: "latest"
  # The terminal half: shell::pty runs the CLI, shell::exec installs it and
  # equips the workspace, coder::read-file reads the files back.
  ide: "latest"
  # The page this worker injects.
  ade: "latest"
