iii: v1
name: claude-code
language: javascript
deploy: bundle
iii_engine_version: ">=0.26.0"
manifest: package.json
license: Apache-2.0
tags: [coding-agent, claude, anthropic, cli, headless, terminal, console-ui]
description: Claude Code as an iii worker — claude::* runs headless turns and claude::terminal::* runs the same CLI in a shell::pty session on its own console page. Both publish raw messages on the claude::on-raw-event function and AgentEvent frames on claude::on-agent-event.

runtime:
  kind: javascript

scripts:
  # Build whenever there is source to build. A published artifact ships
  # `dist/bundle/index.mjs` and nothing else (see this worker's `include` list
  # in `.deploy/workers.yaml`), so it has no `src` and goes straight to node.
  #
  # The build lives in `start`, not `install`: compose reads only
  # `scripts.start` (and `runtime.base_image`) from this file, and `install`
  # runs only inside a VM guest. This worker has no base_image (it runs on the
  # host, beside the `claude` CLI and its login), so a `path://` compose entry
  # needs no scripts of its own: it builds from the checkout and starts. That
  # build also regenerates the embedded iii-integration plugin.
  start: >-
    if [ -f src/index.ts ]; then
    pnpm install --ignore-workspace --frozen-lockfile && pnpm run build:bundle || exit 1;
    fi;
    exec node ./dist/bundle/index.mjs

dependencies:
  state: "latest"
  configuration: "latest"
  # The terminal half: shell::pty runs the CLI, shell::exec installs it and
  # equips the workspace, coder::read-file reads the files back.
  ide: "latest"
  # The page this worker injects.
  ade: "latest"
