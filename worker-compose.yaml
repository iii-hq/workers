workers:
  a2ui:
    source:
      path: a2ui
      package_manifest: Cargo.toml
    artifact:
      kind: rust-binary
      toolchain:
        name: rust
        version: '1.97.1'
      binary: a2ui
      targets: &id001
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-unknown-linux-gnu
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-gnu
      - armv7-unknown-linux-gnueabihf
      frontends:
      - workspace_root: .
        source_path: a2ui/ui
        runtime:
          name: node
          version: '22.20.0'
        package_manager:
          name: pnpm
          version: 11.13.1
        lockfile: pnpm-lock.yaml
        install_command:
        - pnpm
        - install
        - --frozen-lockfile
        build_command:
        - pnpm
        - run
        - build
        outputs:
        - dist
    runtime:
      exec:
      - a2ui
    registry:
      description: Compose, validate, persist, and render A2UI v0.9.1 surfaces for Harness sessions in chat and on an injectable
        Console page.
      license: Apache-2.0
      tags:
      - a2ui
      - generative-ui
      - agent-ui
      - console
      - harness
      dependencies:
        state: 0.x
        configuration: 0.x
        llm-router: ^1.4.12
        harness: ^1.0.0
        shell: 0.x
      publish: true
    validation:
      interface: required
