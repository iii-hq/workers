# CI (.github/scripts/validate_worker.py) requires name/language/deploy/manifest
# and reads the release version from `manifest`. The OCI image includes the
# browser binaries and system libraries that cannot be installed in a bundle
# sandbox at runtime.
iii: v1
name: scrapling
language: python
deploy: image
manifest: pyproject.toml
license: Apache-2.0
tags: [scraping, browser, crawler, anti-bot, extraction, http]
description: >-
  Scrapling as an iii worker — scrapling::* functions run HTTP / anti-bot /
  browser fetches, CSS/XPath/regex/adaptive extraction, persistent sessions,
  and a declarative crawl over the iii bus.

dependencies:
  configuration: "0.x"

runtime:
  language: python
  entry: src/main.py

# Browsers (Camoufox / Chromium) + long-lived sessions are RAM-hungry.
resources:
  memory: 4096
  cpus: 2

scripts:
  install: "pip install ."
  start: "python -m src.main"
