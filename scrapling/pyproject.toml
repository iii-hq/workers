[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# NOT "scrapling": this project depends on the PyPI `scrapling`; a same-named
# project is a self-dependency and breaks `pip install`. The iii worker name
# (folder + iii.worker.yaml) is still `scrapling` — CI validates that, not this.
name = "scrapling-worker"
version = "0.2.4"
description = "Scrapling as an iii worker: HTTP / anti-bot / browser fetch + CSS/XPath/regex/adaptive extraction as scrapling::* functions."
authors = [{ name = "iii" }]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "iii-sdk==0.21.6",
    "scrapling[fetchers]==0.4.9",
    "markdownify",  # scrapling's HTML→Markdown backend (only in its [shell]/[ai] extras)
    "pillow",  # screenshot downscale/tiling so images fit model input limits
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
scrapling-worker = "src.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
