# Agent permissions for the secrets worker.
version: 1

rules:
  # Values and their allowlists are the human's call, made from the console
  # (a user-initiated call bypasses this gate). An agent never reads a value,
  # stores or imports one, or changes which workers may resolve it.
  - '!secrets::resolve'
  - '!secrets::set'
  - '!secrets::import'
  - '!secrets::delete'
  - '!secrets::access'
  # The configuration reload sink is engine plumbing.
  - '!secrets::on-config-change'
  # Metadata only: names, references, masked hints, fingerprints, consumers,
  # where the vault and key live. secrets::detect stays approval-gated: it
  # runs the user's login shell to look for existing keys.
  - secrets::list
  - secrets::get
  - secrets::status
