[workspace]

[package]
name = "secrets"
version = "0.1.4"
edition = "2021"
publish = false
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
description = "Local protected secret store: encrypted values (secret://NAME) or project .env variables (env://NAME) behind versionable references, resolved only by allowlisted workers."

[lib]
name = "secrets"
path = "src/lib.rs"

[[bin]]
name = "secrets"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.23.0"
iii-config-client = { path = "../crates/config-client" }
iii-worker-paths = { path = "../crates/worker-paths" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "process", "time", "io-util", "fs"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
# Vault crypto: XChaCha20-Poly1305 for values, HMAC-SHA256 for fingerprints.
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
# Following hand edits to .env through the OS (inotify/FSEvents), never polling.
notify = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
futures-util = "0.3"
tempfile = "3"
tokio-tungstenite = "0.28"

# Prioritize release binary size; retain the default feature set.
[profile.release]
opt-level = "z"
strip = true
lto = "fat"
codegen-units = 1
