iii: v1
name: secrets
language: rust
deploy: binary
manifest: Cargo.toml
license: Apache-2.0
bin: secrets
tags: [secrets, credentials, vault, security]
description: Local protected secret store. Provider keys and other credentials are encrypted under a master key kept outside the project (secret://NAME) or kept as variables in the project's .env (env://NAME), referenced from versioned configuration and resolved only by the workers each secret allowlists; metadata reads never return a value, and the secrets::changed trigger reports rotations and .env edits.

runtime:
  kind: rust

# How a supervisor starts this worker from a source checkout.
scripts:
  install: cargo build
  start: cargo run --bin secrets

config:
  # Encrypted vault (vault.json), under the project's gitignored data/ tree.
  data_dir: data/secrets
  # Master key file override; null keeps ~/.config/iii/secrets/<vault_id>.key.
  key_file: null
  # The env file env://NAME references read and the console writes to.
  # Relative to the project; point each environment or namespace at its own,
  # e.g. .env.staging.
  env_file: .env

dependencies:
  configuration: "latest"
