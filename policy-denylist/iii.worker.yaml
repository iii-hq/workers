iii: v1
name: policy-denylist
language: rust
deploy: binary
manifest: Cargo.toml
bin: iii-policy-denylist
description: Hook subscriber on agent::before_function_call that blocks calls whose function id matches a configured denylist.

runtime:
  kind: rust

scripts:
  install: cargo build
  start: cargo run

config:
  topic: agent::before_function_call
  denied_functions:
    - "bash:rm -rf"
    - sudo
    - curl-pipe-bash
