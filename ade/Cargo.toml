[workspace]

[package]
name = "ade"
version = "1.10.6"
edition = "2021"
publish = false

[[bin]]
name = "ade"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.26.0"
# Worker-side injectable console UI (content function + one ade::ui::asset
# observer per asset + hot-reload watcher) — the ADE worker dogfoods its own
# protocol to ship the injectable-UI toggle form. Direct link, never published.
iii-console-ui = { path = "../crates/console-ui" }
# Project-relative `data_dir` resolution shared by every worker (III_COMPOSE_DIR).
iii-worker-paths = { path = "../crates/worker-paths" }
# Chat mention provider descriptor + search/get wire types (`@trace(id=…)`).
mention-contract = { path = "../crates/mention-contract" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "net", "io-util", "time", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
serde_yaml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
url = "2"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }

# HTTP + WS proxy
# =0.8.8: last axum on tokio-tungstenite 0.28, the iii-sdk major; lift when iii-sdk moves to 0.29.
axum = { version = "=0.8.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["set-header"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
# Server-side client for `POST /probe` (reads a redirect's real status).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Compose page: watch the daemon state and the compose file.
notify = "8"

# Embed web/dist
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
mime_guess = "2"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
which = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
