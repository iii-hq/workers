<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <!-- resizes-content: Android shrinks the layout viewport for the
         on-screen keyboard, so the 100dvh shell re-flows above it. iOS
         ignores the hint; the Sheet tracks visualViewport for it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />

    <title>iii Console</title>
    <meta name="theme-color" content="#f2f0ed" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="iii Console" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="iii Console" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/iii-apple-touch.png" />

    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <script>
      (() => {
        const LIGHT = '#f2f0ed';
        const DARK = '#0a0a0a';
        const prefersDark = () =>
          window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
        let theme;
        try {
          const stored = localStorage.getItem('iii-theme');
          theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : prefersDark()
                ? 'dark'
                : 'light';
        } catch (_) {
          theme = prefersDark() ? 'dark' : 'light';
        }
        const color = theme === 'dark' ? DARK : LIGHT;
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.documentElement.style.backgroundColor = color;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', color);
      })();
    </script>
  </head>
  <body class="bg-bg text-ink font-sans">
    <div id="root"></div>
    <!-- Injectable-UI boot contract: a STATIC single import map, parsed
         before any module loading starts (a map parsed later is rejected
         wholesale under classic import-map semantics). The console's own
         bundle has no bare imports at runtime, so this affects only
         injected worker scripts, which bundle with these five specifiers
         external. Relative URLs on purpose — the build uses base './' for
         arbitrary subpath mounting. -->
    <script type="importmap">
      {
        "imports": {
          "react": "./vendor/react.js",
          "react-dom": "./vendor/react-dom.js",
          "react-dom/client": "./vendor/react-dom-client.js",
          "react/jsx-runtime": "./vendor/jsx-runtime.js",
          "@iii-dev/console-ui": "./vendor/console-ui.js"
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
