iii: v1
name: lsp
language: rust
deploy: binary
manifest: Cargo.toml
license: Apache-2.0
bin: lsp
description: III Language Server — autocompletion, hover and diagnostics for III engine function calls and observers
# Opt out of Registry interface publication. lsp is a stdio language server:
# it exits on stdin EOF (so it cannot stay alive while backgrounded) and it
# only consumes engine discovery — it registers no functions, so there is no
# interface to collect.
registry_interface: false
