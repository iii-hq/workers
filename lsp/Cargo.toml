[package]
name = "lsp"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
name = "lsp"
path = "src/lib.rs"

[[bin]]
name = "lsp"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.26.0"
tower-lsp-server = "0.23"
tree-sitter = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
dashmap = "6"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
