[workspace]

[package]
name = "textstats"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[[bin]]
name = "textstats"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.11.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
schemars = "0.8"
