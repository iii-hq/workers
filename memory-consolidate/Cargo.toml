[workspace]

[package]
name = "memory-consolidate"
version = "0.2.2"
edition = "2021"
publish = false

[[bin]]
name = "memory-consolidate"
path = "src/main.rs"

[lib]
name = "memory_consolidate"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.26.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
# Must stay on the same schemars major as iii-sdk so the derived
# `JsonSchema` impls satisfy `RegisterFunction::new_async`.
schemars = "0.8"

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
