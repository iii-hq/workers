iii: v1
name: judge
language: rust
deploy: binary
manifest: Cargo.toml
license: Apache-2.0
bin: judge
tags: [evaluation, judge, noul, choice, score, relevance]
description: Provider-neutral evaluation hub (judge::evaluate, judge::cancel, and the internal judge::models::list) that forwards typed Noul, Choice and Score questions to the selected judge-<provider> worker; the default provider is a Console setting seeded from JUDGE_PROVIDER (typesafe). Also resolves worker-defined @<name>(id=…) chat mentions for agents (judge::mentions::resolve and a harness pre-generate hook).
config:
  provider: typesafe
dependencies:
  configuration: "latest"
  judge-typesafe: "latest"
