[workspace]

[package]
name = "judge"
version = "0.2.1"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Provider-neutral judge hub: forwards typed Noul, Choice and Score evaluations to judge-<provider> workers."

[features]
default = ["console-ui"]
console-ui = ["dep:iii-console-ui"]

[dependencies]
judge-contract = { path = "../crates/judge-contract" }
iii-sdk = "=0.23.0"
iii-config-client = { path = "../crates/config-client" }
iii-console-ui = { path = "../crates/console-ui", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"

[dev-dependencies]
futures-util = "0.3"
judge-typesafe = { path = "../judge-typesafe", default-features = false }
tempfile = "3"
tokio-tungstenite = "0.28"
wiremock = "0.6"

# Prioritize release binary size; retain the default feature set.
[profile.release]
opt-level = "z"
strip = true
lto = "fat"
codegen-units = 1
