[workspace]

[package]
name = "provider-sarvam"
version = "0.2.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Sarvam AI provider worker behind llm-router: Sarvam chat models, Saaras speech to text and Bulbul text to speech."

[[bin]]
name = "provider-sarvam"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
llm-router = { path = "../llm-router", default-features = false }
# Must match llm-router's pin (one iii-sdk per graph). The SDK provides the
# live span-start push used to render `provider::sarvam::stream` output.
iii-sdk = "=0.26.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must stay on the same schemars major as iii-sdk so the derived
# request/response schemas match what the SDK emits at registration.
schemars = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "rustls-tls"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4"] }

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
