# Agent permissions for the provider-sarvam worker.
# Spec: tech-specs/2026-06-agentic/llm-router.md § Security.
version: 1

rules:
  # Direct provider calls bypass the router's accounting, budgets, and retry
  # policy — never agent-callable. The router invokes these worker-to-worker.
  - '!provider::sarvam::stream'
  - '!provider::sarvam::refresh_models'
  - '!provider::sarvam::on_router_ready'
  - '!provider::sarvam::count_tokens'
  - '!provider::sarvam::transcribe'
  - '!provider::sarvam::speak'
