iii: v1
name: sandbox-code-runner
language: rust
deploy: binary
manifest: Cargo.toml
license: Apache-2.0
bin: sandbox-code-runner
tags: [nodejs, python, run, sandbox, microvm]
description: Run Node.js and Python in iii-sandbox microVMs — run code, register bus functions from working source, and tear down runtimes on demand. Guest code gets the real iii-sdk client as a global `iii`, lazily connected to the engine.

dependencies:
  configuration: "latest"

# The client can compile on more platforms than the microVM sandbox backend
# supports. Keep Intel macOS out of releases even though it is a default
# target for other binary workers. This mirrors the private release catalog.
targets:
  - aarch64-apple-darwin
  - x86_64-unknown-linux-gnu
  - x86_64-unknown-linux-musl
  - aarch64-unknown-linux-gnu
  - armv7-unknown-linux-gnueabihf
