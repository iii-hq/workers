[workspace]

[package]
name = "sandbox-code-runner"
version = "0.2.3"
edition = "2024"
publish = false

[[bin]]
name = "sandbox-code-runner"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.26.0"
iii-helpers = "=0.26.0"
# Worker-side injectable console UI (content function + ade::ui::asset
# observers + hot-reload watcher) — direct link, never published.
iii-console-ui = { path = "../crates/console-ui" }
# Shared plumbing for the builtin `configuration` worker (seeding, retries,
# NOT_FOUND semantics, serialized hot-reload, guidance binding slot).
iii-config-client = { path = "../crates/config-client" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "signal", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
# Must stay on the same schemars major as iii-sdk so derived schemas match
# what RegisterFunction emits at registration time.
schemars = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[dev-dependencies]
which = "8"

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
