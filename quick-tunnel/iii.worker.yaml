iii: v1
name: quick-tunnel
language: rust
deploy: binary
iii_engine_version: ">=0.26.0"
manifest: Cargo.toml
bin: quick-tunnel
license: Apache-2.0
description: Manage expiring durable leases on authorized public tunnels (cloudflared Quick Tunnel child processes or in-process OpenTunnel).
tags: [cloudflare, opentunnel, quick-tunnel, webhooks, tunnel, leases]
dependencies:
  configuration: latest
config:
  # Only keys the 0.2.2 schema knows: compose validates these defaults against
  # the previously registered schema before the new version can start.
  # `provider` and `proxy_protocol` stay out: a missing `provider` resolves at
  # boot to opentunnel on a fresh install and to cloudflared on a worker that
  # already ran on it (see config::provider_for_unnamed).
  targets:
    webhooks: http://127.0.0.1:3112
  cloudflared: cloudflared
  state_path: data/quick-tunnel/leases.json
  startup_timeout_ms: 30000
  max_retries: 3
  retry_initial_ms: 1000
  retry_max_ms: 30000
  max_leases: 1024
  max_lease_seconds: 2592000
