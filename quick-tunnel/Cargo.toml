[workspace]

[package]
name = "quick-tunnel"
version = "0.2.2"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Lease-managed public tunnels (cloudflared Quick Tunnels or OpenTunnel) on the iii worker mesh"
repository = "https://github.com/iii-hq/workers"

[[bin]]
name = "quick-tunnel"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.26.0"
iii-config-client = { path = "../crates/config-client" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
futures-util = "0.3"
# Young crate: pin exactly.
opentunnel = "=0.6.2"
schemars = { version = "0.8", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Self-signed certificate for a seeded OpenTunnel identity; same features opentunnel uses.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio-tungstenite = "0.28"

[lints.rust]
unsafe_code = "forbid"

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
