[package]
name = "xa11y-macos"
version = "0.15.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
build = "build.rs"
description = "macOS accessibility backend for xa11y (AXUIElement), vendored with patches (PATCHES.md)"
repository = "https://github.com/xa11y/xa11y"

# Standalone: never join an enclosing workspace.
[workspace]

[lib]
name = "xa11y_macos"
path = "src/lib.rs"

[dependencies]
xa11y-core = { version = "=0.15.2", default-features = false }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
rayon = "1"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1"
