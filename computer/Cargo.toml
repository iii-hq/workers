[workspace]

[package]
name = "computer"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "computer"
path = "src/main.rs"

[lib]
name = "computer"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.20.0"
arc-swap = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive"] }
schemars = "0.8"
async-trait = "0.1"
base64 = "0.22"
enigo = "0.3"
xcap = "0.4"
image = "0.25"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
