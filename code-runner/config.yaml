max_runtimes: 32          # live runtimes across both engines
default_timeout_ms: 5000  # per run and per handler invocation when unspecified
max_timeout_ms: 30000     # ceiling a request's timeout_ms is clamped to
idle_ttl_secs: 900        # reap runtimes with no activity for this long
heap_mb: 128              # V8 object-heap cap per node runtime
external_mb: 64           # off-heap cap per node runtime; heap_mb does not cover it
# Per-runtime private scratch directory reachable from run code as
# `iii.files`. 0 disables it entirely, including the guest surface.
# WORST-CASE HOST FOOTPRINT IS max_runtimes * scratch_mb — 256 MiB here — and
# the system temp directory is tmpfs (host RAM) on most Linux hosts, so set
# scratch_root to real disk if that matters.
scratch_mb: 8
scratch_files: 64
# scratch_root: /var/lib/iii/code-runner   # default: the system temp directory
