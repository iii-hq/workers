iii: v1
name: code-runner
language: rust
deploy: binary
manifest: Cargo.toml
bin: code-runner
tags: [nodejs, python, eval, sandbox, microvm]
description: Run Node.js and Python in iii-sandbox microVMs — eval code, register bus functions from working source, and tear down runtimes on demand.

# code-runner has no V8 (or any other platform-restricted)
# dependency — everything it links (iii-sdk, tokio, serde, schemars, clap,
# uuid, base64…) builds cleanly on every default triple. No `targets:`
# restriction needed; the release matrix fans out to all default triples.
