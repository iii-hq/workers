[workspace]

[package]
name = "code-runner"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "code-runner"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.21.6"
iii-helpers = "=0.21.6"
# Worker-side injectable console UI (content function + console:script/style
# triggers + hot-reload watcher) — direct link, never published.
iii-console-ui = { path = "../crates/console-ui" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "signal", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Must stay on the same schemars major as iii-sdk so derived schemas match
# what RegisterFunction emits at registration time.
schemars = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"

[dev-dependencies]
which = "8"
