[workspace]

[package]
name = "editor"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "editor"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Lockstep with every other worker and with `crates/console-ui`, which this
# binary links: two iii-sdk versions in one process means two incompatible
# `IIIClient` types.
iii-sdk = "=0.21.6"
iii-console-ui = { path = "../crates/console-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
schemars = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
# Myers line diff. `editor::diff` is a pure function over two strings, so the
# only thing this pulls in is the algorithm itself.
similar = "2"

[dev-dependencies]
serde_json = "1"
which = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
