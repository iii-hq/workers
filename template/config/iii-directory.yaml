# First-registration seed. Later edits belong in the configuration UI.
# Relative paths resolve against III_COMPOSE_DIR (template/), not the worker source.
skills_folder: data/skills
local_skills_folder: skills
agents_folder: agents
auto_download: true

# The local skills/harness/ namespace wins over registry bundles and makes the
# automatic downloader skip harness, preserving the Medium profiles and skills.
# Other workers' downloaded instructions stay in the ignored data/skills/ cache.
