iii: v1
name: http
language: rust
deploy: binary
manifest: Cargo.toml
license: Apache-2.0
bin: http
tags: [http, rest, api, endpoint]
description: Expose functions as HTTP endpoints — hosts `http::on-request`; each observer of it declares a route, and its target answers the matched requests.
config:
  port: 3111
  host: 0.0.0.0
  webhook_listener: null
  default_timeout: 30000
  concurrency_request_limit: 1024
  cors:
    allowed_origins: ['*']
    allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
dependencies:
  configuration: "latest"
