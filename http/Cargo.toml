[workspace]

[package]
name = "iii-http"
version = "0.23.2"
edition = "2024"
description = "HTTP server worker for iii — serves the routes declared by observers of http::on-request"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
publish = false

[lib]
name = "iii_http"
path = "src/lib.rs"

[[bin]]
name = "http"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.26.0"
# Direct dep for W3C trace-context propagation helpers
# (`observability::extract_context` + the re-exported `opentelemetry` crate).
# Pinned to the version `iii-sdk` already resolves so the `opentelemetry` types
# line up across both crates.
iii-helpers = "=0.26.0"
# W3C trace-context parent propagation on `tracing::Span` (`OpenTelemetrySpanExt`).
# 0.33 pairs with opentelemetry 0.32 (same as iii-sdk 0.26.0).
tracing-opentelemetry = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
anyhow = "1"
# Colorized console log formatting (same crate/version as the engine).
colored = "3"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"
# =0.8.8: last axum on tokio-tungstenite 0.28, the iii-sdk major; lift when iii-sdk moves to 0.29.
axum = "=0.8.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "timeout", "limit"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
dashmap = "6"

[dev-dependencies]
# Local fake engine/channel transport; same version already resolved by iii-sdk.
tokio-tungstenite = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serial_test = "3"
# trace-context propagation e2e: an in-memory OTel exporter + tracing bridge so
# the test can observe `set_parent`/`add_event` output on the HTTP span.
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
