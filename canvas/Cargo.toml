[workspace]

[package]
name = "canvas"
version = "0.2.1"
edition = "2021"
description = "Canvas worker for iii — create, edit and render diagrams stored as editable source (mermaid text or excalidraw scenes), drawn live in chat and on a canvas page (canvas::* functions)"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
publish = false

[lib]
name = "canvas"
path = "src/lib.rs"

[[bin]]
name = "canvas"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.26.0"
# Worker-side injectable console UI (content function + one ade::ui::asset
# observer per asset + hot-reload watcher) — direct link, never published.
iii-console-ui = { path = "../crates/console-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
