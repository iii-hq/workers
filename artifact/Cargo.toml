[workspace]

[package]
name = "artifact"
version = "0.1.0"
edition = "2024"
description = "Artifact worker for iii — store versioned single-file artifacts (HTML designs and prototypes, markdown RFCs and docs, SVG drawings) and share a frozen version through an expiring, token-guarded link (artifact::* functions)"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
publish = false

[lib]
name = "artifact"
path = "src/lib.rs"

[[bin]]
name = "artifact"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.27.0"
# Worker-side injectable console UI (content function + asset triggers +
# hot-reload watcher) — direct link, never published.
iii-console-ui = { path = "../crates/console-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "net"] }
axum = "=0.8.8"
pulldown-cmark = "0.13"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
