# iii engine configuration — passed via `iii -c config.yaml`.
#
# Only engine-owned workers belong here. The shell worker and TypeScript
# harness run as host processes launched by run-tests.sh.

workers:
  - name: iii-worker-manager
    config:
      host: 127.0.0.1
      port: ${E2E_PORT:49134}

# The router serves sandbox::* in `default` and forwards each call to the
# bound adapter. This suite binds `sandbox-mock`, which the harness registers
# in its own namespace, so the fs cases go through the router. The mock has
# no create, so sandbox::create gets S304 and every EXEC_SANDBOX_CASES case
# logs SKIP, on KVM hosts too. Real-VM ide coverage is the template-stack
# check (spec 11).
sandbox:
  adapter: sandbox-mock
  namespace: ide-e2e
