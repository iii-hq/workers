# Agent permissions for the provider-merge-gateway worker.
# Spec: tech-specs/2026-06-agentic/llm-router.md § Security.
version: 1

rules:
  # Direct provider calls bypass the router's accounting, budgets, and retry
  # policy — never agent-callable. The router invokes these worker-to-worker.
  - '!provider::merge-gateway::stream'
  - '!provider::merge-gateway::refresh_models'
  - '!provider::merge-gateway::on_router_ready'
  - '!provider::merge-gateway::embed'
  - '!provider::merge-gateway::count_tokens'
