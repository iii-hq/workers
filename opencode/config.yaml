engine_url: ws://127.0.0.1:49134

defaults:
  model: ""                # empty = OpenCode default; else "provider/model", e.g. "anthropic/claude-sonnet-4-5"
  cwd: ""                  # default working directory for runs
  agent: ""                # OpenCode agent to use; empty = default

# Stream AgentEvent frames here, grouped by session_id. The console and
# acp worker both read this stream.
events_stream: agent::events

# Raw OpenCode JSON events (verbatim `opencode run --format json` lines:
# step_start, text, tool_use, step_finish) mirrored here, grouped by session_id.
raw_events_stream: opencode::events

# Prepend the iii runtime context to the prompt on a fresh session: teaches the
# agent live discovery against the engine catalog through the iii CLI
# (engine::functions::list, `iii trigger <fn> --help`). OpenCode reaches the CLI
# through its own shell tool. Per-turn override via the iii_context payload field.
iii_context: true

# Path to the opencode CLI binary. Empty = resolve `opencode` on PATH.
opencode_executable: ""
