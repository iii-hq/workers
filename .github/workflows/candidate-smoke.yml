name: Validate exact worker candidate
run-name: RC · candidate_smoke · ${{ inputs.operation_id }} · ${{ inputs.step_id }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        required: true
        type: string
      step_id:
        required: true
        type: string
      tag:
        required: true
        type: string
      worker:
        required: true
        type: string
      version:
        required: true
        type: string
      release_run_id:
        required: true
        type: string
      release_run_attempt:
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: candidate-smoke-${{ inputs.worker }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      III_API_URL: https://api.workers.iii.dev
      SMOKE_DIR: ${{ github.workspace }}/target/release-candidate-smoke
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: pipeline-scripts

      - name: Validate Release Control dispatch
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 pipeline-scripts/.github/scripts/release_control_contract.py validate-dispatch
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'

      - name: Validate exact release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ '${{ inputs.release_run_id }}' =~ ^[1-9][0-9]*$ ]]
          [[ '${{ inputs.release_run_attempt }}' =~ ^[1-9][0-9]*$ ]]
          actual=$(gh api 'repos/${{ github.repository }}/actions/runs/${{ inputs.release_run_id }}' --jq .run_attempt)
          [[ "$actual" == '${{ inputs.release_run_attempt }}' ]]

      - run: python3 -m pip install --quiet pyyaml

      - name: Install stable iii CLI
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 https://install.iii.dev/iii/main/install.sh -o /tmp/install-iii.sh
          sh /tmp/install-iii.sh
          {
            echo "$HOME/.local/bin"
            echo "$HOME/.iii/bin"
          } >>"$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.iii/bin:$PATH"
          iii --version

      - name: Prepare KVM for Scrapling sandbox
        if: inputs.worker == 'scrapling'
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm

      - name: Start empty engine
        run: |
          set -euo pipefail
          mkdir -p "$SMOKE_DIR/project"
          printf 'workers: []\n' >"$SMOKE_DIR/project/config.yaml"
          cd "$SMOKE_DIR/project"
          setsid iii -c config.yaml --no-update-check >"$SMOKE_DIR/engine.log" 2>&1 &
          echo "$!" >"$SMOKE_DIR/engine.pid"
          for _ in {1..120}; do
            kill -0 "$(cat "$SMOKE_DIR/engine.pid")" 2>/dev/null
            if iii trigger engine::workers::list --json '{}' >"$SMOKE_DIR/workers-baseline.json" 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Snapshot trigger baseline
        run: |
          cd "$SMOKE_DIR/project"
          iii trigger engine::triggers::list --json '{"include_internal": false}' >"$SMOKE_DIR/trigger-types-baseline.json"

      - name: Install exact candidate through next
        run: |
          set -euo pipefail
          cd "$SMOKE_DIR/project"
          timeout --signal=TERM --kill-after=15s 600 iii worker add '${{ inputs.worker }}@next' --force --reset-config 2>&1 | tee "$SMOKE_DIR/worker-add.log"

      - name: Verify exact candidate lock
        run: >-
          python3 pipeline-scripts/.github/scripts/verify_registry_lock.py
          --lock "$SMOKE_DIR/project/iii.lock"
          --required '${{ inputs.worker }}'
          --worker '${{ inputs.worker }}'
          --version '${{ inputs.version }}'
          --output "$SMOKE_DIR/lock-verification.json"

      - name: Collect candidate interface
        run: |
          python3 pipeline-scripts/.github/scripts/collect_worker_interface.py \
            --worker '${{ inputs.worker }}' --out "$SMOKE_DIR/worker-interface.json" --wait-seconds 180 \
            --trigger-types-baseline "$SMOKE_DIR/trigger-types-baseline.json" --workers-baseline "$SMOKE_DIR/workers-baseline.json"
          python3 pipeline-scripts/.github/scripts/collect_worker_interface.py \
            --assert-non-empty --assert-typed-schemas --assert-file "$SMOKE_DIR/worker-interface.json"

      - name: Upload raw smoke facts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candidate-smoke-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: ${{ env.SMOKE_DIR }}/
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop smoke stack
        if: always()
        run: |
          set +e
          if [[ -f "$SMOKE_DIR/project/config.yaml" ]]; then
            cd "$SMOKE_DIR/project"
            iii worker remove -y '${{ inputs.worker }}' >/dev/null 2>&1 || true
          fi
          if [[ -f "$SMOKE_DIR/engine.pid" ]]; then
            kill -- "-$(cat "$SMOKE_DIR/engine.pid")" 2>/dev/null || kill "$(cat "$SMOKE_DIR/engine.pid")" 2>/dev/null || true
          fi

      - name: Write factual result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          subject=$(jq -cn --arg worker '${{ inputs.worker }}' --arg version '${{ inputs.version }}' \
            --arg tag '${{ inputs.tag }}' --arg channel next '{worker:$worker,version:$version,tag:$tag,channel:$channel}')
          checks=$(jq -cn --arg status "$JOB_STATUS" '[{name:"registry_lock",status:$status},{name:"worker_interface",status:$status}]')
          outputs=$(jq -cn --arg run_id '${{ inputs.release_run_id }}' --arg attempt '${{ inputs.release_run_attempt }}' \
            '{release_run:{id:($run_id|tonumber),attempt:($attempt|tonumber)}}')
          python3 pipeline-scripts/.github/scripts/release_control_contract.py write-result \
            --kind candidate_smoke --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow candidate-smoke.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects '[]' --outputs "$outputs" \
            --output execution-result.json

      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: execution-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: execution-result.json
          retention-days: 30
          if-no-files-found: error
