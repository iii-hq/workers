name: Move container channel alias

on:
  workflow_call:
    inputs:
      worker:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        description: 'Mutable alias to move after Registry publication'
        required: true
        type: string
      expected_digest:
        description: 'Digest emitted by the immutable version build'
        required: true
        type: string
    outputs:
      image_digest:
        value: ${{ jobs.alias.outputs.image_digest }}
      image_alias:
        value: ${{ jobs.alias.outputs.image_alias }}

permissions:
  contents: read
  packages: write

jobs:
  alias:
    name: Move ${{ inputs.worker }}:${{ inputs.channel }}
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.refs.outputs.image_digest }}
      image_alias: ${{ steps.refs.outputs.image_alias }}
    steps:
      - name: Validate immutable source
        id: refs
        env:
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
        run: |
          set -euo pipefail
          [[ "$CHANNEL" == next || "$CHANNEL" == latest ]] || {
            echo "::error::channel must be next|latest"
            exit 2
          }
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::expected_digest must be a sha256 digest"
            exit 2
          }
          owner=${GITHUB_REPOSITORY_OWNER,,}
          base="ghcr.io/${owner}/${WORKER}"
          {
            echo "version_ref=${base}:${VERSION}"
            echo "digest_ref=${base}@${EXPECTED_DIGEST}"
            echo "image_alias=${base}:${CHANNEL}"
            echo "image_digest=${EXPECTED_DIGEST}"
          } >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move and verify alias
        env:
          VERSION_REF: ${{ steps.refs.outputs.version_ref }}
          DIGEST_REF: ${{ steps.refs.outputs.digest_ref }}
          IMAGE_ALIAS: ${{ steps.refs.outputs.image_alias }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$VERSION_REF" --raw >version-manifest.json
          docker buildx imagetools inspect "$DIGEST_REF" --raw >digest-manifest.json
          cmp version-manifest.json digest-manifest.json
          docker buildx imagetools create --tag "$IMAGE_ALIAS" "$DIGEST_REF"
          docker buildx imagetools inspect "$IMAGE_ALIAS" --raw >alias-manifest.json
          cmp digest-manifest.json alias-manifest.json
