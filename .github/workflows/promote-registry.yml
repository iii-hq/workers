name: Promote exact Registry version
run-name: RC v3 · registry_promotion · ${{ inputs.operation_id }} · ${{ inputs.step_id }}

on:
  workflow_dispatch:
    inputs:
      contract_version:
        required: true
        type: string
      operation_id:
        required: true
        type: string
      step_id:
        required: true
        type: string
      worker:
        required: true
        type: string
      version:
        required: true
        type: string
      expected_next_version:
        required: true
        type: string
      expected_latest_version:
        description: Exact current latest version, or "none"
        required: true
        type: string
      release_run_id:
        required: true
        type: string
      release_run_attempt:
        required: true
        type: string
      candidate_evidence_run_id:
        required: true
        type: string
      candidate_evidence_run_attempt:
        required: true
        type: string
      e2e_run_id:
        description: Exact Harness validation run, or 0
        required: true
        type: string
      e2e_run_attempt:
        description: Exact Harness validation attempt, or 0
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: promote-registry-${{ inputs.worker }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Release Control dispatch
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/release_control_contract.py validate-dispatch
          --contract-version '${{ inputs.contract_version }}'
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'
          --mutating

      - name: Validate pinned identities
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.version }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
          EVIDENCE_RUN_ID: ${{ inputs.candidate_evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT: ${{ inputs.candidate_evidence_run_attempt }}
          E2E_RUN_ID: ${{ inputs.e2e_run_id }}
          E2E_RUN_ATTEMPT: ${{ inputs.e2e_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$WORKER" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(experimental|alpha|beta))?$ ]]
          for pair in "$RELEASE_RUN_ID:$RELEASE_RUN_ATTEMPT" "$EVIDENCE_RUN_ID:$EVIDENCE_RUN_ATTEMPT"; do
            IFS=: read -r run_id attempt <<<"$pair"
            [[ "$run_id" =~ ^[1-9][0-9]*$ && "$attempt" =~ ^[1-9][0-9]*$ ]]
            actual=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .run_attempt)
            [[ "$actual" == "$attempt" ]]
          done
          if [[ "$E2E_RUN_ID" != 0 || "$E2E_RUN_ATTEMPT" != 0 ]]; then
            [[ "$E2E_RUN_ID" =~ ^[1-9][0-9]*$ && "$E2E_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$E2E_RUN_ID" --jq .run_attempt)" == "$E2E_RUN_ATTEMPT" ]]
          fi
          tag="${WORKER}/v${VERSION}"
          git fetch origin "+refs/tags/${tag}:refs/tags/${tag}"
          git rev-parse "${tag}^{}" >tag-sha.txt

      - name: Promote Registry with exact CAS
        env:
          WORKERS_REGISTRY_API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}
        run: >-
          python3 .github/scripts/registry_release.py
          --api-url 'https://api.workers.iii.dev'
          --worker '${{ inputs.worker }}'
          --version '${{ inputs.version }}'
          --expected-next-version '${{ inputs.expected_next_version }}'
          --expected-latest-version '${{ inputs.expected_latest_version }}'
          --output registry-promotion.json

      - name: Write factual result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          subject=$(jq -cn --arg worker '${{ inputs.worker }}' --arg version '${{ inputs.version }}' \
            --arg channel latest --arg tag_sha "$(cat tag-sha.txt 2>/dev/null || true)" \
            '{worker:$worker,version:$version,channel:$channel,tag_sha:$tag_sha}')
          checks=$(jq -cn --arg status "$JOB_STATUS" '[{name:"registry_cas",status:$status}]')
          changed=$(jq -r '.changed // false' registry-promotion.json 2>/dev/null || echo false)
          effects=$(jq -cn --arg status "$JOB_STATUS" --argjson changed "$changed" \
            '[{surface:"registry_latest",status:(if $status == "success" then (if $changed then "changed" else "unchanged" end) else "failed" end)}]')
          outputs=$(jq -cn \
            --arg release_run_id '${{ inputs.release_run_id }}' --arg release_run_attempt '${{ inputs.release_run_attempt }}' \
            --arg evidence_run_id '${{ inputs.candidate_evidence_run_id }}' --arg evidence_run_attempt '${{ inputs.candidate_evidence_run_attempt }}' \
            --arg e2e_run_id '${{ inputs.e2e_run_id }}' --arg e2e_run_attempt '${{ inputs.e2e_run_attempt }}' \
            '{release_run:{id:($release_run_id|tonumber),attempt:($release_run_attempt|tonumber)},candidate_evidence_run:{id:($evidence_run_id|tonumber),attempt:($evidence_run_attempt|tonumber)},e2e_run:{id:($e2e_run_id|tonumber),attempt:($e2e_run_attempt|tonumber)}}')
          python3 .github/scripts/release_control_contract.py write-result \
            --kind registry_promotion --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow promote-registry.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects "$effects" --outputs "$outputs" \
            --output execution-result.json

      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: execution-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: execution-result.json
          retention-days: 30
          if-no-files-found: error
