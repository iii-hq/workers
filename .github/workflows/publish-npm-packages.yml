name: Publish npm packages

# Publishes the workspace packages that leave the repository to npm and owns
# their versions: @iii-dev/console-ui (worker UIs outside this repo compile
# against it) and @iii-dev/native-ui (the native-app SDK). Inside the repo both
# stay linked through workspace:*, so a version is only what npm serves.
#
# Each run packs main's head and compares the shipped files with the
# registry's `latest` (.github/scripts/npm_package_release.py):
#   - same files                → nothing to publish;
#   - different files           → next version from the conventional commits
#                                 since the last version change (feat → minor,
#                                 `!`/BREAKING CHANGE → major, minor below
#                                 1.0.0, anything else → patch);
#   - package.json ahead of npm → that hand-picked version as is (first
#                                 publication included).
# A dispatch can force a patch/minor/major bump, or dry-run the whole plan.
#
# npm is published first and is the source of truth; package.json follows in
# a bot commit with the subject Release Control's drift skips (as in
# sync-manifest-versions.yml), tagged `<name>@<version>`. If that push fails
# the next run sees npm ahead of package.json and only syncs it.

on:
  push:
    branches: [main]
    paths:
      - 'packages/console-ui/**'
      - 'packages/native-ui/**'
      # The catalog pins the dependency ranges pnpm writes into the tarball.
      - 'pnpm-workspace.yaml'
      - '.github/scripts/npm_package_release.py'
      - '.github/workflows/publish-npm-packages.yml'
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        options: [all, console-ui, native-ui]
        default: all
      bump:
        description: auto reads the commits and skips unchanged packages; patch, minor or major always publish
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Plan and pack only; publish, commit and tag nothing
        type: boolean
        default: false

permissions: {}

concurrency:
  group: publish-npm-packages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @iii-dev/${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Push the version commit and tag to main.
      contents: write
      # npm provenance.
      id-token: write
    strategy:
      fail-fast: false
      # One at a time: each job pushes a version commit to main, and the next
      # one checks out main after it.
      max-parallel: 1
      matrix:
        package: ${{ fromJSON((inputs.package == '' || inputs.package == 'all') && '["console-ui","native-ui"]' || format('["{0}"]', inputs.package)) }}
    env:
      PACKAGE: ${{ matrix.package }}
      PACKAGE_DIR: packages/${{ matrix.package }}
      BUMP: ${{ inputs.bump || 'auto' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # main's head, not the triggering SHA: the concurrency group drops
          # queued runs, so every run converges on whatever main is now.
          ref: main
          # The release baseline and commit range come from history.
          fetch-depth: 0
          filter: blob:none
          # The version commit and tag are pushed with the job token.
          persist-credentials: true

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install
        run: pnpm --filter "@iii-dev/$PACKAGE..." install --frozen-lockfile

      - name: Check
        env:
          # The native-ui test host's wall-time deadlines (see ci.yml).
          III_NATIVE_UI_BUDGET_SCALE: '4'
        run: |
          set -euo pipefail
          case "$PACKAGE" in
            console-ui)
              node --test "$PACKAGE_DIR"/*.test.mjs
              ;;
            native-ui)
              pnpm --filter @iii-dev/native-ui typecheck
              pnpm --filter @iii-dev/native-ui test
              (cd "$PACKAGE_DIR" && node scripts/gen-catalog.mjs --check && node scripts/gen-conformance.mjs --check)
              ;;
            *)
              echo "no checks defined for $PACKAGE" >&2
              exit 1
              ;;
          esac

      - name: Pack
        run: |
          set -euo pipefail
          echo "PACK_DIR=$RUNNER_TEMP/pack" >> "$GITHUB_ENV"
          PACK_DIR=$RUNNER_TEMP/pack
          rm -rf "$PACK_DIR" && mkdir -p "$PACK_DIR"
          (cd "$PACKAGE_DIR" && pnpm pack --pack-destination "$PACK_DIR")

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          python3 .github/scripts/npm_package_release.py plan \
            --package-dir "$PACKAGE_DIR" \
            --tarball "$(ls "$PACK_DIR"/*.tgz)" \
            --bump "$BUMP" \
            --github-output "$GITHUB_OUTPUT"

      - name: Write the version and repack
        if: steps.plan.outputs.action != 'none' && steps.plan.outputs.version != steps.plan.outputs.current
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/npm_package_release.py set-version --package-dir "$PACKAGE_DIR" --version "$VERSION"
          rm -rf "$PACK_DIR" && mkdir -p "$PACK_DIR"
          (cd "$PACKAGE_DIR" && pnpm pack --pack-destination "$PACK_DIR")

      - name: Publish to npm
        if: steps.plan.outputs.action == 'publish'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          tarball=$(ls "$PACK_DIR"/*.tgz)
          if [ "$DRY_RUN" = true ]; then
            npm publish "$tarball" --access public --dry-run
          else
            npm publish "$tarball" --access public --provenance
          fi

      - name: Commit and tag the version
        if: steps.plan.outputs.action != 'none' && env.DRY_RUN != 'true'
        env:
          ACTION: ${{ steps.plan.outputs.action }}
          VERSION: ${{ steps.plan.outputs.version }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- "$PACKAGE_DIR/package.json"; then
            # Release Control's drift skips commits with exactly this subject.
            git commit --quiet --message 'chore(release): sync package manifests to published versions' \
              --message "$TAG" -- "$PACKAGE_DIR/package.json"
            for attempt in 1 2 3; do
              git push origin HEAD:main && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              git pull --rebase origin main
            done
          fi
          if [ "$ACTION" = publish ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "tag $TAG already exists"
            else
              git tag "$TAG" HEAD
              git push origin "refs/tags/$TAG"
            fi
          fi

      - name: Summary
        if: always() && steps.plan.outputs.action != ''
        env:
          NAME: ${{ steps.plan.outputs.name }}
          ACTION: ${{ steps.plan.outputs.action }}
          CURRENT: ${{ steps.plan.outputs.current }}
          LATEST: ${{ steps.plan.outputs.latest }}
          VERSION: ${{ steps.plan.outputs.version }}
          REASON: ${{ steps.plan.outputs.reason }}
        run: |
          {
            echo "### $NAME"
            echo
            echo "| action | version | package.json | npm latest | dry run |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| $ACTION | $VERSION | $CURRENT | ${LATEST:-none} | $DRY_RUN |"
            echo
            echo "$REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  index:
    # A job-token push starts no workflow, and Release Control resolves main's
    # head through its descriptor index (see sync-manifest-versions.yml).
    # Checked even when nothing was pushed: a head that already has a run is
    # skipped.
    needs: publish
    if: ${{ !cancelled() && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Index main's head
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          head_runs=$(gh run list --workflow deploy-descriptor-index.yml --commit "$head" \
            --limit 1 --json databaseId --jq length)
          if [ "$head_runs" = 0 ]; then
            gh workflow run deploy-descriptor-index.yml --ref main
          fi
