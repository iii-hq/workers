name: Publish to workers registry

on:
  workflow_call:
    inputs:
      worker:
        description: 'Worker name (folder)'
        required: true
        type: string
      version:
        description: 'Semver version'
        required: true
        type: string
      deploy:
        description: 'binary | image | bundle'
        required: true
        type: string
      registry_tag:
        description: 'Registry tag (latest, next, ...)'
        required: false
        type: string
        default: latest
      tag:
        description: 'Git tag (e.g., image-resize/v1.0.0)'
        required: true
        type: string
      bin:
        description: 'Cargo binary name (binary deploy only)'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Fully-qualified image reference (image deploy only)'
        required: false
        type: string
        default: ''
      api_url:
        description: 'Workers registry base URL'
        required: false
        type: string
        default: 'https://api.workers.iii.dev'

jobs:
  publish:
    name: POST /publish (${{ inputs.worker }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install pyyaml
        run: pip install --quiet pyyaml

      # Bundle workers run `scripts.start: node ./index.mjs`; make sure
      # Node 22+ is available on the runner before we spawn the extracted
      # bundle. No-op for the binary / image paths.
      - name: Install Node (bundle deploy)
        if: inputs.deploy == 'bundle'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install iii CLI
        env:
          VERSION: '0.17.0'
        run: |
          set -euo pipefail
          curl -fsSL https://install.iii.dev/iii/main/install.sh -o /tmp/install-iii.sh
          sh /tmp/install-iii.sh
          {
            echo "$HOME/.local/bin"
            echo "$HOME/.iii/bin"
          } >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.iii/bin:$PATH"
          iii --version

      - name: Start III engine
        run: |
          set -euo pipefail
          printf 'workers: []\n' > config.yaml
          iii --config config.yaml --no-update-check > iii-engine.log 2>&1 &
          echo "$!" > iii-engine.pid

          for _ in {1..60}; do
            if ! kill -0 "$(cat iii-engine.pid)" 2>/dev/null; then
              echo "::error::iii engine exited before becoming ready"
              cat iii-engine.log
              exit 1
            fi

            if iii trigger 'engine::workers::list' --json '{}' >/tmp/iii-workers.json 2>/tmp/iii-trigger.err; then
              cat /tmp/iii-workers.json
              exit 0
            fi

            sleep 1
          done

          echo "::error::iii engine did not become ready"
          cat /tmp/iii-trigger.err || true
          cat iii-engine.log || true
          exit 1

      # The harness bundle no longer depends on the `database` worker —
      # provider credentials/settings + permissions live in the built-in
      # `configuration` worker (engine-default-enabled), so no dependency
      # worker needs to be started before interface collection.
      - name: Snapshot engine trigger types baseline
        run: |
          set -euo pipefail
          iii trigger \
            'engine::trigger-types::list' \
            --json '{"include_internal": false}' \
            > trigger-types-baseline.json
          cat trigger-types-baseline.json

      - name: Start local worker for interface collection
        env:
          WORKER: ${{ inputs.worker }}
          BIN: ${{ inputs.bin }}
          DEPLOY: ${{ inputs.deploy }}
          TAG: ${{ inputs.tag }}
          REPO_URL: ${{ format('https://github.com/{0}', github.repository) }}
        run: |
          set -euo pipefail
          mode=$(python3 .github/scripts/manifest_version.py deploy-mode "$WORKER")

          case "$mode" in
            iii-add)
              iii worker add "./$WORKER" --force --reset-config
              ;;
            release-binary)
              bin_name="${BIN:-$WORKER}"
              asset_url="$REPO_URL/releases/download/$TAG/${bin_name}-x86_64-unknown-linux-gnu.tar.gz"
              echo "Fetching prebuilt worker: $asset_url"
              curl -fsSL "$asset_url" -o /tmp/worker-bin.tar.gz
              tar -xzf /tmp/worker-bin.tar.gz -C /tmp/
              bin_path="/tmp/${bin_name}"
              chmod +x "$bin_path"

              worker_log="worker-$WORKER.log"
              pushd "$WORKER" >/dev/null
              echo "Starting local worker with: (cd $WORKER && $bin_path)"
              "$bin_path" > "../$worker_log" 2>&1 &
              echo "$!" > ../worker.pid
              popd >/dev/null

              sleep 2
              if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then
                echo "::error::$WORKER exited before interface collection"
                cat "$worker_log" || true
                exit 1
              fi
              ;;
            release-bundle)
              # `_bundle.yml` uploaded `<worker>.tar.gz` (containing
              # `index.mjs` + `iii.worker.yaml`) to the GitHub Release.
              # Download, extract, and spawn `scripts.start` directly on
              # the runner (same pattern as `release-binary`). Avoids
              # `iii worker add`, which no longer accepts `--wait` and
              # boots local dirs in a VM sandbox unsuitable for CI.
              bundle_url="$REPO_URL/releases/download/$TAG/${WORKER}.tar.gz"
              echo "Fetching prebuilt bundle: $bundle_url"
              curl -fsSL "$bundle_url" -o /tmp/worker-bundle.tar.gz
              stage_dir="/tmp/${WORKER}-bundle"
              rm -rf "$stage_dir"
              mkdir -p "$stage_dir"
              tar -xzf /tmp/worker-bundle.tar.gz -C "$stage_dir"
              ls -la "$stage_dir"

              worker_log="worker-$WORKER.log"
              workspace_root="$PWD"
              echo "Starting local worker with: (cd $stage_dir && node ./index.mjs)"
              pushd "$stage_dir" >/dev/null
              node ./index.mjs > "$workspace_root/$worker_log" 2>&1 &
              echo "$!" > "$workspace_root/worker.pid"
              popd >/dev/null

              sleep 2
              if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then
                echo "::error::$WORKER exited before interface collection"
                cat "$worker_log" || true
                exit 1
              fi
              ;;
            cargo-run)
              if [[ ! -f "$WORKER/Cargo.toml" ]]; then
                echo "::error::$WORKER is a Rust worker but $WORKER/Cargo.toml was not found"
                exit 1
              fi

              worker_log="worker-$WORKER.log"
              pushd "$WORKER" >/dev/null
              cargo_args=(run)
              if [[ -n "${BIN:-}" ]]; then
                cargo_args+=(--bin "$BIN")
              fi
              cargo_args+=(--)

              echo "Starting local worker with: (cd $WORKER && cargo ${cargo_args[*]})"
              cargo "${cargo_args[@]}" > "../$worker_log" 2>&1 &
              echo "$!" > ../worker.pid
              popd >/dev/null

              sleep 2
              if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then
                echo "::error::$WORKER exited before interface collection"
                cat "$worker_log" || true
                exit 1
              fi
              ;;
            *)
              echo "::error::$WORKER iii.worker.yaml has no local runtime/scripts.start and is not a Rust worker; cannot collect interface"
              exit 1
              ;;
          esac

      - name: Collect worker interface
        env:
          WORKER: ${{ inputs.worker }}
        run: |
          args=(
            "--worker" "$WORKER"
            "--out" "worker-interface.json"
            "--wait-seconds" "120"
            "--trigger-types-baseline" "trigger-types-baseline.json"
          )
          python3 .github/scripts/collect_worker_interface.py "${args[@]}"

      - name: Assert worker interface was collected
        run: |
          set -euo pipefail
          python3 .github/scripts/collect_worker_interface.py \
            --assert-non-empty --assert-file worker-interface.json

      - name: Resolve binary artifacts
        if: inputs.deploy == 'binary'
        env:
          TAG: ${{ inputs.tag }}
          BIN: ${{ inputs.bin }}
          WORKER: ${{ inputs.worker }}
          REPO_URL: ${{ format('https://github.com/{0}', github.repository) }}
        run: |
          python3 .github/scripts/resolve_binary_artifacts.py \
            --repo-url "$REPO_URL" \
            --tag "$TAG" \
            --bin "${BIN:-$WORKER}" \
            --out binaries.json

      - name: Create empty binary artifacts
        if: inputs.deploy != 'binary'
        run: |
          printf '{}\n' > binaries.json

      - name: Resolve bundle artifact
        if: inputs.deploy == 'bundle'
        env:
          TAG: ${{ inputs.tag }}
          WORKER: ${{ inputs.worker }}
          REPO_URL: ${{ format('https://github.com/{0}', github.repository) }}
        run: |
          python3 .github/scripts/resolve_bundle_artifact.py \
            --repo-url "$REPO_URL" \
            --tag "$TAG" \
            --worker "$WORKER" \
            --out bundle.json

      - name: Create empty bundle artifact
        if: inputs.deploy != 'bundle'
        run: |
          printf '{}\n' > bundle.json

      - name: Build payload
        env:
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.version }}
          DEPLOY: ${{ inputs.deploy }}
          REGISTRY_TAG: ${{ inputs.registry_tag }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REPO_URL: ${{ format('https://github.com/{0}', github.repository) }}
        run: |
          python3 .github/scripts/build_publish_payload.py \
            --worker "$WORKER" \
            --version "$VERSION" \
            --registry-tag "$REGISTRY_TAG" \
            --deploy "$DEPLOY" \
            --repo-url "$REPO_URL" \
            --interface-json worker-interface.json \
            --binaries-json binaries.json \
            --bundle-json bundle.json \
            --image-tag "$IMAGE_TAG" \
            --out payload.json

      - name: POST /publish
        env:
          API_URL: ${{ inputs.api_url }}
          API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}
        run: |
          if [[ -z "$API_KEY" ]]; then
            echo "::error::WORKERS_REGISTRY_API_KEY secret is not set"
            exit 1
          fi
          http=$(curl -sS -o response.json -w '%{http_code}' \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            -X POST "$API_URL/publish" \
            --data-binary @payload.json)
          echo "HTTP $http"
          cat response.json
          if [[ "$http" != "200" ]]; then
            echo "::error::publish failed with HTTP $http"
            exit 1
          fi

      - name: Build skills payload
        id: skills_payload
        env:
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.version }}
        run: |
          python3 .github/scripts/build_skills_payload.py \
            --worker "$WORKER" \
            --version "$VERSION" \
            --out skills-payload.json

      - name: POST /w/<worker>/skills
        if: steps.skills_payload.outputs.skip != 'true'
        env:
          API_URL: ${{ inputs.api_url }}
          API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}
          WORKER: ${{ inputs.worker }}
        run: |
          set -euo pipefail
          if [[ -z "$API_KEY" ]]; then
            echo "::error::WORKERS_REGISTRY_API_KEY secret is not set"
            exit 1
          fi
          http=$(curl -sS -o skills-response.json -w '%{http_code}' \
            -H "X-API-Key: $API_KEY" \
            -H "Content-Type: application/json" \
            -X POST "$API_URL/w/$WORKER/skills" \
            --data-binary @skills-payload.json)
          echo "HTTP $http"
          cat skills-response.json
          if [[ "$http" != "200" ]]; then
            echo "::error::publish skills failed with HTTP $http"
            exit 1
          fi

      - name: Dump III logs
        if: failure()
        run: |
          echo "::group::iii engine log"
          tail -n 200 iii-engine.log || true
          echo "::endgroup::"
          if [[ -f worker-${{ inputs.worker }}.log ]]; then
            echo "::group::worker log"
            tail -n 200 worker-${{ inputs.worker }}.log || true
            echo "::endgroup::"
          fi
          if [[ -f iii-database.log ]]; then
            echo "::group::iii-database log"
            tail -n 200 iii-database.log || true
            echo "::endgroup::"
          fi

      - name: Stop local worker
        if: always()
        run: |
          if [[ -f worker.pid ]]; then
            kill "$(cat worker.pid)" 2>/dev/null || true
          fi

      - name: Stop dependency workers
        if: always()
        run: |
          if [[ -f iii-database.pid ]]; then
            kill "$(cat iii-database.pid)" 2>/dev/null || true
          fi

      - name: Stop III engine
        if: always()
        run: |
          if [[ -f iii-engine.pid ]]; then
            kill "$(cat iii-engine.pid)" 2>/dev/null || true
          fi
