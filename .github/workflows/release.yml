# Release SOP: docs/sops/release.md
name: Publish exact worker release
run-name: RC · release · ${{ inputs.operation_id }} · ${{ inputs.step_id }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        description: Release Control operation UUID
        required: true
        type: string
      step_id:
        description: Release Control release step UUID
        required: true
        type: string
      source_tag_step_id:
        description: Step UUID recorded in the annotated tag
        required: true
        type: string
      tag:
        description: Exact annotated release tag
        required: true
        type: string
      publish_registry:
        description: Exact Registry capability selected by Release Control
        required: true
        type: boolean

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  setup:
    name: Validate exact release identity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      worker: ${{ steps.meta.outputs.worker }}
      version: ${{ steps.meta.outputs.version }}
      deploy: ${{ steps.meta.outputs.deploy }}
      language: ${{ steps.meta.outputs.language }}
      bin: ${{ steps.meta.outputs.bin }}
      manifest: ${{ steps.meta.outputs.manifest }}
      registry_tag: ${{ steps.meta.outputs.registry_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      targets: ${{ steps.meta.outputs.targets }}
      experimental: ${{ steps.meta.outputs.experimental }}
      tag_sha: ${{ steps.meta.outputs.tag_sha }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      maturity: ${{ steps.meta.outputs.maturity }}
      web_bundle: ${{ steps.web.outputs.needed }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - name: Install manifest tooling
        run: python3 -m pip install --quiet pyyaml

      - name: Validate Release Control dispatch
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/release_control_contract.py validate-dispatch
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'
          --mutating

      - name: Parse tag and worker manifest
        id: meta
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git fetch origin "+refs/tags/${RAW_TAG}:refs/tags/${RAW_TAG}"
          python3 .github/scripts/parse_release_tag.py "$RAW_TAG"
          [[ "$(git tag -l --format='%(contents)' "$RAW_TAG" | sed -n 's/^operation-id: //p')" == '${{ inputs.operation_id }}' ]]
          [[ "$(git tag -l --format='%(contents)' "$RAW_TAG" | sed -n 's/^step-id: //p')" == '${{ inputs.source_tag_step_id }}' ]]

      - name: Detect web bundle
        id: web
        env:
          WORKER: ${{ steps.meta.outputs.worker }}
        run: |
          if [[ -f "$WORKER/web/package.json" || -f "$WORKER/ui/package.json" ]]; then
            echo "needed=true" >>"$GITHUB_OUTPUT"
          else
            echo "needed=false" >>"$GITHUB_OUTPUT"
          fi

  github-release:
    name: Create GitHub Release shell
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: ${{ needs.setup.outputs.worker }} ${{ needs.setup.outputs.version }}
          draft: false
          prerelease: ${{ needs.setup.outputs.registry_tag == 'next' || needs.setup.outputs.is_prerelease == 'true' }}
          make_latest: false
          generate_release_notes: true

  binary-build:
    name: Binary build
    needs: [setup, github-release]
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.deploy == 'binary' }}
    uses: ./.github/workflows/_rust-binary.yml
    with:
      ref: ${{ inputs.tag }}
      bin_name: ${{ needs.setup.outputs.bin }}
      manifest_path: ${{ needs.setup.outputs.worker }}/${{ needs.setup.outputs.manifest }}
      tag_name: ${{ needs.setup.outputs.tag }}
      targets: ${{ needs.setup.outputs.targets }}
      web_bundle: ${{ needs.setup.outputs.web_bundle == 'true' }}
    secrets: inherit

  container-build:
    name: Container build
    needs: [setup, github-release]
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.deploy == 'image' }}
    uses: ./.github/workflows/_container.yml
    with:
      ref: ${{ inputs.tag }}
      worker: ${{ needs.setup.outputs.worker }}
      version: ${{ needs.setup.outputs.version }}
      dockerfile: Dockerfile
    secrets: inherit

  bundle-build:
    name: Bundle build
    needs: [setup, github-release]
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.deploy == 'bundle' }}
    uses: ./.github/workflows/_bundle.yml
    with:
      ref: ${{ inputs.tag }}
      worker: ${{ needs.setup.outputs.worker }}
      version: ${{ needs.setup.outputs.version }}
      language: ${{ needs.setup.outputs.language }}
      tag_name: ${{ needs.setup.outputs.tag }}
    secrets: inherit

  registry-publish:
    name: Publish immutable version and exact channel
    needs: [setup, binary-build, container-build, bundle-build]
    if: ${{ !failure() && !cancelled() && inputs.publish_registry }}
    uses: ./.github/workflows/_publish-registry.yml
    with:
      ref: ${{ inputs.tag }}
      worker: ${{ needs.setup.outputs.worker }}
      version: ${{ needs.setup.outputs.version }}
      deploy: ${{ needs.setup.outputs.deploy }}
      registry_tag: ${{ needs.setup.outputs.registry_tag }}
      tag: ${{ needs.setup.outputs.tag }}
      bin: ${{ needs.setup.outputs.bin }}
      image_tag: ${{ needs.container-build.outputs.image_tag }}
      experimental: ${{ needs.setup.outputs.experimental == 'true' }}
    secrets: inherit

  evidence:
    name: Record factual release effects
    needs: [setup, github-release, binary-build, container-build, bundle-build, registry-publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Write factual result
        env:
          SETUP: ${{ needs.setup.result }}
          GITHUB_RELEASE: ${{ needs.github-release.result }}
          BINARY: ${{ needs.binary-build.result }}
          CONTAINER: ${{ needs.container-build.result }}
          BUNDLE: ${{ needs.bundle-build.result }}
          REGISTRY: ${{ needs.registry-publish.result }}
          WORKER: ${{ needs.setup.outputs.worker }}
          VERSION: ${{ needs.setup.outputs.version }}
          TAG: ${{ needs.setup.outputs.tag || inputs.tag }}
          TAG_SHA: ${{ needs.setup.outputs.tag_sha }}
          SOURCE_SHA: ${{ needs.setup.outputs.source_sha }}
          CHANNEL: ${{ needs.setup.outputs.registry_tag }}
          DEPLOY: ${{ needs.setup.outputs.deploy }}
          IMAGE_DIGEST: ${{ needs.container-build.outputs.image_digest }}
        run: |
          subject=$(jq -cn --arg worker "$WORKER" --arg version "$VERSION" --arg source_sha "$SOURCE_SHA" \
            --arg tag "$TAG" --arg tag_sha "$TAG_SHA" --arg channel "$CHANNEL" \
            '{worker:$worker,version:$version,source_sha:$source_sha,tag:$tag,tag_sha:$tag_sha,channel:$channel}')
          checks=$(jq -cn --arg setup "$SETUP" --arg binary "$BINARY" --arg container "$CONTAINER" \
            --arg bundle "$BUNDLE" \
            '[{name:"setup",status:$setup},{name:"binary_build",status:$binary},{name:"container_build",status:$container},{name:"bundle_build",status:$bundle}]')
          effects=$(jq -cn --arg release "$GITHUB_RELEASE" --arg registry "$REGISTRY" \
            '[{surface:"github_release",status:$release},{surface:"registry_publish",status:$registry}]')
          outputs=$(jq -cn --arg deploy "$DEPLOY" --arg image_digest "$IMAGE_DIGEST" \
            '{deploy:$deploy,image_digest:(if $image_digest == "" then null else $image_digest end)}')
          python3 .github/scripts/release_control_contract.py write-result \
            --kind release --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow release.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects "$effects" --outputs "$outputs" \
            --output execution-result.json

      - uses: actions/upload-artifact@v6
        with:
          name: execution-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: execution-result.json
          retention-days: 30
          if-no-files-found: error
