# Release SOP: docs/sops/release.md
name: Release

on:
  push:
    tags:
      - 'acp/v*'
      - 'approval-gate/v*'
      - 'bridge/v*'
      - 'browser/v*'
      - 'claude-code/v*'
      - 'codex/v*'
      - 'computer/v*'
      - 'devin/v*'
      - 'console/v*'
      - 'grok/v*'
      - 'context-manager/v*'
      - 'cron/v*'
      - 'database/v*'
      - 'editor/v*'
      - 'email/v*'
      - 'eval/v*'
      - 'harness/v*'
      - 'hermes/v*'
      - 'http/v*'
      - 'iii-directory/v*'
      - 'lsp/v*'
      - 'image-resize/v*'
      - 'llm-router/v*'
      - 'fp/v*'
      - 'github/v*'
      - 'mcp/v*'
      - 'memory/v*'
      - 'memory-consolidate/v*'
      - 'opencode/v*'
      - 'openwiki/v*'
      - 'pdf/v*'
      - 'pi/v*'
      - 'provider-anthropic/v*'
      - 'provider-claude-code/v*'
      - 'provider-deepseek/v*'
      - 'provider-kimi/v*'
      - 'provider-llamacpp/v*'
      - 'provider-openai/v*'
      - 'provider-openai-codex/v*'
      - 'provider-xai/v*'
      - 'provider-zai/v*'
      - 'pubsub/v*'
      - 'queue/v*'
      - 'rbac-proxy/v*'
      - 'session-manager/v*'
      - 'slack/v*'
      - 'telegram-bot/v*'
      - 'shell/v*'
      - 'state/v*'
      - 'storage/v*'
      - 'scrapling/v*'
      - 'web/v*'
      - 'worktree/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., image-resize/v1.0.0)'
        required: true
        type: string

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────────────────────
  # Setup: parse tag, read iii.worker.yaml, extract registry-tag.
  # ──────────────────────────────────────────────────────────────
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      worker: ${{ steps.meta.outputs.worker }}
      version: ${{ steps.meta.outputs.version }}
      deploy: ${{ steps.meta.outputs.deploy }}
      language: ${{ steps.meta.outputs.language }}
      bin: ${{ steps.meta.outputs.bin }}
      manifest: ${{ steps.meta.outputs.manifest }}
      registry_tag: ${{ steps.meta.outputs.registry_tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
      targets: ${{ steps.meta.outputs.targets }}
      experimental: ${{ steps.meta.outputs.experimental }}
      tag_sha: ${{ steps.meta.outputs.tag_sha }}
      web_bundle: ${{ steps.web.outputs.needed }}
      interface_smoke: ${{ steps.smoke.outputs.interface_smoke }}
      harness_smoke: ${{ steps.harness_smoke.outputs.enabled }}
      staged: ${{ steps.release_state.outputs.staged }}
      promotable: ${{ steps.release_state.outputs.promotable }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Refetch annotated tag
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "$RAW_TAG" ]]; then
            git fetch origin "+refs/tags/${RAW_TAG}:refs/tags/${RAW_TAG}"
          fi

      - name: Parse tag + worker manifest
        id: meta
        env:
          RAW_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 .github/scripts/parse_release_tag.py "$RAW_TAG"

      # Workers like `console` ship a Vite SPA embedded into the binary via
      # `rust-embed`. Their `build.rs` invokes `pnpm install + pnpm build`
      # inside `<worker>/web/`, which the rust-binary matrix runners don't
      # have a Node/pnpm toolchain for. Detection is filesystem-based so any
      # future worker that adds a `web/package.json` opts in automatically.
      - name: Detect web bundle
        id: web
        env:
          WORKER: ${{ steps.meta.outputs.worker }}
        run: |
          if [[ -f "$WORKER/web/package.json" || -f "$WORKER/ui/package.json" ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$WORKER has a web/ or ui/ frontend; will pre-build its bundle"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      # A worker may declare `interface_smoke: false` in iii.worker.yaml when
      # it can't be booted for interface collection (e.g. iii-lsp is a stdio
      # language server that exits on stdin EOF and registers no functions).
      # Such workers still build + ship their binary, but skip the registry
      # publish job below. Default (key absent) is to publish as usual.
      - name: Detect interface-smoke opt-out
        id: smoke
        env:
          WORKER: ${{ steps.meta.outputs.worker }}
        run: |
          set -euo pipefail
          val=$(WORKER="$WORKER" python3 -c 'import os, sys, pathlib; sys.path.insert(0, ".github/scripts"); import _lib; m = _lib.read_iii_worker_yaml(pathlib.Path(os.environ["WORKER"])); print("false" if m.raw.get("interface_smoke") is False else "true")')
          echo "interface_smoke=$val" >> "$GITHUB_OUTPUT"
          if [[ "$val" == "false" ]]; then
            echo "::notice::$WORKER opts out of interface collection; registry publish will be skipped"
          fi

      # The published Harness quickstart also covers every worker declared as
      # a mandatory Harness dependency. Keep this derived from the manifest so
      # the post-deploy smoke follows dependency changes automatically.
      - name: Detect Harness quickstart smoke target
        id: harness_smoke
        env:
          WORKER: ${{ steps.meta.outputs.worker }}
        run: |
          set -euo pipefail
          enabled=$(WORKER="$WORKER" python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          worker = os.environ["WORKER"]
          manifest = yaml.safe_load(Path("harness/iii.worker.yaml").read_text())
          dependencies = manifest.get("dependencies", {}) or {}
          print("true" if worker == "harness" or worker in dependencies else "false")
          PY
          )
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "::notice::Harness quickstart smoke target=$enabled worker=$WORKER"

      - name: Classify staged release
        id: release_state
        env:
          REGISTRY_TAG: ${{ steps.meta.outputs.registry_tag }}
          INTERFACE_SMOKE: ${{ steps.smoke.outputs.interface_smoke }}
          IS_PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
          DRY_RUN: ${{ steps.meta.outputs.dry_run }}
        run: |
          set -euo pipefail
          staged=false
          promotable=false
          if [[ "$REGISTRY_TAG" == next && "$INTERFACE_SMOKE" == true && "$DRY_RUN" != true ]]; then
            staged=true
            if [[ "$IS_PRERELEASE" != true ]]; then
              promotable=true
            fi
          fi
          echo "staged=$staged" >>"$GITHUB_OUTPUT"
          echo "promotable=$promotable" >>"$GITHUB_OUTPUT"
          echo "::notice::staged=$staged promotable=$promotable"

  # ──────────────────────────────────────────────────────────────
  # Create the GitHub Release shell (skipped on dry runs).
  # ──────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [setup]
    if: needs.setup.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: ${{ needs.setup.outputs.worker }} ${{ needs.setup.outputs.version }}
          draft: false
          prerelease: ${{ needs.setup.outputs.is_prerelease == 'true' || needs.setup.outputs.staged == 'true' }}
          make_latest: false
          generate_release_notes: true

  # ──────────────────────────────────────────────────────────────
  # Binary path: build multi-arch via the existing reusable.
  # ──────────────────────────────────────────────────────────────
  binary-build:
    name: Binary build
    needs: [setup, create-release]
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.deploy == 'binary' }}
    uses: ./.github/workflows/_rust-binary.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      bin_name: ${{ needs.setup.outputs.bin }}
      manifest_path: ${{ needs.setup.outputs.worker }}/${{ needs.setup.outputs.manifest }}
      tag_name: ${{ needs.setup.outputs.tag }}
      is_prerelease: ${{ needs.setup.outputs.is_prerelease == 'true' || needs.setup.outputs.staged == 'true' }}
      skip_create_release: true
      dry_run: ${{ needs.setup.outputs.dry_run == 'true' }}
      targets: ${{ needs.setup.outputs.targets }}
      web_bundle: ${{ needs.setup.outputs.web_bundle == 'true' }}
    secrets: inherit

  # ──────────────────────────────────────────────────────────────
  # Container path: build multi-arch image, push to ghcr.io.
  # ──────────────────────────────────────────────────────────────
  container-build:
    name: Container build
    needs: [setup, create-release]
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.deploy == 'image' }}
    uses: ./.github/workflows/_container.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      worker: ${{ needs.setup.outputs.worker }}
      version: ${{ needs.setup.outputs.version }}
      registry_tag: ${{ needs.setup.outputs.registry_tag }}
      dry_run: ${{ needs.setup.outputs.dry_run == 'true' }}
    secrets: inherit

  # ──────────────────────────────────────────────────────────────
  # Bundle path: build a single-file archive (Node/Python), upload
  # as a GitHub Release asset for `_publish-registry.yml` to resolve.
  # ──────────────────────────────────────────────────────────────
  bundle-build:
    name: Bundle build
    needs: [setup, create-release]
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.deploy == 'bundle' }}
    uses: ./.github/workflows/_bundle.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      worker: ${{ needs.setup.outputs.worker }}
      version: ${{ needs.setup.outputs.version }}
      language: ${{ needs.setup.outputs.language }}
      tag_name: ${{ needs.setup.outputs.tag }}
      is_prerelease: ${{ needs.setup.outputs.is_prerelease == 'true' || needs.setup.outputs.staged == 'true' }}
      dry_run: ${{ needs.setup.outputs.dry_run == 'true' }}
    secrets: inherit

  # ──────────────────────────────────────────────────────────────
  # Publish to the workers registry API.
  # ──────────────────────────────────────────────────────────────
  publish:
    name: Publish to registry
    needs: [setup, binary-build, container-build, bundle-build]
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.dry_run != 'true' && needs.setup.outputs.interface_smoke != 'false' }}
    uses: ./.github/workflows/_publish-registry.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      worker: ${{ needs.setup.outputs.worker }}
      version: ${{ needs.setup.outputs.version }}
      deploy: ${{ needs.setup.outputs.deploy }}
      registry_tag: ${{ needs.setup.outputs.registry_tag }}
      tag: ${{ needs.setup.outputs.tag }}
      bin: ${{ needs.setup.outputs.bin }}
      image_tag: ${{ needs.container-build.outputs.image_tag }}
      experimental: ${{ needs.setup.outputs.experimental }}
    secrets: inherit

  candidate-smoke:
    name: Validate published candidate
    needs: [setup, publish]
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.staged == 'true' && needs.publish.result == 'success' }}
    uses: ./.github/workflows/_candidate-smoke.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      worker: ${{ needs.setup.outputs.worker }}
      version: ${{ needs.setup.outputs.version }}

  harness-quickstart:
    name: Validate candidate in Harness quickstart
    needs: [setup, candidate-smoke]
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.staged == 'true' && needs.setup.outputs.harness_smoke == 'true' }}
    uses: ./.github/workflows/harness-quickstart.yml
    with:
      cli_channel: latest
      registry_tag: latest
      release_worker: ${{ needs.setup.outputs.worker }}
      release_version: ${{ needs.setup.outputs.version }}
      release_tag: ${{ needs.setup.outputs.tag }}
      release_run_id: ${{ github.run_id }}
      cascade_e2e: false

  harness-e2e:
    name: Validate candidate in deployed Harness E2E
    needs: [setup, harness-quickstart]
    if: ${{ !failure() && !cancelled() && needs.setup.outputs.staged == 'true' && needs.setup.outputs.harness_smoke == 'true' }}
    uses: ./.github/workflows/_harness-e2e.yml
    with:
      stack_mode: registry
      runs: 1
      max_parallel: 2
      benchmark_lane: deployed
      cli_channel: latest
      registry_tag: latest
      release_tag: ${{ needs.setup.outputs.tag }}
      release_worker: ${{ needs.setup.outputs.worker }}
      release_version: ${{ needs.setup.outputs.version }}
      release_url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.setup.outputs.tag }}
      release_run_id: ${{ github.run_id }}
      subjects: ${{ vars.HARNESS_E2E_SUBJECTS || '[{"id":"anthropic-sonnet","model":"claude-sonnet-4-6","provider":"anthropic"}]' }}
      judge_model: ${{ vars.HARNESS_E2E_JUDGE_MODEL || 'claude-sonnet-4-6' }}
      judge_provider: ${{ vars.HARNESS_E2E_JUDGE_PROVIDER || 'anthropic' }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      zai_api_key: ${{ secrets.ZAI_API_KEY }}

  candidate-ready:
    name: Record candidate evidence
    needs: [setup, publish, candidate-smoke, harness-quickstart, harness-e2e]
    if: ${{ always() && needs.setup.result == 'success' && needs.setup.outputs.staged == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Build candidate evidence
        env:
          REPOSITORY: ${{ github.repository }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TAG_SHA: ${{ needs.setup.outputs.tag_sha }}
          RELEASE_TAG: ${{ needs.setup.outputs.tag }}
          WORKER: ${{ needs.setup.outputs.worker }}
          VERSION: ${{ needs.setup.outputs.version }}
          DEPLOY: ${{ needs.setup.outputs.deploy }}
          REGISTRY_TAG: ${{ needs.setup.outputs.registry_tag }}
          HARNESS_GATE_REQUIRED: ${{ needs.setup.outputs.harness_smoke }}
          PROMOTABLE: ${{ needs.setup.outputs.promotable }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          CANDIDATE_SMOKE_RESULT: ${{ needs.candidate-smoke.result }}
          HARNESS_QUICKSTART_RESULT: ${{ needs.harness-quickstart.result }}
          HARNESS_E2E_RESULT: ${{ needs.harness-e2e.result }}
        run: |
          python3 .github/scripts/release_candidate.py build \
            --repository "$REPOSITORY" \
            --release-run-id "$RELEASE_RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --tag-sha "$TAG_SHA" \
            --release-tag "$RELEASE_TAG" \
            --worker "$WORKER" \
            --version "$VERSION" \
            --deploy "$DEPLOY" \
            --registry-tag "$REGISTRY_TAG" \
            --harness-gate-required "$HARNESS_GATE_REQUIRED" \
            --promotable "$PROMOTABLE" \
            --publish-result "$PUBLISH_RESULT" \
            --candidate-smoke-result "$CANDIDATE_SMOKE_RESULT" \
            --harness-quickstart-result "$HARNESS_QUICKSTART_RESULT" \
            --harness-e2e-result "$HARNESS_E2E_RESULT" \
            --output release-candidate.json
          cat release-candidate.json

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ needs.setup.outputs.worker }}-${{ needs.setup.outputs.version }}
          path: release-candidate.json
          retention-days: 30
          if-no-files-found: error

      - name: Require all candidate gates
        run: jq -e '.candidate_ready == true' release-candidate.json >/dev/null

  # ──────────────────────────────────────────────────────────────
  # Announce the release in Slack (#worker-releases). Terminal job:
  # nothing depends on it, but a bad token or channel fails red
  # instead of rotting silently.
  # ──────────────────────────────────────────────────────────────
  announce:
    name: Announce on Slack
    needs: [setup, binary-build, container-build, bundle-build, publish, candidate-ready]
    if: >-
      ${{
        always() &&
        needs.setup.result == 'success' &&
        needs.setup.outputs.dry_run != 'true' &&
        (
          (needs.setup.outputs.staged == 'true' && needs.candidate-ready.result == 'success') ||
          (
            needs.setup.outputs.staged != 'true' &&
            needs.binary-build.result != 'failure' &&
            needs.container-build.result != 'failure' &&
            needs.bundle-build.result != 'failure' &&
            (needs.setup.outputs.interface_smoke == 'false' || needs.publish.result == 'success')
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Post to Slack
        id: post
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: worker-releases
          WORKER: ${{ needs.setup.outputs.worker }}
          VERSION: ${{ needs.setup.outputs.version }}
          IS_PRERELEASE: ${{ needs.setup.outputs.is_prerelease }}
          STAGED: ${{ needs.setup.outputs.staged }}
          PROMOTABLE: ${{ needs.setup.outputs.promotable }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.setup.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$STAGED" == true && "$PROMOTABLE" == true ]]; then
            text="🧪 ${WORKER} v${VERSION} candidate passed on @next — <${RUN_URL}|promote manually> · <${RELEASE_URL}|GitHub prerelease>"
          elif [[ "$STAGED" == true ]]; then
            text="🧪 ${WORKER} v${VERSION} prerelease passed on @next — <${RELEASE_URL}|GitHub prerelease>"
          else
            suffix=""
            if [[ "$IS_PRERELEASE" == "true" ]]; then suffix=" (pre-release)"; fi
            text="🚀 ${WORKER} v${VERSION}${suffix} released — <${RELEASE_URL}|GitHub Release>"
          fi
          payload=$(jq -n --arg channel "$CHANNEL" --arg text "$text" '{channel: $channel, text: $text}')
          resp=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload")
          if ! echo "$resp" | jq -e .ok > /dev/null; then
            echo "::error::Slack API error: $(echo "$resp" | jq -r .error)"
            exit 1
          fi
          echo "ts=$(echo "$resp" | jq -r .ts)" >> "$GITHUB_OUTPUT"

      - name: Post release notes in thread
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: worker-releases
          TAG: ${{ needs.setup.outputs.tag }}
          THREAD_TS: ${{ steps.post.outputs.ts }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes=$(gh release view "$TAG" -R "${{ github.repository }}" --json body --jq .body 2>/dev/null || true)
          if [[ -z "$notes" ]]; then
            echo "::notice::no release notes body; skipping thread reply"
            exit 0
          fi
          notes=$(printf '%s' "$notes" | head -c 2900)
          payload=$(jq -n --arg channel "$CHANNEL" --arg text "$notes" --arg ts "$THREAD_TS" \
            '{channel: $channel, text: $text, thread_ts: $ts}')
          resp=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload")
          if ! echo "$resp" | jq -e .ok > /dev/null; then
            echo "::error::Slack API error: $(echo "$resp" | jq -r .error)"
            exit 1
          fi
