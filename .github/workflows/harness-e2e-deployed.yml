name: Harness E2E deployed

on:
  workflow_dispatch:
    inputs:
      cli_channel:
        description: iii installer channel
        required: true
        type: choice
        options: [latest, next]
        default: latest
      registry_tag:
        description: Registry tag for the baseline Harness stack
        required: true
        type: choice
        options: [latest, next]
        default: latest
      release_worker:
        description: Worker published by the release
        required: true
        type: string
      release_version:
        description: Exact version that must be resolved from the registry
        required: true
        type: string
      release_tag:
        description: Git tag associated with the release
        type: string
        default: ''
      release_run_id:
        description: GitHub Actions run id of the publishing release
        type: string
        default: ''
      smoke_run_id:
        description: GitHub Actions run id of the preceding smoke CI
        type: string
        default: ''
      subjects:
        description: Optional JSON subject matrix
        type: string
        default: ''
      judge_model:
        description: Optional fixed judge model id
        type: string
        default: ''
      judge_provider:
        description: Optional fixed judge provider id
        type: string
        default: ''
      runs:
        description: Number of executions per scenario
        type: number
        default: 1

permissions:
  actions: read
  contents: read

concurrency:
  group: harness-e2e-deployed-${{ inputs.release_worker }}-${{ inputs.release_version }}-${{ inputs.cli_channel }}-${{ inputs.registry_tag }}
  cancel-in-progress: false

jobs:
  e2e:
    uses: ./.github/workflows/_harness-e2e.yml
    with:
      stack_mode: registry
      runs: ${{ inputs.runs }}
      max_parallel: 2
      benchmark_lane: deployed
      cli_channel: ${{ inputs.cli_channel }}
      registry_tag: ${{ inputs.registry_tag }}
      release_tag: ${{ inputs.release_tag }}
      release_worker: ${{ inputs.release_worker }}
      release_version: ${{ inputs.release_version }}
      release_run_id: ${{ inputs.release_run_id }}
      smoke_run_id: ${{ inputs.smoke_run_id }}
      subjects: ${{ inputs.subjects || vars.HARNESS_E2E_SUBJECTS || '[{"id":"anthropic-sonnet","model":"claude-sonnet-4-6","provider":"anthropic"}]' }}
      judge_model: ${{ inputs.judge_model || vars.HARNESS_E2E_JUDGE_MODEL || 'claude-sonnet-4-6' }}
      judge_provider: ${{ inputs.judge_provider || vars.HARNESS_E2E_JUDGE_PROVIDER || 'anthropic' }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      zai_api_key: ${{ secrets.ZAI_API_KEY }}
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
