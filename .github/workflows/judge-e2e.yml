name: Judge E2E
run-name: Test · judge_e2e · ${{ github.event_name }}

on:
  pull_request:
    paths:
      - 'judge/**'
      - 'judge-typesafe/**'
      - 'judge-semif/**'
      - 'crates/judge-contract/**'
      - 'crates/config-client/**'
      - 'crates/console-ui/**'
      - 'crates/worker-paths/**'
      - 'packages/console-ui/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/scripts/judge-*'
      - '.github/workflows/judge-e2e.yml'

permissions:
  contents: read

concurrency:
  group: judge-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # Same verified configuration::ensure release as ci.yml and build.yml.
  III_RELEASE_TAG: 'iii/v0.24.0-rc.2'

jobs:
  e2e:
    name: UI bundles and local engine
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Prepare reports
        run: |
          mkdir -p "$RUNNER_TEMP/judge-e2e-reports"
          echo "JUDGE_E2E_REPORT_DIR=$RUNNER_TEMP/judge-e2e-reports" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1

      - name: Cache cargo registry and builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            judge
            judge-typesafe
            crates/judge-contract

      - name: Setup pnpm
        # Version comes from the root package.json packageManager field.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --filter '@iii-workers/judge-ui...' --filter '@iii-workers/judge-typesafe-ui...' --filter '@iii-workers/judge-semif-ui...' install --frozen-lockfile 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/ui-install.log"

      - name: UI Vitest (judge, judge-typesafe, judge-semif)
        run: |
          pnpm --dir judge/ui test 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-ui-test.log"
          pnpm --dir judge-typesafe/ui test 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-typesafe-ui-test.log"
          pnpm --dir judge-semif/ui test 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-semif-ui-test.log"

      - name: Build real embedded UI assets
        run: |
          pnpm --dir judge/ui build 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-ui-build.log"
          pnpm --dir judge-typesafe/ui build 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-typesafe-ui-build.log"
          pnpm --dir judge-semif/ui build 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-semif-ui-build.log"
          # Reuse these assets in both Cargo feature variants.
          echo 'SKIP_UI_BUILD=1' >> "$GITHUB_ENV"

      # judge-semif compiles llama.cpp (cmake), its bindings (bindgen: libclang)
      # and the runtime-loaded Vulkan backend module (headers + glslc).
      - name: Provision llama.cpp build tools
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev libvulkan-dev glslc spirv-headers

      - name: Install pinned iii engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BIN_DIR: ${{ runner.temp }}/judge-engine/bin
        run: |
          installer="$RUNNER_TEMP/judge-install-iii.sh"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 5 \
            https://install.iii.dev/iii/main/install.sh -o "$installer"
          sh "$installer" 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/engine-install.log"
          "$BIN_DIR/iii" --version | tee "$JUDGE_E2E_REPORT_DIR/engine-version.log"
          test "$(awk '{print $NF}' "$JUDGE_E2E_REPORT_DIR/engine-version.log")" = "${III_RELEASE_TAG#iii/v}"
          echo "III_ENGINE_BIN=$BIN_DIR/iii" >> "$GITHUB_ENV"

      - name: Real-engine tests (4 local mocked cases)
        run: bash .github/scripts/judge-e2e.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: judge-e2e-reports
          path: ${{ runner.temp }}/judge-e2e-reports/
          if-no-files-found: ignore
          retention-days: 7
