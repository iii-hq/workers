name: Judge E2E
run-name: Test · judge_e2e · ${{ github.event_name }}

on:
  pull_request:
    paths:
      - 'judge/**'
      - 'judge-laya/**'
      - 'judge-typesafe/**'
      - 'judge-semif/**'
      - 'judge-decider/**'
      - 'judge-clef/**'
      - 'judge-openai/**'
      - 'crates/llama-runtime/**'
      - 'crates/llama-native/**'
      - 'crates/judge-contract/**'
      - 'crates/judge-provider/**'
      - 'crates/config-client/**'
      - 'crates/console-ui/**'
      - 'crates/worker-paths/**'
      - 'packages/console-ui/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/scripts/judge-*'
      - '.github/workflows/judge-e2e.yml'

permissions:
  contents: read

concurrency:
  group: judge-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  # Same verified configuration::ensure release as ci.yml and build.yml.
  III_RELEASE_TAG: 'iii/v0.24.0-rc.2'

jobs:
  e2e:
    name: UI bundles and local engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          # The PR merge commit plus its first parent (the base tip) for the diff below.
          fetch-depth: 2

      # packages/console-ui (types only) and the root pnpm files feed the UI
      # checks but nothing the Rust engine suite exercises, so a PR touching
      # only those skips the Rust engine half. Keep this regex in sync with
      # on.pull_request.paths minus those JS-only entries.
      - name: Decide whether the engine suite runs
        id: scope
        run: |
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if grep -qE '^(judge(-laya|-typesafe|-semif|-decider|-clef|-openai)?/|crates/(llama-runtime|llama-native|judge-contract|judge-provider|config-client|console-ui|worker-paths)/|rust-toolchain\.toml$|\.cargo/|\.github/scripts/judge-|\.github/workflows/judge-e2e\.yml$)' <<<"$changed"; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Only JS-side shared files changed; skipping the Rust engine suite."
          fi

      - name: Prepare reports
        run: |
          mkdir -p "$RUNNER_TEMP/judge-e2e-reports"
          echo "JUDGE_E2E_REPORT_DIR=$RUNNER_TEMP/judge-e2e-reports" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        if: steps.scope.outputs.engine == 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1

      - name: Setup pnpm
        # Version comes from the root package.json packageManager field.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install UI dependencies
        run: pnpm --filter '@iii-workers/judge-ui...' --filter '@iii-workers/judge-laya-ui...' --filter '@iii-workers/judge-typesafe-ui...' --filter '@iii-workers/judge-semif-ui...' --filter '@iii-workers/judge-decider-ui...' --filter '@iii-workers/judge-clef-ui...' --filter '@iii-workers/judge-openai-ui...' install --frozen-lockfile 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/ui-install.log"

      - name: UI Vitest (judge, judge-laya, judge-typesafe, judge-semif, judge-decider, judge-clef, judge-openai)
        run: |
          pnpm --dir judge/ui test 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-ui-test.log"
          pnpm --dir judge-laya/ui test 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-laya-ui-test.log"
          pnpm --dir judge-typesafe/ui test 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-typesafe-ui-test.log"
          pnpm --dir judge-semif/ui test 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-semif-ui-test.log"
          pnpm --dir judge-decider/ui test 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-decider-ui-test.log"
          pnpm --dir judge-clef/ui test 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-clef-ui-test.log"
          pnpm --dir judge-openai/ui test 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-openai-ui-test.log"

      - name: Build real embedded UI assets
        run: |
          pnpm --dir judge/ui build 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-ui-build.log"
          pnpm --dir judge-laya/ui build 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-laya-ui-build.log"
          pnpm --dir judge-typesafe/ui build 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-typesafe-ui-build.log"
          pnpm --dir judge-semif/ui build 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-semif-ui-build.log"
          pnpm --dir judge-decider/ui build 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-decider-ui-build.log"
          pnpm --dir judge-clef/ui build 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-clef-ui-build.log"
          pnpm --dir judge-openai/ui build 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/judge-openai-ui-build.log"
          # Reuse these assets in both Cargo feature variants.
          echo 'SKIP_UI_BUILD=1' >> "$GITHUB_ENV"

      - name: Install pinned iii engine
        if: steps.scope.outputs.engine == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BIN_DIR: ${{ runner.temp }}/judge-engine/bin
        run: |
          installer="$RUNNER_TEMP/judge-install-iii.sh"
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 5 \
            https://install.iii.dev/iii/main/install.sh -o "$installer"
          sh "$installer" 2>&1 | tee "$JUDGE_E2E_REPORT_DIR/engine-install.log"
          "$BIN_DIR/iii" --version | tee "$JUDGE_E2E_REPORT_DIR/engine-version.log"
          test "$(awk '{print $NF}' "$JUDGE_E2E_REPORT_DIR/engine-version.log")" = "${III_RELEASE_TAG#iii/v}"
          echo "III_ENGINE_BIN=$BIN_DIR/iii" >> "$GITHUB_ENV"

      # Compile time was the whole cost: four from-scratch llama.cpp builds with
      # every CPU variant and Vulkan, plus eight workspaces each building the
      # same deps. One target dir builds each shared unit once across the
      # suites (judge-laya's opt-level 3 still gets its own llama.cpp), and the
      # tiny models run on one CPU module. The hosted image ships cmake, curl,
      # tar and patch. No rust-cache: PR-scoped caches never reach another PR,
      # and it purges path crates (llama-native's llama.cpp) anyway.
      - name: Real-engine tests (11 local mocked cases)
        if: steps.scope.outputs.engine == 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/judge-e2e-target
          III_LLAMA_CPP_MINIMAL: '1'
        run: bash .github/scripts/judge-e2e.sh

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: judge-e2e-reports
          path: ${{ runner.temp }}/judge-e2e-reports/
          if-no-files-found: ignore
          retention-days: 7
