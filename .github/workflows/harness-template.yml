name: Harness template

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: harness-template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Harness template validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --quiet PyYAML==6.0.3
      - name: Validate local Compose stack, configuration, agents and skills
        run: python template/tests/test_template.py
