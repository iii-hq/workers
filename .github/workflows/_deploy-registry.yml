name: Deployment Registry Publish

on:
  workflow_call:
    inputs:
      worker: {required: true, type: string}
      version: {required: true, type: string}
      github_tag: {required: true, type: string}
      prepared_run_id: {required: true, type: string}
      prepared_artifact: {required: true, type: string}
      image_tag: {required: false, default: '', type: string}
      registry_tag: {required: false, default: next, type: string}
      expected_current_version: {required: false, default: '', type: string}
    secrets:
      WORKERS_REGISTRY_API_KEY: {required: true}

permissions: {}

jobs:
  publish:
    runs-on: workers-release-linux-8core
    environment: workers-registry-release
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ inputs.prepared_artifact }}
          path: deploy-prepared
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}

      - name: Build the current Registry payload from prepared bytes
        env:
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.version }}
          GITHUB_TAG: ${{ inputs.github_tag }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          REGISTRY_TAG: ${{ inputs.registry_tag }}
        run: |
          set -euo pipefail
          python3 .github/scripts/deployment_interface.py verify-evidence \
            --descriptor deploy-prepared/deployment-descriptor.json \
            --evidence deploy-prepared/deployment-evidence.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          descriptor = json.loads(Path("deploy-prepared/deployment-descriptor.json").read_text())
          prepared = json.loads(Path("deploy-prepared/prepared-artifacts.json").read_text())
          interface_snapshot = json.loads(Path("deploy-prepared/deployment-interface.json").read_text())
          if descriptor["worker"] != os.environ["WORKER"]:
              raise SystemExit("prepared descriptor identity mismatch")
          if prepared["descriptor_sha256"] != descriptor["descriptor_sha256"]:
              raise SystemExit("prepared artifact descriptor mismatch")
          interface = interface_snapshot.get("interface")
          kind = descriptor["artifact"]["kind"]
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['GITHUB_TAG']}"
          artifacts = [entry for entry in prepared["artifacts"] if entry["role"] != "checksum"]
          if kind == "rust-binary":
              targets = {unit["id"]: unit["target"] for unit in descriptor["build_units"]}
              artifact_payload = {
                  "kind": kind,
                  "binaries": {
                      targets[entry["unit"]]: {
                          "url": f"{base}/{entry['name']}",
                          "sha256": entry["sha256"],
                      }
                      for entry in artifacts
                  },
              }
          elif kind in {"javascript-bundle", "python-bundle"}:
              if len(artifacts) != 1:
                  raise SystemExit("bundle release requires exactly one prepared archive")
              entry = artifacts[0]
              artifact_payload = {
                  "kind": kind,
                  "archive_url": f"{base}/{entry['name']}",
                  "sha256": entry["sha256"],
              }
          elif kind == "oci-image":
              image_tag = os.environ["IMAGE_TAG"]
              if not image_tag or "@sha256:" not in image_tag:
                  raise SystemExit("image release requires a digest-pinned image tag")
              artifact_payload = {"kind": kind, "image_tag": image_tag}
          else:
              raise SystemExit(f"unsupported artifact kind {kind}")
          Path("interface.json").write_text(json.dumps(interface or {"functions": [], "triggers": []}, sort_keys=True) + "\n")
          Path("registry-artifacts.json").write_text(json.dumps(artifact_payload, sort_keys=True) + "\n")
          PY
          python3 .github/scripts/build_publish_payload.py \
            --descriptor deploy-prepared/deployment-descriptor.json \
            --published-version "$VERSION" \
            --repo-url "https://github.com/$GITHUB_REPOSITORY" \
            --interface-json interface.json \
            --artifacts-json registry-artifacts.json \
            --registry-tag "$REGISTRY_TAG" \
            --out payload.json
          if jq -e 'has("package_descriptor") or has("descriptor_sha256") or has("channel")' payload.json >/dev/null; then
            echo 'descriptor-native fields must never reach the current Registry' >&2
            exit 1
          fi
          if [[ "$REGISTRY_TAG" == none ]]; then
            test "$(jq 'has(\"tag\")' payload.json)" = false
          else
            test "$(jq -r .tag payload.json)" = "$REGISTRY_TAG"
          fi

      - name: Publish candidate and next atomically with readback
        env:
          WORKERS_REGISTRY_API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/registry_publication.py publish-version \
            --api-url https://api.workers.iii.dev \
            --worker "$WORKER" --version "$VERSION" \
            --payload payload.json --out registry-version-receipt.json

      - name: Move next with compare-and-swap
        if: inputs.expected_current_version != ''
        env:
          API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.version }}
          EXPECTED_CURRENT_VERSION: ${{ inputs.expected_current_version }}
        run: |
          set -euo pipefail
          before=$(curl -fsS -H 'Content-Type: application/json' -X POST \
            'https://api.workers.iii.dev/resolve' \
            --data "$(jq -nc --arg worker "$WORKER" '{worker:$worker,version:"next"}')" | jq -er .root.version)
          state=absent
          [[ "$before" == "$VERSION" ]] && state=present
          if [[ "$state" == absent && "$before" != "$EXPECTED_CURRENT_VERSION" ]]; then
            echo 'next changed outside the authorized compare-and-swap' >&2
            exit 1
          fi
          plan=$(python3 .github/scripts/deployment_effects.py plan --before "$state")
          if [[ "$plan" == mutate ]]; then
            payload=$(jq -nc --arg version "$VERSION" --arg expected "$EXPECTED_CURRENT_VERSION" \
              '{version:$version,expected_current_version:$expected}')
            curl -fsS -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' -X PUT \
              "https://api.workers.iii.dev/w/$WORKER/tags/next" --data "$payload" >next-mutation.json
          fi
          after=$(curl -fsS -H 'Content-Type: application/json' -X POST \
            'https://api.workers.iii.dev/resolve' \
            --data "$(jq -nc --arg worker "$WORKER" '{worker:$worker,version:"next"}')" | jq -er .root.version)
          test "$after" = "$VERSION"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: registry-publication-${{ inputs.worker }}-${{ inputs.version }}
          path: |
            payload.json
            registry-version-receipt.json
          if-no-files-found: error
          retention-days: 30
