name: Prerelease from branch
run-name: Prerelease · ${{ inputs.worker }} · ${{ inputs.target_version || inputs.suffix }} · ${{ inputs.operation_id || 'manual' }}

# Publishes a worker prerelease from a feature branch without changing that
# branch or main. The versioned commit is reachable only through the annotated
# release tag, and the registry channel is intentionally fixed to `next`.
#
# Run from Actions -> Prerelease from branch -> "Use workflow from: <feature-branch>".

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker slug from .github/release-workers.yaml'
        required: true
        type: string
      suffix:
        description: 'Prerelease maturity'
        required: true
        type: choice
        options: [experimental, alpha, beta]
        default: alpha
      target_version:
        description: 'Exact prerelease version; overrides suffix when set'
        required: false
        type: string
        default: ''
      experimental:
        description: 'Worker-level experimental badge (independent of version maturity)'
        required: false
        type: boolean
        default: false
      operation_id:
        description: 'Release Control operation UUID'
        required: false
        type: string
        default: ''
      step_id:
        description: 'Release Control step UUID'
        required: false
        type: string
        default: ''

permissions:
  actions: write
  contents: write

concurrency:
  group: prerelease-${{ inputs.worker }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare prerelease tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}

      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.generate_token.outputs.token }}

      - name: Install release tooling
        run: pip install --quiet pyyaml

      - name: Refuse main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH" == "main" ]]; then
            echo "::error::Prereleases from branch cannot run on main; use Create Tag"
            exit 1
          fi
          echo "::notice::Publishing prerelease from branch: $BRANCH"

      - name: Discover manifest
        id: meta
        env:
          WORKER: ${{ inputs.worker }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_catalog.py validate
          workflow=$(python3 .github/scripts/release_catalog.py get "$WORKER" release_workflow)
          [[ "$workflow" == release.yml ]] || {
            echo "::error::$WORKER does not use the standard release workflow"
            exit 2
          }
          manifest=$(python3 .github/scripts/release_catalog.py get "$WORKER" manifest)
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"

      - name: Calculate prerelease version
        id: version
        env:
          WORKER: ${{ inputs.worker }}
          MANIFEST: ${{ steps.meta.outputs.manifest }}
          SUFFIX: ${{ inputs.suffix }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          current=$(python3 .github/scripts/manifest_version.py read "$WORKER/$MANIFEST")
          version=$(python3 .github/scripts/manifest_version.py resolve \
            "$WORKER/$MANIFEST" --kind none --suffix "$SUFFIX" --target "$TARGET_VERSION")
          maturity=$(python3 .github/scripts/manifest_version.py maturity "$version")
          [[ "$maturity" != stable ]] || {
            echo "::error::Prerelease from branch requires experimental, alpha, or beta"
            exit 2
          }
          python3 .github/scripts/manifest_version.py check-history "$WORKER" "$version"
          {
            echo "version=$version"
            echo "tag=${WORKER}/v${version}"
            echo "maturity=$maturity"
          } >>"$GITHUB_OUTPUT"
          echo "::notice::$WORKER: $current -> $version (maturity=$maturity)"

      - name: Write prerelease version to manifest
        env:
          WORKER: ${{ inputs.worker }}
          MANIFEST: ${{ steps.meta.outputs.manifest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/manifest_version.py bump \
            "$WORKER/$MANIFEST" --kind none --target "$VERSION" >/dev/null
          python3 .github/scripts/manifest_version.py verify \
            "$WORKER/$MANIFEST" --expected "$VERSION"

      - name: Sync Cargo.lock to prerelease version
        env:
          WORKER: ${{ inputs.worker }}
          MANIFEST: ${{ steps.meta.outputs.manifest }}
        run: |
          set -euo pipefail
          python3 .github/scripts/manifest_version.py sync-lock "$WORKER/$MANIFEST"

      - name: Ensure prerelease tag is available
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag already exists: $TAG"
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "workers-ci[bot]"
          git config user.email "workers-ci[bot]@users.noreply.github.com"

      - name: Commit version bump and push prerelease tag only
        env:
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          MATURITY: ${{ steps.version.outputs.maturity }}
          EXPERIMENTAL: ${{ inputs.experimental }}
          OPERATION_ID: ${{ inputs.operation_id }}
          STEP_ID: ${{ inputs.step_id }}
        run: |
          set -euo pipefail
          git add -A
          git commit -m "chore(${WORKER}): prerelease ${VERSION} [skip ci]"
          operation_id="${OPERATION_ID:-github:${GITHUB_RUN_ID}}"
          step_id="${STEP_ID:-prerelease}"
          git tag -a "$TAG" -m "Prerelease $TAG

          worker: $WORKER
          version: $VERSION
          release-contract: 2
          operation-id: $operation_id
          step-id: $step_id
          source-sha: ${GITHUB_SHA}
          maturity: $MATURITY
          registry-tag: next
          experimental: $EXPERIMENTAL
          "
          # Do not push the selected branch or main. The ephemeral alpha
          # commit is reachable exclusively through this annotated tag.
          git push origin "$TAG"
          echo "::notice::Created $TAG (registry-tag=next)"

      - name: Dispatch release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f tag="$TAG"
          echo "::notice::Dispatched Release for $TAG"
