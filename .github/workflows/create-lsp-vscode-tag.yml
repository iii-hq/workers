name: Create exact LSP VS Code tag
run-name: RC v3 · create_lsp_tag · ${{ inputs.operation_id }} · ${{ inputs.step_id }}

on:
  workflow_dispatch:
    inputs:
      contract_version: { required: true, type: string }
      operation_id: { required: true, type: string }
      step_id: { required: true, type: string }
      source_sha: { required: true, type: string }
      target_version: { required: true, type: string }

permissions:
  contents: write

concurrency:
  group: create-lsp-vscode-tag
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.token.outputs.token }}
      - name: Validate Release Control dispatch
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/release_control_contract.py validate-dispatch
          --contract-version '${{ inputs.contract_version }}'
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'
          --mutating
      - name: Create ephemeral versioned tag
        env:
          VERSION: ${{ inputs.target_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          OPERATION_ID: ${{ inputs.operation_id }}
          STEP_ID: ${{ inputs.step_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          tag="lsp-vscode/v${VERSION}"
          ! git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null
          git config user.name "workers-ci[bot]"
          git config user.email "workers-ci[bot]@users.noreply.github.com"
          cd lsp-vscode
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          cd ..
          git add lsp-vscode/package.json lsp-vscode/package-lock.json
          git commit -m "chore(lsp-vscode): release ${VERSION} [skip ci]"
          maturity=stable
          [[ "$VERSION" == *-* ]] && maturity=prerelease
          git tag -a "$tag" -m "Release $tag

          worker: lsp-vscode
          version: $VERSION
          release-contract: 3
          operation-id: $OPERATION_ID
          step-id: $STEP_ID
          source-sha: $SOURCE_SHA
          maturity: $maturity
          registry-tag: next
          experimental: false
          "
          git push origin "$tag"
      - name: Write factual result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          subject=$(jq -cn --arg worker lsp-vscode --arg version '${{ inputs.target_version }}' \
            --arg source_sha '${{ inputs.source_sha }}' --arg tag 'lsp-vscode/v${{ inputs.target_version }}' \
            '{worker:$worker,version:$version,source_sha:$source_sha,tag:$tag}')
          checks=$(jq -cn --arg status "$JOB_STATUS" '[{name:"create_lsp_tag",status:$status}]')
          effects=$(jq -cn --arg status "$JOB_STATUS" --arg tag 'lsp-vscode/v${{ inputs.target_version }}' \
            '[{surface:"git_tag",status:(if $status == "success" then "changed" else "failed" end),immutable_id:$tag}]')
          python3 .github/scripts/release_control_contract.py write-result \
            --kind create_tag --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow create-lsp-vscode-tag.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects "$effects" --outputs '{}' --output execution-result.json
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: execution-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: execution-result.json
          retention-days: 30
          if-no-files-found: error
