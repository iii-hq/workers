name: Repair worker release
run-name: Repair · ${{ inputs.worker }}@${{ inputs.version }} · ${{ inputs.action }} · ${{ inputs.operation_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker slug
        required: true
        type: string
      version:
        description: Exact existing release version
        required: true
        type: string
      release_run_id:
        description: Original Release workflow run
        required: true
        type: string
      action:
        description: Repair action
        required: true
        type: choice
        options: [verify, candidate-smoke, container-alias, github-release]
        default: verify
      channel:
        description: 'Surface to repair (original uses the tag annotation)'
        required: true
        type: choice
        options: [original, next, latest]
        default: original
      operation_id:
        description: Release Control repair operation UUID
        required: false
        type: string
        default: ''
      step_id:
        description: Release Control repair step UUID
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: repair-worker-${{ inputs.worker }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  setup:
    name: Validate repair identity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      tag_sha: ${{ steps.meta.outputs.tag_sha }}
      worker: ${{ steps.meta.outputs.worker }}
      version: ${{ steps.meta.outputs.version }}
      maturity: ${{ steps.meta.outputs.maturity }}
      registry_tag: ${{ steps.channel.outputs.value }}
      deploy: ${{ steps.meta.outputs.deploy }}
      image_digest: ${{ steps.source.outputs.image_digest }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      release_operation_id: ${{ steps.meta.outputs.operation_id }}
      operation_id: ${{ steps.intent.outputs.operation_id }}
      step_id: ${{ steps.intent.outputs.step_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/checkout@v5
        with:
          ref: ${{ format('{0}/v{1}', inputs.worker, inputs.version) }}
          path: release-source

      - run: pip install --quiet pyyaml

      - name: Parse release tag
        id: meta
        run: >-
          python3 .github/scripts/parse_release_tag.py
          "${{ inputs.worker }}/v${{ inputs.version }}"
          --source-dir release-source

      - name: Normalize repair identity
        id: intent
        env:
          OPERATION_ID_INPUT: ${{ inputs.operation_id }}
          STEP_ID_INPUT: ${{ inputs.step_id }}
        run: |
          set -euo pipefail
          [[ "${{ inputs.release_run_id }}" =~ ^[0-9]+$ ]] || {
            echo "::error::release_run_id must be numeric"
            exit 2
          }
          {
            echo "operation_id=${OPERATION_ID_INPUT:-github:${GITHUB_RUN_ID}}"
            echo "step_id=${STEP_ID_INPUT:-repair}"
          } >>"$GITHUB_OUTPUT"

      - name: Resolve repair channel
        id: channel
        env:
          CHANNEL_INPUT: ${{ inputs.channel }}
          ORIGINAL_CHANNEL: ${{ steps.meta.outputs.registry_tag }}
        run: |
          set -euo pipefail
          channel="$CHANNEL_INPUT"
          if [[ "$channel" == original ]]; then channel="$ORIGINAL_CHANNEL"; fi
          [[ "$channel" == next || "$channel" == latest ]]
          if [[ "${{ inputs.action }}" == candidate-smoke && "$channel" != next ]]; then
            echo "::error::candidate-smoke repairs require channel next"
            exit 2
          fi
          echo "value=$channel" >>"$GITHUB_OUTPUT"

      - name: Load source evidence
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          EXPECTED_TAG_SHA: ${{ steps.meta.outputs.tag_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" >release-run.json
          jq -e '
            .name == "Release" and
            (.path | startswith(".github/workflows/release.yml@")) and
            (.event == "push" or .event == "workflow_dispatch")
          ' release-run.json >/dev/null || {
            echo "::error::run $RELEASE_RUN_ID is not a standard Release run"
            exit 1
          }
          event=$(jq -r .event release-run.json)
          if [[ "$event" == push ]]; then
            jq -e --arg tag "$TAG" --arg sha "$EXPECTED_TAG_SHA" \
              '.head_branch == $tag and .head_sha == $sha' release-run.json >/dev/null || {
              echo "::error::push run $RELEASE_RUN_ID does not match $TAG at $EXPECTED_TAG_SHA"
              exit 1
            }
          fi
          mkdir -p source
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-candidate-${WORKER}-${VERSION}" --dir source 2>/dev/null || true
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-result-${RELEASE_RUN_ID}" --dir source 2>/dev/null || true

          evidence_sha=$(jq -r '.tag_sha // empty' source/release-candidate.json 2>/dev/null || true)
          if [[ -z "$evidence_sha" ]]; then
            evidence_sha=$(jq -r '.tag_sha // empty' source/release-result.json 2>/dev/null || true)
          fi
          if [[ -n "$evidence_sha" && "$evidence_sha" != "$EXPECTED_TAG_SHA" ]]; then
            echo "::error::source evidence tag SHA is $evidence_sha, expected $EXPECTED_TAG_SHA"
            exit 1
          fi
          digest=$(jq -r '.image_digest // empty' source/release-candidate.json 2>/dev/null || true)
          if [[ -z "$digest" ]]; then
            digest=$(jq -r '.image_digest // empty' source/release-result.json 2>/dev/null || true)
          fi
          echo "image_digest=$digest" >>"$GITHUB_OUTPUT"

  registry:
    name: Verify Registry state
    needs: [setup]
    if: inputs.action != 'github-release'
    runs-on: ubuntu-latest
    outputs:
      resolved_version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Resolve expected channel
        id: resolve
        env:
          API_URL: https://api.workers.iii.dev
          WORKER: ${{ needs.setup.outputs.worker }}
          VERSION: ${{ needs.setup.outputs.version }}
          REGISTRY_TAG: ${{ needs.setup.outputs.registry_tag }}
        run: |
          set -euo pipefail
          resolved=$(python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".github/scripts")
          from registry_release import resolve_version
          print(resolve_version(os.environ["API_URL"], os.environ["WORKER"], os.environ["REGISTRY_TAG"]))
          PY
          )
          [[ "$resolved" == "$VERSION" ]] || {
            echo "::error::$WORKER@$REGISTRY_TAG resolves $resolved, expected $VERSION"
            exit 1
          }
          echo "version=$resolved" >>"$GITHUB_OUTPUT"

  candidate-smoke:
    name: Repair candidate smoke
    needs: [setup, registry]
    if: inputs.action == 'candidate-smoke'
    uses: ./.github/workflows/_candidate-smoke.yml
    with:
      ref: ${{ needs.setup.outputs.tag }}
      worker: ${{ needs.setup.outputs.worker }}
      version: ${{ needs.setup.outputs.version }}

  container-alias:
    name: Repair container alias
    needs: [setup, registry]
    if: >-
      ${{
        always() &&
        needs.setup.result == 'success' &&
        needs.registry.result == 'success' &&
        needs.setup.outputs.deploy == 'image' &&
        (inputs.action == 'container-alias' || inputs.action == 'candidate-smoke')
      }}
    uses: ./.github/workflows/_container-alias.yml
    with:
      worker: ${{ needs.setup.outputs.worker }}
      version: ${{ needs.setup.outputs.version }}
      channel: ${{ needs.setup.outputs.registry_tag }}
      expected_digest: ${{ needs.setup.outputs.image_digest }}
    secrets: inherit

  candidate-evidence:
    name: Record repaired candidate evidence
    needs: [setup, registry, candidate-smoke, container-alias]
    if: ${{ always() && inputs.action == 'candidate-smoke' && needs.candidate-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.tag }}
      - name: Build repaired candidate evidence
        env:
          ALIAS_RESULT: ${{ needs.container-alias.result }}
        run: |
          python3 .github/scripts/release_candidate.py build \
            --repository "$GITHUB_REPOSITORY" \
            --release-run-id "${{ inputs.release_run_id }}" \
            --evidence-run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --tag-sha "${{ needs.setup.outputs.tag_sha }}" \
            --source-sha "${{ needs.setup.outputs.source_sha }}" \
            --release-tag "${{ needs.setup.outputs.tag }}" \
            --worker "${{ needs.setup.outputs.worker }}" \
            --version "${{ needs.setup.outputs.version }}" \
            --maturity "${{ needs.setup.outputs.maturity }}" \
            --deploy "${{ needs.setup.outputs.deploy }}" \
            --registry-tag "${{ needs.setup.outputs.registry_tag }}" \
            --operation-id "${{ needs.setup.outputs.release_operation_id }}" \
            --step-id "repair-candidate-smoke" \
            --image-digest "${{ needs.setup.outputs.image_digest }}" \
            --promotable true \
            --publish-result success \
            --candidate-smoke-result success \
            --container-alias-result "$ALIAS_RESULT" \
            --output release-candidate.json
          jq -e '.candidate_ready == true' release-candidate.json >/dev/null
      - uses: actions/upload-artifact@v6
        with:
          name: release-candidate-${{ needs.setup.outputs.worker }}-${{ needs.setup.outputs.version }}
          path: release-candidate.json
          retention-days: 30
          if-no-files-found: error

  github-release:
    name: Repair GitHub Release state
    needs: [setup]
    if: inputs.action == 'github-release'
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          MATURITY: ${{ needs.setup.outputs.maturity }}
          REGISTRY_TAG: ${{ needs.setup.outputs.registry_tag }}
        run: |
          set -euo pipefail
          prerelease=true
          if [[ "$MATURITY" == stable && "$REGISTRY_TAG" == latest ]]; then prerelease=false; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --prerelease="$prerelease" --latest=false
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "${{ needs.setup.outputs.worker }} ${{ needs.setup.outputs.version }}" \
              --generate-notes --prerelease="$prerelease" --latest=false
          fi

  verify:
    name: Verify release surfaces
    needs: [setup, registry]
    if: inputs.action == 'verify'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4
        if: needs.setup.outputs.deploy == 'image'
      - uses: docker/login-action@v4
        if: needs.setup.outputs.deploy == 'image'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify GitHub Release and container alias
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          MATURITY: ${{ needs.setup.outputs.maturity }}
          REGISTRY_TAG: ${{ needs.setup.outputs.registry_tag }}
          DEPLOY: ${{ needs.setup.outputs.deploy }}
          IMAGE_DIGEST: ${{ needs.setup.outputs.image_digest }}
          WORKER: ${{ needs.setup.outputs.worker }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url >github-release.json
          expected_prerelease=true
          if [[ "$MATURITY" == stable && "$REGISTRY_TAG" == latest ]]; then expected_prerelease=false; fi
          jq -e --arg tag "$TAG" --argjson prerelease "$expected_prerelease" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == $prerelease' \
            github-release.json >/dev/null
          if [[ "$DEPLOY" == image ]]; then
            [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            owner=${GITHUB_REPOSITORY_OWNER,,}
            docker buildx imagetools inspect \
              "ghcr.io/${owner}/${WORKER}@${IMAGE_DIGEST}" --raw >digest-manifest.json
            docker buildx imagetools inspect \
              "ghcr.io/${owner}/${WORKER}:${REGISTRY_TAG}" --raw >alias-manifest.json
            cmp digest-manifest.json alias-manifest.json
          fi

  result:
    name: Record repair result
    needs: [setup, registry, candidate-smoke, container-alias, candidate-evidence, github-release, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build repair evidence
        env:
          ACTION: ${{ inputs.action }}
          SETUP_RESULT: ${{ needs.setup.result }}
          REGISTRY_RESULT: ${{ needs.registry.result }}
          CANDIDATE_SMOKE_RESULT: ${{ needs.candidate-smoke.result }}
          CONTAINER_ALIAS_RESULT: ${{ needs.container-alias.result }}
          CANDIDATE_EVIDENCE_RESULT: ${{ needs.candidate-evidence.result }}
          GITHUB_RELEASE_RESULT: ${{ needs.github-release.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          selected_result=failed
          case "$ACTION" in
            verify) selected_result="$VERIFY_RESULT" ;;
            candidate-smoke) selected_result="$CANDIDATE_EVIDENCE_RESULT" ;;
            container-alias) selected_result="$CONTAINER_ALIAS_RESULT" ;;
            github-release) selected_result="$GITHUB_RELEASE_RESULT" ;;
          esac
          status=failed
          [[ "$SETUP_RESULT" == success && "$selected_result" == success ]] && status=succeeded
          jq -n \
            --argjson schema_version 2 \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg repair_run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg operation_id "${{ needs.setup.outputs.operation_id || inputs.operation_id }}" \
            --arg step_id "${{ needs.setup.outputs.step_id || inputs.step_id }}" \
            --arg worker "${{ inputs.worker }}" \
            --arg version "${{ inputs.version }}" \
            --arg release_run_id "${{ inputs.release_run_id }}" \
            --arg action "$ACTION" \
            --arg status "$status" \
            --arg setup "$SETUP_RESULT" \
            --arg registry "$REGISTRY_RESULT" \
            --arg selected "$selected_result" \
            '{schema_version: $schema_version, repository: $repository,
              repair_run_id: $repair_run_id, run_attempt: $run_attempt,
              operation_id: $operation_id, step_id: $step_id,
              worker: $worker, version: $version, release_run_id: $release_run_id,
              action: $action, status: $status,
              results: {setup: $setup, registry: $registry, selected: $selected}}' \
            >repair-result.json
      - uses: actions/upload-artifact@v6
        with:
          name: release-repair-${{ inputs.worker }}-${{ inputs.version }}-${{ github.run_id }}
          path: repair-result.json
          retention-days: 30
          if-no-files-found: error
