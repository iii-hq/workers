name: rbac-proxy E2E
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Deployment · test · {0} · {1}', inputs.operation_id, inputs.step_id) || format('Test · rbac_proxy_e2e · {0}', github.event_name) }}

on:
  pull_request:
    paths:
      - 'rbac-proxy/**'
      - '.github/workflows/rbac-proxy-e2e.yml'
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: string
      operation_id:
        required: true
        type: string
      step_id:
        required: true
        type: string

concurrency:
  group: rbac-proxy-e2e-${{ inputs.operation_id || inputs.source_sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: Auth / gating / namespacing / discovery / channels through the proxy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Validate Release Control dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/deployment_control_contract.py validate-dispatch
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'

      - name: Rewrite SSH to HTTPS for public deps
        run: git config --local url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rbac-proxy

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rbac-proxy/tests/e2e/workers/harness/package-lock.json

      - name: Install iii engine (next)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 5 \
            https://install.iii.dev/iii/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify engine
        run: iii --version

      - name: Run harness
        working-directory: rbac-proxy/tests/e2e
        run: ./run-tests.sh

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rbac-proxy-e2e-report
          path: |
            rbac-proxy/tests/e2e/reports/
          retention-days: 7

  evidence:
    needs: e2e
    if: github.event_name == 'workflow_dispatch' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: "${{ github.sha }}"
      - run: |
          subject=$(jq -cn --arg source_sha '${{ inputs.source_sha }}' '{source_sha:$source_sha}')
          checks=$(jq -cn --arg status '${{ needs.e2e.result }}' '[{name:"rbac_proxy_e2e",status:$status}]')
          python3 .github/scripts/deployment_control_contract.py write-test-result --kind test --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' --workflow rbac-proxy-e2e.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects '[]' --outputs '{}' --output e2e-result.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: e2e-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: e2e-result.json
          retention-days: 30
