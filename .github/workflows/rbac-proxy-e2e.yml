name: rbac-proxy E2E
run-name: 'Test · rbac_proxy_e2e · ${{ github.event_name }}'

on:
  pull_request:
    paths:
      - 'rbac-proxy/**'
      - '.github/workflows/rbac-proxy-e2e.yml'

concurrency:
  group: rbac-proxy-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep integration on the engine release that provides configuration::ensure.
  III_RELEASE_TAG: 'iii/v0.26.0'

jobs:
  e2e:
    name: Auth / gating / namespacing / discovery / channels through the proxy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Rewrite SSH to HTTPS for public deps
        run: git config --local url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: rbac-proxy

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rbac-proxy/tests/e2e/workers/harness/package-lock.json

      - name: Install iii engine (next)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 5 \
            https://install.iii.dev/iii/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify engine
        run: iii --version

      - name: Run harness
        working-directory: rbac-proxy/tests/e2e
        run: ./run-tests.sh

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rbac-proxy-e2e-report
          path: |
            rbac-proxy/tests/e2e/reports/
          retention-days: 7
