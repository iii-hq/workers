# Release SOP: docs/sops/release.md
name: Create Tag

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Worker module to release'
        required: true
        type: choice
        options:
          - acp
          - approval-gate
          - bridge
          - browser
          - claude-code
          - codex
          - devin
          - console
          - grok
          - context-manager
          - cron
          - database
          - email
          - harness
          - hermes
          - http
          - iii-directory
          - lsp
          - lsp-vscode
          - image-resize
          - llm-router
          - fp
          - github
          - mcp
          - memory
          - memory-consolidate
          - opencode
          - pi
          - provider-anthropic
          - provider-claude-code
          - provider-kimi
          - provider-llamacpp
          - provider-openai
          - provider-openai-codex
          - provider-xai
          - provider-zai
          - pubsub
          - queue
          - rbac-proxy
          - session-manager
          - slack
          - telegram-bot
          - shell
          - state
          - worktree
          - storage
          - scrapling
          - web
      bump:
        description: 'Version bump (none = release the manifest version as-is, e.g. when a merged PR already set it)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: patch
      tag:
        description: 'Registry tag (passed to POST /publish; not part of git tag name)'
        required: true
        type: choice
        options:
          - latest
          - next
        default: latest

permissions:
  contents: write

concurrency:
  group: create-tag
  cancel-in-progress: false

jobs:
  create-tag:
    name: Bump version & create tag
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Pre-flight checks
        env:
          WORKER: ${{ inputs.worker }}
        run: |
          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          if [[ "$BRANCH" != "main" ]]; then
            echo "::error::Must be on main branch (currently on $BRANCH)"
            exit 1
          fi
          if [[ ! -d "$WORKER" ]]; then
            echo "::error::Worker directory does not exist: $WORKER"
            exit 1
          fi

      - name: Discover manifest
        id: meta
        env:
          WORKER: ${{ inputs.worker }}
        run: |
          set -euo pipefail
          # lsp-vscode has no iii.worker.yaml (special VS Code extension flow).
          if [[ "$WORKER" == "lsp-vscode" ]]; then
            echo "manifest=package.json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f "$WORKER/iii.worker.yaml" ]]; then
            echo "::error::$WORKER/iii.worker.yaml is missing"
            exit 1
          fi
          MANIFEST=$(grep '^manifest:' "$WORKER/iii.worker.yaml" | head -n1 | awk '{print $2}')
          if [[ -z "$MANIFEST" ]]; then
            echo "::error::$WORKER/iii.worker.yaml has no 'manifest' key"
            exit 1
          fi
          echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Calculate and write next version
        id: versions
        env:
          WORKER: ${{ inputs.worker }}
          BUMP: ${{ inputs.bump }}
          MANIFEST: ${{ steps.meta.outputs.manifest }}
        run: |
          set -euo pipefail
          current=$(python3 .github/scripts/manifest_version.py read "$WORKER/$MANIFEST")
          new_ver=$(python3 .github/scripts/manifest_version.py bump "$WORKER/$MANIFEST" --kind "$BUMP")
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "version=$new_ver" >> "$GITHUB_OUTPUT"
          echo "tag=${WORKER}/v${new_ver}" >> "$GITHUB_OUTPUT"
          echo "::notice::${WORKER}: ${current} -> ${new_ver}"

      - name: Validate manifest update
        env:
          WORKER: ${{ inputs.worker }}
          MANIFEST: ${{ steps.meta.outputs.manifest }}
          NEW_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/manifest_version.py verify \
            "$WORKER/$MANIFEST" --expected "$NEW_VERSION"
          echo "Validated $WORKER/$MANIFEST = $NEW_VERSION"

      # The bump only rewrites Cargo.toml. Without this, the crate's own entry
      # in Cargo.lock keeps the old version until someone's local `cargo build`
      # rewrites it, so every developer pulls a dirty lockfile. Sync it here so
      # `git add -A` below commits the lockfile alongside the manifest. No-op
      # for non-Rust workers and crates without a committed Cargo.lock.
      - name: Sync Cargo.lock to bumped version
        env:
          WORKER: ${{ inputs.worker }}
          MANIFEST: ${{ steps.meta.outputs.manifest }}
        run: |
          set -euo pipefail
          python3 .github/scripts/manifest_version.py sync-lock "$WORKER/$MANIFEST"

      - name: Check tag does not exist
        env:
          TAG: ${{ steps.versions.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Configure git identity
        run: |
          git config user.name "workers-ci[bot]"
          git config user.email "workers-ci[bot]@users.noreply.github.com"

      - name: Commit and push
        env:
          WORKER: ${{ inputs.worker }}
          NEW_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          if git diff --quiet; then
            echo "::notice::manifest unchanged (bump: none); skipping bump commit"
          else
            git add -A
            git commit -m "chore(${WORKER}): bump to v${NEW_VERSION}"
            git push origin main
          fi

      - name: Create and push annotated tag
        env:
          TAG: ${{ steps.versions.outputs.tag }}
          REGISTRY_TAG: ${{ inputs.tag }}
          WORKER: ${{ inputs.worker }}
          NEW_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          git tag -a "$TAG" -m "Release $TAG

          worker: $WORKER
          version: $NEW_VERSION
          registry-tag: $REGISTRY_TAG
          "
          git push origin "$TAG"
          echo "::notice::Created tag: $TAG (registry-tag=$REGISTRY_TAG)"
