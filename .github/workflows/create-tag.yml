# Release SOP: docs/sops/release.md
name: Create exact release tag
run-name: RC v3 · create_tag · ${{ inputs.operation_id }} · ${{ inputs.step_id }}

on:
  workflow_dispatch:
    inputs:
      contract_version:
        description: Release Control contract version
        required: true
        type: string
      operation_id:
        description: Release Control operation UUID
        required: true
        type: string
      step_id:
        description: Release Control step UUID
        required: true
        type: string
      worker:
        description: Exact worker slug
        required: true
        type: string
      target_version:
        description: Exact target version
        required: true
        type: string
      registry_tag:
        description: Exact Registry channel
        required: true
        type: choice
        options: [next, latest]
      experimental:
        description: Exact Registry experimental flag
        required: true
        type: boolean
      expected_current_version:
        description: CAS guard for the manifest version
        required: true
        type: string
      source_sha:
        description: Immutable main SHA used by the release plan
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-tag-${{ inputs.worker }}
  cancel-in-progress: false

jobs:
  create-tag:
    name: Create ${{ inputs.worker }}/v${{ inputs.target_version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.token.outputs.token }}

      - name: Install manifest tooling
        run: python3 -m pip install --quiet pyyaml

      - name: Validate Release Control dispatch
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/release_control_contract.py validate-dispatch
          --contract-version '${{ inputs.contract_version }}'
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'
          --mutating

      - name: Validate immutable release intent
        id: intent
        env:
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.target_version }}
          EXPECTED_CURRENT: ${{ inputs.expected_current_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKER" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(experimental|alpha|beta))?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          test -f "$WORKER/iii.worker.yaml"
          git diff --quiet "$SOURCE_SHA" HEAD -- "$WORKER" || {
            echo "::error::$WORKER changed after Release Control planned this release"
            exit 2
          }
          manifest=$(WORKER="$WORKER" python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, ".github/scripts")
          import _lib
          print(_lib.read_iii_worker_yaml(pathlib.Path(os.environ["WORKER"])).manifest or "")
          PY
          )
          test -n "$manifest"
          current=$(python3 .github/scripts/manifest_version.py read "$WORKER/$manifest")
          [[ "$current" == "$EXPECTED_CURRENT" ]] || {
            echo "::error::$WORKER version drifted: expected $EXPECTED_CURRENT, found $current"
            exit 2
          }
          maturity=$(python3 .github/scripts/manifest_version.py maturity "$VERSION")
          python3 .github/scripts/manifest_version.py check-history "$WORKER" "$VERSION"
          {
            echo "manifest=$manifest"
            echo "current=$current"
            echo "maturity=$maturity"
            echo "tag=${WORKER}/v${VERSION}"
          } >>"$GITHUB_OUTPUT"

      - name: Inspect existing tag
        id: existing
        env:
          TAG: ${{ steps.intent.outputs.tag }}
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.target_version }}
          CHANNEL: ${{ inputs.registry_tag }}
          EXPERIMENTAL: ${{ inputs.experimental }}
          OPERATION_ID: ${{ inputs.operation_id }}
          STEP_ID: ${{ inputs.step_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if ! git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "exists=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          annotation=$(git tag -l --format='%(contents)' "$TAG")
          for field in \
            "worker: $WORKER" "version: $VERSION" "release-contract: 3" \
            "operation-id: $OPERATION_ID" "step-id: $STEP_ID" "source-sha: $SOURCE_SHA" \
            "registry-tag: $CHANNEL" "experimental: $EXPERIMENTAL"; do
            grep -Fx "$field" <<<"$annotation" >/dev/null
          done
          echo "exists=true" >>"$GITHUB_OUTPUT"

      - name: Write exact version
        if: steps.existing.outputs.exists != 'true'
        env:
          WORKER: ${{ inputs.worker }}
          MANIFEST: ${{ steps.intent.outputs.manifest }}
          VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          python3 .github/scripts/manifest_version.py bump "$WORKER/$MANIFEST" --kind none --target "$VERSION" >/dev/null
          python3 .github/scripts/manifest_version.py verify "$WORKER/$MANIFEST" --expected "$VERSION"
          python3 .github/scripts/manifest_version.py sync-lock "$WORKER/$MANIFEST"

      - name: Commit exact version
        if: steps.existing.outputs.exists != 'true'
        env:
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.target_version }}
        run: |
          set -euo pipefail
          git config user.name "workers-ci[bot]"
          git config user.email "workers-ci[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "chore(${WORKER}): bump to v${VERSION}"
            git push origin HEAD:main
          fi

      - name: Create annotated release tag
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.intent.outputs.tag }}
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.target_version }}
          MATURITY: ${{ steps.intent.outputs.maturity }}
          CHANNEL: ${{ inputs.registry_tag }}
          EXPERIMENTAL: ${{ inputs.experimental }}
          OPERATION_ID: ${{ inputs.operation_id }}
          STEP_ID: ${{ inputs.step_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "Release $TAG

          worker: $WORKER
          version: $VERSION
          release-contract: 3
          operation-id: $OPERATION_ID
          step-id: $STEP_ID
          source-sha: $SOURCE_SHA
          maturity: $MATURITY
          registry-tag: $CHANNEL
          experimental: $EXPERIMENTAL
          "
          git push origin "$TAG"

      - name: Write factual result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TAG: ${{ steps.intent.outputs.tag }}
          MATURITY: ${{ steps.intent.outputs.maturity }}
          EXISTED: ${{ steps.existing.outputs.exists || 'false' }}
        run: |
          subject=$(jq -cn \
            --arg worker '${{ inputs.worker }}' --arg version '${{ inputs.target_version }}' \
            --arg source_sha '${{ inputs.source_sha }}' --arg tag "$TAG" \
            --arg channel '${{ inputs.registry_tag }}' \
            '{worker:$worker,version:$version,source_sha:$source_sha,tag:$tag,channel:$channel}')
          checks=$(jq -cn --arg status "$JOB_STATUS" '[{name:"create_tag",status:$status}]')
          effects=$(jq -cn --arg status "$JOB_STATUS" --arg existed "$EXISTED" --arg tag "$TAG" \
            '[{surface:"git_tag",status:(if $status == "success" then (if $existed == "true" then "unchanged" else "changed" end) else "failed" end),immutable_id:$tag}]')
          outputs=$(jq -cn --arg maturity "$MATURITY" '{maturity:$maturity}')
          python3 .github/scripts/release_control_contract.py write-result \
            --kind create_tag --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow create-tag.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects "$effects" --outputs "$outputs" \
            --output execution-result.json

      - name: Upload factual result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: execution-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: execution-result.json
          retention-days: 30
          if-no-files-found: error
