name: storage E2E
run-name: ${{ github.event_name == 'workflow_dispatch' && format('RC v3 · test · {0} · {1}', inputs.operation_id, inputs.step_id) || format('Test · storage_e2e · {0}', github.event_name) }}

on:
  pull_request:
    paths:
      - 'storage/**'
      - '.github/workflows/storage-e2e.yml'
  workflow_dispatch:
    inputs:
      contract_version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      operation_id:
        required: true
        type: string
      step_id:
        required: true
        type: string

concurrency:
  group: storage-e2e-${{ inputs.operation_id || inputs.source_sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  script-tests:
    name: Script self-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Validate Release Control dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/release_control_contract.py validate-dispatch
          --contract-version '${{ inputs.contract_version }}'
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'

      - name: Rewrite SSH to HTTPS for public deps
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: storage

      - name: Build worker
        run: cargo build --release --bin storage
        working-directory: storage

      - name: Install iii engine
        # script-tests/run.sh exercises the full preflight path of run-tests.sh,
        # including the engine-binary check. Without iii on PATH the --filter
        # and SIGINT tests bail early with "iii engine binary missing" instead
        # of exercising what they're meant to assert.
        run: |
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 5 \
            https://install.iii.dev/iii/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run script-tests
        run: ./script-tests/run.sh
        working-directory: storage/tests/e2e

  e2e:
    name: Harness (--providers=all)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Validate Release Control dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/release_control_contract.py validate-dispatch
          --contract-version '${{ inputs.contract_version }}'
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'

      - name: Rewrite SSH to HTTPS for public deps
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: storage

      - uses: actions/setup-node@v5
        with:
          # setup-node v5 auto-caches when package.json declares packageManager.
          # This step never cached; the repository is already over its cache budget.
          package-manager-cache: false
          node-version: '20'
          # No cache: harness has no committed package-lock.json (run-tests.sh
          # generates one via `npm install` at first run). setup-node@v4 with
          # `cache: 'npm'` against a missing lockfile is a hard failure, not a
          # warning. ~10s slower per run; revisit if we ever commit a lockfile.

      - name: Install iii engine
        run: |
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 5 \
            https://install.iii.dev/iii/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify engine + docker
        run: |
          iii --version
          docker --version
          docker compose version

      - name: Pull docker images
        run: docker compose --profile cloud pull --quiet
        working-directory: storage/tests/e2e

      - name: Run harness (--providers=all)
        working-directory: storage/tests/e2e
        run: ./run-tests.sh --providers=all --trigger-providers=local,s3 --no-pull

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: storage-e2e-reports
          path: |
            storage/tests/e2e/reports/
          retention-days: 7

  evidence:
    needs: [script-tests, e2e]
    if: github.event_name == 'workflow_dispatch' && always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.sha }}" }
      - run: |
          subject=$(jq -cn --arg source_sha '${{ inputs.source_sha }}' '{source_sha:$source_sha}')
          checks=$(jq -cn --arg scripts '${{ needs.script-tests.result }}' --arg e2e '${{ needs.e2e.result }}' \
            '[{name:"storage_script_tests",status:$scripts},{name:"storage_e2e",status:$e2e}]')
          python3 .github/scripts/release_control_contract.py write-result --kind test --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' --workflow storage-e2e.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects '[]' --outputs '{}' --output execution-result.json
      - uses: actions/upload-artifact@v6
        with:
          name: execution-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: execution-result.json
          retention-days: 30
