name: Release Stable Publish
run-name: RC stable publish · ${{ inputs.worker }} · ${{ fromJSON(inputs.identity).operation_id }} · ${{ fromJSON(inputs.identity).step_id }} · ${{ fromJSON(inputs.identity).dispatch_nonce }}

on:
  workflow_dispatch:
    inputs:
      identity: {required: true, type: string}
      worker: {required: true, type: string}
      source_sha: {required: true, type: string}
      prepared_sha: {required: true, type: string}
      candidate_version: {required: true, type: string}
      stable_version: {required: true, type: string}
      descriptor_sha256: {required: true, type: string}
      prepared_run_id: {required: true, type: string}
      expected_latest_version: {required: true, type: string}

env:
  RELEASE_IDENTITY: ${{ inputs.identity }}
  OPERATION_ID: ${{ fromJSON(inputs.identity).operation_id }}
  STEP_ID: ${{ fromJSON(inputs.identity).step_id }}
  RELEASE_INTENT_ID: ${{ fromJSON(inputs.identity).release_intent_id }}
  CANDIDATE_ID: ${{ fromJSON(inputs.identity).candidate_id }}
  ATTEMPT_ID: ${{ fromJSON(inputs.identity).attempt_id }}
  DISPATCH_NONCE: ${{ fromJSON(inputs.identity).dispatch_nonce }}
  PLAN_HASH: ${{ fromJSON(inputs.identity).plan_hash }}
  WORKER: ${{ inputs.worker }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  PREPARED_SHA: ${{ inputs.prepared_sha }}
  CANDIDATE_VERSION: ${{ inputs.candidate_version }}
  STABLE_VERSION: ${{ inputs.stable_version }}
  DESCRIPTOR_SHA256: ${{ inputs.descriptor_sha256 }}
  PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
  EXPECTED_LATEST_VERSION: ${{ inputs.expected_latest_version }}

permissions: {}

concurrency:
  group: release-stable-${{ inputs.worker }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: workers-release-linux-8core
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-prepared-${{ env.CANDIDATE_ID }}
          path: release-prepared
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
      - name: Authorize same immutable candidate
        env:
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
        run: |
          set -euo pipefail
          test "$(jq -r .version release-prepared/release-descriptor.json)" = "$CANDIDATE_VERSION"
          test "$(jq -r .descriptor_sha256 release-prepared/release-descriptor.json)" = "$DESCRIPTOR_SHA256"
          python3 .github/scripts/release_interface.py verify-evidence --descriptor release-prepared/release-descriptor.json --evidence release-prepared/release-evidence.json
          python3 .github/scripts/release_control_contract.py validate-identity --identity "$RELEASE_IDENTITY"
          python3 .github/scripts/release_control_contract.py validate-dispatch --operation-id "$OPERATION_ID" --step-id "$STEP_ID" --dispatch-nonce "$DISPATCH_NONCE" --descriptor-sha256 "$DESCRIPTOR_SHA256" --plan-hash "$PLAN_HASH" --source-sha "$SOURCE_SHA" --prepared-sha "$PREPARED_SHA" --mutating
          python3 .github/scripts/release_control_contract.py authorize-dispatch --api-url "$RELEASE_CONTROL_API_URL" --repository '${{ github.repository }}' --operation-id "$OPERATION_ID" --step-id "$STEP_ID" --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' --workflow 'release-stable-publish.yml' --event '${{ github.event_name }}' --sha '${{ github.sha }}' --release-intent-id "$RELEASE_INTENT_ID" --candidate-id "$CANDIDATE_ID" --attempt-id "$ATTEMPT_ID" --dispatch-nonce "$DISPATCH_NONCE" --plan-hash "$PLAN_HASH" --worker "$WORKER" --source-sha "$SOURCE_SHA" --descriptor-sha256 "$DESCRIPTOR_SHA256"
      - name: CAS candidate version to latest
        id: promote
        env:
          API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED: ${{ inputs.expected_latest_version }}
        run: |
          set -euo pipefail
          mkdir -p effect-state
          printf '%s\n' unknown >effect-state/registry-before
          printf '%s\n' not_started >effect-state/registry-mutation
          printf '%s\n' unknown >effect-state/registry-after
          printf '%s\n' unknown >effect-state/github-before
          printf '%s\n' not_started >effect-state/github-mutation
          printf '%s\n' unknown >effect-state/github-after

          expected=null
          [[ "$EXPECTED" == none ]] || expected=$(jq -cn --arg value "$EXPECTED" '$value')
          resolve=$(jq -nc --arg worker "$WORKER" '{worker:$worker,version:"latest"}')
          status=$(curl -sS -o latest-before.json -w '%{http_code}' -H 'Content-Type: application/json' \
            -X POST 'https://api.workers.iii.dev/resolve' --data "$resolve")
          if [[ "$status" == 200 ]]; then
            actual=$(jq -er .root.version latest-before.json)
            if [[ "$actual" == "$CANDIDATE_VERSION" ]]; then
              printf '%s\n' present >effect-state/registry-before
            elif [[ "$EXPECTED" != none && "$actual" == "$EXPECTED" ]]; then
              printf '%s\n' absent >effect-state/registry-before
            else
              echo "latest changed outside the authorized compare-and-swap: $actual"
              exit 1
            fi
          elif [[ "$status" == 404 && "$EXPECTED" == none ]]; then
            printf '%s\n' absent >effect-state/registry-before
          else
            cat latest-before.json
            echo "cannot prove Registry latest precondition"
            exit 1
          fi

          registry_plan=$(python3 .github/scripts/release_effects.py plan \
            --before "$(cat effect-state/registry-before)")
          if [[ "$registry_plan" == mutate ]]; then
            printf '%s\n' started >effect-state/registry-mutation
            body=$(jq -cn --arg version "$CANDIDATE_VERSION" --argjson expected "$expected" \
              '{version:$version,expected_current_version:$expected}')
            status=$(curl -sS -o response.json -w '%{http_code}' -H "X-API-Key: $API_KEY" \
              -H 'Content-Type: application/json' -X PUT \
              "https://api.workers.iii.dev/w/$WORKER/tags/latest" --data "$body")
            cat response.json
            test "$status" = 200
            printf '%s\n' completed >effect-state/registry-mutation
          elif [[ "$registry_plan" != skip ]]; then
            echo "Registry latest precondition is unknown"
            exit 1
          fi
          curl -fsS -H 'Content-Type: application/json' -X POST \
            'https://api.workers.iii.dev/resolve' --data "$resolve" >latest-after.json
          test "$(jq -r .root.version latest-after.json)" = "$CANDIDATE_VERSION"
          printf '%s\n' present >effect-state/registry-after

          tag="$WORKER/v$CANDIDATE_VERSION"
          gh release view "$tag" --json isPrerelease >github-before.json
          if [[ "$(jq -r .isPrerelease github-before.json)" == false ]]; then
            printf '%s\n' present >effect-state/github-before
          else
            printf '%s\n' absent >effect-state/github-before
          fi
          github_plan=$(python3 .github/scripts/release_effects.py plan \
            --before "$(cat effect-state/github-before)")
          if [[ "$github_plan" == mutate ]]; then
            printf '%s\n' started >effect-state/github-mutation
            gh release edit "$tag" --prerelease=false --latest
            printf '%s\n' completed >effect-state/github-mutation
          elif [[ "$github_plan" != skip ]]; then
            echo "GitHub release state is unknown"
            exit 1
          fi
          gh release view "$tag" --json isPrerelease >github-after.json
          test "$(jq -r .isPrerelease github-after.json)" = false
          printf '%s\n' present >effect-state/github-after
      - name: Write result
        if: always()
        env:
          STATUS: ${{ steps.promote.outcome }}
        run: |
          set -euo pipefail
          outcome=succeeded; error=null
          if [[ "$STATUS" == cancelled ]]; then outcome=canceled; error='{"code":"stable_publish_canceled","category":"promotion","retryable":true,"message":"latest CAS was canceled"}'
          elif [[ "$STATUS" != success ]]; then outcome=failed; error='{"code":"stable_publish_failed","category":"promotion","retryable":true,"message":"latest CAS did not complete"}'; fi
          artifacts='[]'
          if [[ -f release-prepared/release-evidence.json ]]; then artifacts=$(jq -c '[.artifacts[] | del(.unit)]' release-prepared/release-evidence.json); fi
          probe() { [[ -s "effect-state/$1" ]] && cat "effect-state/$1" || printf '%s\n' "$2"; }
          registry_state=$(python3 .github/scripts/release_effects.py classify \
            --before "$(probe registry-before unknown)" \
            --mutation "$(probe registry-mutation not_started)" \
            --after "$(probe registry-after unknown)")
          github_state=$(python3 .github/scripts/release_effects.py classify \
            --before "$(probe github-before unknown)" \
            --mutation "$(probe github-mutation not_started)" \
            --after "$(probe github-after unknown)")
          effects=$(jq -nc --arg version "$CANDIDATE_VERSION" --arg registry_state "$registry_state" --arg github_state "$github_state" '[{surface:"registry-latest",state:$registry_state,after:$version},{surface:"github-release",state:$github_state,immutable_id:$version}]')
          python3 .github/scripts/release_control_contract.py write-result --repository '${{ github.repository }}' --operation-id "$OPERATION_ID" --step-id "$STEP_ID" --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' --workflow 'release-stable-publish.yml' --event '${{ github.event_name }}' --sha '${{ github.sha }}' --release-intent-id "$RELEASE_INTENT_ID" --candidate-id "$CANDIDATE_ID" --attempt-id "$ATTEMPT_ID" --dispatch-nonce "$DISPATCH_NONCE" --plan-hash "$PLAN_HASH" --worker "$WORKER" --phase stable_publish --source-sha "$SOURCE_SHA" --prepared-sha "$PREPARED_SHA" --candidate-version "$CANDIDATE_VERSION" --stable-version "$STABLE_VERSION" --descriptor-sha256 "$DESCRIPTOR_SHA256" --outcome "$outcome" --effects "$effects" --artifacts-json "$artifacts" --error-json "$error" --output release-result.json
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-result-${{ env.CANDIDATE_ID }}-${{ env.STEP_ID }}-attempt-${{ github.run_attempt }}
          path: release-result.json
          retention-days: 30
          if-no-files-found: error
      - if: always()
        env:
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
        run: python3 .github/scripts/release_control_contract.py post-result --api-url "$RELEASE_CONTROL_API_URL" --result release-result.json
