name: Deployment Prepare
run-name: Deployment prepare · ${{ inputs.worker }} · ${{ fromJSON(inputs.identity).deployment_batch_id }} · ${{ fromJSON(inputs.identity).deployment_target_id }} · ${{ fromJSON(inputs.identity).step_id }} · ${{ fromJSON(inputs.identity).dispatch_nonce }}

on:
  workflow_dispatch:
    inputs:
      identity: {required: true, type: string}
      worker: {required: true, type: string}
      target_version: {required: true, type: string}
      channel:
        required: true
        type: choice
        options: [next, latest]
      source_sha: {required: true, type: string}
      descriptor_sha256: {required: true, type: string}
      descriptor_run_id: {required: true, type: string}
      descriptor_artifact: {required: true, type: string}

env:
  DEPLOYMENT_IDENTITY: ${{ inputs.identity }}
  DEPLOYMENT_BATCH_ID: ${{ fromJSON(inputs.identity).deployment_batch_id }}
  DEPLOYMENT_TARGET_ID: ${{ fromJSON(inputs.identity).deployment_target_id }}
  STEP_ID: ${{ fromJSON(inputs.identity).step_id }}
  ATTEMPT_ID: ${{ fromJSON(inputs.identity).attempt_id }}
  DISPATCH_NONCE: ${{ fromJSON(inputs.identity).dispatch_nonce }}
  PLAN_HASH: ${{ fromJSON(inputs.identity).plan_hash }}
  WORKER: ${{ inputs.worker }}
  TARGET_VERSION: ${{ inputs.target_version }}
  DEPLOYMENT_CHANNEL: ${{ inputs.channel }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  DESCRIPTOR_SHA256: ${{ inputs.descriptor_sha256 }}
  DESCRIPTOR_RUN_ID: ${{ inputs.descriptor_run_id }}
  DESCRIPTOR_ARTIFACT: ${{ inputs.descriptor_artifact }}

permissions: {}

jobs:
  prepare:
    runs-on: workers-release-linux-8core
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      prepared_sha: ${{ steps.descriptor.outputs.prepared_sha }}
      matrix: ${{ steps.descriptor.outputs.matrix }}
      descriptor_artifact: ${{ steps.descriptor.outputs.artifact }}
      frontend_artifact: ${{ steps.descriptor.outputs.frontend_artifact }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Download Release Control-selected descriptor index
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ inputs.descriptor_artifact }}
          path: deployment-descriptor-index
          run-id: ${{ inputs.descriptor_run_id }}
          github-token: ${{ github.token }}

      - name: Select byte-exact descriptor from immutable index
        run: |
          set -euo pipefail
          [[ "$DESCRIPTOR_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test "$DESCRIPTOR_ARTIFACT" = "deployment-descriptor-index-$SOURCE_SHA"
          compiler_digest=$(jq -er .compiler.digest deployment-descriptor-index/deployment-descriptor-index.json)
          python3 .github/scripts/deployment_train.py select-descriptor \
            --index-dir deployment-descriptor-index \
            --worker "$WORKER" \
            --source-sha "$SOURCE_SHA" \
            --compiler-digest "$compiler_digest" \
            --descriptor-sha256 "$DESCRIPTOR_SHA256" \
            --out deployment-input/deployment-descriptor.json

      - name: Validate and authorize immutable dispatch
        env:
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
        run: |
          set -euo pipefail
          python3 .github/scripts/deployment_control_contract.py validate-identity --identity "$DEPLOYMENT_IDENTITY"
          python3 .github/scripts/deployment_control_contract.py validate-dispatch \
            --step-id "$STEP_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --descriptor-sha256 "$DESCRIPTOR_SHA256" \
            --plan-hash "$PLAN_HASH" \
            --source-sha "$SOURCE_SHA" \
            --mutating
          python3 .github/scripts/deployment_control_contract.py authorize-dispatch \
            --api-url "$RELEASE_CONTROL_API_URL" \
            --step-id "$STEP_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --deployment-batch-id "$DEPLOYMENT_BATCH_ID" \
            --deployment-target-id "$DEPLOYMENT_TARGET_ID" \
            --attempt-id "$ATTEMPT_ID" \
            --plan-hash "$PLAN_HASH" \
            --worker "$WORKER" \
            --source-sha "$SOURCE_SHA" \
            --target-version "$TARGET_VERSION" \
            --channel "$DEPLOYMENT_CHANNEL" \
            --descriptor-sha256 "$DESCRIPTOR_SHA256" \
            --repository '${{ github.repository }}' \
            --workflow 'deploy-prepare.yml' \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --event '${{ github.event_name }}' \
            --sha '${{ github.sha }}'

      - name: Validate immutable source against selected descriptor
        run: |
          set -euo pipefail
          python3 .github/scripts/deployment_train.py prepare \
            --worker "$WORKER" \
            --source-sha "$SOURCE_SHA" \
            --target-version "$TARGET_VERSION" \
            --channel "$DEPLOYMENT_CHANNEL" \
            --descriptor-sha256 "$DESCRIPTOR_SHA256" \
            --descriptor deployment-input/deployment-descriptor.json

      - name: Resolve descriptor-owned frontend metadata
        id: frontend
        run: >-
          python3 .github/scripts/deployment_train.py frontend-metadata
          --descriptor deployment-input/deployment-descriptor.json
          --github-output "$GITHUB_OUTPUT"

      - name: Install descriptor-pinned pnpm
        if: steps.frontend.outputs.count != '0'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: ${{ steps.frontend.outputs.package_manager_version }}

      - name: Install descriptor-pinned Node.js
        if: steps.frontend.outputs.count != '0'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ steps.frontend.outputs.runtime_version }}

      - name: Resolve frontend pnpm store
        if: steps.frontend.outputs.count != '0'
        id: frontend-pnpm
        run: echo "store_path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache descriptor-pinned frontend dependencies
        if: steps.frontend.outputs.count != '0'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.frontend-pnpm.outputs.store_path }}
          key: deployment-frontend-${{ steps.frontend.outputs.package_manager_version }}-node${{ steps.frontend.outputs.runtime_version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.frontend.outputs.lock_sha256 }}

      - name: Build embedded frontends once
        run: >-
          python3 .github/scripts/deployment_train.py build-frontends
          --descriptor deployment-input/deployment-descriptor.json
          --out .release-frontend

      - name: Export descriptor
        id: descriptor
        run: |
          set -euo pipefail
          {
            echo "prepared_sha=$(jq -r .source_sha deployment-input/deployment-descriptor.json)"
            echo "matrix=$(python3 .github/scripts/deployment_train.py matrix --descriptor deployment-input/deployment-descriptor.json)"
            echo "artifact=deployment-descriptor-$DEPLOYMENT_TARGET_ID-$STEP_ID"
            echo "frontend_artifact=deployment-frontend-$DEPLOYMENT_TARGET_ID-$STEP_ID"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-descriptor-${{ env.DEPLOYMENT_TARGET_ID }}-${{ env.STEP_ID }}
          path: deployment-input/deployment-descriptor.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-frontend-${{ env.DEPLOYMENT_TARGET_ID }}-${{ env.STEP_ID }}
          path: .release-frontend/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  build:
    needs: prepare
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_deploy-build.yml
    with:
      worker: ${{ inputs.worker }}
      prepared_sha: ${{ needs.prepare.outputs.prepared_sha }}
      descriptor_artifact: ${{ needs.prepare.outputs.descriptor_artifact }}
      frontend_artifact: ${{ needs.prepare.outputs.frontend_artifact }}
      target: ${{ matrix.target }}
      unit: ${{ matrix.unit }}
      kind: ${{ matrix.kind }}
      runner: ${{ matrix.runner }}

  assemble:
    needs: [prepare, build]
    runs-on: workers-release-linux-8core
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.prepared_sha }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.prepare.outputs.descriptor_artifact }}
          path: deployment-input

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-build-${{ inputs.worker }}-*
          path: release-builds

      - name: Assemble immutable release
        run: |
          set -euo pipefail
          python3 .github/scripts/deployment_train.py assemble \
            --descriptor deployment-input/deployment-descriptor.json \
            --artifacts-dir release-builds \
            --out deploy-prepared

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-assembled-${{ env.DEPLOYMENT_TARGET_ID }}
          path: deploy-prepared/
          if-no-files-found: error
          retention-days: 7

  interface:
    needs: [prepare, assemble]
    runs-on: workers-release-linux-8core
    permissions:
      actions: read
      contents: read
    steps:
      # Use the workflow implementation selected by this run, while all worker
      # bytes and their runtime contract come from the immutable prepared artifact.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: deployment-assembled-${{ env.DEPLOYMENT_TARGET_ID }}
          path: deploy-prepared

      - name: Resolve descriptor-bound capture configuration
        id: capture_source
        run: |
          set -euo pipefail
          echo "required=$(jq -r '.runtime.interface_config != null' deploy-prepared/deployment-descriptor.json)" >> "$GITHUB_OUTPUT"
          echo "path=$(jq -er '.source.path + "/config.collect.yaml"' deploy-prepared/deployment-descriptor.json)" >> "$GITHUB_OUTPUT"

      # Capture-only configuration is hashed into the descriptor and read from
      # the same immutable source SHA as the prepared artifact.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.capture_source.outputs.required == 'true'
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.prepared_sha }}
          path: capture-source
          sparse-checkout: ${{ steps.capture_source.outputs.path }}
          sparse-checkout-cone-mode: false

      - name: Stage immutable bytes for interface capture
        id: interface
        run: >-
          python3 .github/scripts/deployment_interface.py stage
          --descriptor deploy-prepared/deployment-descriptor.json
          --prepared deploy-prepared/prepared-artifacts.json
          --source-root capture-source
          --out interface-work/stage.json
          --github-output "$GITHUB_OUTPUT"

      - name: Install current iii runtime
        if: steps.interface.outputs.interface_capture == 'required'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
            https://install.iii.dev/iii/main/install.sh -o /tmp/install-iii.sh
          sh /tmp/install-iii.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.iii/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.iii/bin:$PATH"
          iii --version

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.interface.outputs.kind == 'javascript-bundle' && steps.interface.outputs.interface_capture == 'required'
        with:
          node-version: ${{ steps.interface.outputs.runtime_version }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.interface.outputs.kind == 'python-bundle' && steps.interface.outputs.interface_capture == 'required'
        with:
          python-version: ${{ steps.interface.outputs.runtime_version }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        if: steps.interface.outputs.kind == 'python-bundle' && steps.interface.outputs.interface_capture == 'required'
        with:
          version: ${{ steps.interface.outputs.package_manager_version }}
          enable-cache: false

      - name: Install OCI capture tooling
        if: steps.interface.outputs.kind == 'oci-image' && steps.interface.outputs.interface_capture == 'required'
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Collect interface registration from immutable artifact
        env:
          INTERFACE_CAPTURE: ${{ steps.interface.outputs.interface_capture }}
          KIND: ${{ steps.interface.outputs.kind }}
        run: |
          set -euo pipefail
          if [[ "$INTERFACE_CAPTURE" == skipped ]]; then
            python3 .github/scripts/deployment_interface.py snapshot \
              --descriptor deploy-prepared/deployment-descriptor.json \
              --prepared deploy-prepared/prepared-artifacts.json \
              --out deploy-prepared/deployment-interface.json
            python3 .github/scripts/deployment_interface.py build-evidence \
              --descriptor deploy-prepared/deployment-descriptor.json \
              --prepared deploy-prepared/prepared-artifacts.json \
              --interface deploy-prepared/deployment-interface.json \
              --out deploy-prepared/deployment-evidence.json
            exit 0
          fi

          engine_pid=''
          worker_pid=''
          container_name=''
          image_name=''
          cleanup() {
            if [[ -n "$container_name" ]]; then docker rm -f "$container_name" >/dev/null 2>&1 || true; fi
            if [[ -n "$image_name" ]]; then docker image rm "$image_name" >/dev/null 2>&1 || true; fi
            if [[ -n "$worker_pid" ]]; then kill -- "-$worker_pid" >/dev/null 2>&1 || true; fi
            if [[ -n "$engine_pid" ]]; then kill -- "-$engine_pid" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          engine_port=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
          engine_url="ws://127.0.0.1:$engine_port"
          printf 'workers:\n  - name: iii-worker-manager\n    config:\n      host: 127.0.0.1\n      port: %s\n' "$engine_port" >interface-work/engine.yaml
          setsid iii --config interface-work/engine.yaml --no-update-check >interface-work/engine.log 2>&1 &
          engine_pid=$!
          for _ in $(seq 1 60); do
            kill -0 "$engine_pid" 2>/dev/null || { cat interface-work/engine.log; exit 1; }
            iii trigger --port "$engine_port" 'engine::workers::list' --json '{}' >/dev/null 2>&1 && break
            sleep 1
          done
          iii trigger --port "$engine_port" 'engine::workers::list' --json '{}' >interface-work/workers-baseline.json
          iii trigger --port "$engine_port" 'engine::triggers::list' --json '{"include_internal":false}' >interface-work/triggers-baseline.json

          if [[ "$KIND" == oci-image ]]; then
            container_name="deployment-interface-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            image_name="$container_name:prepared"
            oci_archive=$(jq -er .oci_archive interface-work/stage.json)
            sudo skopeo copy "oci-archive:$oci_archive" "docker-daemon:$image_name"
            docker_env=(--env "III_URL=$engine_url")
            while IFS= read -r encoded; do
              docker_env+=(--env "$(printf '%s' "$encoded" | base64 --decode)")
            done < <(jq -r '.environment | to_entries[] | (.key + "=" + .value) | @base64' interface-work/stage.json)
            docker run --rm --network host --name "$container_name" "${docker_env[@]}" "$image_name" \
              >interface-work/worker.log 2>&1 &
            worker_pid=$!
          else
            setsid python3 .github/scripts/deployment_interface.py run-worker \
              --metadata interface-work/stage.json --engine-url "$engine_url" \
              --log interface-work/worker.log &
            worker_pid=$!
          fi

          export III_TRIGGER_PORT="$engine_port"
          python3 .github/scripts/collect_worker_interface.py \
            --worker "$WORKER" --out interface-work/worker-interface.json \
            --wait-seconds 600 \
            --trigger-types-baseline interface-work/triggers-baseline.json \
            --workers-baseline interface-work/workers-baseline.json
          python3 .github/scripts/collect_worker_interface.py \
            --assert-non-empty --assert-typed-schemas \
            --assert-file interface-work/worker-interface.json
          python3 .github/scripts/deployment_interface.py snapshot \
            --descriptor deploy-prepared/deployment-descriptor.json \
            --prepared deploy-prepared/prepared-artifacts.json \
            --interface interface-work/worker-interface.json \
            --out deploy-prepared/deployment-interface.json
          python3 .github/scripts/deployment_interface.py build-evidence \
            --descriptor deploy-prepared/deployment-descriptor.json \
            --prepared deploy-prepared/prepared-artifacts.json \
            --interface deploy-prepared/deployment-interface.json \
            --out deploy-prepared/deployment-evidence.json

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-prepared-${{ env.DEPLOYMENT_TARGET_ID }}
          path: deploy-prepared/
          if-no-files-found: error
          # Prepared bytes and their captured Registry interface must outlive
          # the candidate soak window so stable finalization reuses both.
          retention-days: 90

  report:
    if: always()
    needs: [prepare, build, assemble, interface]
    runs-on: workers-release-linux-8core
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        continue-on-error: true
        with:
          name: deployment-prepared-${{ env.DEPLOYMENT_TARGET_ID }}
          path: deploy-prepared

      - name: Write release result
        if: always()
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
          INTERFACE_RESULT: ${{ needs.interface.result }}
        run: |
          set -euo pipefail
          outcome=succeeded; error=null
          if [[ "$PREPARE_RESULT" == cancelled || "$BUILD_RESULT" == cancelled || "$ASSEMBLE_RESULT" == cancelled || "$INTERFACE_RESULT" == cancelled ]]; then
            outcome=canceled; error='{"code":"prepare_canceled","category":"build","retryable":true,"message":"release preparation was canceled"}'
          elif [[ "$PREPARE_RESULT" != success || "$BUILD_RESULT" != success || "$ASSEMBLE_RESULT" != success || "$INTERFACE_RESULT" != success ]]; then
            outcome=failed; error='{"code":"prepare_failed","category":"build","retryable":true,"message":"release preparation did not complete"}'
          fi
          artifacts='[]'
          if [[ -f deploy-prepared/deployment-evidence.json ]]; then artifacts=$(jq -c '[.artifacts[] | del(.unit)]' deploy-prepared/deployment-evidence.json); fi
          state=absent; [[ "$outcome" == succeeded ]] && state=present
          effects=$(jq -nc --arg id "$SOURCE_SHA" --arg state "$state" '[{surface:"source-snapshot",state:$state,immutable_id:$id}]')
          python3 .github/scripts/deployment_control_contract.py write-result \
            --repository '${{ github.repository }}' \
            --step-id "$STEP_ID" \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --workflow 'deploy-prepare.yml' \
            --event '${{ github.event_name }}' \
            --sha '${{ github.sha }}' \
            --deployment-batch-id "$DEPLOYMENT_BATCH_ID" \
            --deployment-target-id "$DEPLOYMENT_TARGET_ID" \
            --attempt-id "$ATTEMPT_ID" \
            --dispatch-nonce "$DISPATCH_NONCE" \
            --plan-hash "$PLAN_HASH" \
            --worker "$WORKER" \
            --phase prepare \
            --source-sha "$SOURCE_SHA" \
            --prepared-sha "$SOURCE_SHA" \
            --target-version "$TARGET_VERSION" \
            --channel "$DEPLOYMENT_CHANNEL" \
            --descriptor-sha256 "$DESCRIPTOR_SHA256" \
            --outcome "$outcome" \
            --effects "$effects" \
            --artifacts-json "$artifacts" \
            --error-json "$error" \
            --output deployment-result.json

      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-result-${{ env.DEPLOYMENT_TARGET_ID }}-${{ env.STEP_ID }}-attempt-${{ github.run_attempt }}
          path: deployment-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Report byte-exact result to Release Control
        if: always()
        env:
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
        run: |
          python3 .github/scripts/deployment_control_contract.py post-result \
            --api-url "$RELEASE_CONTROL_API_URL" \
            --result deployment-result.json
