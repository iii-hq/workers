name: Rust dependency audit

on:
  pull_request:
    paths:
      - '**/Cargo.lock'
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: rust-dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.79.11
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit Rust lockfiles
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          lockfiles=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            while IFS= read -r -d '' lockfile; do
              [[ -f "$lockfile" ]] && lockfiles+=("$lockfile")
            done < <(git diff --name-only -z "$BASE_SHA...$HEAD_SHA" -- '**/Cargo.lock')
          else
            while IFS= read -r -d '' lockfile; do
              lockfiles+=("${lockfile#./}")
            done < <(find . -name Cargo.lock -not -path '*/target/*' -print0 | sort -z)
          fi

          if (( ${#lockfiles[@]} == 0 )); then
            echo "No Rust lockfiles selected."
            exit 0
          fi

          status=0
          first=1
          for lockfile in "${lockfiles[@]}"; do
            echo "::group::cargo audit --file $lockfile"
            if (( first )); then
              cargo audit --file "$lockfile" || status=1
              first=0
            else
              cargo audit --no-fetch --file "$lockfile" || status=1
            fi
            echo "::endgroup::"
          done

          echo "Audited ${#lockfiles[@]} lockfile(s)." >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
