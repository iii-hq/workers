name: Publish worker skills

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Comma-separated worker names, or "all"'
        required: true
        type: string
      registry_tag:
        description: 'Registry tag channel to publish skills to'
        required: true
        type: choice
        options:
          - latest
          - next
        default: latest

concurrency:
  group: publish-worker-skills-${{ inputs.registry_tag }}
  cancel-in-progress: false

jobs:
  setup:
    name: Parse workers
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.parse.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Build worker matrix
        id: parse
        env:
          WORKERS: ${{ inputs.workers }}
        run: |
          set -euo pipefail
          python3 .github/scripts/parse_publish_workers_input.py \
            --workers "$WORKERS"

  publish:
    name: Publish skills (${{ matrix.worker }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.setup.outputs.matrix) }}
    uses: ./.github/workflows/_publish-worker-skills.yml
    with:
      worker: ${{ matrix.worker }}
      version: ${{ inputs.registry_tag }}
    secrets:
      WORKERS_REGISTRY_API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}
