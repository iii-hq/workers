name: Publish exact worker skills
run-name: RC v3 · skills_publish · ${{ inputs.operation_id }} · ${{ inputs.step_id }}

on:
  workflow_dispatch:
    inputs:
      contract_version: { required: true, type: string }
      operation_id: { required: true, type: string }
      step_id: { required: true, type: string }
      worker: { required: true, type: string }
      version: { required: true, type: string }

permissions:
  contents: read

concurrency:
  group: publish-worker-skills-${{ inputs.worker }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Validate Release Control dispatch
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/release_control_contract.py validate-dispatch
          --contract-version '${{ inputs.contract_version }}'
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'
          --mutating

  publish:
    needs: guard
    uses: ./.github/workflows/_publish-worker-skills.yml
    with:
      worker: ${{ inputs.worker }}
      version: ${{ inputs.version }}
    secrets:
      WORKERS_REGISTRY_API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}

  evidence:
    needs: [guard, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Write factual result
        run: |
          subject=$(jq -cn --arg worker '${{ inputs.worker }}' --arg version '${{ inputs.version }}' '{worker:$worker,version:$version}')
          checks=$(jq -cn --arg status '${{ needs.publish.result }}' '[{name:"skills_publish",status:$status}]')
          effects=$(jq -cn --arg status '${{ needs.publish.result }}' \
            '[{surface:"registry_skills",status:(if $status == "success" then "changed" else $status end)}]')
          python3 .github/scripts/release_control_contract.py write-result \
            --kind skills_publish --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow publish-worker-skills.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects "$effects" --outputs '{}' --output execution-result.json
      - uses: actions/upload-artifact@v6
        with:
          name: execution-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: execution-result.json
          retention-days: 30
          if-no-files-found: error
