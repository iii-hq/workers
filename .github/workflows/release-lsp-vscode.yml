name: Publish exact LSP VS Code release
run-name: RC v3 · lsp_publish · ${{ inputs.operation_id }} · ${{ inputs.step_id }}

on:
  workflow_dispatch:
    inputs:
      contract_version:
        required: true
        type: string
      operation_id:
        required: true
        type: string
      step_id:
        required: true
        type: string
      source_tag_step_id:
        required: true
        type: string
      tag:
        required: true
        type: string
      targets:
        description: Exact JSON array of publish targets
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-lsp-vscode-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Validate Release Control dispatch
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/release_control_contract.py validate-dispatch
          --contract-version '${{ inputs.contract_version }}'
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'
          --mutating

      - name: Resolve tag
        id: resolve
        env:
          RAW_TAG: ${{ inputs.tag }}
          TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          TAG=$(echo "$RAW_TAG" | xargs)
          jq -e 'type == "array" and length > 0 and length == (unique | length) and all(.[]; . == "vscode-marketplace" or . == "openvsx" or . == "github-release")' <<<"$TARGETS" >/dev/null
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          annotation=$(git tag -l --format='%(contents)' "$TAG")
          grep -Fx 'release-contract: 3' <<<"$annotation" >/dev/null
          grep -Fx 'operation-id: ${{ inputs.operation_id }}' <<<"$annotation" >/dev/null
          grep -Fx 'step-id: ${{ inputs.source_tag_step_id }}' <<<"$annotation" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

      - name: Extract metadata from tag
        id: meta
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^lsp-vscode/v[0-9]+\.[0-9]+\.[0-9]+([-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid lsp-vscode release tag: $TAG"
            exit 1
          fi

          VERSION="${TAG#lsp-vscode/v}"

          if [[ "$VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::lsp-vscode release -- tag=$TAG version=$VERSION"

  package:
    name: Package VSIX
    needs: [setup]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lsp-vscode
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          # setup-node v5 auto-caches when package.json declares packageManager.
          # This step never cached; the repository is already over its cache budget.
          package-manager-cache: false
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Set extension version from release tag
        env:
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          npm version --no-git-tag-version --allow-same-version "$RELEASE_VERSION"

          ACTUAL_VERSION=$(node -p "require('./package.json').version")
          if [[ "$ACTUAL_VERSION" != "$RELEASE_VERSION" ]]; then
            echo "::error::Manifest version mismatch: expected ${RELEASE_VERSION}, got ${ACTUAL_VERSION}"
            exit 1
          fi

          echo "::notice::lsp-vscode package version set to ${ACTUAL_VERSION}"

      - name: Package VSIX
        run: npx @vscode/vsce package --out iii-lsp-${{ needs.setup.outputs.version }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: iii-lsp-vsix-${{ needs.setup.outputs.version }}
          path: lsp-vscode/iii-lsp-${{ needs.setup.outputs.version }}.vsix
          if-no-files-found: error

  publish-vscode:
    name: Publish VS Code Marketplace
    needs: [setup, package]
    if: contains(fromJSON(needs.setup.outputs.targets), 'vscode-marketplace')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lsp-vscode
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          # setup-node v5 auto-caches when package.json declares packageManager.
          # This step never cached; the repository is already over its cache budget.
          package-manager-cache: false
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@v7
        with:
          name: iii-lsp-vsix-${{ needs.setup.outputs.version }}
          path: lsp-vscode/dist

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --pat "$VSCE_PAT" --packagePath dist/iii-lsp-${{ needs.setup.outputs.version }}.vsix

  publish-openvsx:
    name: Publish OpenVSX
    needs: [setup, package]
    if: contains(fromJSON(needs.setup.outputs.targets), 'openvsx')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lsp-vscode
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          # setup-node v5 auto-caches when package.json declares packageManager.
          # This step never cached; the repository is already over its cache budget.
          package-manager-cache: false
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@v7
        with:
          name: iii-lsp-vsix-${{ needs.setup.outputs.version }}
          path: lsp-vscode/dist

      - name: Publish to OpenVSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish dist/iii-lsp-${{ needs.setup.outputs.version }}.vsix --pat "$OVSX_PAT"

  github-release:
    name: Upload GitHub Release
    needs: [setup, package]
    if: contains(fromJSON(needs.setup.outputs.targets), 'github-release')
    runs-on: ubuntu-latest
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v7
        with:
          name: iii-lsp-vsix-${{ needs.setup.outputs.version }}
          path: lsp-vscode/dist

      - name: Upload VSIX to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          name: lsp-vscode ${{ needs.setup.outputs.version }}
          draft: false
          prerelease: ${{ needs.setup.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: lsp-vscode/dist/iii-lsp-${{ needs.setup.outputs.version }}.vsix

  evidence:
    name: Record factual LSP publish effects
    needs: [setup, package, publish-vscode, publish-openvsx, github-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - name: Write factual result
        run: |
          subject=$(jq -cn --arg worker lsp-vscode --arg version '${{ needs.setup.outputs.version }}' --arg tag '${{ inputs.tag }}' \
            '{worker:$worker,version:$version,tag:$tag}')
          checks=$(jq -cn --arg package '${{ needs.package.result }}' '[{name:"package",status:$package}]')
          effects=$(jq -cn --arg vscode '${{ needs.publish-vscode.result }}' --arg openvsx '${{ needs.publish-openvsx.result }}' \
            --arg github '${{ needs.github-release.result }}' \
            '[{surface:"vscode_marketplace",status:$vscode},{surface:"openvsx",status:$openvsx},{surface:"github_release",status:$github}]')
          outputs=$(jq -cn --argjson targets '${{ inputs.targets }}' '{targets:$targets}')
          python3 .github/scripts/release_control_contract.py write-result \
            --kind lsp_publish --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow release-lsp-vscode.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects "$effects" \
            --outputs "$outputs" --output execution-result.json
      - uses: actions/upload-artifact@v6
        with:
          name: execution-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: execution-result.json
          retention-days: 30
          if-no-files-found: error
