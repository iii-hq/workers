name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  scripts-tests:
    name: .github/scripts tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet pytest pyyaml
      - run: pytest .github/scripts/tests/ -v

  # ──────────────────────────────────────────────────────────────
  # Discover: enumerate changed workers, read their iii.worker.yaml,
  # bucket them per language for the matrix jobs below.
  # ──────────────────────────────────────────────────────────────
  discover:
    name: Discover changed workers
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.bucket.outputs.rust }}
      node: ${{ steps.bucket.outputs.node }}
      python: ${{ steps.bucket.outputs.python }}
      all: ${{ steps.bucket.outputs.all }}
      source_changed: ${{ steps.bucket.outputs.source_changed }}
      vscode_changed: ${{ steps.bucket.outputs.vscode_changed }}
      any: ${{ steps.bucket.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute base ref
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF" || true
          echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"

      - name: Bucket changed workers
        id: bucket
        env:
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 .github/scripts/discover_changed_workers.py --base "$BASE"

  # ──────────────────────────────────────────────────────────────
  # PR gates: readme present, manifest version > main, iii.worker.yaml valid.
  # Runs once per changed worker (excluding lsp-vscode).
  # ──────────────────────────────────────────────────────────────
  pr-checks:
    name: "${{ matrix.worker }}: PR checks"
    needs: discover
    if: needs.discover.outputs.all != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.discover.outputs.all) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
        run: git fetch --no-tags --depth=1 origin "$BASE_REF"

      - name: Validate worker
        env:
          WORKER: ${{ matrix.worker }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || 'main' }}
          SOURCE_CHANGED: ${{ needs.discover.outputs.source_changed }}
        run: |
          set -euo pipefail
          pip install --quiet pyyaml
          python3 .github/scripts/validate_worker.py \
            --worker "$WORKER" \
            --base-ref "origin/$BASE_REF" \
            --source-changed "$SOURCE_CHANGED"

  # ──────────────────────────────────────────────────────────────
  # Rust per-worker lint + test
  # ──────────────────────────────────────────────────────────────
  rust:
    name: "${{ matrix.worker }}: rust lint + test"
    needs: discover
    if: needs.discover.outputs.rust != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.discover.outputs.rust) }}
    defaults:
      run:
        working-directory: ${{ matrix.worker }}
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite SSH to HTTPS for public deps
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.worker }} -> target

      # Workers that ship a Vite SPA embedded into the binary (e.g.
      # `console`) have a `build.rs` that calls `pnpm install + pnpm
      # build` inside `<worker>/web/`. Pre-build the dist here so the
      # cargo invocations below see a fresh bundle and short-circuit
      # the pnpm step. Detection is filesystem-based: workers without
      # a `web/package.json` skip all three steps cleanly.
      - name: Setup pnpm (workers with bundled web/)
        if: hashFiles(format('{0}/web/package.json', matrix.worker)) != ''
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node (workers with bundled web/)
        if: hashFiles(format('{0}/web/package.json', matrix.worker)) != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: ${{ matrix.worker }}/web/pnpm-lock.yaml

      - name: Pre-build SPA bundle
        if: hashFiles(format('{0}/web/package.json', matrix.worker)) != ''
        working-directory: ${{ matrix.worker }}/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

  # ──────────────────────────────────────────────────────────────
  # Interface boot smoke: build each changed Rust worker from source,
  # boot it against a live engine exactly as the registry-publish flow
  # does, and assert its interface is collectable & non-empty. This is
  # the PR-time guard for the class of failure that broke publish in
  # #104 (database/v0.2.6): the worker compiled and passed the 2s
  # liveness check but then crashed building its SQLite pool because
  # the default `sqlite:./data/iii.db` parent dir was missing — so
  # `Collect worker interface` timed out at release time, never on PRs.
  # Scoped to Rust workers (the binary-deploy bucket where this lives);
  # building from source means a clean checkout with no `data/` dir,
  # which is precisely the condition that triggered the crash.
  # ──────────────────────────────────────────────────────────────
  interface-smoke:
    name: "${{ matrix.worker }}: interface boot smoke"
    needs: discover
    if: needs.discover.outputs.rust != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.discover.outputs.rust) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install --quiet pyyaml

      # Some workers can't be interface-smoked: stdio servers (e.g. iii-lsp)
      # exit on stdin EOF while backgrounded, and pure discovery consumers
      # register no interface to collect. They opt out with
      # `interface_smoke: false` in iii.worker.yaml; every downstream step is
      # gated on this so the rest of the matrix is unaffected.
      - name: Check interface-smoke opt-out
        id: optout
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          skip=$(WORKER="$WORKER" python3 -c 'import os, sys, pathlib; sys.path.insert(0, ".github/scripts"); import _lib; m = _lib.read_iii_worker_yaml(pathlib.Path(os.environ["WORKER"])); print("true" if m.raw.get("interface_smoke") is False else "false")')
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [[ "$skip" == "true" ]]; then
            echo "::notice::$WORKER opts out of interface boot smoke (interface_smoke: false in iii.worker.yaml)"
          fi

      - name: Rewrite SSH to HTTPS for public deps
        if: steps.optout.outputs.skip != 'true'
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.optout.outputs.skip != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.optout.outputs.skip != 'true'
        with:
          workspaces: ${{ matrix.worker }} -> target

      # Workers that embed a Vite SPA into the binary (e.g. console) have a
      # build.rs that shells out to pnpm. Pre-build the dist so `cargo build`
      # short-circuits it — mirrors the `rust` job above.
      - name: Setup pnpm (workers with bundled web/)
        if: hashFiles(format('{0}/web/package.json', matrix.worker)) != ''
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node (workers with bundled web/)
        if: hashFiles(format('{0}/web/package.json', matrix.worker)) != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: ${{ matrix.worker }}/web/pnpm-lock.yaml

      - name: Pre-build SPA bundle
        if: hashFiles(format('{0}/web/package.json', matrix.worker)) != ''
        working-directory: ${{ matrix.worker }}/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Build with default features so we boot the same artifact that ships
      # in the GitHub Release (`_rust-binary.yml` builds default features).
      - name: Build worker binary
        if: steps.optout.outputs.skip != 'true'
        working-directory: ${{ matrix.worker }}
        run: cargo build

      - name: Install iii CLI + engine
        if: steps.optout.outputs.skip != 'true'
        env:
          # Must be a tag that still exists on iii-hq/iii (old releases get
          # pruned — 0.17.0 vanished and broke every boot smoke). Keep aligned
          # with the workers' iii-sdk pin.
          VERSION: '0.21.6'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL https://install.iii.dev/iii/main/install.sh -o /tmp/install-iii.sh
          sh /tmp/install-iii.sh
          {
            echo "$HOME/.local/bin"
            echo "$HOME/.iii/bin"
          } >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.iii/bin:$PATH"
          iii --version

      - name: Start III engine
        if: steps.optout.outputs.skip != 'true'
        run: |
          set -euo pipefail
          printf 'workers: []\n' > config.yaml
          iii --config config.yaml --no-update-check > iii-engine.log 2>&1 &
          echo "$!" > iii-engine.pid

          for _ in {1..60}; do
            if ! kill -0 "$(cat iii-engine.pid)" 2>/dev/null; then
              echo "::error::iii engine exited before becoming ready"
              cat iii-engine.log
              exit 1
            fi
            if iii trigger 'engine::workers::list' --json '{}' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::iii engine did not become ready"
          cat iii-engine.log || true
          exit 1

      - name: Snapshot engine baselines
        if: steps.optout.outputs.skip != 'true'
        run: |
          set -euo pipefail
          iii trigger 'engine::triggers::list' --json '{"include_internal": false}' \
            > trigger-types-baseline.json
          iii trigger 'engine::workers::list' --json '{}' > workers-baseline.json

      - name: Start worker from source
        if: steps.optout.outputs.skip != 'true'
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          # Resolve the cargo bin name the same way the publish flow does
          # (iii.worker.yaml `bin:`, falling back to the worker name).
          bin=$(WORKER="$WORKER" python3 -c 'import os, sys, pathlib; sys.path.insert(0, ".github/scripts"); import _lib; m = _lib.read_iii_worker_yaml(pathlib.Path(os.environ["WORKER"])); print(m.bin or m.name)')

          worker_log="worker-$WORKER.log"
          # Interface collection only needs the worker to connect and register
          # its functions/trigger types — not a working backend. A worker may
          # ship config.collect.yaml to boot a lighter copy for this. storage's
          # default config.yaml declares a local bucket and spawns a rustfs
          # sidecar that isn't available here, crashing startup with
          # LOCAL_BACKEND_BIN_NOT_FOUND; config.collect.yaml gives it a
          # sidecar-free config instead. Kept in lockstep with
          # _publish-registry.yml so this smoke check mirrors the publish boot.
          collect_args=()
          if [[ -f "$WORKER/config.collect.yaml" ]]; then
            echo "Using interface-collection config: $WORKER/config.collect.yaml"
            collect_args+=(--config ./config.collect.yaml)
          fi
          # Run from inside the worker dir — this is what makes a relative
          # default db path (sqlite:./data/iii.db) resolve against a clean
          # checkout with no data/ dir, reproducing the publish boot exactly.
          pushd "$WORKER" >/dev/null
          echo "Starting local worker: (cd $WORKER && ./target/debug/$bin ${collect_args[*]})"
          "./target/debug/$bin" "${collect_args[@]}" > "../$worker_log" 2>&1 &
          echo "$!" > ../worker.pid
          popd >/dev/null

          sleep 2
          if ! kill -0 "$(cat worker.pid)" 2>/dev/null; then
            echo "::error::$WORKER exited before interface collection"
            cat "$worker_log" || true
            exit 1
          fi

      - name: Collect worker interface
        if: steps.optout.outputs.skip != 'true'
        env:
          WORKER: ${{ matrix.worker }}
        run: |
          set -euo pipefail
          python3 .github/scripts/collect_worker_interface.py \
            --worker "$WORKER" \
            --out worker-interface.json \
            --wait-seconds 120 \
            --trigger-types-baseline trigger-types-baseline.json \
            --workers-baseline workers-baseline.json

      - name: Assert worker interface was collected
        if: steps.optout.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/collect_worker_interface.py \
            --assert-non-empty --assert-file worker-interface.json

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "::group::iii engine log"
          tail -n 200 iii-engine.log || true
          echo "::endgroup::"
          echo "::group::worker log"
          tail -n 200 "worker-${{ matrix.worker }}.log" || true
          echo "::endgroup::"

      - name: Stop processes
        if: always()
        run: |
          if [[ -f worker.pid ]]; then
            kill "$(cat worker.pid)" 2>/dev/null || true
          fi
          if [[ -f iii-engine.pid ]]; then
            kill "$(cat iii-engine.pid)" 2>/dev/null || true
          fi

  # ──────────────────────────────────────────────────────────────
  # Harness integration E2E (non-required): deterministic public-path
  # regression scenarios against the engine pinned in
  # harness/tests/e2e/engine.lock (see that crate's README; the
  # architecture spec lives in the iii repo). Runs on EVERY PR — the
  # suite is the harness stack's public-contract gate, and engine/worker
  # builds are cached. The engine is BUILT from the pinned source, never
  # downloaded; a cache hit is still re-hashed before use. "Non-required"
  # is enforced by branch protection, not continue-on-error.
  # ──────────────────────────────────────────────────────────────
  harness-integration:
    name: harness integration e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read and validate engine.lock
        id: lock
        run: |
          set -euo pipefail
          lock=harness/tests/e2e/engine.lock
          read_field() {
            local field=$1 values
            values=$(sed -n "s/^${field} = \"\\([^\"]*\\)\"$/\\1/p" "$lock")
            [[ $(printf '%s\n' "$values" | sed '/^$/d' | wc -l) -eq 1 ]] || {
              echo "engine.lock: $field must appear exactly once"
              exit 3
            }
            printf '%s' "$values"
          }
          invalid=$(sed \
            -e '/^[[:space:]]*$/d' \
            -e '/^[[:space:]]*#/d' \
            -e '/^\(repository\|revision\|package\|binary\) = "[^"]*"$/d' \
            "$lock")
          [[ -z "$invalid" ]] || {
            echo "engine.lock: unsupported or malformed entry"
            printf '%s\n' "$invalid"
            exit 3
          }
          repository=$(read_field repository)
          revision=$(read_field revision)
          package=$(read_field package)
          binary=$(read_field binary)
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "engine.lock: repository must be an owner/name slug"
            exit 3
          }
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo "engine.lock: revision must be 40-hex"; exit 3; }
          [[ "$package" =~ ^[A-Za-z0-9_-]+$ ]] || {
            echo "engine.lock: package contains unsupported characters"
            exit 3
          }
          [[ "$binary" =~ ^target/(debug|release)/[A-Za-z0-9_.-]+$ ]] || {
            echo "engine.lock: binary must be a target profile path"
            exit 3
          }
          {
            echo "repository=$repository"
            echo "revision=$revision"
            echo "package=$package"
            echo "binary=$binary"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout pinned engine source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.lock.outputs.repository }}
          ref: ${{ steps.lock.outputs.revision }}
          path: target/integration-engine-src

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: console/web/pnpm-lock.yaml

      - name: Cache engine build
        uses: actions/cache@v4
        with:
          path: target/integration-engine-src/target
          key: integration-engine-${{ runner.os }}-${{ runner.arch }}-${{ steps.lock.outputs.revision }}-${{ hashFiles('target/integration-engine-src/Cargo.lock') }}

      - name: Build pinned engine
        working-directory: target/integration-engine-src
        run: cargo build --locked --release -p ${{ steps.lock.outputs.package }}

      - name: Record engine digest
        id: engine
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/target/integration-engine-src/${{ steps.lock.outputs.binary }}"
          [[ -x "$bin" ]] || { echo "engine binary missing at $bin"; exit 3; }
          sha256sum "$bin"
          echo "bin=$bin" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harness -> target
            queue -> target
            session-manager -> target
            context-manager -> target
            iii-directory -> target
            console -> target

      - name: Integration crate unit tests
        run: cargo test --manifest-path harness/Cargo.toml -p harness-integration

      - name: Validate integration scenarios
        run: make -C harness integration-validate

      - name: Run integration scenarios
        run: make -C harness integration-e2e III_BIN="${{ steps.engine.outputs.bin }}"

      - name: Install Console web dependencies
        working-directory: console/web
        run: pnpm install --frozen-lockfile

      - name: Build Console web app
        working-directory: console/web
        run: pnpm build

      - name: Build Console worker
        run: cargo build --release --manifest-path console/Cargo.toml

      - name: Install Playwright Chromium
        working-directory: console/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck Console E2E tests
        working-directory: console/web
        run: pnpm typecheck:e2e

      - name: Run Console Playwright scenarios
        working-directory: console/web
        env:
          III_BIN: ${{ steps.engine.outputs.bin }}
          HARNESS_INTEGRATION_BIN: ${{ github.workspace }}/harness/target/release/harness-integration
          HARNESS_BIN: ${{ github.workspace }}/harness/target/release/harness
          CONSOLE_BIN: ${{ github.workspace }}/console/target/release/console
          QUEUE_BIN: ${{ github.workspace }}/queue/target/release/queue
          III_DIRECTORY_BIN: ${{ github.workspace }}/iii-directory/target/release/iii-directory
          SESSION_MANAGER_BIN: ${{ github.workspace }}/session-manager/target/release/session-manager
          CONTEXT_MANAGER_BIN: ${{ github.workspace }}/context-manager/target/release/context-manager
          CONSOLE_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/target/console-e2e
        run: pnpm test:e2e

      - name: Verify integration report links
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(target/integration/*/execution.json)
          ((${#reports[@]} > 0)) || { echo "no execution reports found"; exit 3; }
          for execution in "${reports[@]}"; do
            run_dir=$(dirname "$execution")
            result_path=$(jq -er '.result_path' "$execution")
            [[ "$result_path" == "result.json" ]] || {
              echo "$execution: unexpected result_path $result_path"
              exit 3
            }
            expected=$(jq -er '.result_sha256' "$execution")
            actual=$(sha256sum "$run_dir/$result_path" | cut -d' ' -f1)
            [[ "$actual" == "$expected" ]] || {
              echo "$execution: result digest mismatch"
              exit 3
            }
          done

      - name: Upload compact results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            target/integration/*/result.json
            target/integration/*/execution.json
            target/integration/*/teardown.json
          if-no-files-found: ignore

      - name: Upload full non-pass artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: target/integration/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Console E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-e2e-artifacts
          path: target/console-e2e/
          retention-days: 14
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────
  # Node per-worker lint (biome) + test
  # ──────────────────────────────────────────────────────────────
  node:
    name: "${{ matrix.worker }}: node lint + test"
    needs: discover
    if: needs.discover.outputs.node != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.discover.outputs.node) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ matrix.worker }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Biome lint
        run: npx --yes @biomejs/biome@2.4.10 ci ${{ matrix.worker }}

      - name: Run tests
        if: hashFiles(format('{0}/tests/**', matrix.worker)) != ''
        working-directory: ${{ matrix.worker }}
        run: npm test

  # ──────────────────────────────────────────────────────────────
  # Python per-worker lint (ruff) + test (pytest)
  # ──────────────────────────────────────────────────────────────
  python:
    name: "${{ matrix.worker }}: python lint + test"
    needs: discover
    if: needs.discover.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.discover.outputs.python) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff + pytest
        run: pip install --quiet ruff pytest

      - name: Ruff lint
        run: ruff check ${{ matrix.worker }}

      - name: Ruff format check
        run: ruff format --check ${{ matrix.worker }}

      - name: Install worker
        working-directory: ${{ matrix.worker }}
        run: pip install -e ".[dev]" || pip install -e .

      - name: Run pytest
        if: hashFiles(format('{0}/tests/**', matrix.worker)) != ''
        working-directory: ${{ matrix.worker }}
        run: pytest -q

  # ──────────────────────────────────────────────────────────────
  # lsp-vscode: special-case (VS Code extension, not a standard worker)
  # ──────────────────────────────────────────────────────────────
  lsp-vscode:
    name: "lsp-vscode: lint + test"
    needs: discover
    if: needs.discover.outputs.vscode_changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lsp-vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Package check (dry run)
        run: npm run package:check
