name: Harness E2E Main

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: harness-e2e-main
  cancel-in-progress: true

jobs:
  changes:
    name: Discover E2E changes
    runs-on: ubuntu-latest
    outputs:
      e2e_changed: ${{ steps.discover.outputs.e2e_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check whether the E2E stack changed
        id: discover
        env:
          BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 .github/scripts/discover_changed_workers.py \
            --base "$BASE" \
            --head "$GITHUB_SHA"

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e_changed == 'true'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/_harness-e2e.yml
    with:
      runs: 1
      max_parallel: 2
      benchmark_lane: main
      coverage: true
      subjects: ${{ vars.HARNESS_E2E_SUBJECTS || '[{"id":"anthropic-sonnet","model":"claude-sonnet-4-6","provider":"anthropic"}]' }}
      judge_model: ${{ vars.HARNESS_E2E_JUDGE_MODEL || 'claude-sonnet-4-6' }}
      judge_provider: ${{ vars.HARNESS_E2E_JUDGE_PROVIDER || 'anthropic' }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      zai_api_key: ${{ secrets.ZAI_API_KEY }}
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
