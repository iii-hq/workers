name: Memory E2E on release

# Release Control creates one GitHub Release per version it publishes to the
# Registry. A memory release runs harness-e2e's `memory` and `memory-learning`
# suites on its stacks/memory.yaml with that published version, so every memory
# version gets a measured verdict. It warns and never gates: the release is
# already out. A manual dispatch measures any published version.
#
# The gain arms run harness-e2e's `memory-gain` suite on the memory, memory-off
# and memory-consolidated stacks for each model, and one report compares them:
# how much better each class of case goes with memory than without it. The
# report is advisory; it is what a person reads before turning the learned-rule
# and verify-tier changes on by default. Releases measure deepseek-flash, whose
# key the executor holds; another model runs when a dispatch names it, with its
# provider's key in the executor, or locally (harness-e2e README, "Memory gain").
#
# A memory-consolidate release runs the gain arms only. Every run pins both
# versions, the released one and the newest release of the other worker, and
# the report names them. A memory and a memory-consolidate released together
# start one run each.
#
# A release event runs this file as it exists at the tagged commit, so a
# release of a commit that predates this workflow does not trigger it;
# dispatch it by hand for that version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published memory version to measure (e.g. 0.2.22); empty takes the newest memory release
        required: false
      consolidate_version:
        description: >-
          Published memory-consolidate version the memory-consolidated arm
          measures; empty takes the newest memory-consolidate release. Given
          without `version`, only the gain arms run.
        required: false
      models:
        description: >-
          JSON list of provider/model subjects for the gain arms; empty runs
          ["deepseek/deepseek-flash"]. Each provider's key must be in the
          harness-e2e executor.
        required: false
      extraction_model:
        description: >-
          provider::model memory extracts with on the gain arms; empty keeps each
          stack's deepseek::deepseek-flash. Its provider must be deepseek, zai or
          the subject's.
        required: false

permissions: {}

jobs:
  version:
    name: Name the published versions
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.event.release.tag_name, 'memory/v')
      || startsWith(github.event.release.tag_name, 'memory-consolidate/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.version.outputs.versions }}
      consolidated: ${{ steps.version.outputs.consolidated }}
    steps:
      - name: Name the published versions
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
          CONSOLIDATE_INPUT: ${{ inputs.consolidate_version }}
        run: |
          # The newest release of a worker, from its release tags.
          newest() {
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/$1/v" --paginate -q '.[].ref' \
              | sed "s|^refs/tags/$1/v||" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1
          }
          memory="$INPUT"
          consolidate="$CONSOLIDATE_INPUT"
          case "$TAG" in
            memory-consolidate/v*) consolidate="${TAG#memory-consolidate/v}" ;;
            memory/v*) memory="${TAG#memory/v}" ;;
          esac
          memory="${memory:-$(newest memory)}"
          consolidate="${consolidate:-$(newest memory-consolidate)}"
          for version in "$memory" "$consolidate"; do
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::not a released version: '${version}' (memory '${memory}', memory-consolidate '${consolidate}')"
              exit 1
            fi
          done
          echo "versions={\"memory\":\"${memory}\"}" >> "$GITHUB_OUTPUT"
          echo "consolidated={\"memory\":\"${memory}\",\"memory-consolidate\":\"${consolidate}\"}" >> "$GITHUB_OUTPUT"

  memory-e2e:
    name: memory e2e (${{ matrix.suite }})
    needs: version
    # A memory-consolidate release, or a dispatch naming only its version, changed no memory.
    if: >-
      !startsWith(github.event.release.tag_name, 'memory-consolidate/v')
      && !(inputs.consolidate_version != '' && inputs.version == '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [memory, memory-learning]
    steps:
      - name: Mint a token that can run iii-hq/harness-e2e
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}
          owner: iii-hq
          repositories: harness-e2e
          permission-actions: write

      - name: Run the ${{ matrix.suite }} suite on the published memory
        id: e2e
        uses: iii-hq/harness-e2e/.github/actions/verify-stack@36c41f00bf0b23919b82e75ab72c86aec101f485
        with:
          token: ${{ steps.app.outputs.token }}
          versions: ${{ needs.version.outputs.versions }}
          suite: ${{ matrix.suite }}
          stack: memory

      - name: Turn red when the suite did not pass
        if: steps.e2e.outputs.status != 'passed'
        env:
          SUITE: ${{ matrix.suite }}
          SUMMARY: ${{ steps.e2e.outputs.summary }}
        run: |
          echo "::warning::Memory E2E (${SUITE}): ${SUMMARY:-no verdict}"
          exit 1

  # One arm per model and stack. The memory-off arm fails its injection gates
  # by design, so an arm's status says nothing here: the report compares them.
  memory-gain:
    name: memory gain (${{ matrix.model }}, ${{ matrix.stack }})
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        model: ${{ fromJSON(inputs.models || '["deepseek/deepseek-flash"]') }}
        stack: [memory, memory-off, memory-consolidated]
    steps:
      - name: Mint a token that can run iii-hq/harness-e2e
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}
          owner: iii-hq
          repositories: harness-e2e
          permission-actions: write

      - name: Run the memory-gain suite on the ${{ matrix.stack }} stack
        id: e2e
        # The memory gain arms; the stacks run harness-e2e latest, 0.33.0 or later.
        uses: iii-hq/harness-e2e/.github/actions/verify-stack@34f19f5c331d993777c58decab0a0c7d0062c96d
        with:
          token: ${{ steps.app.outputs.token }}
          # Only the consolidated stack declares memory-consolidate; the others refuse its version.
          versions: ${{ matrix.stack == 'memory-consolidated' && needs.version.outputs.consolidated || needs.version.outputs.versions }}
          suite: memory-gain
          stack: ${{ matrix.stack }}
          model: ${{ matrix.model }}
          extraction-model: ${{ inputs.extraction_model }}

      # Every arm leaves a record, one without a run included, so the report
      # names an unmeasured model instead of leaving it out.
      - name: Name the arm for the report
        if: always()
        env:
          MODEL: ${{ matrix.model }}
          ARM: ${{ matrix.stack }}
          RUN_URL: ${{ steps.e2e.outputs.run_url }}
          INDEX: ${{ strategy.job-index }}
        run: |
          mkdir -p arm
          jq -n --arg model "$MODEL" --arg arm "$ARM" --arg run_url "$RUN_URL" \
            '{model: $model, arm: $arm, run_url: $run_url}' > "arm/arm-${INDEX}.json"

      - name: Keep the arm for the report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: memory-gain-arm-${{ strategy.job-index }}
          path: arm/arm-${{ strategy.job-index }}.json

  memory-gain-report:
    name: memory gain report
    needs: [version, memory-gain]
    if: always() && needs.memory-gain.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Collect the arms
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: memory-gain-arm-*
          merge-multiple: true
          path: arms

      - name: List the arms
        id: runs
        run: echo "runs=$(jq -sc . arms/*.json)" >> "$GITHUB_OUTPUT"

      - name: Mint a token that can read iii-hq/harness-e2e runs
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}
          owner: iii-hq
          repositories: harness-e2e
          permission-actions: read

      - name: Compare the arms
        id: gain
        # The memory gain arms; the stacks run harness-e2e latest, 0.33.0 or later.
        uses: iii-hq/harness-e2e/.github/actions/memory-gain@3d1c3566d116882f4efdb07a9c445d9b662fe9c0
        with:
          token: ${{ steps.app.outputs.token }}
          runs: ${{ steps.runs.outputs.runs }}

      # The comparison names no versions; the report says which ones the arms ran.
      - name: Name the measured versions
        if: always() && steps.gain.outputs.report != ''
        env:
          VERSIONS: ${{ needs.version.outputs.consolidated }}
          REPORT: ${{ steps.gain.outputs.report }}
        run: |
          line=$(jq -r '"Measured: memory \(.memory) on every arm, memory-consolidate \(.["memory-consolidate"]) on the memory-consolidated arm."' <<<"$VERSIONS")
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$REPORT/memory-gain.md" ]; then
            printf '\n%s\n' "$line" >> "$REPORT/memory-gain.md"
          fi

      - name: Keep the report
        if: always() && steps.gain.outputs.report != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: memory-gain-report
          path: ${{ steps.gain.outputs.report }}
