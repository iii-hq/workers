name: Harness E2E Daily
run-name: Test · harness_registry · ${{ inputs.operation_id || github.event_name }}

on:
  schedule:
    # 03:00 in America/Fortaleza (UTC-3).
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional full commit SHA; defaults to the default branch revision
        required: false
        type: string
      subjects:
        description: Optional JSON subject matrix; defaults to repository configuration
        required: false
        type: string
      judge_model:
        description: Optional judge model id
        required: false
        type: string
      judge_provider:
        description: Optional judge provider id
        required: false
        type: string
      operation_id:
        description: Release Control operation UUID
        required: false
        type: string
      step_id:
        description: Release Control operation step UUID
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: harness-e2e-daily-${{ inputs.operation_id || 'benchmark' }}
  cancel-in-progress: false

jobs:
  context:
    name: Resolve daily benchmark context
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.context.outputs.source_sha }}
      benchmark_day: ${{ steps.context.outputs.benchmark_day }}
      source_url: ${{ steps.context.outputs.source_url }}
    steps:
      - name: Resolve source and UTC day
        id: context
        env:
          INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          source_sha=${INPUT_SOURCE_SHA:-$CURRENT_SHA}
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_sha must be a full 40-character commit SHA"
            exit 2
          }

          benchmark_day=$(date -u +%F)
          source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${source_sha}"
          {
            echo "source_sha=$source_sha"
            echo "benchmark_day=$benchmark_day"
            echo "source_url=$source_url"
          } >> "$GITHUB_OUTPUT"

  e2e:
    needs: context
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_harness-e2e.yml
    with:
      runs: 3
      max_parallel: 2
      source_ref: ${{ needs.context.outputs.source_sha }}
      stack_mode: registry
      resolve_stack: true
      prebuilt_runner: true
      provisioning_attempts: 2
      benchmark_lane: daily
      release_tag: daily/${{ needs.context.outputs.benchmark_day }}
      release_worker: harness
      release_version: latest
      release_url: ${{ needs.context.outputs.source_url }}
      registry_tag: latest
      coverage: false
      subjects: ${{ inputs.subjects || vars.HARNESS_E2E_SUBJECTS || '[{"id":"anthropic-sonnet","model":"claude-sonnet-4-6","provider":"anthropic"}]' }}
      judge_model: ${{ inputs.judge_model || vars.HARNESS_E2E_JUDGE_MODEL || 'claude-sonnet-4-6' }}
      judge_provider: ${{ inputs.judge_provider || vars.HARNESS_E2E_JUDGE_PROVIDER || 'anthropic' }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      zai_api_key: ${{ secrets.ZAI_API_KEY }}
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
