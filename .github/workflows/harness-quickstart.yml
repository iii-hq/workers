name: Validate exact quickstart channel
run-name: RC · test · ${{ inputs.operation_id }} · ${{ inputs.step_id }}

on:
  workflow_dispatch:
    inputs:
      operation_id: { required: true, type: string }
      step_id: { required: true, type: string }
      source_sha: { required: true, type: string }
      cli_channel:
        required: true
        type: choice
        options: [latest, next]
      registry_tag:
        required: true
        type: choice
        options: [latest, next]
      release_worker:
        description: Exact worker, or "none"
        required: true
        type: string
      release_version:
        description: Exact version, or "none"
        required: true
        type: string
      release_tag:
        description: Exact tag, or "none"
        required: true
        type: string
      release_run_id:
        description: Exact run id, or 0
        required: true
        type: string
      release_run_attempt:
        description: Exact run attempt, or 0
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: harness-quickstart-${{ inputs.operation_id }}-${{ inputs.cli_channel }}-${{ inputs.registry_tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}

      - name: Validate Release Control dispatch
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/release_control_contract.py validate-dispatch
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'

      - uses: pnpm/action-setup@v5
        with:
          version: 11.13.1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Console Playwright dependencies
        working-directory: console/web
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and video tooling
        working-directory: console/web
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run quickstart validator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HARNESS_QUICKSTART_ARTIFACTS_DIR: ${{ github.workspace }}/target/harness-quickstart
          HARNESS_QUICKSTART_TRACE: '1'
          III_CLI_CHANNEL: ${{ inputs.cli_channel }}
          III_WORKER_TAG: ${{ inputs.registry_tag }}
          HARNESS_QUICKSTART_RELEASE_WORKER: ${{ inputs.release_worker != 'none' && inputs.release_worker || '' }}
          HARNESS_QUICKSTART_RELEASE_VERSION: ${{ inputs.release_version != 'none' && inputs.release_version || '' }}
        run: harness/tests/quickstart/run-ci.sh

      - name: Verify exact release in lock
        if: inputs.release_version != 'none'
        run: >-
          python3 .github/scripts/verify_registry_lock.py
          --lock target/harness-quickstart/iii.lock
          --manifest harness/iii.worker.yaml
          --required harness
          --required console
          --worker '${{ inputs.release_worker }}'
          --version '${{ inputs.release_version }}'
          --output target/harness-quickstart/lock-verification.json

      - name: Show quickstart logs
        if: always()
        run: |
          shopt -s nullglob
          for log in target/harness-quickstart/logs/*.log; do
            echo "::group::$(basename "$log")"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Upload raw quickstart facts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quickstart-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: target/harness-quickstart/
          retention-days: 7
          if-no-files-found: ignore

      - name: Write factual result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          subject=$(jq -cn --arg source_sha '${{ inputs.source_sha }}' --arg channel '${{ inputs.registry_tag }}' \
            --arg worker '${{ inputs.release_worker }}' --arg version '${{ inputs.release_version }}' \
            '{source_sha:$source_sha,channel:$channel,worker:(if $worker == "none" then null else $worker end),version:(if $version == "none" then null else $version end)}')
          checks=$(jq -cn --arg status "$JOB_STATUS" '[{name:"quickstart",status:$status}]')
          outputs=$(jq -cn --arg cli '${{ inputs.cli_channel }}' --arg registry '${{ inputs.registry_tag }}' \
            --arg release_run_id '${{ inputs.release_run_id }}' --arg release_run_attempt '${{ inputs.release_run_attempt }}' \
            --slurpfile quickstart target/harness-quickstart/result.json \
            '{cli_channel:$cli,registry_tag:$registry,release_run:{id:($release_run_id|tonumber),attempt:($release_run_attempt|tonumber)},quickstart:($quickstart[0] // null),slack_evidence:(($quickstart[0].slack_evidence // null) | if . == null then null else .path = ("target/harness-quickstart/" + .path) end)}')
          python3 .github/scripts/release_control_contract.py write-result \
            --kind test --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow harness-quickstart.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects '[]' --outputs "$outputs" --output execution-result.json

      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: execution-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: |
            execution-result.json
            target/harness-quickstart/slack-evidence/
          retention-days: 30
          if-no-files-found: error
