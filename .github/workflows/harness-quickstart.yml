name: Harness quickstart

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Installer channel to validate
        type: choice
        options: [latest, next]
        default: latest
      release_worker:
        description: Worker published by the release that triggered this smoke
        type: string
        default: ''
      release_version:
        description: Published worker version that must be resolved
        type: string
        default: ''
      release_tag:
        description: Git tag associated with the published release
        type: string
        default: ''
      release_run_id:
        description: GitHub Actions run id of the publishing release
        type: string
        default: ''
      cascade_e2e:
        description: Dispatch the deployed E2E workflow after a successful smoke
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: harness-quickstart-${{ inputs.channel || github.event_name }}-${{ inputs.release_version || 'rolling' }}
  cancel-in-progress: ${{ inputs.release_version == '' }}

jobs:
  validate:
    name: harness quickstart / published registry (${{ matrix.channel }})
    strategy:
      fail-fast: false
      matrix:
        channel: >-
          ${{
            github.event_name == 'schedule'
            && fromJSON('["latest","next"]')
            || fromJSON(format('["{0}"]', inputs.channel))
          }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Run quickstart validator
        id: quickstart
        env:
          HARNESS_QUICKSTART_ARTIFACTS_DIR: ${{ github.workspace }}/target/harness-quickstart
          HARNESS_QUICKSTART_TRACE: "1"
          III_CHANNEL: ${{ matrix.channel }}
        run: harness/tests/quickstart/run-ci.sh

      - name: Verify the released artifact was resolved
        if: ${{ success() && inputs.release_version != '' }}
        env:
          RELEASE_WORKER: ${{ inputs.release_worker }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/verify_registry_lock.py \
            --lock target/harness-quickstart/iii.lock \
            --manifest harness/iii.worker.yaml \
            --required harness \
            --required console \
            --worker "$RELEASE_WORKER" \
            --version "$RELEASE_VERSION" \
            --output target/harness-quickstart/lock-verification.json
          jq -n \
            --arg worker "$RELEASE_WORKER" \
            --arg version "$RELEASE_VERSION" \
            --arg tag "$RELEASE_TAG" \
            --arg run_id "$RELEASE_RUN_ID" \
            --arg channel "$CHANNEL" \
            '{worker: $worker, version: $version, tag: $tag, release_run_id: $run_id, channel: $channel}' \
            >target/harness-quickstart/release-context.json

      - name: Show quickstart logs
        if: always()
        run: |
          shopt -s nullglob
          logs=(target/harness-quickstart/logs/*.log)
          for log in "${logs[@]}"; do
            echo "::group::$(basename "$log")"
            cat "$log"
            echo "::endgroup::"
          done

      - name: Write quickstart summary
        if: always()
        run: |
          {
            echo "### Harness quickstart"
            echo
            if [[ -f target/harness-quickstart/result.json ]]; then
              jq -r '
                "| Status | Channel | CLI | Duration |",
                "| --- | --- | --- | ---: |",
                "| \(.status) | \(.channel) | \(.cli_version) | \(.elapsed_ms) ms |",
                (if .failure_reason != "" then "", "**Failure:** \(.failure_reason)" else empty end)
              ' target/harness-quickstart/result.json
            else
              echo "No quickstart result was produced."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload quickstart artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: harness-quickstart-${{ matrix.channel }}
          path: target/harness-quickstart/
          retention-days: 7
          if-no-files-found: ignore

  dispatch-e2e:
    name: Dispatch deployed Harness E2E CI
    needs: validate
    if: ${{ needs.validate.result == 'success' && inputs.cascade_e2e == true }}
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deployed E2E CI
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          WORKER: ${{ inputs.release_worker }}
          VERSION: ${{ inputs.release_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          SMOKE_RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ -n "$WORKER" && -n "$VERSION" ]] || {
            echo "::error::release_worker and release_version are required for the E2E cascade"
            exit 2
          }
          gh workflow run harness-e2e-deployed.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$WORKFLOW_REF" \
            --field "channel=$CHANNEL" \
            --field "release_worker=$WORKER" \
            --field "release_version=$VERSION" \
            --field "release_tag=$RELEASE_TAG" \
            --field "release_run_id=$RELEASE_RUN_ID" \
            --field "smoke_run_id=$SMOKE_RUN_ID"
