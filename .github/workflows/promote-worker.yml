name: Promote Worker
run-name: Promote · ${{ inputs.worker }}@${{ inputs.version || 'next' }} · ${{ inputs.operation_id || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      worker:
        description: Worker candidate to promote
        required: true
        type: string
      version:
        description: 'Candidate version (empty = whatever next resolves to; set it only to retry an interrupted promotion after next moved on)'
        required: false
        type: string
        default: ''
      release_run_id:
        description: 'Release run with the candidate evidence (empty = auto-locate the run for the release tag)'
        required: false
        type: string
        default: ''
      release_run_attempt:
        description: 'Expected Release run attempt (empty = current attempt)'
        required: false
        type: string
        default: ''
      candidate_evidence_run_id:
        description: 'Run containing candidate evidence; empty uses the Release run'
        required: false
        type: string
        default: ''
      candidate_evidence_run_attempt:
        description: 'Expected candidate-evidence run attempt (empty = current attempt)'
        required: false
        type: string
        default: ''
      e2e_run_id:
        description: 'Promotion-ready deployed E2E run; required for Harness and auto-located when empty'
        required: false
        type: string
        default: ''
      e2e_run_attempt:
        description: 'Expected deployed E2E run attempt (empty = current attempt)'
        required: false
        type: string
        default: ''
      operation_id:
        description: 'Release Control promotion operation UUID'
        required: false
        type: string
        default: ''
      step_id:
        description: 'Release Control promotion step UUID'
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: promote-worker-${{ inputs.worker }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote ${{ inputs.worker }}@${{ inputs.version || 'next' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WORKER: ${{ inputs.worker }}
      API_URL: https://api.workers.iii.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true

      - name: Install release tooling
        run: pip install --quiet pyyaml

      - name: Validate dispatch context
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == main ]] || {
            echo "::error::Promotions must be dispatched from main"
            exit 2
          }
          [[ "$WORKER" =~ ^[a-z0-9][a-z0-9_-]*$ ]] || {
            echo "::error::worker must be a Registry slug"
            exit 2
          }
          python3 .github/scripts/release_catalog.py validate
          python3 .github/scripts/release_catalog.py get "$WORKER" release_workflow >/dev/null

      # A promotion always ships the candidate behind `next`, so the dispatch
      # only has to name the worker: the version comes from the Registry and
      # the Release run is located from the resulting tag (tag-push runs carry
      # the tag as head_branch). Both inputs remain as overrides for the repair
      # path — re-running an interrupted promotion after `next` moved on, or a
      # dispatched Release re-run whose head_branch is `main`.
      - name: Resolve candidate from next
        id: resolve
        env:
          VERSION_INPUT: ${{ inputs.version }}
          RUN_ID_INPUT: ${{ inputs.release_run_id }}
          RUN_ATTEMPT_INPUT: ${{ inputs.release_run_attempt }}
          EVIDENCE_RUN_ID_INPUT: ${{ inputs.candidate_evidence_run_id }}
          EVIDENCE_RUN_ATTEMPT_INPUT: ${{ inputs.candidate_evidence_run_attempt }}
          E2E_RUN_ID_INPUT: ${{ inputs.e2e_run_id }}
          E2E_RUN_ATTEMPT_INPUT: ${{ inputs.e2e_run_attempt }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if [[ -z "$version" ]]; then
            version=$(python3 - <<'PY'
          import os
          import sys

          sys.path.insert(0, ".github/scripts")
          from registry_release import RegistryError, resolve_version

          try:
              version = resolve_version(os.environ["API_URL"], os.environ["WORKER"], "next", allow_missing=True)
          except RegistryError as error:
              raise SystemExit(str(error))
          if not version:
              raise SystemExit(f"{os.environ['WORKER']} has no candidate behind next in the Registry")
          print(version)
          PY
            )
            echo "::notice::next resolves to ${WORKER}@${version}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(experimental|alpha|beta))?$ ]] || {
            echo "::error::candidate must use MAJOR.MINOR.PATCH[-experimental|-alpha|-beta] (got ${version})"
            exit 2
          }

          run_id="$RUN_ID_INPUT"
          if [[ -z "$run_id" ]]; then
            tag="${WORKER}/v${version}"
            run_id=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs" \
              -f branch="$tag" -f status=completed -f per_page=100 | \
              jq -r --arg tag "$tag" '
                [.workflow_runs[] | select(
                  .path == ".github/workflows/release.yml" and
                  .head_branch == $tag and
                  .event == "push" and
                  .status == "completed" and
                  .conclusion == "success"
                )][0].id // empty
              ')
            [[ -n "$run_id" ]] || {
              echo "::error::No Release run found for tag ${tag}; pass release_run_id explicitly"
              exit 2
            }
            echo "::notice::candidate evidence expected in Release run ${run_id}"
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || {
            echo "::error::release_run_id must be numeric"
            exit 2
          }
          release_attempt="$RUN_ATTEMPT_INPUT"
          if [[ -n "$release_attempt" && ! "$release_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::release_run_attempt must be a positive integer"
            exit 2
          fi

          evidence_run_id="${EVIDENCE_RUN_ID_INPUT:-$run_id}"
          [[ "$evidence_run_id" =~ ^[0-9]+$ ]] || {
            echo "::error::candidate_evidence_run_id must be numeric"
            exit 2
          }
          evidence_attempt="$EVIDENCE_RUN_ATTEMPT_INPUT"
          if [[ -z "$evidence_attempt" && "$evidence_run_id" == "$run_id" ]]; then
            evidence_attempt="$release_attempt"
          fi
          if [[ -n "$evidence_attempt" && ! "$evidence_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::candidate_evidence_run_attempt must be a positive integer"
            exit 2
          fi

          e2e_run_id="$E2E_RUN_ID_INPUT"
          e2e_attempt="$E2E_RUN_ATTEMPT_INPUT"
          if [[ "$WORKER" == harness && -z "$e2e_run_id" ]]; then
            title="Harness E2E · ${WORKER}@${version} ·"
            mapfile -t e2e_candidates < <(gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/harness-e2e-deployed.yml/runs" \
              -f event=workflow_dispatch -f status=completed \
              -f per_page=100 \
              --jq ".workflow_runs[] | select(.conclusion == \"success\" and (.display_title | startswith(\"${title}\"))) | .id")
            for candidate_id in "${e2e_candidates[@]}"; do
              candidate_dir=$(mktemp -d)
              if gh run download "$candidate_id" \
                --repo "$GITHUB_REPOSITORY" \
                --name "harness-e2e-evidence-${WORKER}-${version}" \
                --dir "$candidate_dir" >/dev/null 2>&1 && \
                python3 .github/scripts/harness_e2e_evidence.py validate \
                  --evidence "$candidate_dir/harness-e2e-evidence.json" \
                  --repository "$GITHUB_REPOSITORY" \
                  --release-run-id "$run_id" \
                  --e2e-run-id "$candidate_id" \
                  --worker "$WORKER" \
                  --version "$version" >/dev/null 2>&1; then
                e2e_run_id="$candidate_id"
                rm -r "$candidate_dir"
                break
              fi
              rm -r "$candidate_dir"
            done
            [[ -n "$e2e_run_id" ]] || {
              echo "::error::No promotion-ready deployed Harness E2E run found for ${WORKER}@${version}"
              exit 2
            }
            echo "::notice::Harness E2E evidence expected in run ${e2e_run_id}"
          fi
          if [[ -n "$e2e_run_id" && ! "$e2e_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::e2e_run_id must be numeric"
            exit 2
          fi
          if [[ -n "$e2e_attempt" && ! "$e2e_attempt" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::e2e_run_attempt must be a positive integer"
            exit 2
          fi

          {
            echo "VERSION=${version}"
            echo "RELEASE_RUN_ID=${run_id}"
            echo "EXPECTED_RELEASE_RUN_ATTEMPT=${release_attempt}"
            echo "EVIDENCE_RUN_ID=${evidence_run_id}"
            echo "EXPECTED_EVIDENCE_RUN_ATTEMPT=${evidence_attempt}"
            echo "E2E_RUN_ID=${e2e_run_id}"
            echo "EXPECTED_E2E_RUN_ATTEMPT=${e2e_attempt}"
            echo "PROMOTION_OPERATION_ID=${{ inputs.operation_id || format('github:{0}', github.run_id) }}"
            echo "PROMOTION_STEP_ID=${{ inputs.step_id || 'promote' }}"
          } >>"$GITHUB_ENV"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - name: Validate Release workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.worker }}/v${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" >release-run.json
          # GitHub exposes `run-name` through the API's `name` field, so the
          # workflow file path is the stable identity for a Release run.
          jq -e '.path == ".github/workflows/release.yml"' release-run.json >/dev/null || {
            echo "::error::run $RELEASE_RUN_ID did not execute release.yml"
            exit 1
          }
          release_attempt=$(jq -r .run_attempt release-run.json)
          if [[ -n "$EXPECTED_RELEASE_RUN_ATTEMPT" && "$release_attempt" != "$EXPECTED_RELEASE_RUN_ATTEMPT" ]]; then
            echo "::error::Release run attempt is $release_attempt, expected $EXPECTED_RELEASE_RUN_ATTEMPT"
            exit 1
          fi
          event=$(jq -r .event release-run.json)
          [[ "$event" == push || "$event" == workflow_dispatch ]] || {
            echo "::error::Release run event '$event' is not promotable"
            exit 1
          }
          if [[ "$event" == push ]]; then
            jq -e --arg tag "$TAG" '.head_branch == $tag' release-run.json >/dev/null || {
              echo "::error::push run $RELEASE_RUN_ID is not for tag $TAG"
              exit 1
            }
          fi
          if [[ "$EVIDENCE_RUN_ID" == "$RELEASE_RUN_ID" ]]; then
            cp release-run.json evidence-run.json
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN_ID" >evidence-run.json
            jq -e '
              (.path == ".github/workflows/release.yml") or
              (.path == ".github/workflows/repair-worker-release.yml")
            ' evidence-run.json >/dev/null || {
              echo "::error::run $EVIDENCE_RUN_ID cannot produce candidate evidence"
              exit 1
            }
          fi
          evidence_attempt=$(jq -r .run_attempt evidence-run.json)
          if [[ -n "$EXPECTED_EVIDENCE_RUN_ATTEMPT" && "$evidence_attempt" != "$EXPECTED_EVIDENCE_RUN_ATTEMPT" ]]; then
            echo "::error::Evidence run attempt is $evidence_attempt, expected $EXPECTED_EVIDENCE_RUN_ATTEMPT"
            exit 1
          fi

      - name: Download candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact="release-candidate-${WORKER}-${VERSION}"
          mkdir -p evidence
          gh run download "$EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact" \
            --dir evidence
          test -s evidence/release-candidate.json

      - name: Validate candidate identity and gates
        id: candidate
        run: |
          set -euo pipefail
          python3 .github/scripts/release_candidate.py validate \
            --evidence evidence/release-candidate.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-run-id "$RELEASE_RUN_ID" \
            --evidence-run-id "$EVIDENCE_RUN_ID" \
            --worker "$WORKER" \
            --version "$VERSION" \
            --output validated-candidate.json

          tag="${WORKER}/v${VERSION}"
          git fetch origin "+refs/tags/${tag}:refs/tags/${tag}"
          tag_sha=$(git rev-list -n 1 "$tag")
          evidence_sha=$(jq -r .tag_sha validated-candidate.json)
          [[ "$tag_sha" == "$evidence_sha" ]] || {
            echo "::error::Git tag resolves to $tag_sha, evidence records $evidence_sha"
            exit 1
          }
          run_attempt=$(jq -r .run_attempt evidence-run.json)
          evidence_attempt=$(jq -r .run_attempt validated-candidate.json)
          [[ "$run_attempt" == "$evidence_attempt" ]] || {
            echo "::error::Evidence run attempt is $run_attempt, evidence records $evidence_attempt"
            exit 1
          }

          deploy=$(jq -r .deploy validated-candidate.json)
          maturity=$(jq -r .maturity validated-candidate.json)
          image_digest=$(jq -r '.image_digest // empty' validated-candidate.json)
          {
            echo "tag=$tag"
            echo "deploy=$deploy"
            echo "maturity=$maturity"
            echo "image_digest=$image_digest"
          } >>"$GITHUB_OUTPUT"

      - name: Validate deployed Harness E2E evidence
        if: inputs.worker == 'harness'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$E2E_RUN_ID" >e2e-run.json
          jq -e '
            .path == ".github/workflows/harness-e2e-deployed.yml" and
            .event == "workflow_dispatch" and
            .conclusion == "success" and
            .status == "completed"
          ' e2e-run.json >/dev/null
          mkdir -p e2e-evidence
          gh run download "$E2E_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "harness-e2e-evidence-${WORKER}-${VERSION}" \
            --dir e2e-evidence
          python3 .github/scripts/harness_e2e_evidence.py validate \
            --evidence e2e-evidence/harness-e2e-evidence.json \
            --repository "$GITHUB_REPOSITORY" \
            --release-run-id "$RELEASE_RUN_ID" \
            --e2e-run-id "$E2E_RUN_ID" \
            --worker "$WORKER" \
            --version "$VERSION" \
            --output validated-harness-e2e.json
          run_attempt=$(jq -r .run_attempt e2e-run.json)
          if [[ -n "$EXPECTED_E2E_RUN_ATTEMPT" && "$run_attempt" != "$EXPECTED_E2E_RUN_ATTEMPT" ]]; then
            echo "::error::E2E run attempt is $run_attempt, expected $EXPECTED_E2E_RUN_ATTEMPT"
            exit 1
          fi
          evidence_attempt=$(jq -r .run_attempt validated-harness-e2e.json)
          [[ "$run_attempt" == "$evidence_attempt" ]] || {
            echo "::error::E2E run attempt is $run_attempt, evidence records $evidence_attempt"
            exit 1
          }

      - name: Validate GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url >github-release-before.json
          jq -e --arg tag "$TAG" '.tagName == $tag and .isDraft == false' \
            github-release-before.json >/dev/null

      - name: Promote Registry release tag
        env:
          WORKERS_REGISTRY_API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}
        run: |
          python3 .github/scripts/registry_release.py \
            --api-url "$API_URL" \
            --worker "$WORKER" \
            --version "$VERSION" \
            --output registry-promotion.json

      - name: Set up Docker Buildx
        if: steps.candidate.outputs.deploy == 'image'
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: steps.candidate.outputs.deploy == 'image'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote image latest alias
        if: steps.candidate.outputs.deploy == 'image'
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          digest="${{ steps.candidate.outputs.image_digest }}"
          version_ref="ghcr.io/${owner}/${WORKER}:${VERSION}"
          latest_ref="ghcr.io/${owner}/${WORKER}:latest"
          if [[ -n "$digest" ]]; then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "::error::candidate evidence has an invalid image digest"
              exit 1
            }
            digest_ref="ghcr.io/${owner}/${WORKER}@${digest}"
          else
            echo "::warning::legacy candidate evidence has no digest; promoting from the immutable version tag"
            digest_ref="$version_ref"
          fi
          docker buildx imagetools inspect "$version_ref" --raw >version-manifest.json
          docker buildx imagetools inspect "$digest_ref" --raw >digest-manifest.json
          cmp version-manifest.json digest-manifest.json
          docker buildx imagetools create --tag "$latest_ref" "$digest_ref"
          docker buildx imagetools inspect "$latest_ref" --raw >latest-manifest.json
          cmp digest-manifest.json latest-manifest.json

      - name: Finalize GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.candidate.outputs.tag }}
          MATURITY: ${{ steps.candidate.outputs.maturity }}
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$MATURITY" != stable ]]; then prerelease=true; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --prerelease="$prerelease" --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,url >github-release-after.json
          jq -e --arg tag "$TAG" --argjson prerelease "$prerelease" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == $prerelease' \
            github-release-after.json >/dev/null

      - name: Write promotion summary
        if: always()
        run: |
          {
            echo "### Worker promotion"
            echo
            echo "- Candidate: \`${WORKER}@${VERSION}\`"
            echo "- Release run: [${RELEASE_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID})"
            echo "- Candidate evidence run: [${EVIDENCE_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID})"
            if [[ -n "$E2E_RUN_ID" ]]; then
              echo "- Deployed E2E run: [${E2E_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${E2E_RUN_ID})"
            fi
            if [[ -f registry-promotion.json ]]; then
              previous=$(jq -r '.previous_latest // "none"' registry-promotion.json)
              changed=$(jq -r .changed registry-promotion.json)
              echo "- Previous latest: \`${previous}\`"
              echo "- Registry changed: \`${changed}\`"
            fi
            if [[ -f github-release-after.json ]]; then
              echo "- GitHub Release: $(jq -r .url github-release-after.json)"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Write promotion result
        if: always()
        env:
          OPERATION_ID: ${{ inputs.operation_id || format('github:{0}', github.run_id) }}
          STEP_ID: ${{ inputs.step_id || 'promote' }}
          DEPLOY: ${{ steps.candidate.outputs.deploy }}
        run: |
          registry=false
          github_release=false
          image_alias=false
          [[ -s registry-promotion.json ]] && registry=true
          [[ -s github-release-after.json ]] && github_release=true
          if [[ "$DEPLOY" != image || -s latest-manifest.json ]]; then image_alias=true; fi
          status=failed
          if [[ "$registry" == true ]]; then status=partial; fi
          if [[ "$registry" == true && "$github_release" == true && "$image_alias" == true ]]; then
            status=succeeded
          fi
          jq -n \
            --argjson schema_version 2 \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg promotion_run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg operation_id "$OPERATION_ID" \
            --arg step_id "$STEP_ID" \
            --arg worker "$WORKER" \
            --arg version "$VERSION" \
            --arg release_run_id "$RELEASE_RUN_ID" \
            --arg candidate_evidence_run_id "$EVIDENCE_RUN_ID" \
            --arg e2e_run_id "$E2E_RUN_ID" \
            --arg status "$status" \
            --argjson registry "$registry" \
            --argjson github_release "$github_release" \
            --argjson image_alias "$image_alias" \
            '{schema_version: $schema_version, repository: $repository,
              promotion_run_id: $promotion_run_id, run_attempt: $run_attempt,
              operation_id: $operation_id, step_id: $step_id,
              worker: $worker, version: $version,
              release_run_id: $release_run_id,
              candidate_evidence_run_id: $candidate_evidence_run_id,
              e2e_run_id: ($e2e_run_id | if length > 0 then . else null end),
              status: $status,
              results: {registry: $registry, github_release: $github_release, image_alias: $image_alias}}' \
            >promotion-result.json

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: promotion-${{ inputs.worker }}-${{ steps.resolve.outputs.version }}
          path: |
            validated-candidate.json
            release-run.json
            evidence-run.json
            e2e-run.json
            validated-harness-e2e.json
            github-release-before.json
            github-release-after.json
            registry-promotion.json
            promotion-result.json
          retention-days: 30
          if-no-files-found: warn
