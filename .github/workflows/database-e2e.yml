name: database E2E

on:
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/database-e2e.yml'
  workflow_dispatch:

concurrency:
  group: database-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: Harness (sqlite + postgres + mysql)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite SSH to HTTPS for public deps
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: database

      # database/build.rs shells out to pnpm to build the injected console
      # UI (ui/dist) before embedding it via include_str! — mirrors the
      # ci.yml rust job. Version comes from the repo-root package.json
      # `packageManager` field (the UI pnpm workspace root).
      - name: Setup pnpm (for build.rs UI build)
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: pnpm@11 requires the node:sqlite builtin (Node ≥22.5)
          # for its store, and ci.yml's pnpm jobs already standardize on 22.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: database/tests/e2e/workers/harness/package-lock.json

      # GHA `services:` blocks can't pass `-c wal_level=logical` to postgres,
      # which the row-change tests require. Reuse the same docker-compose
      # stack the harness uses locally for dev/CI parity.
      - name: Install iii engine (next)
        run: |
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 5 \
            https://install.iii.dev/iii/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify engine
        run: iii --version

      - name: Run harness
        working-directory: database/tests/e2e
        # --with-cargo-test runs `cargo test --all-features` against the
        # already-running postgres + mysql so the gated driver/pool tests
        # actually exercise their target DBs (otherwise they early-return).
        run: ./run-tests.sh --with-cargo-test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-e2e-report
          path: |
            database/tests/e2e/reports/
          retention-days: 7
