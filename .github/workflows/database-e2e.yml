name: database E2E
run-name: 'Test · database_e2e · ${{ github.event_name }}'

on:
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/database-e2e.yml'

concurrency:
  group: database-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: Harness (sqlite + postgres + mysql) · ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # database::on-row-changed is a private function with args_format,
        # which registers only on an engine that advertises observe.v2
        # (0.26): the oldest engine the worker supports.
        engine:
          - 'iii/v0.26.0-rc.5'
    env:
      III_RELEASE_TAG: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Rewrite SSH to HTTPS for public deps
        run: git config --local url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.97.1
      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: database

      # database/build.rs shells out to pnpm to build the injected console
      # UI (ui/dist) before embedding it via include_str! — mirrors the
      # ci.yml rust job. Version comes from the repo-root package.json
      # `packageManager` field (the UI pnpm workspace root).
      - name: Setup pnpm (for build.rs UI build)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # 22, not 20: pnpm@11 requires the node:sqlite builtin (Node ≥22.5)
          # for its store, and ci.yml's pnpm jobs already standardize on 22.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: database/tests/e2e/workers/harness/package-lock.json

      # The harness brings up its own postgres + mysql via docker-compose
      # (not GHA `services:`) so local and CI runs share one stack definition.
      - name: Install iii engine (next)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 5 \
            https://install.iii.dev/iii/main/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify engine
        run: iii --version

      - name: Run harness
        working-directory: database/tests/e2e
        # --with-cargo-test runs `cargo test --all-features` against the
        # already-running postgres + mysql so the gated driver/pool tests
        # actually exercise their target DBs (otherwise they early-return).
        run: ./run-tests.sh --with-cargo-test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: database-e2e-report-${{ strategy.job-index }}
          path: |
            database/tests/e2e/reports/
          retention-days: 7
