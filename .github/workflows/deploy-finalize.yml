name: Deployment Finalize
run-name: RC finalize · ${{ inputs.worker }} · ${{ fromJSON(inputs.identity).operation_id }} · ${{ fromJSON(inputs.identity).step_id }} · ${{ fromJSON(inputs.identity).dispatch_nonce }}

on:
  workflow_dispatch:
    inputs:
      identity: {required: true, type: string}
      worker: {required: true, type: string}
      source_sha: {required: true, type: string}
      prepared_sha: {required: true, type: string}
      candidate_version: {required: true, type: string}
      stable_version: {required: true, type: string}
      descriptor_sha256: {required: true, type: string}
      prepared_run_id: {required: true, type: string}
      expected_latest_version: {required: true, type: string}

env:
  DEPLOYMENT_IDENTITY: ${{ inputs.identity }}
  OPERATION_ID: ${{ fromJSON(inputs.identity).operation_id }}
  STEP_ID: ${{ fromJSON(inputs.identity).step_id }}
  DEPLOYMENT_INTENT_ID: ${{ fromJSON(inputs.identity).deployment_intent_id }}
  CANDIDATE_ID: ${{ fromJSON(inputs.identity).candidate_id }}
  ATTEMPT_ID: ${{ fromJSON(inputs.identity).attempt_id }}
  DISPATCH_NONCE: ${{ fromJSON(inputs.identity).dispatch_nonce }}
  PLAN_HASH: ${{ fromJSON(inputs.identity).plan_hash }}
  WORKER: ${{ inputs.worker }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  PREPARED_SHA: ${{ inputs.prepared_sha }}
  CANDIDATE_VERSION: ${{ inputs.candidate_version }}
  STABLE_VERSION: ${{ inputs.stable_version }}
  DESCRIPTOR_SHA256: ${{ inputs.descriptor_sha256 }}
  PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}
  EXPECTED_LATEST_VERSION: ${{ inputs.expected_latest_version }}

permissions: {}

jobs:
  finalize:
    runs-on: workers-release-linux-8core
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: deploy-prepared-${{ env.CANDIDATE_ID }}
          path: deploy-prepared
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
      - name: Authorize finalization
        env:
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
        run: |
          set -euo pipefail
          test "$(jq -r .descriptor_sha256 deploy-prepared/deployment-descriptor.json)" = "$DESCRIPTOR_SHA256"
          python3 .github/scripts/deployment_interface.py verify-evidence --descriptor deploy-prepared/deployment-descriptor.json --evidence deploy-prepared/deployment-evidence.json
          python3 .github/scripts/deployment_control_contract.py validate-identity --identity "$DEPLOYMENT_IDENTITY"
          python3 .github/scripts/deployment_control_contract.py validate-dispatch --operation-id "$OPERATION_ID" --step-id "$STEP_ID" --dispatch-nonce "$DISPATCH_NONCE" --descriptor-sha256 "$DESCRIPTOR_SHA256" --plan-hash "$PLAN_HASH" --source-sha "$SOURCE_SHA" --prepared-sha "$PREPARED_SHA" --mutating
          python3 .github/scripts/deployment_control_contract.py authorize-dispatch --api-url "$RELEASE_CONTROL_API_URL" --repository '${{ github.repository }}' --operation-id "$OPERATION_ID" --step-id "$STEP_ID" --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' --workflow 'deploy-finalize.yml' --event '${{ github.event_name }}' --sha '${{ github.sha }}' --deployment-intent-id "$DEPLOYMENT_INTENT_ID" --candidate-id "$CANDIDATE_ID" --attempt-id "$ATTEMPT_ID" --dispatch-nonce "$DISPATCH_NONCE" --plan-hash "$PLAN_HASH" --worker "$WORKER" --source-sha "$SOURCE_SHA" --descriptor-sha256 "$DESCRIPTOR_SHA256"
      - name: Confirm latest immutable candidate
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          API_KEY: ${{ secrets.WORKERS_REGISTRY_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p effect-state
          printf '%s\n' unknown >effect-state/registry-before
          printf '%s\n' not_started >effect-state/registry-mutation
          printf '%s\n' unknown >effect-state/registry-after
          next_body=$(jq -nc --arg worker "$WORKER" '{worker:$worker,version:"next"}')
          curl -fsS -H 'Content-Type: application/json' -X POST \
            'https://api.workers.iii.dev/resolve' --data "$next_body" >next-resolution.json
          test "$(jq -r .root.version next-resolution.json)" = "$STABLE_VERSION"

          latest_body=$(jq -nc --arg worker "$WORKER" '{worker:$worker,version:"latest"}')
          status=$(curl -sS -o latest-before.json -w '%{http_code}' -H 'Content-Type: application/json' \
            -X POST 'https://api.workers.iii.dev/resolve' --data "$latest_body")
          if [[ "$status" == 200 && "$(jq -r .root.version latest-before.json)" == "$STABLE_VERSION" ]]; then
            printf '%s\n' present >effect-state/registry-before
          elif [[ "$status" == 200 && "$(jq -r .root.version latest-before.json)" == "$EXPECTED_LATEST_VERSION" ]]; then
            printf '%s\n' absent >effect-state/registry-before
          elif [[ "$status" == 404 && "$EXPECTED_LATEST_VERSION" == none ]]; then
            printf '%s\n' absent >effect-state/registry-before
          else
            echo "latest changed outside the authorized compare-and-swap"
            exit 1
          fi
          plan=$(python3 .github/scripts/deployment_effects.py plan --before "$(cat effect-state/registry-before)")
          if [[ "$plan" == mutate ]]; then
            expected=null
            [[ "$EXPECTED_LATEST_VERSION" == none ]] || expected=$(jq -cn --arg value "$EXPECTED_LATEST_VERSION" '$value')
            payload=$(jq -cn --arg version "$STABLE_VERSION" --argjson expected "$expected" \
              '{version:$version,expected_current_version:$expected}')
            printf '%s\n' started >effect-state/registry-mutation
            curl -fsS -H "X-API-Key: $API_KEY" -H 'Content-Type: application/json' -X PUT \
              "https://api.workers.iii.dev/w/$WORKER/tags/latest" --data "$payload" >latest-mutation.json
            printf '%s\n' completed >effect-state/registry-mutation
          fi
          curl -fsS -H 'Content-Type: application/json' -X POST \
            'https://api.workers.iii.dev/resolve' --data "$latest_body" >latest-after.json
          test "$(jq -r .root.version latest-after.json)" = "$STABLE_VERSION"
          printf '%s\n' present >effect-state/registry-after
      - name: Write result
        if: always()
        env:
          STATUS: ${{ steps.finalize.outcome }}
        run: |
          set -euo pipefail
          outcome=succeeded; error=null
          if [[ "$STATUS" == cancelled ]]; then outcome=canceled; error='{"code":"finalize_canceled","category":"release","retryable":true,"message":"release finalization was canceled"}'
          elif [[ "$STATUS" != success ]]; then outcome=failed; error='{"code":"finalize_failed","category":"release","retryable":true,"message":"release finalization did not complete"}'; fi
          artifacts='[]'
          if [[ -f deploy-prepared/deployment-evidence.json ]]; then artifacts=$(jq -c '[.artifacts[] | del(.unit)]' deploy-prepared/deployment-evidence.json); fi
          probe() { [[ -s "effect-state/$1" ]] && cat "effect-state/$1" || printf '%s\n' "$2"; }
          state=$(python3 .github/scripts/deployment_effects.py classify \
            --before "$(probe registry-before unknown)" \
            --mutation "$(probe registry-mutation not_started)" \
            --after "$(probe registry-after unknown)")
          effects=$(jq -nc --arg version "$STABLE_VERSION" --arg state "$state" '[{surface:"registry-latest",state:$state,after:$version}]')
          python3 .github/scripts/deployment_control_contract.py write-result --repository '${{ github.repository }}' --operation-id "$OPERATION_ID" --step-id "$STEP_ID" --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' --workflow 'deploy-finalize.yml' --event '${{ github.event_name }}' --sha '${{ github.sha }}' --deployment-intent-id "$DEPLOYMENT_INTENT_ID" --candidate-id "$CANDIDATE_ID" --attempt-id "$ATTEMPT_ID" --dispatch-nonce "$DISPATCH_NONCE" --plan-hash "$PLAN_HASH" --worker "$WORKER" --phase finalize --source-sha "$SOURCE_SHA" --prepared-sha "$PREPARED_SHA" --candidate-version "$CANDIDATE_VERSION" --stable-version "$STABLE_VERSION" --descriptor-sha256 "$DESCRIPTOR_SHA256" --outcome "$outcome" --effects "$effects" --artifacts-json "$artifacts" --error-json "$error" --output deployment-result.json
      - if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-result-${{ env.CANDIDATE_ID }}-${{ env.STEP_ID }}-attempt-${{ github.run_attempt }}
          path: deployment-result.json
          retention-days: 30
          if-no-files-found: error
      - if: always()
        env:
          RELEASE_CONTROL_API_URL: ${{ vars.RELEASE_CONTROL_API_URL }}
        run: python3 .github/scripts/deployment_control_contract.py post-result --api-url "$RELEASE_CONTROL_API_URL" --result deployment-result.json
