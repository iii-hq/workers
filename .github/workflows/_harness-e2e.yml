name: Harness E2E

on:
  workflow_call:
    inputs:
      runs:
        description: Number of executions per scenario
        required: false
        type: number
        default: 1
      max_parallel:
        description: Maximum number of live model scenarios
        required: false
        type: number
        default: 2
      quality_advisory:
        description: Report score failures without failing the workflow
        required: false
        type: boolean
        default: false
      subjects:
        description: JSON array of subject entries with id, model, and provider
        required: false
        type: string
        default: '[{"id":"anthropic-sonnet","model":"claude-sonnet-4-6","provider":"anthropic"}]'
      judge_model:
        description: Fixed judge model id
        required: false
        type: string
        default: claude-sonnet-4-6
      judge_provider:
        description: Fixed judge provider id
        required: false
        type: string
        default: anthropic
    secrets:
      anthropic_api_key:
        required: false
      openai_api_key:
        required: false
      zai_api_key:
        required: false

jobs:
  build:
    name: harness e2e build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      scenarios: ${{ steps.scenarios.outputs.json }}
      engine_binary: ${{ steps.lock.outputs.binary }}
      engine_revision: ${{ steps.lock.outputs.revision }}
    steps:
      - uses: actions/checkout@v5

      # state/build.rs builds its embedded UI when the checked-out assets are
      # stale, so the isolated E2E build needs the same Node/pnpm toolchain as
      # the regular CI worker builds.
      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Validate subject matrix
        env:
          SUBJECTS: ${{ inputs.subjects }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          JUDGE_PROVIDER: ${{ inputs.judge_provider }}
        run: |
          set -euo pipefail
          jq -e '
            type == "array" and length > 0 and
            all(.[];
              (.id | type == "string" and test("^[A-Za-z0-9_.-]+$")) and
              (.model | type == "string" and length > 0) and
              (.provider | type == "string" and test("^[A-Za-z0-9_-]+$"))
            ) and
            ([.[].id] | unique | length) == length
          ' <<<"$SUBJECTS" >/dev/null
          [[ -n "$JUDGE_MODEL" ]]
          [[ "$JUDGE_PROVIDER" =~ ^[A-Za-z0-9_-]+$ ]]

      - name: Read and validate engine.lock
        id: lock
        run: |
          set -euo pipefail
          lock=harness/tests/integration/engine.lock
          read_field() {
            local field=$1 values
            values=$(sed -n "s/^${field} = \"\\([^\"]*\\)\"$/\\1/p" "$lock")
            [[ $(printf '%s\n' "$values" | sed '/^$/d' | wc -l) -eq 1 ]] || {
              echo "engine.lock: $field must appear exactly once"
              exit 3
            }
            printf '%s' "$values"
          }
          invalid=$(sed \
            -e '/^[[:space:]]*$/d' \
            -e '/^[[:space:]]*#/d' \
            -e '/^\(repository\|revision\|package\|binary\) = "[^"]*"$/d' \
            "$lock")
          [[ -z "$invalid" ]] || {
            echo "engine.lock: unsupported or malformed entry"
            printf '%s\n' "$invalid"
            exit 3
          }
          repository=$(read_field repository)
          revision=$(read_field revision)
          package=$(read_field package)
          binary=$(read_field binary)
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || {
            echo "engine.lock: repository must be an owner/name slug"
            exit 3
          }
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || {
            echo "engine.lock: revision must be 40-hex"
            exit 3
          }
          [[ "$package" =~ ^[A-Za-z0-9_-]+$ ]] || {
            echo "engine.lock: package contains unsupported characters"
            exit 3
          }
          [[ "$binary" =~ ^target/(debug|release)/[A-Za-z0-9_.-]+$ ]] || {
            echo "engine.lock: binary must be a target profile path"
            exit 3
          }
          {
            echo "repository=$repository"
            echo "revision=$revision"
            echo "package=$package"
            echo "binary=$binary"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout pinned engine source
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.lock.outputs.repository }}
          ref: ${{ steps.lock.outputs.revision }}
          path: target/integration-engine-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Restore engine build
        uses: actions/cache/restore@v4
        with:
          path: target/integration-engine-src/target
          key: integration-engine-${{ runner.os }}-${{ runner.arch }}-${{ steps.lock.outputs.revision }}-${{ hashFiles('target/integration-engine-src/Cargo.lock') }}

      - name: Build pinned engine
        working-directory: target/integration-engine-src
        run: cargo build --locked --release -p ${{ steps.lock.outputs.package }}

      - name: Restore E2E Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: harness-e2e
          save-if: false
          workspaces: |
            harness -> target
            database -> target
            state -> target
            queue -> target
            session-manager -> target
            llm-router -> target
            provider-anthropic -> target
            provider-openai -> target
            provider-openai-codex -> target
            provider-claude-code -> target
            provider-zai -> target
            context-manager -> target
            iii-directory -> target
            cron -> target

      - name: Test E2E crate
        run: cargo test --locked --manifest-path harness/Cargo.toml -p harness-e2e

      - name: Lint E2E crate
        run: cargo clippy --locked --manifest-path harness/Cargo.toml -p harness-e2e --all-targets -- -D warnings

      - name: Build E2E stack
        env:
          SUBJECTS: ${{ inputs.subjects }}
          JUDGE_PROVIDER: ${{ inputs.judge_provider }}
        run: |
          set -euo pipefail
          for worker in database state queue session-manager llm-router context-manager iii-directory cron; do
            cargo build --locked --release --manifest-path "$worker/Cargo.toml"
          done
          mapfile -t providers < <(
            {
              jq -r '.[].provider' <<<"$SUBJECTS"
              printf '%s\n' "$JUDGE_PROVIDER"
            } | sort -u
          )
          for provider in "${providers[@]}"; do
            worker="provider-$provider"
            test -f "$worker/Cargo.toml"
            cargo build --locked --release --manifest-path "$worker/Cargo.toml"
          done
          cargo build --locked --release \
            --manifest-path harness/Cargo.toml \
            -p harness \
            -p harness-e2e

      - name: Read code-defined scenarios
        id: scenarios
        run: |
          set -euo pipefail
          scenarios=$(harness/target/release/harness-e2e list)
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' \
            <<<"$scenarios" >/dev/null
          echo "json=$scenarios" >> "$GITHUB_OUTPUT"

      - name: Package E2E binaries
        env:
          SUBJECTS: ${{ inputs.subjects }}
          JUDGE_PROVIDER: ${{ inputs.judge_provider }}
        run: |
          set -euo pipefail
          paths=(
            "target/integration-engine-src/${{ steps.lock.outputs.binary }}"
            database/target/release/database
            state/target/release/state
            queue/target/release/queue
            session-manager/target/release/session-manager
            llm-router/target/release/llm-router
            context-manager/target/release/context-manager
            iii-directory/target/release/iii-directory
            cron/target/release/cron
            harness/target/release/harness
            harness/target/release/harness-e2e
          )
          mapfile -t providers < <(
            {
              jq -r '.[].provider' <<<"$SUBJECTS"
              printf '%s\n' "$JUDGE_PROVIDER"
            } | sort -u
          )
          for provider in "${providers[@]}"; do
            paths+=("provider-$provider/target/release/provider-$provider")
          done
          for path in "${paths[@]}"; do
            test -x "$path"
          done
          tar -czf target/harness-e2e-stack.tar.gz "${paths[@]}"

      - name: Upload E2E binaries
        uses: actions/upload-artifact@v6
        with:
          name: harness-e2e-stack
          path: target/harness-e2e-stack.tar.gz
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: harness e2e / ${{ matrix.subject.id }} / ${{ matrix.scenario }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.max_parallel }}
      matrix:
        scenario: ${{ fromJSON(needs.build.outputs.scenarios) }}
        subject: ${{ fromJSON(inputs.subjects) }}
    steps:
      - uses: actions/checkout@v5

      - name: Download E2E binaries
        uses: actions/download-artifact@v7
        with:
          name: harness-e2e-stack
          path: target

      - name: Extract E2E binaries
        run: tar -xzf target/harness-e2e-stack.tar.gz

      - name: Run real-stack quality scenario
        env:
          ANTHROPIC_API_KEY: ${{ secrets.anthropic_api_key }}
          OPENAI_API_KEY: ${{ secrets.openai_api_key }}
          ZAI_API_KEY: ${{ secrets.zai_api_key }}
          III_BIN: ${{ github.workspace }}/target/integration-engine-src/${{ needs.build.outputs.engine_binary }}
          HARNESS_E2E_BIN: ${{ github.workspace }}/harness/target/release/harness-e2e
          HARNESS_E2E_ARTIFACTS_DIR: ${{ github.workspace }}/target/harness-e2e
          HARNESS_E2E_SCENARIO: ${{ matrix.scenario }}
          HARNESS_E2E_RUNS: ${{ inputs.runs }}
          HARNESS_E2E_MODEL: ${{ matrix.subject.model }}
          HARNESS_E2E_PROVIDER: ${{ matrix.subject.provider }}
          HARNESS_E2E_JUDGE_MODEL: ${{ inputs.judge_model }}
          HARNESS_E2E_JUDGE_PROVIDER: ${{ inputs.judge_provider }}
          HARNESS_E2E_QUALITY_ADVISORY: ${{ inputs.quality_advisory }}
          HARNESS_E2E_ENGINE_REVISION: ${{ needs.build.outputs.engine_revision }}
        run: harness/tests/e2e/run-ci.sh

      - name: Write E2E summary
        if: always()
        env:
          SCENARIO: ${{ matrix.scenario }}
          SUBJECT: ${{ matrix.subject.id }}
          QUALITY_ADVISORY: ${{ inputs.quality_advisory }}
        run: |
          {
            echo "### Harness E2E · $SUBJECT · $SCENARIO"
            echo
            if [[ "$QUALITY_ADVISORY" == "true" ]]; then
              echo "Quality score gate: advisory. Hard gates and technical failures remain blocking."
            else
              echo "Quality score gate: enforced."
            fi
            echo
            results=target/harness-e2e/results/results.json
            if [[ -f "$results" ]]; then
              jq -r '
                .scenarios[0] |
                "| Score median | Threshold | Pass rate | Hard-gate failures | Technical failures | Subject cost (USD) | Judge cost (USD) | Total cost (USD) | Status |",
                "| ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | --- |",
                "| \(.aggregate.median_score // "n/a") | \(.threshold) | \((.aggregate.pass_rate * 100) | round)% | \(.aggregate.hard_gate_failures) | \(.aggregate.technical_failures) | \(.aggregate.cost.subject_usd // "n/a") | \(.aggregate.cost.judge_usd // "n/a") | \(.aggregate.cost.total_usd // "n/a") | \(if .passed then "pass" else "fail" end) |",
                "",
                "| Run | Score | Subject cost (USD) | Judge cost (USD) | Total cost (USD) | Status |",
                "| --- | ---: | ---: | ---: | ---: | --- |",
                (.runs | to_entries[] |
                  "| \(.key + 1) | \(.value.score // "n/a") | \(.value.cost.subject_usd // "n/a") | \(.value.cost.judge_usd // "n/a") | \(.value.cost.total_usd // "n/a") | \(.value.status) |")
              ' "$results"
            else
              echo "No E2E result report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload E2E results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: harness-e2e-${{ matrix.subject.id }}-${{ matrix.scenario }}-results
          path: target/harness-e2e/results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: harness-e2e-${{ matrix.subject.id }}-${{ matrix.scenario }}-diagnostics
          path: |
            target/harness-e2e/logs/
            target/harness-e2e/stack/
          retention-days: 14
          if-no-files-found: ignore

  summary:
    name: harness e2e cost summary
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download E2E results
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: harness-e2e-*-results
          path: target/harness-e2e-results

      - name: Write suite cost summary
        run: |
          {
            echo "### Harness E2E suite cost"
            echo
            mapfile -d '' reports < <(
              find target/harness-e2e-results -name results.json -print0 2>/dev/null
            )
            if ((${#reports[@]} == 0)); then
              echo "No E2E result reports were produced."
              exit 0
            fi
            jq -sr '
              [
                .[] as $report |
                $report.scenarios[] |
                {
                  subject: "\($report.subject.provider)/\($report.subject.model)",
                  cost: .aggregate.cost
                }
              ]
              | sort_by(.subject)
              | group_by(.subject)
              | map({
                  subject: .[0].subject,
                  reports: length,
                  subject_usd: (
                    map(.cost.subject_usd)
                    | if all(.[]; . != null) then add else null end
                  ),
                  judge_usd: (
                    map(.cost.judge_usd)
                    | if all(.[]; . != null) then add else null end
                  ),
                  total_usd: (
                    map(.cost.total_usd)
                    | if all(.[]; . != null) then add else null end
                  )
                })
              | "| Subject | Reports | Subject cost (USD) | Judge cost (USD) | Total cost (USD) |",
                "| --- | ---: | ---: | ---: | ---: |",
                (.[] |
                  "| \(.subject) | \(.reports) | \(.subject_usd // "n/a") | \(.judge_usd // "n/a") | \(.total_usd // "n/a") |")
            ' "${reports[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
