name: Harness E2E Nightly

on:
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      subjects:
        description: Optional JSON subject matrix; defaults to repository configuration
        required: false
        type: string
      judge_model:
        description: Optional judge model id
        required: false
        type: string
      judge_provider:
        description: Optional judge provider id
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: harness-e2e-nightly
  cancel-in-progress: true

jobs:
  changes:
    name: Check for a new main revision
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.revision.outputs.should_run }}
    steps:
      - name: Compare with the last successful full suite
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_sha=$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/harness-e2e-nightly.yml/runs?branch=main&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""'
          )
          if [[ -z "$previous_sha" || "$previous_sha" != "$GITHUB_SHA" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: $GITHUB_SHA already has a successful full E2E suite."
          fi

  e2e:
    needs: changes
    if: needs.changes.outputs.should_run == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_harness-e2e.yml
    with:
      runs: 3
      max_parallel: 2
      benchmark_lane: nightly
      subjects: ${{ inputs.subjects || vars.HARNESS_E2E_SUBJECTS || '[{"id":"anthropic-sonnet","model":"claude-sonnet-4-6","provider":"anthropic"}]' }}
      judge_model: ${{ inputs.judge_model || vars.HARNESS_E2E_JUDGE_MODEL || 'claude-sonnet-4-6' }}
      judge_provider: ${{ inputs.judge_provider || vars.HARNESS_E2E_JUDGE_PROVIDER || 'anthropic' }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      zai_api_key: ${{ secrets.ZAI_API_KEY }}
