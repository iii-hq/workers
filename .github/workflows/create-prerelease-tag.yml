name: Create exact prerelease tag
run-name: RC · create_prerelease_tag · ${{ inputs.operation_id }} · ${{ inputs.step_id }}

on:
  workflow_dispatch:
    inputs:
      operation_id:
        required: true
        type: string
      step_id:
        required: true
        type: string
      worker:
        required: true
        type: string
      target_version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      experimental:
        required: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: create-prerelease-${{ inputs.worker }}
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.III_CI_APP_ID }}
          private-key: ${{ secrets.III_CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.token.outputs.token }}

      - run: python3 -m pip install --quiet pyyaml

      - name: Validate Release Control dispatch
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/release_control_contract.py validate-dispatch
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'
          --mutating

      - name: Validate exact prerelease intent
        id: intent
        env:
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.target_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$WORKER" =~ ^[a-z0-9][a-z0-9_-]*$ ]]
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-(experimental|alpha|beta)$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          manifest=$(WORKER="$WORKER" python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, ".github/scripts")
          import _lib
          print(_lib.read_iii_worker_yaml(pathlib.Path(os.environ["WORKER"])).manifest or "")
          PY
          )
          test -n "$manifest"
          maturity=$(python3 .github/scripts/manifest_version.py maturity "$VERSION")
          [[ "$maturity" != stable ]]
          python3 .github/scripts/manifest_version.py check-history "$WORKER" "$VERSION"
          {
            echo "manifest=$manifest"
            echo "maturity=$maturity"
            echo "tag=${WORKER}/v${VERSION}"
          } >>"$GITHUB_OUTPUT"

      - name: Create ephemeral versioned commit and tag
        env:
          WORKER: ${{ inputs.worker }}
          MANIFEST: ${{ steps.intent.outputs.manifest }}
          VERSION: ${{ inputs.target_version }}
          TAG: ${{ steps.intent.outputs.tag }}
          MATURITY: ${{ steps.intent.outputs.maturity }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPERIMENTAL: ${{ inputs.experimental }}
          OPERATION_ID: ${{ inputs.operation_id }}
          STEP_ID: ${{ inputs.step_id }}
        run: |
          set -euo pipefail
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "::error::tag already exists: $TAG"
            exit 1
          fi
          python3 .github/scripts/manifest_version.py bump "$WORKER/$MANIFEST" --kind none --target "$VERSION" >/dev/null
          python3 .github/scripts/manifest_version.py verify "$WORKER/$MANIFEST" --expected "$VERSION"
          python3 .github/scripts/manifest_version.py sync-lock "$WORKER/$MANIFEST"
          git config user.name "workers-ci[bot]"
          git config user.email "workers-ci[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(${WORKER}): prerelease ${VERSION} [skip ci]"
          git tag -a "$TAG" -m "Prerelease $TAG

          worker: $WORKER
          version: $VERSION
          managed-by: release-control
          operation-id: $OPERATION_ID
          step-id: $STEP_ID
          source-sha: $SOURCE_SHA
          maturity: $MATURITY
          registry-tag: next
          experimental: $EXPERIMENTAL
          "
          git push origin "$TAG"

      - name: Write factual result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TAG: ${{ steps.intent.outputs.tag }}
        run: |
          subject=$(jq -cn --arg worker '${{ inputs.worker }}' --arg version '${{ inputs.target_version }}' \
            --arg source_sha '${{ inputs.source_sha }}' --arg tag "$TAG" \
            '{worker:$worker,version:$version,source_sha:$source_sha,tag:$tag,channel:"next"}')
          checks=$(jq -cn --arg status "$JOB_STATUS" '[{name:"create_prerelease_tag",status:$status}]')
          effects=$(jq -cn --arg status "$JOB_STATUS" --arg tag "$TAG" \
            '[{surface:"git_tag",status:(if $status == "success" then "changed" else "failed" end),immutable_id:$tag}]')
          python3 .github/scripts/release_control_contract.py write-result \
            --kind create_tag --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' \
            --run-id '${{ github.run_id }}' --run-attempt '${{ github.run_attempt }}' \
            --workflow create-prerelease-tag.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects "$effects" --outputs '{}' \
            --output execution-result.json

      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: execution-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: execution-result.json
          retention-days: 30
          if-no-files-found: error
