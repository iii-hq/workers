name: skill-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read           # report-only; the action no longer commits back
  pull-requests: write     # for the sticky PR comment
  actions: write           # for the persistent AI skip-cache (v0.3+)

jobs:
  skill-check:
    runs-on: ubuntu-latest
    steps:
      # No explicit ref — checkout defaults to refs/pull/N/merge on
      # pull_request, which works for both same-repo and fork PRs.
      # Setting `ref: github.head_ref` previously broke fork PRs (the
      # head branch only exists in the fork, not in this repo).
      - uses: actions/checkout@v5
      - uses: iii-hq/skills-and-validation@v0.4
        with:
          write: false
          scope: pr-diff
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
