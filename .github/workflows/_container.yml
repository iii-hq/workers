name: Container Release

on:
  workflow_call:
    inputs:
      ref:
        description: 'Exact release tag to build'
        required: true
        type: string
      worker:
        description: 'Worker name (folder)'
        required: true
        type: string
      version:
        description: 'Semver version (e.g., 1.2.3)'
        required: true
        type: string
      dockerfile:
        description: 'Dockerfile path relative to <worker>/'
        required: true
        type: string
    outputs:
      image_tag:
        description: 'Fully-qualified versioned image reference (ghcr.io/...:<version>)'
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        description: 'Immutable digest produced by the multi-arch build'
        value: ${{ jobs.build.outputs.image_digest }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push (${{ inputs.worker }})
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.refs.outputs.image_tag }}
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image refs
        id: refs
        env:
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.version }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          BASE="ghcr.io/${OWNER}/${WORKER}"
          {
            echo "base=${BASE}"
            echo "image_tag=${BASE}:${VERSION}"
            echo "tags=${BASE}:${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::image=${BASE}:${VERSION}; mutable aliases move only after Registry publication"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.worker }}
          file: ${{ inputs.worker }}/${{ inputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.refs.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ inputs.worker }}
          cache-from: type=gha,scope=${{ inputs.worker }}
          cache-to: type=gha,mode=max,scope=${{ inputs.worker }}
