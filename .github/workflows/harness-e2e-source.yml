name: Validate exact Harness source
run-name: RC · test · ${{ inputs.operation_id }} · ${{ inputs.step_id }}

on:
  workflow_dispatch:
    inputs:
      operation_id: { required: true, type: string }
      step_id: { required: true, type: string }
      source_sha: { required: true, type: string }
      scenarios_json: { required: true, type: string }
      required_scenarios_json: { required: true, type: string }
      policy_digest: { required: true, type: string }
      policy_version: { required: true, type: string }
      subjects: { required: true, type: string }
      judge_model: { required: true, type: string }
      judge_provider: { required: true, type: string }
      runs: { required: true, type: number }

permissions:
  actions: read
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.sha }}" }
      - name: Validate Release Control dispatch
        env:
          RELEASE_CONTROL_BOT_LOGIN: ${{ vars.RELEASE_CONTROL_BOT_LOGIN }}
        run: >-
          python3 .github/scripts/release_control_contract.py validate-dispatch
          --operation-id '${{ inputs.operation_id }}'
          --step-id '${{ inputs.step_id }}'
      - name: Validate exact source context
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          set -euo pipefail
          [[ '${{ inputs.source_sha }}' =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUNS" =~ ^[1-9][0-9]*$ ]]
          jq -e 'type == "array" and length > 0 and length == (unique|length)' <<<'${{ inputs.scenarios_json }}' >/dev/null
          jq -e --argjson selected '${{ inputs.scenarios_json }}' \
            'type == "array" and length > 0 and length == (unique|length) and all(.[]; . as $required | $selected | index($required) != null)' \
            <<<'${{ inputs.required_scenarios_json }}' >/dev/null
          jq -e 'type == "array" and length > 0' <<<'${{ inputs.subjects }}' >/dev/null
  e2e:
    needs: guard
    uses: ./.github/workflows/_harness-e2e.yml
    with:
      source_ref: ${{ inputs.source_sha }}
      stack_mode: source
      runs: ${{ inputs.runs }}
      max_parallel: 2
      validation_lane: main
      release_tag: none
      release_worker: none
      release_version: none
      release_run_id: '0'
      registry_tag: none
      cli_channel: none
      stack_versions: '{}'
      validation_profile: full
      scenarios_json: ${{ inputs.scenarios_json }}
      required_scenarios_json: ${{ inputs.required_scenarios_json }}
      catalog_sha: ${{ inputs.source_sha }}
      profile_digest: ${{ inputs.policy_digest }}
      policy_version: ${{ inputs.policy_version }}
      coverage: true
      subjects: ${{ inputs.subjects }}
      judge_model: ${{ inputs.judge_model }}
      judge_provider: ${{ inputs.judge_provider }}
    secrets:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      zai_api_key: ${{ secrets.ZAI_API_KEY }}
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
  evidence:
    needs: [guard, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: "${{ github.sha }}" }
      - run: |
          subject=$(jq -cn --arg source_sha '${{ inputs.source_sha }}' '{source_sha:$source_sha}')
          checks=$(jq -cn --arg status '${{ needs.e2e.result }}' '[{name:"harness_source",status:$status}]')
          outputs=$(jq -cn --argjson scenarios '${{ inputs.scenarios_json }}' --arg runs '${{ inputs.runs }}' \
            '{selected_scenarios:$scenarios,requested_runs:($runs|tonumber)}')
          python3 .github/scripts/release_control_contract.py write-result --kind test --repository '${{ github.repository }}' \
            --operation-id '${{ inputs.operation_id }}' --step-id '${{ inputs.step_id }}' --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' --workflow harness-e2e-source.yml --event '${{ github.event_name }}' --sha '${{ github.sha }}' \
            --subject "$subject" --checks "$checks" --effects '[]' --outputs "$outputs" --output execution-result.json
      - uses: actions/upload-artifact@v6
        with:
          name: execution-result-${{ inputs.operation_id }}-${{ inputs.step_id }}
          path: execution-result.json
          retention-days: 30
