# C-E2E-505 — a holding hook's own argument mutations must survive the hold
# (reproduction of https://github.com/iii-hq/workers/issues/505).
#
# ONE pre-trigger hook binds to the run-scoped target and returns BOTH a hold
# and a mutation (the approval-gate pattern: gate the call and stamp the
# validated approval context onto it):
#   {{run_id}}::hook-gate → {decision: hold, mutations: {arguments: {value: "expected+approved"}}}
# The runner releases the parked call with
# `harness::function::resolve { action: "execute" }`.
#
# QUARANTINED: the invariants assert the issue's EXPECTED behavior — the
# released call executes with the gate's mutated arguments. Source inspection
# shows the mutations are discarded at parse time (`parse_output` in
# harness/src/hooks/runner.rs maps `decision: "hold"` to a mutation-less
# outcome), and the release path re-reads the transcript's original args
# regardless (#506). Unquarantine when #505 lands.
schema_version: "1"
id: C-E2E-505
description: A pre-trigger hook that holds AND mutates must have its mutation applied to the released call.
stack_profile: harness-core
quarantine: true
send:
  session_id: "{{session_id}}"
  message: "Call the recorder once."
  model: fixture-model
  provider: scripted
  idempotency_key: "{{run_id}}:hold-mutation"
  options:
    functions:
      allow: ["{{run_id}}::record"]
      deny: []
      expose: native
router_script: router-script.json
recorder:
  target:
    function_id: "{{run_id}}::record"
    description: "Record one integration fixture value."
    request_schema:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
      required: ["value"]
    response:
      content:
        - type: text
          text: recorded
      is_error: false
  extra_functions:
    - function_id: "{{run_id}}::hook-gate"
      description: "Pre-trigger approval gate: holds the call AND stamps approval context onto its arguments."
      request_schema:
        type: object
      response:
        decision: hold
        mutations:
          arguments:
            value: "expected+approved"
  lifecycle:
    trigger_type: "harness::turn-completed"
    function_id: "integration-recorder::lifecycle"
bindings:
  - trigger_type: "harness::hook::pre-trigger"
    function_id: "{{run_id}}::hook-gate"
    config:
      functions: ["{{run_id}}::record"]
      priority: 10
release:
  function_call_id: call-1
  action: execute
deadlines:
  readiness_ms: 60000
  scenario_ms: 60000
  teardown_ms: 15000
invariants:
  # THE issue-505 assertion: the holding gate's mutation reaches the released
  # execution, exactly once. (Today the target receives {value: "expected"}.)
  - id: target.calls
    parameters:
      function_id: "{{run_id}}::record"
      count: 1
      payload:
        value: "expected+approved"
  # The gate ran exactly once and saw the original model arguments.
  - id: target.calls
    parameters:
      function_id: "{{run_id}}::hook-gate"
      count: 1
      payload_subset:
        point: pre_trigger
        call:
          id: call-1
          function_id: "{{run_id}}::record"
          arguments:
            value: expected
  - id: transcript.calls_closed
    parameters: {}
  - id: status.terminal
    parameters:
      status: completed
      pending_calls: 0
      queued_messages: 0
  - id: transcript.no_duplicates
    parameters: {}
  - id: lifecycle.completed_once
    parameters:
      allow_identical_duplicates: true
  - id: router.generations_consumed
    parameters:
      count: 2
