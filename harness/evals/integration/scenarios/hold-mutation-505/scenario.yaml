# C-E2E-505 — a holding hook's mutation reaches the released call.
# Reproduction of https://github.com/iii-hq/workers/issues/505.
schema_version: "1"
id: C-E2E-505
description: A pre-trigger hook that holds and mutates must apply its mutation to the released call.

send:
  message: Call the recorder once.

functions:
  record:
    description: Record one integration fixture value.
    request_schema:
      type: object
      additionalProperties: false
      properties:
        value: { type: string }
      required: [value]
    response:
      content:
        - { type: text, text: recorded }
      is_error: false
  hook-gate:
    description: Hold the call and stamp approval context onto its arguments.
    request_schema:
      type: object
    response:
      decision: hold
      mutations:
        arguments:
          value: expected+approved
    expose: false

bindings:
  - trigger: hook_pre_trigger
    function: hook-gate
    functions: [record]
    priority: 10

release:
  action: execute

router:
  generations:
    - reply:
        type: function_call
        function: record
        arguments: { value: expected }
        usage: { input: 8, output: 4 }
    - reply:
        type: text
        text: approved and recorded
        usage: { input: 20, output: 3 }
      match_overrides:
        request_id:
          mode: regex
          pattern: "^t_[0-9a-f]{32}:[0-9]+$"
        system_prompt: { mode: present }
        messages: { mode: present }
        tools: { mode: present }

expect:
  calls_closed: true
  calls:
    - function: record
      count: 1
      payload: { value: expected+approved }
    - function: hook-gate
      count: 1
      payload_subset:
        point: pre_trigger
        call:
          id: call-1
          function_id: "{{run_id}}::record"
          arguments: { value: expected }
