# C-E2E-507 — crash recovery closes the interrupted function call.
# Reproduction of https://github.com/iii-hq/workers/issues/507.
schema_version: "1"
id: C-E2E-507
description: An engine crash during a dispatched function call must not leave the call dangling or the session unusable.
quarantine: true

send:
  message: Call the recorder once.

functions:
  record:
    description: Record one integration fixture value.
    request_schema:
      type: object
      additionalProperties: false
      properties:
        value: { type: string }
      required: [value]
    response:
      content:
        - { type: text, text: recorded }
      is_error: false
    # Leaves a deterministic fault-injection window after durable recording.
    response_delay_ms: 8000

router:
  generations:
    - reply:
        type: function_call
        function: record
        arguments: { value: expected }
        usage: { input: 8, output: 4 }
    - reply:
        type: text
        text: recovered
        usage: { input: 20, output: 2 }
      # Recovery can legitimately reconstruct the second request differently;
      # this reproduction grades the durable outcome instead.
      match_overrides:
        request_id:
          mode: regex
          pattern: "^t_[0-9a-f]{32}:[0-9]+$"
        system_prompt: { mode: present }
        messages: { mode: present }
        tools: { mode: present }

fault:
  kind: engine_sigkill

timeouts:
  scenario_ms: 120000

expect:
  message_counts:
    user: 1
    assistant: 2
    function_result: 1
  assistant_text: recovered
  calls_closed: true
  function_results:
    - function_call_id: call-1
  calls:
    - function: record
      count: 1
      payload: { value: expected }
