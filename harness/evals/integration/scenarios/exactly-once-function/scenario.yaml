# C-E2E-002 — allowed function executes exactly once.
#
# Same session-id/system-prompt deviation as C-E2E-001 (see that scenario's
# header comment). The policy-aid paragraph in the expected system prompt
# embeds the run-scoped allow-list entry, so the template carries {{run_id}}.
schema_version: "1"
id: C-E2E-002
description: An allow-listed native function executes exactly once with a durable result.
stack_profile: harness-core
send:
  session_id: "{{session_id}}"
  message: "Call the recorder once."
  model: fixture-model
  provider: scripted
  idempotency_key: "{{run_id}}:exactly-once-function"
  options:
    functions:
      allow: ["{{run_id}}::record"]
      deny: []
      expose: native
router_script: router-script.json
recorder:
  target:
    function_id: "{{run_id}}::record"
    description: "Record one integration fixture value."
    request_schema:
      type: object
      additionalProperties: false
      properties:
        value:
          type: string
      required: ["value"]
    response:
      content:
        - type: text
          text: recorded
      is_error: false
  lifecycle:
    trigger_type: "harness::turn-completed"
    function_id: "integration-recorder::lifecycle"
deadlines:
  readiness_ms: 60000
  scenario_ms: 60000
  teardown_ms: 15000
invariants:
  - id: send.flags
    parameters:
      merged: false
      queued: false
      deduplicated: false
  - id: transcript.message_counts
    parameters:
      user: 1
      assistant: 2
      function_result: 1
  # Text-only for the same reason as C-E2E-001: durable entries drop usage.
  - id: transcript.assistant_text
    parameters:
      text: "recorded once"
  - id: transcript.no_duplicates
    parameters: {}
  - id: transcript.function_result
    parameters:
      function_call_id: call-1
      function_id: "{{run_id}}::record"
      content:
        - type: text
          text: recorded
      is_error: false
  - id: status.terminal
    parameters:
      status: completed
      pending_calls: 0
      queued_messages: 0
  - id: lifecycle.completed_once
    parameters:
      allow_identical_duplicates: true
  - id: router.generations_consumed
    parameters:
      count: 2
  - id: target.calls
    parameters:
      function_id: "{{run_id}}::record"
      count: 1
      payload:
        value: expected
