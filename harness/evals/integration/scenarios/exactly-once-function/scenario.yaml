# C-E2E-002 — an allow-listed function executes exactly once.
schema_version: "1"
id: C-E2E-002
description: An allow-listed native function executes exactly once with a durable result.

send:
  message: Call the recorder once.

functions:
  record:
    description: Record one integration fixture value.
    request_schema:
      type: object
      additionalProperties: false
      properties:
        value: { type: string }
      required: [value]
    response:
      content:
        - { type: text, text: recorded }
      is_error: false

router:
  generations:
    - reply:
        type: function_call
        function: record
        arguments: { value: expected }
        usage: { input: 8, output: 4 }
    - reply:
        type: text
        text: recorded once
        usage: { input: 18, output: 2 }

expect:
  message_counts:
    user: 1
    assistant: 2
    function_result: 1
  assistant_text: recorded once
  function_results:
    - function: record
      content:
        - { type: text, text: recorded }
      is_error: false
  calls:
    - function: record
      count: 1
      payload: { value: expected }
