# C-E2E-506 — released held calls retain hook-mutated arguments.
# Reproduction of https://github.com/iii-hq/workers/issues/506.
schema_version: "1"
id: C-E2E-506
description: A held call released for execution must run with the arguments produced by earlier hooks.

send:
  message: Call the recorder once.

functions:
  record:
    description: Record one integration fixture value.
    request_schema:
      type: object
      additionalProperties: false
      properties:
        value: { type: string }
      required: [value]
    response:
      content:
        - { type: text, text: recorded }
      is_error: false
  hook-mutate:
    description: Inject validated scope into the arguments.
    request_schema:
      type: object
    response:
      decision: continue
      mutations:
        arguments:
          value: expected+scope
    expose: false
  hook-hold:
    description: Hold every consulted call for explicit approval.
    request_schema:
      type: object
    response:
      decision: hold
    expose: false

bindings:
  - trigger: hook_pre_trigger
    function: hook-mutate
    functions: [record]
    priority: 10
  - trigger: hook_pre_trigger
    function: hook-hold
    functions: [record]
    priority: 20

release:
  action: execute

router:
  generations:
    - reply:
        type: function_call
        function: record
        arguments: { value: expected }
        usage: { input: 8, output: 4 }
    - reply:
        type: text
        text: released and recorded
        usage: { input: 20, output: 3 }
      match_overrides:
        request_id:
          mode: regex
          pattern: "^t_[0-9a-f]{32}:[0-9]+$"
        system_prompt: { mode: present }
        messages: { mode: present }
        tools: { mode: present }

expect:
  calls_closed: true
  calls:
    - function: record
      count: 1
      payload: { value: expected+scope }
    - function: hook-mutate
      count: 1
      payload_subset:
        point: pre_trigger
        call:
          id: call-1
          function_id: "{{run_id}}::record"
          arguments: { value: expected }
    - function: hook-hold
      count: 1
      payload_subset:
        point: pre_trigger
        call:
          id: call-1
          function_id: "{{run_id}}::record"
          arguments: { value: expected+scope }
