[package]
name = "harness-agent-quality"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "harness-agent-quality"
path = "src/bin/agent-quality.rs"

[[bin]]
name = "harness-prompt-eval"
path = "src/bin/prompt-eval.rs"

[lib]
name = "harness_agent_quality"
path = "src/lib.rs"

[dependencies]
harness = { path = "../.." }
eval = { path = "../../../eval" }
iii-sdk = "=0.21.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
schemars = "0.8"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tempfile = "3"
