[package]
name = "harness-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
harness = { path = "../.." }
iii-sdk = "=0.22.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
