# Demo-only config for the consolidated shell worker.
#
# Production deployments should pin `fs.host_root` to a directory they
# intend to expose. The demo opts into `allow_unjailed: true` so the
# FilesystemPanel can browse the developer's machine without explicit
# pinning.
max_timeout_ms: 30000
default_timeout_ms: 10000
max_output_bytes: 1048576
working_dir: null
inherit_env: false
allowed_env:
  - PATH
  - HOME
  - LANG
  - LC_ALL
  - TERM
allowlist:
  - ls
  - cat
  - pwd
  - echo
  - grep
  - head
  - tail
  - which
  - jq
  - uname
  - basename
  - dirname
denylist_patterns:
  - "rm\\s+-rf\\s+/"
  - "mkfs"
  - "shutdown"
  - "reboot"
max_concurrent_jobs: 16
job_retention_secs: 3600

fs:
  host_root: null
  allow_unjailed: true
  max_read_bytes: 16777216
  max_write_bytes: 16777216
  denylist_paths:
    - /etc/passwd
    - /etc/shadow

sandbox:
  enabled: false
