# iii engine configuration for the harness local/dev.
# Pass to the engine via `iii -c engine.config.yaml`.
#
# The `configuration` worker (configuration::register/set/get/list/schema) is
# enabled by default in the engine — the harness registers its `harness` entry
# there at boot and hot-reloads on change.

workers:
  - name: iii-queue
    # 'iii-queue': value now lives in the configuration worker at ./config/iii-queue.yaml. Edit at runtime via 'iii config set iii-queue' (or 'configuration::set'); this block is no longer read.

  - name: iii-state
    # 'iii-state': value now lives in the configuration worker at ./config/iii-state.yaml. Edit at runtime via 'iii config set iii-state' (or 'configuration::set'); this block is no longer read.
