# iii engine configuration for the harness local/dev.
# Pass to the engine via `iii -c engine.config.yaml`.
#
# The `configuration` worker (configuration::register/set/get/list/schema) is
# enabled by default in the engine — the harness registers its `harness` entry
# (providers + permissions) there, replacing the former `database`-backed
# auth-credentials / provider-config stores. No explicit entry is needed here.

workers:
  - name: iii-queue
    config:
      adapter:
        name: builtin
      queue_configs:
        turn-step:
          type: fifo
          message_group_field: session_id
          max_retries: 5
          concurrency: 1

  - name: iii-state
    config:
      adapter:
        name: file_based
