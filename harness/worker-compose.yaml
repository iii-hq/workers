namespace: my-project #comment if you want to be default
startup_timeout: 15m
stop_timeout: 10s

engine:
  # Interpolated so a second worktree can run its own engine without forking
  # this file: unset, it is the literal 49134 CI and a plain `iii compose --up`
  # have always used.
  url: ws://127.0.0.1:${III_ENGINE_PORT:-49134}

# CI disables install prompts when compose starts workers without a terminal.
containers:
  queue:
    worker: path://../queue
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    environment:
      RUST_LOG: info
    scripts:
      run: cargo run --bin queue

  state:
    worker: path://../state
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    environment:
      RUST_LOG: info
      CI: "true"
    scripts:
      run: cargo run --bin state

  session-manager:
    worker: path://../session-manager
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    environment:
      RUST_LOG: info
    scripts:
      run: cargo run --bin session-manager

  llm-router:
    worker: path://../llm-router
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    start_after:
      - state
    environment:
      RUST_LOG: info
      CI: "true"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    scripts:
      run: cargo run --bin llm-router

  provider-openai-codex:
    worker: path://../provider-openai-codex
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    start_after:
      - llm-router
      - state
    environment:
      RUST_LOG: info
      CI: "true"
    scripts:
      run: cargo run --bin provider-openai-codex

  provider-openai:
    worker: path://../provider-openai
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    start_after:
      - llm-router
      - state
    environment:
      RUST_LOG: info
    scripts:
      run: cargo run --bin provider-openai

  provider-anthropic:
    worker: path://../provider-anthropic
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    start_after:
      - llm-router
      - state
    environment:
      RUST_LOG: info
    scripts:
      run: cargo run --bin provider-anthropic

  context-manager:
    worker: path://../context-manager
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    start_after:
      - llm-router
    environment:
      RUST_LOG: info
      CI: "true"
    scripts:
      run: cargo run --bin context-manager

  iii-directory:
    worker: path://../iii-directory
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    environment:
      RUST_LOG: info
      CI: "true"
      ORT_PREFER_DYNAMIC_LINK: "0"
    scripts:
      # iii-directory links the pinned static ONNX Runtime: ort-sys downloads and
      # verifies it for the build target. Offline hosts export ORT_LIB_PATH first
      # (see ../iii-directory/scripts/provision-onnxruntime.sh for Linux x86_64).
      run: >-
        cargo run --bin iii-directory

  cron:
    worker: path://../cron
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    environment:
      RUST_LOG: info
      CI: "true"
    scripts:
      run: cargo run --bin cron

  ade:
    worker: path://../ade
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    environment:
      RUST_LOG: info
      CI: "true"
    scripts:
      run: cargo run --bin ade

  ide:
    worker: path://../ide
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    environment:
      RUST_LOG: info
      CI: "true"
    scripts:
      run: cargo run --bin ide

  harness:
    worker: path://.
    env_file:
      - ${WORKERS_DEV_ENV_FILE:-workers-dev.env.example}
    start_after:
      - state
      - queue
      - session-manager
      - llm-router
      - provider-openai-codex
      - provider-openai
      - provider-anthropic
      - context-manager
      - iii-directory
      - cron
      - ade
      - ide
    environment:
      RUST_LOG: info
      CI: "true"
    scripts:
      run: cargo run --bin harness
