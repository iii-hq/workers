[workspace]
members = ["tests/e2e", "tests/integration"]
resolver = "2"

[package]
name = "harness"
version = "1.8.0"
edition = "2021"
publish = false

[[bin]]
name = "harness"
path = "src/main.rs"

[lib]
name = "harness"
path = "src/lib.rs"

[dependencies]
# 0.21.8 adds the reconnect reattach handshake. Older SDKs can lose this
# worker's registrations when the engine reloads another worker.
iii-sdk = "=0.21.8"
# Re-exports the same `opentelemetry` the SDK uses, so we can carry the active
# OTel context across `tokio::spawn` boundaries (shared `Context` global).
# 0.21.5 adds the live span-start push (`LiveSpanStartProcessor`), so the
# console renders `harness::turn step` while it runs instead of on close.
iii-helpers = "=0.21.8"
# Worker-side injectable console UI (content function + console:script/style
# triggers + hot-reload watcher) — direct link, never published.
iii-console-ui = { path = "../crates/console-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
# Must stay on the same schemars major as iii-sdk so the derived
# `JsonSchema` impls satisfy `RegisterFunction::new_async`.
schemars = "0.8"
uuid = { version = "1", features = ["v4"] }
# Fail-closed allow/deny matching for the dispatch policy.
globset = "0.4"
# Output-contract JSON Schema validation (json contracts with a schema).
jsonschema = { version = "0.18", default-features = false }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }

# The integration runner digests every spawned binary before boot. Optimizing sha2 in
# development avoids a long stall when hashing large debug worker binaries.
[profile.dev.package.sha2]
opt-level = 3
