workers:
  - name: approval-gate
    config:
      approval_state_scope: approvals
      default_timeout_ms: 300000
      topic: agent::before_function_call
  - name: auth-credentials
    config:
      engine_url: ws://127.0.0.1:49134
      store: iii_state
  - name: hook-fanout
  - name: llm-budget
    config:
      skills_handshake_deadline_secs: 180
      skills_trigger_timeout_ms: 5000
  - name: models-catalog
    config:
      engine_url: ws://127.0.0.1:49134
      skills_register_timeout_ms: 5000
      skills_unregister_timeout_ms: 2000
      state_request_timeout_ms: 5000
  - name: policy-denylist
    config:
      denied_functions:
        - bash:rm -rf
        - sudo
        - curl-pipe-bash
      topic: agent::before_function_call
  - name: provider-anthropic
    config:
      default_api_url: https://api.anthropic.com/v1/messages
      default_max_tokens: 4096
  - name: provider-openai
  - name: provider-router
  - name: session
  - name: shell
    config:
      allowed_env:
        - PATH
        - HOME
        - LANG
        - LC_ALL
        - TERM
      allowlist:
        - ls
        - cat
        - pwd
        - echo
        - grep
        - head
        - tail
        - which
        - jq
        - uname
        - basename
        - dirname
      default_timeout_ms: 10000
      denylist_patterns:
        - rm\s+-rf\s+/
        - mkfs
        - shutdown
        - reboot
      fs:
        allow_unjailed: true
        denylist_paths:
          - /etc/passwd
          - /etc/shadow
        host_root: null
        max_read_bytes: 16777216
        max_write_bytes: 16777216
      inherit_env: false
      job_retention_secs: 3600
      max_concurrent_jobs: 16
      max_output_bytes: 1048576
      max_timeout_ms: 30000
      sandbox:
        enabled: false
      working_dir: null
  - name: iii-directory
    config:
      download_timeout_ms: 60000
      registry_cache_ttl_ms: 60000
      registry_url: https://api.workers.iii.dev
      skills_folder: ./data/skills

  - name: iii-bridge
  - name: iii-http
    config:
      concurrency_request_limit: 1024
      cors:
        allowed_methods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowed_origins:
          - '*'
      default_timeout: 30000
      host: 127.0.0.1
      port: 3111
  - name: iii-queue
    config:
      adapter:
        name: builtin
  - name: iii-sandbox
    config:
      auto_install: true
      default_cpus: 1
      default_idle_timeout_secs: 300
      default_memory_mb: 512
      image_allowlist:
        - python
        - node
      max_concurrent_sandboxes: 32
  - name: iii-state
    config:
      adapter:
        config:
          file_path: ./data/state_store.db
          store_method: file_based
        name: kv
  - name: iii-stream
    config:
      adapter:
        config:
          file_path: ./data/stream_store
          store_method: file_based
        name: kv
      host: 127.0.0.1
      port: 3112
  - name: turn-orchestrator
    config:
      sync_default_timeout_ms: 120000
      sync_poll_interval_ms: 50
      system_default_skills:
        - iii://iii-directory/index
  - name: harness
    worker_path: .
