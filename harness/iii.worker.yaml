iii: v1
name: harness
language: javascript
deploy: bundle
manifest: package.json
description: Meta-worker that composes the modular Node workers backing the iii chat surface.

runtime:
  kind: javascript

scripts:
  start: node ./index.mjs

dependencies:
  iii-state: "^0.17.0"
  iii-stream: "^0.17.0"
  iii-queue: "^0.17.0"
  iii-observability: "^0.17.0"
  configuration: "^0.17.0"
  iii-directory: "^0.8.1"
  session-manager: "^0.1.0"
  # Soft dependency: the turn loop degrades to raw history when absent
  # (see harness pre-flight fallback in src/runtime/compaction.ts). Declared
  # for install convenience; the runtime fallback is the actual contract.
  context-manager: "^0.1.0"
