  queue: "^0.2.0"
  cron: "^0.21.0"
  configuration: "^0.21.6"
  iii-observability: "^0.21.6"
  iii-stream: "^0.21.6"
  iii-directory: "^1.0.0"
  llm-router: "^1.0.0"
  session-manager: "^1.0.0"
  context-manager: "^1.0.0"
  provider-anthropic: "^1.0.0"
  provider-openai: "^1.0.0"
  shell: "^0.9.0"
  scrapling: "^0.2.4"
