  document-extract: "^0.1.0"
  models-catalog: "^0.1.0"
  auth-credentials: "^0.1.0"
  auth-rbac: "^0.1.0"
  audit-log: "^0.1.0"
  policy-denylist: "^0.1.0"
  dlp-scrubber: "^0.1.0"
  guardrails: "^0.1.0"
  llm-budget: "^0.1.0"
  session-inbox: "^0.1.0"
  hook-fanout: "^0.1.0"
  shell-bash: "^0.1.0"
  shell-filesystem: "^0.1.0"
  subagent: "^0.1.0"
  provider-cli: "^0.1.0"
  provider-anthropic: "^0.1.0"
