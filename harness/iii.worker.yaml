iii: v1
name: harness
language: rust
deploy: binary
manifest: Cargo.toml
bin: harness
description: Thin durable turn loop that wires session-manager, context-manager, and llm-router into an agent loop; spawns sub-agents as child sessions.

dependencies:
  iii-state: "^0.19.0"
  iii-queue: "^0.19.0"
  configuration: "^0.19.0"
  iii-directory: "^0.8.1"
  session-manager: "^0.1.0"
  context-manager: "^0.1.0"
  llm-router: "^0.1.0"