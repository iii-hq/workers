  configuration: "^0.19.0"
  directory: "^1.0.0"
  session-manager: "^1.0.0"
  context-manager: "^1.0.0"
  approval-gate: "^1.0.0"
  provider-anthropic: "^1.0.0"
  provider-openai: "^1.0.0"