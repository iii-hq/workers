  turn-orchestrator: "^0.2.0"
  provider-router: "^0.2.0"
  session: "^0.2.0"
  models-catalog: "^0.2.0"
  hook-fanout: "^0.2.0"
  policy-denylist: "^0.2.0"
  shell: "^0.3.0"
  provider-anthropic: "^0.2.0"
  provider-openai: "^0.2.0"
  auth-credentials: "^0.2.0"
  llm-budget: "^0.2.0"
  iii-directory: "^0.5.1"
  approval-gate: "^0.2.0"
  iii-sandbox: "^0.11.0"
