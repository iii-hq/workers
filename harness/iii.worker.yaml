iii: v1
name: harness
language: rust
deploy: binary
manifest: Cargo.toml
license: Apache-2.0
bin: harness
tags: [agent, harness, loop, autonomous]
description: Thin durable turn loop that wires session-manager, context-manager, and llm-router into an agent loop; spawns sub-agents as child sessions.

dependencies:
  state: "latest"
  queue: "latest"
  cron: "latest"
  configuration: "latest"
  iii-observability: "latest"
  iii-directory: "latest"
  judge: "latest"
  llm-router: "latest"
  session-manager: "latest"
  context-manager: "latest"
  provider-openai-codex: "latest"
  provider-anthropic: "latest"
  provider-openai: "latest"
  ide: "latest"
  ade: "latest"
