iii: v1
name: context-compaction
language: node
deploy: binary
manifest: package.json
bin: iii-context-compaction
description: Thin user-initiated /compact wrapper (context-compaction::compact_session) over the context-manager worker; summarises the post-compaction window via context::compact and persists the round trip as a session bookkeeping entry. The transcript is never modified.

runtime:
  kind: node

scripts:
  install: pnpm install
  start: node ./dist/context-compaction/main.js

dependencies:
  session-manager: "^0.1.0"
  context-manager: "^0.1.0"
