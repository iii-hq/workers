# context-manager runtime configuration.
#
# Token-budget knobs. The usable input budget per call is
#   usable = (input_limit ?? context_window - max_output_tokens)
#            - reserved - thinking_budget
# where reserved defaults to min(reserved_tokens_cap,
# context_window * reserved_pct / 100) and is overridable per call.

# Cap on the default reserve (tokens).
reserved_tokens_cap: 20000
# Percentage of the context window reserved by default.
reserved_pct: 10

# user+assistant turn pairs always kept verbatim by compaction when the
# request omits options.tail_turns.
tail_turns: 2

# Prune defaults (overridable per call via options).
protect_recent_tokens: 40000   # newest function-output tokens never pruned
min_free_tokens: 20000         # skip pruning when it would free less
max_output_chars: 2000         # outputs at or under this size are not "verbose"

# Compaction mutual-exclusion lease TTL (seconds). A crashed holder's
# claim expires after this long.
lease_ttl_secs: 300

# Directory holding compaction-lease files (one `<scope>/<key>.json` per
# lease, written atomically). A leading `~/` expands to the home
# directory. Mirrors session-manager's data_dir; this worker is the
# single writer of this directory.
lease_dir: ~/.iii/data/context-manager

# When the request has no inline limits and llm-router is absent, fall
# back to a conservative model (context_window 8192 / max_output 1024)
# instead of failing. Set false to make unresolvable models an error.
allow_fallback_limits: true

# Outer budget for one summariser call through router::chat (ms). Must
# exceed the router's own stream budget.
summarizer_timeout_ms: 320000
