[workspace]

[package]
name = "provider-command-code"
version = "0.1.4-experimental"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Command Code dual-protocol provider worker behind llm-router."

[[bin]]
name = "provider-command-code"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
llm-router = { path = "../llm-router", default-features = false }
iii-sdk = "=0.22.1-alpha.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util"] }
