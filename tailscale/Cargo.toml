[workspace]

[package]
name = "tailscale"
version = "0.2.1"
edition = "2024"
publish = false
description = "Tailscale worker for iii — the tailscale CLI as tailscale::* functions (connectivity, peers, exit nodes, preferences, Serve and Funnel publishing, Taildrop, certificates, accounts, updates) with an injected Console page"

[lib]
name = "tailscale"
path = "src/lib.rs"

[[bin]]
name = "tailscale"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.26.0"
iii-console-ui = { path = "../crates/console-ui" }
arc-swap = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
schemars = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
qrcode = "0.14"
url = "2"

[dev-dependencies]
serde_json = "1"

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
