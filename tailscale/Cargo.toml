[workspace]

[package]
name = "tailscale"
version = "0.1.0"
edition = "2021"
publish = false
description = "Tailscale worker for iii — share the local Console over Tailscale Serve or explicitly enabled Funnel (tailscale::* functions) with an injected Console page and QR links"

[lib]
name = "tailscale"
path = "src/lib.rs"

[[bin]]
name = "tailscale"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.23.0-rc.2"
iii-console-ui = { path = "../crates/console-ui" }
arc-swap = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
qrcode = "0.14"
url = "2"

[dev-dependencies]
serde_json = "1"
