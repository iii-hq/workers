# Runtime wiring only. Deployment approval defaults (default_mode,
# always_allow_seed, pending_timeout_ms) live in the engine's
# configuration entry "approval-gate", not here — see README § Configuration.

# The harness::hook::pre-trigger binding the worker registers for itself
# at startup (tech-specs/2026-06-agentic/approval-gate.md § The approval::gate hook).
hook:
  functions: ["*"]
  timeout_ms: 5000
  on_error: fail_closed

# 6-field cron expression for the expiry sweep (engine cron trigger).
sweep_expression: "0 0 0 * * *"

# Fail-closed budget for the synchronous policy::check_permissions consult.
policy_timeout_ms: 5000

# Best-effort session::get budget inside the hook (record context fields
# are omitted when this is exceeded).
session_fetch_timeout_ms: 1000

# Budget for state::* calls.
state_timeout_ms: 5000

# Budget for harness::function::resolve calls.
harness_timeout_ms: 10000
