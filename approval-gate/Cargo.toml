[workspace]

[package]
name = "approval-gate"
version = "0.1.0"
description = "Hook subscriber on agent::before_function_call that pauses function calls listed in approval_required until the UI resolves them via approval::resolve."
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/iii-hq/workers"
authors = ["iii contributors"]
publish = false

[lib]
name = "approval_gate"
path = "src/lib.rs"

[[bin]]
name = "approval-gate"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.11.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
