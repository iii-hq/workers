[workspace]

[package]
name = "approval-gate"
version = "1.0.3"
edition = "2021"
publish = false

[[bin]]
name = "approval-gate"
path = "src/main.rs"

[lib]
name = "approval_gate"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.20.0-alpha.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
# Must stay on the same schemars major as iii-sdk so the derived
# `JsonSchema` impls satisfy `RegisterFunction::new_async` /
# `RegisterTriggerType::trigger_request_format`.
schemars = "0.8"
base64 = "0.22"
regex = "1"

[features]
# Test-only seam: exposes `testkit` (engine bootstrap for the engine-backed
# tests) without compiling it into the production lib/binary. Off by default,
# so `cargo build` / the release binary exclude it. Enabled for this crate's
# own tests via the self dev-dependency below; CI also runs `--all-features`.
testkit = []

[dev-dependencies]
# Self-reference enabling the `testkit` feature for the integration tests
# (which link the lib) so `cargo test` works without `--all-features`.
approval-gate = { path = ".", features = ["testkit"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
harness = { path = "../harness" }
