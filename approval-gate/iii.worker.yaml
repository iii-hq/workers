iii: v1
name: approval-gate
language: rust
deploy: binary
manifest: Cargo.toml
bin: approval-gate
description: |
  Hook subscriber on agent::before_function_call. Decides every LLM-initiated
  function call via a layered rules engine. Allow → pass through. Deny →
  structured ApprovalRuleDenied. Ask → write a Pending record and wait for
  approval::resolve. Omitted rules disable policy; explicit rules enable
  first-match approval policy.

runtime:
  kind: rust

scripts:
  install: cargo build
  start: cargo run

config:
  topic: agent::before_function_call
  approval_state_scope: approvals
  default_timeout_ms: 300000
  # Watchdog tick interval (ms). The gate spawns a background task that
  # calls approval::tick_timeouts every interval to reclaim expired
  # Pending and stale InFlight rows, then wakes the orchestrator via
  # run::resume. Set to 0 to disable (tests drive ticks manually).
  tick_interval_ms: 15000
