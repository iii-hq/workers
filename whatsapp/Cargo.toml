[workspace]

[package]
name = "whatsapp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "Apache-2.0"
description = "Native WhatsApp sessions and operations as iii functions, with no Node runtime"

[[bin]]
name = "whatsapp"
path = "src/main.rs"

[dependencies]
iii-sdk = "=0.23.0"
iii-config-client = { path = "../crates/config-client" }
iii-console-ui = { path = "../crates/console-ui" }
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "dd0763c4635b353c4ed52def39d030fb2f375f9a" }
wacore = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "dd0763c4635b353c4ed52def39d030fb2f375f9a" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
async-trait = "0.1"
diesel = { version = "=2.3.13", features = ["sqlite"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 0
