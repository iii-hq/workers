# Use a fresh directory: whatsmeow cannot read the Rust worker's credentials.
data_dir: data/whatsapp-go
# Name the phone lists under Linked devices; empty shows "Other device". Both
# keys reach WhatsApp only when a device pairs: relink to rename an existing one.
device_name: ''
device_platform: desktop
max_sessions: 32
max_media_bytes: 16777216
max_events: 1000
max_inbox_messages: 10000
operation_timeout_secs: 30
shutdown_timeout_secs: 15
# Cloud settings can also come from worker environment variables; see README.md.
# Environment values override these fields at runtime and are not saved here.
cloud:
  enabled: false
  api_version: v26.0
  business_account_id: ''
  phone_number_id: ''
  access_token: ''
  app_secret: ''
  verify_token: ''
