# Seed installed as `initial_value` with the configuration worker on first
# registration; the live value is authoritative thereafter. The engine URL is
# bootstrap and lives on the --url flag, not here.

# Devin API bearer token. Referenced as ${DEVIN_API_KEY} so the configuration
# worker env-expands it from the environment; the secret never lives in the repo.
# Empty disables devin::session::* and devin::api (the CLI surface still works if
# the local devin binary is already authenticated).
api_key: "${DEVIN_API_KEY}"

# Devin organization id, env-expanded from ${DEVIN_ORG_ID}. Required for the
# organization-scoped v3 endpoints (sessions, pr-reviews, code-scan remediation):
# it is a path segment, e.g. /v3/organizations/{org_id}/sessions. Leave the env
# var unset only if you use the CLI and passthrough surfaces exclusively.
org_id: "${DEVIN_ORG_ID}"

# Base URL for the Devin REST API. Default is the v1 endpoint, which personal
# tokens use; set it to https://api.devin.ai/v3 alongside org_id for a service key.
base_url: https://api.devin.ai/v1

# HTTP request timeout for Devin API calls, in seconds.
request_timeout_secs: 120

# Path to the devin CLI binary. Empty = the `devin` binary on PATH.
devin_executable: ""

# Extra arguments inserted before `--print --` on every devin::run invocation.
# devin CLI modes: auto (read-only), accept-edits (also edits), dangerous (all).
# Only `dangerous` auto-approves command execution, so an iii-context run needs
# it to actually run `iii trigger`; auto is the safe default.
cli_extra_args: ["--permission-mode", "auto"]

# Stream AgentEvent frames here, grouped by session_id. The console and acp
# worker both read this stream.
events_stream: agent::events

# Raw devin CLI stdout lines mirrored verbatim here, grouped by session_id.
raw_events_stream: devin::events

# Prepend the iii runtime context to a devin::run prompt so the agent discovers
# engine functions through the iii CLI, the same as the grok and codex workers.
# Defaults on for parity; override per turn with the iii_context payload field.
iii_context: true
