# Agent permissions for the memory worker: a suggested policy for deployments
# that run a policy worker; nothing loads this file at run time.
# The worker itself refuses every function denied after `memory::rest` when
# the call comes from inside an agent turn, and holds an agent's save, update
# and delete to its own note (README § Permissions); the internal seams and
# `memory::rest` rely on this policy alone.
# Spec: tech-specs/2026-06-agentic/memory.md § Security.
version: 1

rules:
  # Internal seams: the harness invokes the hook, the queue delivers
  # extraction jobs, session-manager GC and the configuration worker drive
  # the rest. Never agent-callable.
  - '!memory::hook::pre-generate'
  - '!memory::on-turn-completed'
  - '!memory::on-session-deleted'
  - '!memory::extract-job'
  - '!memory::on-config-change'
  # The REST adapter runs whichever public function a route's path names,
  # the ones denied below included; only the http worker's routes call it.
  - '!memory::rest'
  # Bank and rule writes are human-owned surfaces (console, REST, CLI); agents
  # read and save memories but do not reshape banks or the always-injected
  # rules.
  # Consolidation seam: sibling workers retire duplicates through this;
  # agents never rewrite history directly.
  - '!memory::supersede'
  # The verify tier's seams: the source transcript of a note, and the
  # one-append correction of a note that transcript contradicts.
  - '!memory::correct'
  - '!memory::transcript'
  - '!memory::bank::create'
  - '!memory::bank::delete'
  - '!memory::rule::set'
  - '!memory::reload'
  # Pinning is the user's: a pinned memory is untouchable by every automatic
  # path, and no turn may update or delete it.
  - '!memory::pin'
