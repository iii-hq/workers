[workspace]

[package]
name = "github"
version = "0.2.2"
edition = "2021"
publish = false

[[bin]]
name = "github"
path = "src/main.rs"

# Library target so tests/ (required by validate_worker.py for source-changed
# workers) can exercise the public contract; the binary is a thin wiring shim.
[lib]
name = "github"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.21.6"
iii-console-ui = { path = "../crates/console-ui" }
# Must stay on the same schemars major as iii-sdk so the derived schemas line up.
schemars = "0.8"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "signal",
    "process",
    "time",
    "io-util",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
