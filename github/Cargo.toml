[workspace]

[package]
name = "github"
version = "0.3.3-rc.3"
edition = "2021"
publish = false

[[bin]]
name = "github"
path = "src/main.rs"

# Library target so tests/ (required by validate_worker.py for source-changed
# workers) can exercise the public contract; the binary is a thin wiring shim.
[lib]
name = "github"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.22.1-alpha.25"
iii-console-ui = { path = "../crates/console-ui" }
# Must stay on the same schemars major as iii-sdk so the derived schemas line up.
schemars = { version = "0.8", features = ["chrono"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "signal",
    "process",
    "time",
    "io-util",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
iii-http = { path = "../http" }
futures = "0.3"
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
