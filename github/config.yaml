# Opt in only after reading docs/architecture/github-webhooks.md. Parameters below require restart.
webhooks:
  enabled: false
  storage_path: ./data/github-webhooks/store.sqlite3
  tunnel_id: webhooks
  queue: github-webhooks
  max_body_bytes: 1048576
  max_pending: 10000
  # Default delivery policy for every agent (hot-reloaded). A github::pr::event
  # binding can override it with its own `notifications` object; profile=all
  # restores the full per-entity stream.
  notifications:
    # Only CI failures on the current head, new comments/reviews from others and
    # merge/close, coalesced into one digest per watch. CI success, progress,
    # cancellations, pushes and edits never wake the agent.
    profile: agent_actionable
    # Ignore the agent's own comments; its gh login is discovered automatically.
    ignore_self: true
    # Send after 15s without new events; never hold a digest longer than 2min.
    quiet_ms: 15000
    max_wait_ms: 120000
    max_items: 30
    max_comment_chars: 2000

# Seed installed as `initial_value` with the configuration worker on first
# registration; the live value is authoritative thereafter. The engine URL is
# bootstrap and lives on the --url flag, not here.

# Path to the GitHub CLI binary. Empty = the `gh` binary on PATH.
gh_executable: ""

# GitHub token injected as GH_TOKEN into every child gh process. Referenced as
# ${GH_TOKEN} so the configuration worker env-expands it; empty falls back to
# the worker's inherited environment (ambient `gh auth login` state or an
# already-exported GH_TOKEN).
token: "${GH_TOKEN}"

# Timeout for a gh invocation when the caller omits timeout_ms, in ms.
default_timeout_ms: 30000

# Upper clamp for any per-call timeout_ms, in ms.
max_timeout_ms: 120000

# Per-stream capture cap (stdout and stderr each), in bytes. Output beyond it
# is dropped and flagged stdout_truncated / stderr_truncated.
max_output_bytes: 1048576
