# Seed installed as `initial_value` with the configuration worker on first
# registration; the live value is authoritative thereafter. The engine URL is
# bootstrap and lives on the --url flag, not here.

defaults:
  model: ""            # empty = Grok CLI default (e.g. grok-build-0.1)
  cwd: ""
  always_approve: true # auto-approve tool/command execution on headless turns

# Event feeds are fixed trigger types, not configurable streams: bind
# `grok::agent-event` (translated AgentEvent frames) or `grok::raw-event`
# (verbatim Grok streaming-json events) with { session_id }. The retired
# events_stream / raw_events_stream keys are ignored if still present.

# Deliver the iii runtime context as the leading agent instructions: teaches
# the agent live discovery against the engine catalog through the iii CLI.
# Per-turn override via the iii_context payload field.
iii_context: true

# Path to the Grok CLI binary. Empty = the `grok` binary on PATH.
grok_executable: ""
