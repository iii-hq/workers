[workspace]

[package]
name = "grok"
version = "0.2.1"
edition = "2024"
publish = false

[[bin]]
name = "grok"
path = "src/main.rs"

[lib]
name = "grok"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.26.0"
iii-helpers = "=0.26.0"
schemars = { version = "0.8", features = ["uuid1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "process", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"

[dev-dependencies]
tempfile = "3"

# Release profile for published binaries: thin LTO with one codegen unit runs
# faster than Cargo's default, and strip drops the symbol table for a smaller
# download at no runtime cost.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
