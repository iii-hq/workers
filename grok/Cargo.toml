[workspace]

[package]
name = "grok"
version = "0.1.3"
edition = "2021"
publish = false

[[bin]]
name = "grok"
path = "src/main.rs"

[lib]
name = "grok"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.22.0-alpha.5"
iii-helpers = "=0.22.0-alpha.5"
schemars = { version = "0.8", features = ["uuid1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "process", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"

[dev-dependencies]
tempfile = "3"
