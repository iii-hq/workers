[workspace]

[package]
name = "coder"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "coder"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.13.0-next.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4"
walkdir = "2"
regex = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
which = "8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
# BDD test runner. Drives Gherkin .feature files under tests/features/.
cucumber = "0.22"
# Used by step defs that need to drive multiple awaits in fixed order.
futures = "0.3"

# Single BDD entry point. cucumber needs full control of the runner, so
# `harness = false` is required. All .feature files under
# `tests/features/**` are discovered at runtime; tags (`@engine`,
# `@security`, ...) let you filter to a subset:
#
#   cargo test --test bdd                              # everything
#   cargo test --test bdd -- --tags @search            # one tag
#   cargo test --test bdd -- --tags "@engine and not @unix"
[[test]]
name = "bdd"
harness = false
