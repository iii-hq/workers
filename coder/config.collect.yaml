# Interface-collection config for the registry publish workflow.
#
# The publish job (.github/workflows/_publish-registry.yml) boots a throwaway
# copy of this worker purely to read back the functions and trigger types it
# registers with the engine — the published "interface". That interface is
# static: it does NOT depend on which roots coder is jailed to.
#
# The shipped config.yaml jails coder to ["./", "/tmp"]. On a fresh CI runner
# the checkout root happens to exist, but the publish job should not depend on
# the layout of whatever directory it runs in — coder refuses to start if zero
# roots canonicalize, and we do not want interface collection to hinge on the
# runner's working directory.
#
# This config jails the throwaway worker to "/tmp" only — a directory that
# always exists on every CI runner. The PathResolver canonicalizes it
# instantly, the worker registers its 9 functions plus the configuration
# trigger, interface collection completes, and the publish step runs normally.
# No file is ever read or written during collection, so a minimal single-root
# seed is sufficient and safe.

base_paths: ["/tmp"]
