iii: v1
name: coder
language: rust
deploy: binary
manifest: Cargo.toml
bin: coder
description: Path-jailed code worker — read/search/update/create/delete files plus paginated list-folder and tree, with non-accessible glob protection.

targets:
  - x86_64-apple-darwin
  - aarch64-apple-darwin
  - x86_64-unknown-linux-gnu
  - x86_64-unknown-linux-musl
  - aarch64-unknown-linux-gnu
  - armv7-unknown-linux-gnueabihf

runtime:
  kind: rust

scripts:
  install: cargo build
  start: cargo run
