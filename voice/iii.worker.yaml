iii: v1
name: voice
language: rust
deploy: binary
manifest: Cargo.toml
license: Apache-2.0
bin: voice
tags: [voice, speech, dictation, transcription, stt, tts, audio]
description: Speak to the console — bundled streaming speech-to-text for live dictation, optional host whisper.cpp for final-pass and file transcription, read-aloud, and remote speech providers, with a mic chip and a voice page. Registers the `voice::transcript`, `voice::session-started`, `voice::session-stopped`, `voice::model-progress` and `voice::speech-ended` trigger types and, next to them, the observable functions `voice::on-transcript`, `voice::on-session-started`, `voice::on-session-stopped`, `voice::on-model-progress` and `voice::on-speech-ended` (iii 0.25).

runtime:
  kind: rust

# How Compose starts this worker from a source checkout.
scripts:
  install: cargo build
  start: cargo run --bin voice
dependencies:
  configuration: "latest"

# The speech engine links a prebuilt onnxruntime that its upstream publishes
# only for these four triples (glibc Linux and macOS). musl and armv7 have no
# static archive to link, so the release matrix stays on the supported set —
# the code-runner precedent.
targets:
  - x86_64-apple-darwin
  - aarch64-apple-darwin
  - x86_64-unknown-linux-gnu
