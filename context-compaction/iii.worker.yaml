iii: v1
name: context-compaction
language: rust
deploy: binary
manifest: Cargo.toml
bin: iii-context-compaction
description: Subscriber to agent::events that triggers session compaction once context-window thresholds are reached.
dependencies:
  models-catalog: "^0.1.0"
  session-tree: "^0.1.0"
config:
  threshold_pct: 0.85
  fallback_context_window: 200000
