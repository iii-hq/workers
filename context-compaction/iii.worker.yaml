iii: v1
name: context-compaction
language: rust
deploy: binary
manifest: Cargo.toml
bin: context-compaction
description: Out-of-band session-history compactor. Subscribes to agent::events on each turn end, summarises older turns via provider-router, and writes a session-tree Compaction entry so the next turn reads a compressed transcript.

runtime:
  kind: rust

scripts:
  install: cargo build
  start: cargo run

dependencies:
  session: "^0.2.0"
  provider-router: "^0.2.0"
