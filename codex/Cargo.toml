[workspace]

[package]
name = "codex"
version = "0.1.8"
edition = "2021"
publish = false

[[bin]]
name = "codex"
path = "src/main.rs"

[lib]
name = "codex"
path = "src/lib.rs"

[dependencies]
iii-sdk = "=0.22.1-alpha.8"
iii-helpers = "=0.22.1-alpha.8"
schemars = { version = "0.8", features = ["uuid1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "process", "time", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
