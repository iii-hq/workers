# Seed installed as `initial_value` with the configuration worker on first
# registration; the live value is authoritative thereafter. The engine URL is
# bootstrap and lives on the --url flag, not here.

defaults:
  model: ""
  sandbox_mode: workspace-write   # read-only | workspace-write | danger-full-access
  approval_policy: never          # never | on-request | on-failure | untrusted
  reasoning_effort: ""            # empty = Codex default; minimal|low|medium|high|xhigh
  cwd: ""
  skip_git_repo_check: true

# Stream AgentEvent frames here, grouped by session_id. The console and
# acp worker both read this stream.
events_stream: agent::events

# Raw Codex thread events (exact SDK shapes: thread.started, turn.started,
# item.started/updated/completed, turn.completed, turn.failed, error)
# mirrored verbatim here, grouped by session_id.
raw_events_stream: codex::events

# Deliver the iii runtime context as Codex developer_instructions: teaches
# the agent live discovery against the engine catalog through the iii CLI
# (a localhost engine is reachable under the default sandbox). Per-turn
# override via the iii_context payload field; a caller-supplied
# developer_instructions in codex_config wins.
iii_context: true

# Path to the Codex CLI binary. Empty = the `codex` binary on PATH.
codex_executable: ""

# Override the API base URL (passed to the SDK as baseUrl). Empty = default.
base_url: ""
