iii: v1
name: codex
language: javascript
deploy: bundle
manifest: package.json
description: OpenAI Codex as an iii worker — codex::* functions run headless Codex turns, mirror raw thread events onto codex::events, and stream AgentEvent frames onto agent::events.

runtime:
  kind: javascript

scripts:
  install: pnpm install && pnpm run build
  start: node dist/index.js

dependencies:
  iii-state: "^0.17.0"
  iii-stream: "^0.17.0"
